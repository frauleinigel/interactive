<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажёр: Практико-игровые форматы</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            position: relative;
        }
        h1 {
            font-size: 26px;
            margin-top: 0;
            margin-bottom: 6px;
        }
        .sub {
            color: #333;
            margin-bottom: 24px;
            font-size: 15px;
            line-height: 1.5;
        }
        .place-label {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 8px;
            color: #333;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            min-width: 100px;
        }
        .tab-btn.active {
            border-color: #0066cc;
            background: #e6f0ff;
        }
        .tab-btn.done {
            border-color: #28a745;
            background: #e6f7e6;
        }
        .tab-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .slot {
            background: #f9fafb;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 16px;
            border-left: 5px solid #ccc;
            transition: 0.2s;
        }
        .slot.done {
            border-left-color: #28a745;
            background: #f0faf0;
        }
        .slot .row-label {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .slot .row-label span {
            font-weight: 500;
            font-size: 14px;
            color: #333;
        }
        .slot select {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
            margin-right: 4px;
        }
        .slot select:disabled {
            background: #e9ecef;
            opacity: 0.8;
            cursor: not-allowed;
        }
        .slot button {
            padding: 6px 18px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        .slot button:hover {
            background: #0052a3;
        }
        .slot button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }
        .result-box {
            margin-top: 12px;
            padding: 12px 16px;
            background: #e6f7e6;
            border-radius: 8px;
            border-left: 4px solid #28a745;
        }
        .result-box strong {
            display: block;
            font-size: 16px;
        }
        .result-box .desc {
            color: #333;
            margin-top: 4px;
        }
        .next-btn {
            display: none;
            padding: 14px 28px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 16px;
        }
        .next-btn:hover {
            background: #1f7a33;
        }
        .summary {
            display: none;
        }
        #errorToast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #cc0000;
            color: white;
            padding: 24px 48px;
            border-radius: 16px;
            font-size: 32px;
            font-weight: bold;
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
            z-index: 9999;
            display: none;
            pointer-events: none;
            text-align: center;
            letter-spacing: 1px;
            border: 2px solid #ff9999;
        }
    </style>
</head>
<body>

<div id="errorToast">Ошибка</div>

<div class="container" id="app">
    <h1>🧩 Практико-игровые форматы</h1>
    <div class="sub">
        По аналогии с предыдущими тренажерами в каждом месте действия составьте логичные связки: "что делаем" + "инструмент". Получите готовые форматы.
        <br><br>
        <strong>Важно:</strong> варианты “что делаем” и “инструмент” должны сочетаться друг с другом.
    </div>

    <div class="place-label">📍 Место действия:</div>
    <div class="tabs" id="tabsContainer"></div>

    <div id="slotsContainer"></div>

    <button class="next-btn" id="nextBtn">➡️ Перейти к следующему месту</button>
    <div class="summary" id="summary"></div>
</div>

<script>
    const places = [
        {
            name: 'Цифровой экран',
            combos: [
                { do: 'Творим', use: 'Канцелярские принадлежности', title: 'Мастер-класс «Цифровая афиша комедии»', desc: 'Создаём плакат к советскому фильму, рисуем на сенсорном экране.' },
                { do: 'Ищем', use: 'Зашифрованные подсказки', title: 'Киноребус «Отгадай артефакт»', desc: 'На экране появляются зашифрованные подсказки-картинки, по которым участники отгадывают предметы из советских комедий и называют их ведущему.' },
                { do: 'Отгадываем', use: 'Мимика и жесты', title: 'Интеллект-турнир «Кинокрокодил»', desc: 'На экране показывают сцены без звука, участники угадывают звуковой фрагмент.' }
            ]
        },
        {
            name: 'Зал',
            combos: [
                { do: 'Творим', use: 'Канцелярские принадлежности', title: 'Художественная сессия «Стенгазета “Юмор советских комедий”»', desc: 'Создаём большую стенгазету по мотивам фильмов СССР.' },
                { do: 'Ищем', use: 'Зашифрованные подсказки', title: 'Квест «По следам Шурика»', desc: 'По залу спрятаны конверты с подсказками. Участники собирают их и находят знаковый предмет.' },
                { do: 'Отгадываем', use: 'Мимика и жесты', title: 'Игра «Угадай сцену советского кино»', desc: 'Участник жестами и мимикой воспроизводит эпизод из комедии, зрители угадывают фильм.' }
            ]
        },
        {
            name: 'Сцена',
            combos: [
                { do: 'Творим', use: 'Канцелярские принадлежности', title: 'Конкурс «Слоган советской комедии»', desc: 'Участник за минуту придумывает слоган к комедии, записывает и защищает перед залом.' },
                { do: 'Ищем', use: 'Зашифрованные подсказки', title: 'Игра «Подбери реквизит»', desc: 'Участник получает карточку с цитатой, находит среди предметов на сцене тот, который к ней относится, и показывает публике.' },
                { do: 'Отгадываем', use: 'Мимика и жесты', title: 'Спектакль «Пантомима советских комедий»', desc: 'На сцене разыгрывают сцены из комедий без слов, публика озвучивает.' }
            ]
        }
    ];

    const doOptions = ['Творим', 'Ищем', 'Отгадываем'];
    const useOptions = ['Канцелярские принадлежности', 'Зашифрованные подсказки', 'Мимика и жесты'];

    let selectedCombos = places.map(() => [false, false, false]);
    let currentPlace = 0;

    const tabsContainer = document.getElementById('tabsContainer');
    const slotsContainer = document.getElementById('slotsContainer');
    const nextBtn = document.getElementById('nextBtn');
    const errorToast = document.getElementById('errorToast');

    function showError() {
        errorToast.style.display = 'block';
        errorToast.style.opacity = 1;
        setTimeout(() => {
            errorToast.style.opacity = 0;
            setTimeout(() => {
                errorToast.style.display = 'none';
            }, 300);
        }, 2000);
    }

    function render() {
        let tabsHtml = '';
        places.forEach((place, idx) => {
            const allDone = selectedCombos[idx].every(v => v === true);
            const isActive = idx === currentPlace;
            let btnClass = 'tab-btn';
            if (isActive) btnClass += ' active';
            if (allDone) btnClass += ' done';
            const label = allDone ? '✅ ' + place.name : place.name;
            tabsHtml += `<button class="${btnClass}" data-index="${idx}">${label}</button>`;
        });
        tabsContainer.innerHTML = tabsHtml;

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const idx = parseInt(this.dataset.index);
                if (idx === currentPlace) return;
                currentPlace = idx;
                render();
            });
        });

        const place = places[currentPlace];
        const combos = place.combos;
        const selected = selectedCombos[currentPlace];

        let slotsHtml = '';
        for (let i = 0; i < 3; i++) {
            const isCollected = selected[i];
            const slotClass = isCollected ? 'slot done' : 'slot';
            const slotNumber = i + 1;
            slotsHtml += `<div class="${slotClass}">`;
            // Всегда показываем селекты, но если собрано, то disabled
            slotsHtml += `<div class="row-label">`;
            slotsHtml += `<span>${slotNumber}. Что делаем:</span>`;
            slotsHtml += `<select id="doSelect_${i}" ${isCollected ? 'disabled' : ''}>`;
            if (isCollected) {
                // Показываем выбранное значение
                slotsHtml += `<option value="${combos[i].do}" selected>${combos[i].do}</option>`;
            } else {
                slotsHtml += `<option value="" selected>— выбрать —</option>`;
                doOptions.forEach(opt => {
                    slotsHtml += `<option value="${opt}">${opt}</option>`;
                });
            }
            slotsHtml += `</select>`;
            slotsHtml += `<span>Инструмент:</span>`;
            slotsHtml += `<select id="useSelect_${i}" ${isCollected ? 'disabled' : ''}>`;
            if (isCollected) {
                slotsHtml += `<option value="${combos[i].use}" selected>${combos[i].use}</option>`;
            } else {
                slotsHtml += `<option value="" selected>— выбрать —</option>`;
                useOptions.forEach(opt => {
                    slotsHtml += `<option value="${opt}">${opt}</option>`;
                });
            }
            slotsHtml += `</select>`;
            if (!isCollected) {
                slotsHtml += `<button id="checkBtn_${i}">Проверить</button>`;
            }
            slotsHtml += `</div>`;
            // Если собрано, показываем результат
            if (isCollected) {
                slotsHtml += `<div class="result-box"><strong>${combos[i].title}</strong><div class="desc">${combos[i].desc}</div></div>`;
            }
            slotsHtml += `</div>`;
        }
        slotsContainer.innerHTML = slotsHtml;

        // Обработчики для кнопок "Проверить"
        for (let i = 0; i < 3; i++) {
            if (!selected[i]) {
                const btn = document.getElementById(`checkBtn_${i}`);
                if (btn) {
                    btn.addEventListener('click', function() {
                        const doSelect = document.getElementById(`doSelect_${i}`);
                        const useSelect = document.getElementById(`useSelect_${i}`);
                        if (!doSelect || !useSelect) return;
                        const selectedDo = doSelect.value;
                        const selectedUse = useSelect.value;
                        if (selectedDo === "" || selectedUse === "") {
                            showError();
                            return;
                        }
                        let foundIndex = -1;
                        for (let j = 0; j < combos.length; j++) {
                            if (combos[j].do === selectedDo && combos[j].use === selectedUse) {
                                foundIndex = j;
                                break;
                            }
                        }
                        if (foundIndex === -1) {
                            showError();
                            return;
                        }
                        if (selectedCombos[currentPlace][foundIndex]) {
                            showError(); // уже выбрано
                            return;
                        }
                        selectedCombos[currentPlace][foundIndex] = true;
                        render();
                    });
                }
            }
        }

        const allDone = selectedCombos[currentPlace].every(v => v === true);
        if (allDone && currentPlace < places.length - 1) {
            nextBtn.style.display = 'inline-block';
            nextBtn.textContent = `➡️ Перейти к ${places[currentPlace+1].name}`;
        } else if (allDone && currentPlace === places.length - 1) {
            nextBtn.style.display = 'none';
        } else {
            nextBtn.style.display = 'none';
        }
    }

    function goToNext() {
        if (currentPlace < places.length - 1) {
            currentPlace++;
            render();
        }
    }

    nextBtn.addEventListener('click', goToNext);
    render();
</script>
</body>
</html>
