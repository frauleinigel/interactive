<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Диалоговый тренажёр</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }

    .container {
      max-width: 820px;
      width: 100%;
      background: #ffffff;
      border-radius: 40px;
      padding: 32px 30px 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      border: 2px solid #000000;
      transition: all 0.2s;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #000000;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      letter-spacing: -0.3px;
    }

    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .progress-bar-track {
      flex: 1;
      min-width: 140px;
      height: 10px;
      background: #e0e0e0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #000000;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #000000;
      border-radius: 12px;
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .step-indicator {
      font-weight: 600;
      font-size: 15px;
      color: #000000;
      background: #f0f0f0;
      padding: 4px 16px;
      border-radius: 40px;
      white-space: nowrap;
      letter-spacing: 0.2px;
      border: 1px solid #000000;
    }

    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 28px 30px 30px;
      border: 2px solid #000000;
      margin-bottom: 24px;
    }

    .stage-badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      color: #000000;
      background: #f0f0f0;
      padding: 3px 16px;
      border-radius: 30px;
      letter-spacing: 0.3px;
      margin-bottom: 14px;
      border: 1px solid #000000;
    }

    .question {
      font-size: 20px;
      font-weight: 600;
      color: #000000;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .scenario {
      font-size: 16px;
      color: #000000;
      background: #f9f9f9;
      padding: 14px 18px;
      border-radius: 18px;
      margin: 12px 0 22px 0;
      border-left: 6px solid #000000;
      line-height: 1.5;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 16px 0 10px;
    }

    .option-btn {
      background: #ffffff;
      border: 2px solid #000000;
      border-radius: 20px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 500;
      color: #000000;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: none;
    }

    .option-btn:hover:not(.disabled) {
      background: #f0f0f0;
      border-color: #000000;
      transform: translateY(-1px);
    }

    .option-btn .letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 40px;
      background: #e0e0e0;
      color: #000000;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      border: 1px solid #000000;
      transition: 0.1s;
    }

    .option-btn.selected-correct {
      background: #d4edda;
      border-color: #28a745;
    }
    .option-btn.selected-correct .letter {
      background: #28a745;
      color: #ffffff;
      border-color: #28a745;
    }

    .option-btn.selected-wrong {
      background: #f8d7da;
      border-color: #dc3545;
    }
    .option-btn.selected-wrong .letter {
      background: #dc3545;
      color: #ffffff;
      border-color: #dc3545;
    }

    .option-btn.show-correct {
      background: #d4edda;
      border-color: #28a745;
    }
    .option-btn.show-correct .letter {
      background: #28a745;
      color: #ffffff;
      border-color: #28a745;
    }

    .option-btn.disabled {
      cursor: default;
      opacity: 0.8;
    }
    .option-btn.disabled:hover {
      transform: none;
      background: #ffffff;
    }
    .option-btn.disabled.selected-correct:hover,
    .option-btn.disabled.show-correct:hover {
      background: #d4edda;
    }
    .option-btn.disabled.selected-wrong:hover {
      background: #f8d7da;
    }

    .feedback {
      margin-top: 24px;
      padding: 20px 22px;
      border-radius: 22px;
      background: #f9f9f9;
      border-left: 6px solid #000000;
      display: none;
      animation: fadeSlide 0.35s ease;
      border: 2px solid #000000;
    }

    .feedback.visible {
      display: block;
    }

    .feedback .title {
      font-weight: 700;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      color: #000000;
    }

    .feedback .title .icon {
      font-size: 22px;
    }

    .feedback .explanation {
      font-size: 15px;
      line-height: 1.6;
      color: #000000;
      margin-top: 4px;
    }

    .feedback .explanation strong {
      color: #000000;
    }

    .feedback.correct {
      background: #d4edda;
      border-left-color: #28a745;
      border-color: #28a745;
    }
    .feedback.correct .title {
      color: #155724;
    }

    .feedback.wrong {
      background: #f8d7da;
      border-left-color: #dc3545;
      border-color: #dc3545;
    }
    .feedback.wrong .title {
      color: #721c24;
    }

    .btn-next {
      background: #000000;
      color: #ffffff;
      border: 2px solid #000000;
      border-radius: 60px;
      padding: 14px 36px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: none;
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.3px;
    }

    .btn-next:hover:not(:disabled) {
      background: #333333;
      transform: translateY(-2px);
    }

    .btn-next:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
      background: #666666;
    }

    .btn-reset {
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
      padding: 12px 28px;
      border-radius: 60px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
      margin-top: 6px;
    }

    .btn-reset:hover {
      background: #f0f0f0;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      margin-top: 10px;
    }

    .result-summary {
      background: #ffffff;
      border-radius: 28px;
      padding: 28px 30px;
      text-align: center;
      border: 3px solid #000000;
      margin-top: 10px;
    }

    .result-summary h2 {
      font-size: 26px;
      color: #000000;
      margin-bottom: 6px;
    }

    .result-summary .score {
      font-size: 48px;
      font-weight: 700;
      color: #000000;
    }

    .result-summary .desc {
      font-size: 17px;
      color: #000000;
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .container { padding: 20px 16px 28px; }
      h1 { font-size: 22px; flex-wrap: wrap; }
      .card { padding: 20px 16px; }
      .question { font-size: 18px; }
      .option-btn { font-size: 15px; padding: 12px 16px; }
      .feedback { padding: 16px; }
      .btn-next { width: 100%; justify-content: center; }
      .action-row { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <header>
      <h1>🧠 Диалоговый тренажёр</h1>
    </header>

    <div class="progress-wrapper">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill" style="width: 0%;"></div>
      </div>
      <span class="step-indicator" id="stepIndicator">1 / 3</span>
    </div>

    <div id="cardContainer">
      <div class="card" id="stageCard">
        <div class="stage-badge" id="stageBadge">Этап 1</div>
        <div class="question" id="questionText">Первая реакция и контакт</div>
        <div class="scenario" id="scenarioText">Вы наблюдаете, как администратор подходит к гостю с белой тростью и собакой-поводырем. Какую фразу вы закрепите в регламенте как обязательную?</div>
        <div class="options" id="optionsContainer"></div>

        <div class="feedback" id="feedbackBlock">
          <div class="title"><span class="icon" id="feedbackIcon">✅</span> <span id="feedbackTitle">Верно!</span></div>
          <div class="explanation" id="feedbackExplanation"></div>
        </div>

        <div class="action-row">
          <button class="btn-next" id="nextBtn" disabled>Далее →</button>
          <button class="btn-reset" id="resetBtn">⟳ Начать заново</button>
        </div>
      </div>
    </div>

    <div id="resultContainer" class="result-summary hidden">
      <h2>🏁 Тренировка завершена</h2>
      <div class="score" id="resultScore">3 / 3</div>
      <div class="desc" id="resultDesc">Отлично! Вы выбрали все правильные ответы.</div>
      <button class="btn-reset" style="margin-top:20px;" id="resetFromResultBtn">⟳ Пройти снова</button>
    </div>
  </div>

  <script>
    (function() {
      const stages = [{
        id: 1,
        badge: 'Этап 1',
        question: 'Первая реакция и контакт',
        scenario: 'Вы наблюдаете, как администратор подходит к гостю с белой тростью и собакой-поводырем. Какую фразу вы закрепите в регламенте как обязательную?',
        options: [
          '«Постойте, я сейчас позову кого-нибудь, кто вам поможет».',
          '«Добрый день! Я администратор [имя]. Вам нужно содействие в передвижении или вы сориентируетесь самостоятельно?»',
          '«Здравствуйте! Проходите к кассе, она прямо и чуть левее».'
        ],
        correctIndex: 1,
        explanation: 'Показатель 3.2 требует «оказания помощи работниками, прошедшими обучение». Правильный стандарт — представиться и предложить помощь, не навязывая её. Вариант 1 — признак необученного персонала, вариант 3 — небезопасно.'
      }, {
        id: 2,
        badge: 'Этап 2',
        question: 'Работа с собакой-поводырем',
        scenario: 'Посетитель уточняет: «Я с собакой, мне можно в зал или её нужно оставить в фойе?» Какой ответ администратора гарантирует отсутствие жалоб и штрафов?',
        options: [
          '«С собаками нельзя по правилам безопасности, но я могу за ней присмотреть здесь».',
          '«Конечно, проходите. Собака-поводырь — это средство реабилитации, доступ с ней разрешен везде. Хотите, я принесу ей воды?»',
          '«Можно, если у вас есть паспорт собаки и она в наморднике».'
        ],
        correctIndex: 1,
        explanation: 'По закону собака-поводырь имеет доступ в любое помещение. Требовать паспорт или намордник в культурном учреждении — риск получить 0 баллов за «условия доступности». Предложение воды — плюс к сервису, который отметит эксперт.'
      }, {
        id: 3,
        badge: 'Этап 3',
        question: 'Физическое сопровождение',
        scenario: 'Гость просит проводить его в зал. Как вы обучите персонал это делать правильно?',
        options: [
          'Идти впереди и громко комментировать дорогу: «Тут ступенька! Теперь направо!»',
          'Предложить гостю взять администратора за локоть и идти на полшага впереди, спокойно предупреждая о препятствиях.',
          'Взять гостя за руку и вести его за собой.'
        ],
        correctIndex: 1,
        explanation: 'Это международный стандарт этикета и безопасности. Именно за знание таких нюансов инспекторы НОК ставят высший балл по показателю «Компетенции персонала».'
      }];

      const progressFill = document.getElementById('progressFill');
      const stepIndicator = document.getElementById('stepIndicator');
      const stageBadge = document.getElementById('stageBadge');
      const questionText = document.getElementById('questionText');
      const scenarioText = document.getElementById('scenarioText');
      const optionsContainer = document.getElementById('optionsContainer');
      const feedbackBlock = document.getElementById('feedbackBlock');
      const feedbackIcon = document.getElementById('feedbackIcon');
      const feedbackTitle = document.getElementById('feedbackTitle');
      const feedbackExplanation = document.getElementById('feedbackExplanation');
      const nextBtn = document.getElementById('nextBtn');
      const resetBtn = document.getElementById('resetBtn');
      const resetFromResultBtn = document.getElementById('resetFromResultBtn');
      const cardContainer = document.getElementById('cardContainer');
      const resultContainer = document.getElementById('resultContainer');
      const resultScore = document.getElementById('resultScore');
      const resultDesc = document.getElementById('resultDesc');

      let currentStage = 0;
      let correctCount = 0;
      let isAnswered = false;

      const letters = ['А', 'Б', 'В'];

      function renderStage(index) {
        const stage = stages[index];
        if (!stage) return;

        const progress = ((index) / stages.length) * 100;
        progressFill.style.width = progress + '%';
        stepIndicator.textContent = `${index + 1} / ${stages.length}`;

        stageBadge.textContent = stage.badge;
        questionText.textContent = stage.question;
        scenarioText.textContent = stage.scenario;

        optionsContainer.innerHTML = '';
        stage.options.forEach((text, i) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.dataset.index = i;
          btn.innerHTML = `<span class="letter">${letters[i]}</span> ${text}`;
          btn.addEventListener('click', () => handleOptionClick(i));
          optionsContainer.appendChild(btn);
        });

        isAnswered = false;
        feedbackBlock.classList.remove('visible', 'correct', 'wrong');
        nextBtn.disabled = true;
        document.querySelectorAll('.option-btn').forEach(el => {
          el.classList.remove('selected-correct', 'selected-wrong', 'show-correct', 'disabled');
        });

        if (index === stages.length - 1) {
          nextBtn.textContent = '🏁 Завершить';
        } else {
          nextBtn.textContent = 'Далее →';
        }
      }

      function handleOptionClick(index) {
        if (isAnswered) return;

        const stage = stages[currentStage];
        const isCorrect = (index === stage.correctIndex);
        const btns = document.querySelectorAll('.option-btn');

        btns.forEach(btn => btn.classList.remove('selected-wrong'));

        if (isCorrect) {
          correctCount++;
          btns.forEach(btn => {
            btn.classList.add('disabled');
            if (parseInt(btn.dataset.index) === index) {
              btn.classList.add('selected-correct');
            }
            if (parseInt(btn.dataset.index) === stage.correctIndex) {
              btn.classList.add('show-correct');
            }
          });

          feedbackBlock.className = 'feedback visible correct';
          feedbackIcon.textContent = '✅';
          feedbackTitle.textContent = 'Верно!';
          feedbackExplanation.innerHTML = stage.explanation;

          isAnswered = true;
          nextBtn.disabled = false;
        } else {
          btns.forEach(btn => {
            if (parseInt(btn.dataset.index) === index) {
              btn.classList.add('selected-wrong');
            }
          });

          feedbackBlock.className = 'feedback visible wrong';
          feedbackIcon.textContent = '❌';
          feedbackTitle.textContent = 'Ошибка!';
          feedbackExplanation.textContent = 'Попробуйте выбрать другой вариант.';
        }
      }

      function goToNext() {
        if (!isAnswered) return;

        if (currentStage === stages.length - 1) {
          showResult();
        } else {
          currentStage++;
          renderStage(currentStage);
        }
      }

      function showResult() {
        cardContainer.classList.add('hidden');
        resultContainer.classList.remove('hidden');

        const total = stages.length;
        resultScore.textContent = `${correctCount} / ${total}`;

        let desc = '';
        if (correctCount === total) {
          desc = '🎉 Отлично! Вы выбрали все правильные ответы. Персонал готов к проверке!';
        } else if (correctCount >= total - 1) {
          desc = '👍 Хороший результат! Повторите материал по ошибкам.';
        } else {
          desc = '📖 Рекомендуем пересмотреть регламенты и пройти тренировку заново.';
        }
        resultDesc.textContent = desc;

        progressFill.style.width = '100%';
        stepIndicator.textContent = '🏁 Завершено';
      }

      function resetAll() {
        currentStage = 0;
        correctCount = 0;
        isAnswered = false;

        cardContainer.classList.remove('hidden');
        resultContainer.classList.add('hidden');

        renderStage(0);
        feedbackBlock.classList.remove('visible', 'correct', 'wrong');
        nextBtn.disabled = true;
      }

      function init() {
        resetAll();
        nextBtn.addEventListener('click', goToNext);
        resetBtn.addEventListener('click', resetAll);
        resetFromResultBtn.addEventListener('click', resetAll);
      }

      init();
    })();
  </script>
</body>
</html>
