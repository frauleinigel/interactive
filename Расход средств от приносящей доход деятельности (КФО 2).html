<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>НОК Самоаудит — Кейс 4</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #002b80;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .card {
            max-width: 780px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 43, 128, 0.10);
            padding: 28px 28px 32px;
            transition: box-shadow 0.2s;
        }

        .top-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .emoji-box {
            flex-shrink: 0;
            width: 60px;
            height: 60px;
            border-radius: 16px;
            border: 1px solid #d9e0ed;
            background: #f8fbff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.6rem;
            line-height: 1;
            user-select: none;
        }

        .case-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #5a3e2b;
            line-height: 1.3;
        }

        .question {
            font-size: 1.2rem;
            font-weight: 500;
            color: #cc0000;
            margin-bottom: 22px;
            line-height: 1.5;
            padding: 14px 18px;
            border: 1px solid #d9e0ed;
            border-radius: 14px;
            background: #ffffff;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 26px;
        }

        .answer-btn {
            background: linear-gradient(145deg, #f7f7f7, #e8e8e8);
            border: 2px solid #002b80;
            border-radius: 16px;
            padding: 18px 18px 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 1.05rem;
            font-weight: 600;
            color: #001a4d;
            line-height: 1.5;
            box-shadow: 0 2px 6px rgba(0, 43, 128, 0.03);
            min-height: 80px;
            word-break: break-word;
            display: flex;
            align-items: center;
        }

        .answer-btn:hover:not(.disabled) {
            border-color: #001a4d;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 43, 128, 0.08);
            background: linear-gradient(145deg, #f0f0f0, #e0e0e0);
        }

        .answer-btn .text {
            font-weight: 600;
        }

        .answer-btn.correct {
            border-color: #1a8c4a;
            background: #e6f5ed;
            box-shadow: 0 0 0 3px rgba(26, 140, 74, 0.2);
        }

        .answer-btn.wrong {
            border-color: #b3002d;
            background: #fce8eb;
            box-shadow: 0 0 0 3px rgba(204, 51, 68, 0.2);
        }

        .answer-btn.disabled {
            cursor: default;
            opacity: 0.8;
        }
        .answer-btn.disabled:hover {
            transform: none;
            box-shadow: none;
            background: linear-gradient(145deg, #f7f7f7, #e8e8e8);
        }

        .reset-wrap {
            display: flex;
            justify-content: flex-end;
        }

        .reset-btn {
            background: linear-gradient(145deg, #f9e05d, #f5d43a);
            border: 2px solid #d4b82a;
            border-radius: 30px;
            padding: 10px 32px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #3d2e0a;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(212, 184, 42, 0.25);
            letter-spacing: 0.3px;
        }

        .reset-btn:hover {
            background: linear-gradient(145deg, #fce873, #f7d94a);
            border-color: #c4a820;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 184, 42, 0.35);
        }

        .reset-btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(212, 184, 42, 0.2);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 20, 50, 0.6);
            backdrop-filter: blur(3px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #ffffff;
            max-width: 580px;
            width: 100%;
            border-radius: 24px;
            padding: 30px 28px 26px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
            position: relative;
            animation: fadeSlide 0.25s ease;
            border: 2px solid #002b80;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 2rem;
            line-height: 1;
            cursor: pointer;
            color: #002b80;
            background: transparent;
            border: none;
            padding: 4px 10px;
            border-radius: 30px;
            transition: background 0.15s;
            font-weight: 300;
        }

        .modal-close:hover {
            background: #f0f4fc;
        }

        .modal-content {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #002b80;
            padding-right: 10px;
            word-break: break-word;
        }

        .modal-content strong {
            color: #001f5e;
        }

        @media (max-width: 640px) {
            .card {
                padding: 20px 16px 24px;
            }
            .top-row {
                gap: 12px;
                margin-bottom: 16px;
            }
            .emoji-box {
                width: 50px;
                height: 50px;
                font-size: 2.2rem;
            }
            .case-title {
                font-size: 1.2rem;
            }
            .answers-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .answer-btn {
                min-height: 60px;
                padding: 16px 16px 14px;
                font-size: 1rem;
            }
            .question {
                font-size: 1.1rem;
                padding: 12px 14px;
            }
            .modal-box {
                padding: 22px 18px 20px;
                margin: 10px;
            }
            .modal-content {
                font-size: 0.95rem;
            }
            .modal-close {
                font-size: 1.8rem;
                top: 10px;
                right: 12px;
            }
            .reset-wrap {
                justify-content: center;
            }
            .reset-btn {
                width: 100%;
                text-align: center;
                padding: 12px;
                font-size: 1rem;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 16px 10px 20px;
            }
            .answer-btn {
                font-size: 0.95rem;
                padding: 14px 12px 12px;
                min-height: 50px;
            }
            .question {
                font-size: 1rem;
                padding: 10px 12px;
            }
            .case-title {
                font-size: 1rem;
            }
            .emoji-box {
                width: 44px;
                height: 44px;
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="card" role="main" aria-label="Тренажёр НОК Самоаудит — Кейс 4">

        <div class="top-row">
            <div class="emoji-box">💰</div>
            <div class="case-title">Расход средств от приносящей доход деятельности (КФО 2)</div>
        </div>

        <div class="question">
            Выберите формулировку для использования прибыли от платных услуг:
        </div>

        <div class="answers-grid" id="answersGrid" role="radiogroup" aria-label="Варианты ответов">
            <button class="answer-btn" data-index="0">
                <span class="text">Направить средства от платной деятельности на погашение задолженности по налогам учреждения (за КФО 4).</span>
            </button>
            <button class="answer-btn" data-index="1">
                <span class="text">Направить средства от платной деятельности на текущий ремонт кабинета директора.</span>
            </button>
            <button class="answer-btn" data-index="2">
                <span class="text">Направить средства от платной деятельности на выплату премии всему коллективу (включая тех, кто не участвовал в оказании платных услуг).</span>
            </button>
            <button class="answer-btn" data-index="3">
                <span class="text">Направить средства от платной деятельности на закупку оборудования для кружковой работы, предусмотренной Платными услугами, согласно смете доходов и расходов.</span>
            </button>
        </div>

        <div class="reset-wrap">
            <button class="reset-btn" id="resetBtn">⟳ Начать заново</button>
        </div>

    </div>

    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
        <div class="modal-box">
            <button class="modal-close" id="modalCloseBtn" aria-label="Закрыть">✕</button>
            <div class="modal-content" id="modalContent">
                <span id="modalMessage">Выберите вариант ответа, чтобы проверить себя.</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const answersData = [{
                text: 'Направить средства от платной деятельности на погашение задолженности по налогам учреждения (за КФО 4).',
                correct: false,
                feedback: '<strong>❌ Ошибка.</strong> Запрещено закрывать дыры госзадания (КФО 4) деньгами от платных услуг. Это смешение источников финансирования, которое проверяющие трактуют как нарушение бюджетной дисциплины.'
            }, {
                text: 'Направить средства от платной деятельности на текущий ремонт кабинета директора.',
                correct: false,
                feedback: '<strong>❌ Ошибка.</strong> Ремонт кабинета директора за счет платных услуг — самый частый повод для исков о взыскании убытков с руководителя. Такие траты крайне сложно обосновать как необходимые для получения дохода.'
            }, {
                text: 'Направить средства от платной деятельности на выплату премии всему коллективу (включая тех, кто не участвовал в оказании платных услуг).',
                correct: false,
                feedback: '<strong>❌ Ошибка.</strong> Премии из КФО 2 должны соответствовать Положению об оплате труда. Выплата тем, кто не причастен к заработку этих средств, часто квалифицируется как неэффективный расход.'
            }, {
                text: 'Направить средства от платной деятельности на закупку оборудования для кружковой работы, предусмотренной Платными услугами, согласно смете доходов и расходов.',
                correct: true,
                feedback: '<strong>✅ Верно!</strong> Это прозрачный и безопасный путь. Средства КФО 2 должны расходоваться строго в соответствии с утвержденной сметой доходов и расходов.'
            }];

            const grid = document.getElementById('answersGrid');
            const resetBtn = document.getElementById('resetBtn');
            const allButtons = grid.querySelectorAll('.answer-btn');

            const modalOverlay = document.getElementById('modalOverlay');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const modalMessage = document.getElementById('modalMessage');

            let isAnswered = false;

            function resetAll() {
                isAnswered = false;
                allButtons.forEach(btn => {
                    btn.classList.remove('correct', 'wrong', 'disabled');
                    btn.disabled = false;
                    btn.setAttribute('aria-checked', 'false');
                });
                modalOverlay.classList.remove('active');
                modalMessage.innerHTML = 'Выберите вариант ответа, чтобы проверить себя.';
            }

            function showModal(message) {
                modalMessage.innerHTML = message;
                modalOverlay.classList.add('active');
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
            }

            function handleAnswer(e) {
                const btn = e.currentTarget;
                if (isAnswered || btn.disabled) return;

                const index = parseInt(btn.dataset.index);
                const data = answersData[index];
                if (!data) return;

                isAnswered = true;

                allButtons.forEach(b => {
                    b.disabled = true;
                    b.classList.add('disabled');
                });

                btn.classList.add(data.correct ? 'correct' : 'wrong');
                btn.setAttribute('aria-checked', 'true');

                showModal(data.feedback);
            }

            allButtons.forEach(btn => {
                btn.addEventListener('click', handleAnswer);
            });

            modalCloseBtn.addEventListener('click', closeModal);

            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) {
                    closeModal();
                }
            });

            resetBtn.addEventListener('click', function() {
                resetAll();
            });

            resetAll();

        })();
    </script>

</body>
</html>
