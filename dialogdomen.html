<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Живой диалог | ДК «Заря»</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a2b5e 0%, #0f3c7a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
        }

        .dialogue-container {
            max-width: 900px;
            width: 100%;
            background: #fffef7;
            border-radius: 2.5rem;
            box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .chat-area {
            padding: 2rem 2rem 1.5rem;
            background: #ffffff;
            min-height: 400px;
            max-height: 500px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: fadeSlideUp 0.35s ease-out;
        }
        .message.user {
            flex-direction: row-reverse;
        }
        .msg-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            animation: gentleFloatIcon 2.5s infinite ease-in-out;
        }
        @keyframes gentleFloatIcon {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .director .msg-icon {
            background: linear-gradient(145deg, #2c5f8a, #1a3f60);
            color: #ffecb3;
        }
        .user .msg-icon {
            background: linear-gradient(145deg, #b22234, #871c2c);
            color: #ffd966;
        }
        .bubble {
            max-width: 70%;
            padding: 0.8rem 1.3rem;
            border-radius: 1.3rem;
            font-size: 1rem;
            line-height: 1.45;
            font-weight: 500;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            position: relative;
        }
        .director .bubble {
            background: #eef2ff;
            color: #001f3f;
            border-top-left-radius: 0.3rem;
            border: 1px solid #cfdfff;
        }
        .user .bubble {
            background: #1e3a8a;
            color: white;
            border-top-right-radius: 0.3rem;
            text-align: right;
        }
        .typing-cursor::after {
            content: "▌";
            display: inline-block;
            animation: blink 0.9s step-end infinite;
            margin-left: 2px;
            color: currentColor;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* всплывающая подсказка */
        .feedback-toast {
            background: rgba(0,0,0,0.8);
            color: white;
            font-size: 0.9rem;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            animation: fadeInOut 3s ease forwards;
            pointer-events: none;
            z-index: 10;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-8px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-8px); visibility: hidden; }
        }

        .options-panel {
            padding: 1rem 2rem 2rem;
            background: #fafbff;
            border-top: 2px solid #e9edf5;
            transition: all 0.2s;
        }
        .options-title {
            font-size: 0.8rem;
            font-weight: 800;
            color: #dc143c;
            letter-spacing: 1px;
            margin-bottom: 0.8rem;
            text-transform: uppercase;
        }
        .option-button {
            display: block;
            width: 100%;
            background: white;
            border: 2px solid #0d6efd;
            border-radius: 60px;
            padding: 0.8rem 1.2rem;
            margin-bottom: 0.8rem;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: left;
            color: #0a2b5e;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .option-button:hover {
            background: #eef2ff;
            transform: translateX(8px);
            border-color: #dc143c;
        }
        .option-prefix {
            font-weight: 800;
            color: #dc143c;
            font-size: 1.05rem;
        }

        .restart-button {
            background: #1e3a8a;
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin: 0 2rem 1.8rem auto;
            width: fit-content;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .restart-button:hover {
            background: #0f2b66;
            transform: scale(0.97);
        }
        .chat-area::-webkit-scrollbar {
            width: 6px;
        }
        .chat-area::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .chat-area::-webkit-scrollbar-thumb {
            background: #0d6efd;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="dialogue-container">
    <div class="chat-area" id="chatMessages"></div>
    <div class="options-panel" id="optionsPanel"></div>
    <button class="restart-button" id="restartBtn">⟳ Начать диалог заново</button>
</div>

<script>
    // СЦЕНАРИЙ ДИАЛОГА (корректные переходы)
    const STEPS = {
        start: {
            speaker: 'director',
            text: "Привет! Я директор ДК «Заря». Узнал, что наш домен зарегистрирован на личный ящик бывшего сисадмина. Ты же все знаешь — дай совет, как поступить?",
            options: [
                { text: "Не трогай ничего и просто плати вовремя. Идентификация через Госуслуги обязательна только для новых сайтов.", nextStep: 'incorrectBranch', correct: false },
                { text: "Срочно начни переоформление домена на учреждение. Без этого вы не пройдете проверку через Госуслуги.", nextStep: 'correctBranch', correct: true }
            ]
        },
        incorrectBranch: {
            speaker: 'director',
            text: "Ох, кажется, ты и сам позабыл, что Федеральный закон № 569-ФЗ обязывает всех администраторов подтверждать данные. А не подскажешь, как теперь избежать блокировки?",
            options: [
                { text: "Авторизуйся в личном кабинете регистратора через Госуслуги (ЕСИА) организации.", nextStep: 'finalCorrect', correct: true },
                { text: "Отправь регистратору скан паспорта нового администратора по обычной почте.", nextStep: 'finalIncorrect', correct: false }
            ]
        },
        correctBranch: {
            speaker: 'director',
            text: "Спасибо! Отличный совет. От тебя нужна еще одна подсказка. Как теперь связать наши данные с Госуслугами учреждения?",
            options: [
                { text: "Достаточно просто указать ИНН организации в анкете регистратора.", nextStep: 'finalIncorrect', correct: false },
                { text: "Нужно авторизоваться в кабинете регистратора через ЕСИА организации для сверки данных.", nextStep: 'finalCorrect', correct: true }
            ]
        },
        finalCorrect: {
            speaker: 'director',
            text: "В точку! Ты узнал это в Школе менеджера культуры? Пора бы и мне начать в ней учиться!",
            options: null,
            isFinal: true
        },
        finalIncorrect: {
            speaker: 'director',
            text: "Боюсь, что ты ошибаешься так же, как и я. Предлагаю повнимательнее изучить материал в Школе менеджера культуры.",
            options: null,
            isFinal: true
        }
    };

    let currentStepKey = 'start';
    let isTyping = false;
    let historyMessages = [];

    const chatContainer = document.getElementById('chatMessages');
    const optionsContainer = document.getElementById('optionsPanel');

    function renderHistory() {
        chatContainer.innerHTML = '';
        historyMessages.forEach(msg => {
            const msgDiv = createMessageElement(msg.speaker, msg.text);
            chatContainer.appendChild(msgDiv);
        });
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function createMessageElement(speaker, text) {
        const div = document.createElement('div');
        div.className = `message ${speaker}`;
        const icon = speaker === 'director' ? '👨‍💼' : '🧑‍🎓';
        div.innerHTML = `<div class="msg-icon">${icon}</div><div class="bubble">${escapeHtml(text)}</div>`;
        return div;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function typeText(element, fullText, speed = 45) {
        return new Promise((resolve) => {
            let index = 0;
            element.innerText = '';
            element.classList.add('typing-cursor');
            function type() {
                if (index < fullText.length) {
                    element.innerText += fullText.charAt(index);
                    index++;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    setTimeout(type, speed);
                } else {
                    element.classList.remove('typing-cursor');
                    resolve();
                }
            }
            type();
        });
    }

    async function addTypingMessage(speaker, text) {
        const messageDiv = createMessageElement(speaker, '');
        const bubble = messageDiv.querySelector('.bubble');
        bubble.innerText = '';
        bubble.classList.add('typing-cursor');
        chatContainer.appendChild(messageDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        await typeText(bubble, text, 45);
        bubble.classList.remove('typing-cursor');
        historyMessages.push({ speaker, text });
    }

    function clearOptions() {
        optionsContainer.innerHTML = '';
    }

    function showFeedback(isCorrect) {
        const toast = document.createElement('div');
        toast.className = 'feedback-toast';
        toast.innerHTML = isCorrect ? '✅ Верно' : '❌ Неверно';
        const lastUserMsg = [...chatContainer.querySelectorAll('.message.user')].pop();
        if (lastUserMsg) {
            lastUserMsg.style.position = 'relative';
            lastUserMsg.appendChild(toast);
        } else {
            optionsContainer.parentNode.insertBefore(toast, optionsContainer);
        }
        setTimeout(() => toast.remove(), 3000);
    }

    async function showOptionsForStep(stepKey) {
        const step = STEPS[stepKey];
        if (!step.options) return;
        await delay(400);
        clearOptions();
        const title = document.createElement('div');
        title.className = 'options-title';
        title.innerText = 'Ваш ответ:';
        optionsContainer.appendChild(title);

        for (let idx = 0; idx < step.options.length; idx++) {
            const opt = step.options[idx];
            const btn = document.createElement('button');
            btn.className = 'option-button';
            btn.innerHTML = `<span class="option-prefix">${String.fromCharCode(65+idx)}.</span><span>${escapeHtml(opt.text)}</span>`;
            btn.addEventListener('click', async () => {
                if (isTyping) return;
                isTyping = true;
                // сразу убираем кнопки, чтобы пользователь их не видел во время паузы
                clearOptions();
                
                await addTypingMessage('user', opt.text);
                
                const isFinal = (opt.nextStep === 'finalCorrect' || opt.nextStep === 'finalIncorrect');
                if (!isFinal) {
                    showFeedback(opt.correct);
                }
                await delay(1200);
                
                let nextStep = opt.nextStep;
                if (!nextStep) {
                    nextStep = stepKey === 'correctBranch' ? 'finalIncorrect' : 'finalIncorrect';
                }
                currentStepKey = nextStep;
                const nextStepData = STEPS[currentStepKey];
                if (nextStepData) {
                    await addTypingMessage(nextStepData.speaker, nextStepData.text);
                    if (nextStepData.options && !nextStepData.isFinal) {
                        await showOptionsForStep(currentStepKey);
                    } else {
                        clearOptions();
                    }
                } else {
                    clearOptions();
                }
                isTyping = false;
            });
            optionsContainer.appendChild(btn);
        }
    }

    function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    async function resetDialogue() {
        if (isTyping) return;
        isTyping = true;
        historyMessages = [];
        currentStepKey = 'start';
        clearOptions();
        chatContainer.innerHTML = '';
        await addTypingMessage(STEPS.start.speaker, STEPS.start.text);
        await showOptionsForStep('start');
        isTyping = false;
    }

    document.getElementById('restartBtn').addEventListener('click', async () => {
        if (isTyping) return;
        resetDialogue();
    });

    resetDialogue();
</script>
</body>
</html>
