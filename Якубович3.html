<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Суперигра «Поле финансовых рисков» — Урок 3</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', 'Times New Roman', serif; background: #f4f6fb; color: #1a2456; min-height: 100vh; padding: 40px 20px; display: flex; justify-content: center; align-items: flex-start; }
  .container { max-width: 960px; width: 100%; }
  .game-title { text-align: center; margin-bottom: 28px; }
  .game-title .label { font-family: sans-serif; font-size: 1em; letter-spacing: 6px; text-transform: uppercase; color: #c89400; font-weight: bold; margin-bottom: 6px; }
  .game-title h1 { font-size: 2.4em; letter-spacing: 4px; color: #1a2456; font-weight: normal; text-transform: uppercase; line-height: 1.2; }
  .motto-block { background: #ffffff; border: 2px solid #e2e7f0; border-radius: 14px; padding: 22px 26px; box-shadow: 0 8px 30px rgba(26, 36, 86, 0.08); margin-bottom: 24px; }
  .motto-block .label { font-family: sans-serif; font-size: 0.78em; letter-spacing: 2.5px; text-transform: uppercase; color: #c89400; font-weight: bold; margin-bottom: 14px; }
  .motto-display { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; min-height: 44px; }
  .letter { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 32px; font-size: 1.3em; font-weight: bold; border-radius: 4px; transition: all 0.4s ease; padding: 0 2px; }
  .letter.space { width: 12px; min-width: 12px; }
  .letter.dash { min-width: 28px; }
  .letter.shown { color: #1a2456; }
  .letter.revealed { color: #c89400; background: #fff8e0; animation: pop 0.5s ease; }
  .letter.hidden { background: #eef1f8; border: 1px solid #d4dbe8; color: transparent; }
  @keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 50% { transform: scale(1.35); } 100% { transform: scale(1); opacity: 1; } }
  .play-row { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 30px; min-height: 260px; }
  .drum-col { flex: 0 0 auto; width: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 260px; }
  .drum-wrapper { position: relative; width: 200px; height: 200px; margin-bottom: 18px; flex-shrink: 0; }
  .drum-pointer { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 22px solid #c89400; z-index: 3; }
  .drum { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(#3a4a8e 0deg 45deg, #6a4bb8 45deg 90deg, #3a4a8e 90deg 135deg, #6a4bb8 135deg 180deg, #3a4a8e 180deg 225deg, #6a4bb8 225deg 270deg, #3a4a8e 270deg 315deg, #6a4bb8 315deg 360deg); border: 4px solid #c89400; box-shadow: 0 8px 30px rgba(26, 36, 86, 0.25); position: relative; display: flex; align-items: center; justify-content: center; }
  .drum::after { content: '1 2 3'; position: absolute; width: 60px; height: 60px; background: #ffffff; border: 3px solid #c89400; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #1a2456; font-size: 0.85em; letter-spacing: 3px; font-weight: bold; box-shadow: 0 0 20px rgba(200, 148, 0, 0.4); }
  .spin-btn { font-family: inherit; font-size: 0.95em; padding: 12px 28px; background: linear-gradient(135deg, #ffd84d, #c89400); color: #1a2456; border: none; border-radius: 30px; font-weight: bold; letter-spacing: 1px; cursor: pointer; box-shadow: 0 6px 20px rgba(200, 148, 0, 0.35); transition: all 0.3s; text-transform: uppercase; white-space: nowrap; }
  .spin-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(200, 148, 0, 0.5); }
  .spin-btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
  .host-col { flex: 0 0 auto; width: 240px; height: 260px; border-radius: 14px; overflow: hidden; background: #f0f2f8; border: 2px solid #e2e7f0; box-shadow: 0 8px 30px rgba(26, 36, 86, 0.08); display: flex; align-items: center; justify-content: center; position: relative; }
  .host-col img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
  .host-col .placeholder { font-family: sans-serif; font-size: 0.72em; color: #94a3c4; text-align: center; padding: 12px; line-height: 1.5; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(10, 15, 46, 0.55); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100; animation: fadeIn 0.25s ease; }
  .modal-overlay.active { display: flex; }
  .modal-overlay.feedback-overlay { z-index: 200; background: rgba(10, 15, 46, 0.7); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal { background: #ffffff; border-radius: 16px; width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(10, 15, 46, 0.4); animation: slideUp 0.35s cubic-bezier(0.2, 0.8, 0.3, 1); position: relative; }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-close { position: absolute; top: 14px; right: 18px; width: 32px; height: 32px; background: #f0f2f8; border: none; border-radius: 50%; cursor: pointer; font-size: 1.2em; color: #6b7794; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-family: sans-serif; line-height: 1; }
  .modal-close:hover { background: #e2e7f0; color: #1a2456; }
  .modal-inner { padding: 32px; }
  .modal-counter { color: #c89400; font-size: 0.85em; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px; font-family: sans-serif; font-weight: bold; }
  .modal-situation { color: #3a4460; font-size: 1.05em; line-height: 1.65; margin-bottom: 24px; }
  .answers { display: flex; flex-direction: column; gap: 12px; }
  .answer-btn { font-family: inherit; text-align: left; padding: 16px 20px; background: #f8f9fc; color: #1a2456; border: 2px solid #e2e7f0; border-radius: 8px; cursor: pointer; font-size: 1em; line-height: 1.45; transition: all 0.2s; }
  .answer-btn:hover:not(:disabled) { background: #fff8e0; border-color: #c89400; transform: translateX(4px); }
  .answer-btn:disabled { cursor: default; }
  .answer-btn.correct { background: #e8f8ee; border-color: #2ea860; color: #1a5c33; box-shadow: 0 0 15px rgba(46, 168, 96, 0.2); }
  .answer-btn.wrong { background: #fdeaea; border-color: #d94a4a; color: #8a1f1f; }
  .feedback-modal { max-width: 480px; }
  .feedback-content { padding: 36px 32px 28px; text-align: left; }
  .feedback-icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8em; font-weight: bold; margin-bottom: 20px; font-family: sans-serif; }
  .feedback-icon.correct { background: #e8f8ee; color: #2ea860; }
  .feedback-icon.wrong { background: #fdeaea; color: #d94a4a; }
  .feedback-content h3 { font-size: 1.4em; font-weight: normal; margin-bottom: 16px; }
  .feedback-content h3.correct { color: #2ea860; }
  .feedback-content h3.wrong { color: #d94a4a; }
  .feedback-text { color: #3a4460; font-size: 1.05em; line-height: 1.65; }
  .modal-btn { font-family: inherit; padding: 12px 26px; background: linear-gradient(135deg, #ffd84d, #c89400); color: #1a2456; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 0.95em; letter-spacing: 0.5px; transition: all 0.2s; }
  .modal-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(200, 148, 0, 0.4); }
  .modal-actions { margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end; }
  .final-section { text-align: center; padding: 44px 32px; background: #ffffff; border: 3px solid #c89400; border-radius: 14px; animation: fadeIn 0.6s ease; box-shadow: 0 8px 40px rgba(200, 148, 0, 0.2); display: none; }
  .final-section.active { display: block; }
  .final-section h2 { color: #1a2456; font-size: 2em; margin-bottom: 20px; font-weight: normal; letter-spacing: 3px; }
  .final-section > p { color: #6b7794; font-size: 1.05em; }
  .final-motto { font-size: 1.5em; color: #1a2456; font-weight: bold; padding: 24px; background: #fff8e0; border-radius: 8px; margin: 24px 0 0; letter-spacing: 1.5px; line-height: 1.5; border: 2px dashed #c89400; }
  .final-restart-btn { font-family: inherit; margin-top: 28px; padding: 14px 34px; background: linear-gradient(135deg, #ffd84d, #c89400); color: #1a2456; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 1em; letter-spacing: 1px; text-transform: uppercase; transition: all 0.25s; box-shadow: 0 6px 20px rgba(200, 148, 0, 0.35); }
  .final-restart-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(200, 148, 0, 0.5); }
  @media (max-width: 640px) { .play-row { flex-direction: column; min-height: auto; } .drum-col, .host-col { width: 100%; max-width: 280px; } .host-col { height: 280px; } .game-title h1 { font-size: 1.7em; letter-spacing: 2px; } .modal-inner { padding: 24px 20px; } .feedback-content { padding: 28px 22px 22px; } }
</style>
</head>
<body>
<div class="container">
  <div class="game-title"><div class="label">Суперигра</div><h1>Поле финансовых рисков</h1></div>
  <div class="motto-block"><div class="label">Девиз урока</div><div class="motto-display" id="mottoDisplay"></div></div>
  <div class="play-row" id="playRow">
    <div class="drum-col">
      <div class="drum-wrapper"><div class="drum-pointer"></div><div class="drum" id="drum"></div></div>
      <button class="spin-btn" id="spinBtn">Вращать барабан</button>
    </div>
    <div class="host-col">
      <img src="https://www.cultmanager.ru/images/Vibecoding/image---2026-10-07t185240.760.jpeg" alt="Ведущий" onerror="this.style.display='none'; this.parentNode.innerHTML='<div class=&quot;placeholder&quot;>Портрет ведущего</div>';">
    </div>
  </div>
  <div class="final-section" id="finalSection">
    <h2>СУПЕРИГРА ПРОЙДЕНА!</h2>
    <p>Вы собрали девиз урока:</p>
    <div class="final-motto">ЦЕНА БЕЗ РАСЧЁТА — ПУТЬ К УБЫТКУ</div>
    <button class="final-restart-btn" id="finalRestartBtn">Начать суперигру заново</button>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay"><div class="modal"><button class="modal-close" id="modalClose">×</button><div class="modal-inner" id="modalInner"></div></div></div>
<div class="modal-overlay feedback-overlay" id="feedbackOverlay"><div class="modal feedback-modal"><button class="modal-close" id="feedbackClose">×</button><div class="feedback-content" id="feedbackContent"></div></div></div>

<script>
const phrase = [
  {ch:'Ц', group:0}, {ch:'Е', group:0}, {ch:'Н', group:0}, {ch:'А', group:0}, {ch:' ', group:0},
  {ch:'Б', group:0}, {ch:'Е', group:0}, {ch:'З', group:0}, {ch:' ', group:0},
  {ch:'Р', group:1}, {ch:'А', group:1}, {ch:'С', group:1}, {ch:'Ч', group:1}, {ch:'Ё', group:1}, {ch:'Т', group:1}, {ch:'А', group:1},
  {ch:' ', group:0}, {ch:'—', group:0}, {ch:' ', group:0},
  {ch:'П', group:2}, {ch:'У', group:2}, {ch:'Т', group:2}, {ch:'Ь', group:2}, {ch:' ', group:0},
  {ch:'К', group:3}, {ch:' ', group:0}, {ch:'У', group:3}, {ch:'Б', group:3}, {ch:'Ы', group:3}, {ch:'Т', group:3}, {ch:'К', group:3}, {ch:'У', group:3}
];

const cases = [
  {
    situation: 'Учреждение установило цену билета на мастер-класс 500 рублей. Через год выяснилось: материалы подорожали, а комиссия билетного оператора выросла с 3% до 7%. Цена не менялась. Что было упущено при расчёте?',
    answers: [
      {text: 'Ничего — цена утверждена, пересматривать не нужно.', correct: false, feedback: 'Цена, утверждённая год назад, не учитывает инфляцию и рост комиссии оператора. Если не пересматривать прейскурант, услуга станет убыточной. При ежегодном обновлении цен нужно закладывать инфляцию и комиссию.'},
      {text: 'В цену не заложили инфляцию и рост комиссии билетного оператора.', correct: true, feedback: 'Верно. При утверждении цены на следующий год нужно закладывать коэффициент инфляции и комиссию оператора (обычно 3–7%). Иначе через год услуга перестанет окупаться.'},
      {text: 'Нужно было сразу заложить 20% прибыли, а не 10%.', correct: false, feedback: 'Размер прибыли — отдельный вопрос. Проблема в том, что цена не пересматривалась с учётом инфляции и роста комиссии. Даже 20% прибыли не спасут, если расходы выросли больше.'}
    ]
  },
  {
    situation: 'Себестоимость одного мастер-класса — 5000 рублей. Учреждение закупает краски и сумки в розницу. Поставщик предлагает оптовую скидку 15% при закупке от 50 комплектов. Что это даст?',
    answers: [
      {text: 'Снижение себестоимости и рост рентабельности услуги.', correct: true, feedback: 'Верно. Оптовые закупки — законный способ снизить прямые расходы. Это повышает рентабельность без увеличения цены билета. Главное — не закупить лишнего и следить за сроками хранения.'},
      {text: 'Ничего — скидка незначительная.', correct: false, feedback: '15% от стоимости материалов — это реальное снижение себестоимости. При больших объёмах экономия становится существенной. Это один из законных способов повысить рентабельность услуги.'},
      {text: 'Риск затоваривания — лучше не рисковать.', correct: false, feedback: 'Риск есть, но он управляемый. Если услуга востребована и количество участников стабильно, оптовые закупки оправданы. Нужно рассчитать, сколько комплектов реально расходуется за месяц.'}
    ]
  },
  {
    situation: 'Бухгалтер предлагает включить в прямые расходы мастер-класса стоимость новых мольбертов — 30 000 рублей. Мольберты будут использоваться три года. Верно ли это?',
    answers: [
      {text: 'Да, если мольберты куплены специально для этого мастер-класса.', correct: false, feedback: 'Даже если мольберты куплены для конкретного занятия, они будут использоваться многократно. Их нельзя списать в прямые расходы одного мастер-класса — только через амортизацию.'},
      {text: 'Да, если стоимость мольбертов меньше 40 000 рублей.', correct: false, feedback: 'Стоимость не главный критерий. Если мольберты служат больше года, они учитываются как основные средства независимо от цены. Прямые расходы — только для полностью расходуемых материалов.'},
      {text: 'Нет, мольберты — это основные средства, их стоимость переносится через амортизацию.', correct: true, feedback: 'Верно. В прямые расходы включаются только те материалы, которые расходуются полностью. Мольберты служат несколько лет, их стоимость учитывается через амортизацию, а не единовременно.'}
    ]
  }
];

let currentCase = 0, nextCaseIndex = 0, revealedGroups = new Set();
const overlay = document.getElementById('modalOverlay'), modalInner = document.getElementById('modalInner'), modalClose = document.getElementById('modalClose');
const feedbackOverlay = document.getElementById('feedbackOverlay'), feedbackContent = document.getElementById('feedbackContent'), feedbackClose = document.getElementById('feedbackClose');
const spinBtn = document.getElementById('spinBtn');

function renderMotto() {
  const container = document.getElementById('mottoDisplay');
  container.innerHTML = '';
  phrase.forEach(item => {
    const span = document.createElement('span');
    span.className = 'letter';
    if (item.ch === ' ') { span.classList.add('space'); span.textContent = ' '; }
    else if (item.ch === '—') { span.classList.add('dash'); span.textContent = '—'; if (item.group === 0) span.classList.add('shown'); }
    else if (item.group === 0) { span.classList.add('shown'); span.textContent = item.ch; }
    else if (revealedGroups.has(item.group)) { span.classList.add('revealed'); span.textContent = item.ch; }
    else { span.classList.add('hidden'); span.textContent = item.ch; }
    container.appendChild(span);
  });
}
function revealGroup(g) { revealedGroups.add(g); renderMotto(); }
function openModal(html) { modalInner.innerHTML = html; overlay.classList.add('active'); }
function closeModal() { overlay.classList.remove('active'); }
function showCaseModal(index) {
  currentCase = index;
  const c = cases[index];
  let html = '<div class="modal-counter">Кейс ' + (index + 1) + ' из ' + cases.length + '</div>';
  html += '<p class="modal-situation">' + c.situation + '</p><div class="answers">';
  c.answers.forEach((a, i) => { html += '<button class="answer-btn" data-idx="' + i + '">' + a.text + '</button>'; });
  html += '</div>';
  openModal(html);
  modalInner.querySelectorAll('.answer-btn').forEach(btn => { btn.onclick = () => handleAnswer(parseInt(btn.dataset.idx)); });
}
function openFeedback(isCorrect, text) {
  let html = '<div class="feedback-icon ' + (isCorrect ? 'correct' : 'wrong') + '">' + (isCorrect ? '✓' : '✕') + '</div>';
  html += '<h3 class="' + (isCorrect ? 'correct' : 'wrong') + '">' + (isCorrect ? 'Верно!' : 'Ошибка') + '</h3>';
  html += '<p class="feedback-text">' + text + '</p>';
  feedbackContent.innerHTML = html;
  feedbackOverlay.classList.add('active');
}
function closeFeedback() { feedbackOverlay.classList.remove('active'); }
function handleAnswer(answerIdx) {
  const c = cases[currentCase], answer = c.answers[answerIdx];
  const allBtns = modalInner.querySelectorAll('.answer-btn');
  allBtns.forEach(b => b.disabled = true);
  allBtns.forEach((b, i) => { if (c.answers[i].correct) b.classList.add('correct'); else if (i === answerIdx) b.classList.add('wrong'); });
  openFeedback(answer.correct, answer.feedback);
  if (answer.correct) { revealGroup(currentCase + 1); nextCaseIndex = currentCase + 1; }
  const actions = document.createElement('div'); actions.className = 'modal-actions';
  const actionBtn = document.createElement('button'); actionBtn.className = 'modal-btn';
  if (answer.correct) {
    if (currentCase < cases.length - 1) {
      actionBtn.textContent = 'Следующий кейс →';
      actionBtn.onclick = () => { closeModal(); closeFeedback(); spinBtn.disabled = false; };
    } else {
      actionBtn.textContent = 'Завершить суперигру';
      actionBtn.onclick = () => { closeModal(); closeFeedback(); document.getElementById('playRow').style.display = 'none'; document.getElementById('finalSection').classList.add('active'); };
    }
  } else {
    actionBtn.textContent = 'Попробовать снова';
    actionBtn.onclick = () => { closeModal(); closeFeedback(); setTimeout(() => { showCaseModal(currentCase); }, 300); };
  }
  actions.appendChild(actionBtn); modalInner.appendChild(actions);
}
function resetGame() {
  currentCase = 0; nextCaseIndex = 0; revealedGroups = new Set(); renderMotto();
  document.getElementById('playRow').style.display = 'flex';
  document.getElementById('finalSection').classList.remove('active');
  spinBtn.disabled = false;
  const drum = document.getElementById('drum'); drum.style.transition = 'none'; drum.style.transform = 'rotate(0deg)';
}
feedbackClose.onclick = () => { closeFeedback(); };
feedbackOverlay.onclick = (e) => { if (e.target === feedbackOverlay) closeFeedback(); };
modalClose.onclick = () => { closeModal(); closeFeedback(); spinBtn.disabled = false; };
overlay.onclick = (e) => { if (e.target === overlay) { closeModal(); closeFeedback(); spinBtn.disabled = false; } };
spinBtn.onclick = function() {
  const drum = document.getElementById('drum'); spinBtn.disabled = true;
  const turns = 3 + Math.random() * 2, degrees = turns * 360;
  drum.style.transition = 'transform 2.5s cubic-bezier(0.2, 0.8, 0.3, 1)'; drum.style.transform = 'rotate(' + degrees + 'deg)';
  setTimeout(() => { drum.style.transition = 'none'; drum.style.transform = 'rotate(0deg)'; showCaseModal(nextCaseIndex); }, 2600);
};
document.getElementById('finalRestartBtn').onclick = () => { resetGame(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
renderMotto();
</script>
</body>
</html>
