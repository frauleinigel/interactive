<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ветеран СВО в вашем учреждении культуры: диалоговый тренажёр</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: #e8edf3;
    padding: 16px;
    color: #1a1a1a;
    font-size: 20px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .trainer {
    max-width: 960px;
    max-height: calc(100vh - 32px);
    margin: 0 auto;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 12px 48px rgba(20,40,70,0.14);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Стартовый экран ---------- */
  .start-screen {
    flex: 1 1 auto;
    min-height: calc(100vh - 32px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 32px;
    text-align: center;
    gap: 24px;
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .start-screen::-webkit-scrollbar { display: none; }
  .portrait {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    overflow: hidden;
    border: 6px solid #1e3a5f;
    box-shadow: 0 14px 44px rgba(30,58,95,0.28);
    flex-shrink: 0;
    background: #dbe4ee;
  }
  .portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .start-title {
    font-size: 32px;
    font-weight: 800;
    color: #1e3a5f;
    margin: 0;
    max-width: 760px;
    line-height: 1.25;
  }
  .start-sub {
    font-size: 20px;
    color: #1a1a1a;
    max-width: 680px;
    line-height: 1.6;
    margin: 0;
  }
  .start-btn {
    margin-top: 8px;
    padding: 18px 56px;
    background: #1b8a3f;
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 8px 22px rgba(27,138,63,0.35);
    transition: background 0.15s, transform 0.15s;
  }
  .start-btn:hover { background: #167032; transform: translateY(-1px); }

  /* ---------- Чат (компактный) ---------- */
  .stage {
    flex: 0 1 auto;
    min-height: 0;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    background: #fbfcfe;
  }
  .stage::-webkit-scrollbar { display: none; }
  .msg {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    max-width: 84%;
    animation: fadeIn 0.3s ease;
  }
  .msg--left { align-self: flex-start; }
  .msg--right { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: #dbe4ee;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .msg--right .avatar { background: #cfe0f4; }
  .msg__body { display: flex; flex-direction: column; gap: 3px; }
  .bubble {
    padding: 10px 15px;
    border-radius: 16px;
    font-size: 17px;
    line-height: 1.45;
    background: #eef2f7;
    border-top-left-radius: 5px;
    color: #1a1a1a;
    word-wrap: break-word;
  }
  .msg--right .bubble {
    background: #1e3a5f;
    color: #fff;
    border-top-left-radius: 16px;
    border-top-right-radius: 5px;
  }
  .note {
    font-size: 15px;
    font-style: italic;
    color: #1e3a5f;
    padding-left: 6px;
    line-height: 1.35;
    font-weight: 500;
  }
  .msg--right .note { text-align: right; padding-right: 6px; padding-left: 0; }

  /* Вводная реплика с фото ветерана */
  .narration {
    align-self: stretch;
    display: flex;
    align-items: center;
    gap: 14px;
    font-style: italic;
    color: #1a1a1a;
    font-size: 16px;
    padding: 12px 16px;
    background: #fff;
    border-radius: 14px;
    border: 2px dashed #94a8c4;
    line-height: 1.45;
    font-weight: 500;
  }
  .narration__photo {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #1e3a5f;
    flex-shrink: 0;
    background: #dbe4ee;
    box-shadow: 0 4px 12px rgba(30,58,95,0.2);
  }
  .narration__photo img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .narration__text { flex: 1; }

  .final-block {
    align-self: center;
    max-width: 640px;
    text-align: center;
    padding: 8px 0;
    animation: fadeIn 0.4s ease;
  }
  .final-block h3 { margin: 0 0 10px; font-size: 22px; color: #1e3a5f; font-weight: 800; }
  .final-block p { margin: 0; font-size: 17px; line-height: 1.55; color: #1a1a1a; }

  /* ---------- Футер с опциями ---------- */
  .footer {
    flex-shrink: 0;
    padding: 12px 20px 16px;
    background: #fff;
    border-top: 2px solid #d8e0ea;
  }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .options__title {
    font-size: 15px;
    color: #1e3a5f;
    font-weight: 800;
    margin-bottom: 2px;
    letter-spacing: 0.01em;
  }
  .option-btn {
    text-align: left;
    padding: 11px 16px;
    border: 2px solid #c9d5e3;
    border-radius: 12px;
    background: #fff;
    cursor: pointer;
    font-size: 16px;
    line-height: 1.4;
    font-family: inherit;
    color: #1a1a1a;
    width: 100%;
    transition: all 0.15s;
    font-weight: 500;
  }
  .option-btn:hover:not(:disabled) { border-color: #1e3a5f; background: #f5f9ff; }
  .option-btn:disabled { opacity: 0.35; cursor: default; }

  /* ---------- Попап ---------- */
  .popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .popup-overlay.visible { display: flex; animation: fadeIn 0.2s ease; }
  .popup {
    background: #fff;
    border-radius: 22px;
    padding: 32px 34px 30px;
    max-width: 620px;
    width: 100%;
    position: relative;
    box-shadow: 0 24px 64px rgba(0,0,0,0.35);
    border-left: 8px solid #1e3a5f;
    animation: popIn 0.25s ease;
  }
  .popup-close {
    position: absolute;
    top: 14px; right: 14px;
    width: 42px; height: 42px;
    border-radius: 50%;
    border: none;
    background: #eef2f7;
    color: #1e3a5f;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    font-family: inherit;
    font-weight: 700;
    transition: background 0.15s;
  }
  .popup-close:hover { background: #dbe3ec; }
  .popup-icon { font-size: 32px; margin-bottom: 8px; }
  .popup-title {
    font-size: 22px;
    font-weight: 800;
    color: #1e3a5f;
    margin-bottom: 12px;
    padding-right: 50px;
    line-height: 1.3;
  }
  .popup-text {
    font-size: 18px;
    line-height: 1.55;
    color: #1a1a1a;
  }

  /* Жёлтая кнопка «Пройти ещё раз» */
  .restart-btn {
    padding: 14px 36px;
    background: #f5b301;
    color: #1a1a1a;
    border: 2px solid #d99a00;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    display: block;
    margin-left: auto;
    box-shadow: 0 6px 18px rgba(217,154,0,0.35);
    transition: background 0.15s, transform 0.15s;
  }
  .restart-btn:hover { background: #e0a400; transform: translateY(-1px); }

  .typing { display: inline-flex; gap: 5px; align-items: center; padding: 14px 18px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #94a8c4; animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink { 0%,60%,100%{opacity:.3} 30%{opacity:1} }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  @keyframes popIn { from{opacity:0;transform:scale(0.94)} to{opacity:1;transform:scale(1)} }

  @media (max-width: 640px) {
    body { padding: 8px; font-size: 18px; }
    .trainer { max-height: calc(100vh - 16px); border-radius: 14px; }
    .start-screen { padding: 26px 20px; gap: 18px; min-height: calc(100vh - 16px); }
    .portrait { width: 150px; height: 150px; border-width: 5px; }
    .start-title { font-size: 25px; }
    .start-sub { font-size: 18px; }
    .start-btn { font-size: 19px; padding: 16px 42px; }
    .stage { padding: 12px 12px; gap: 8px; }
    .footer { padding: 10px 12px 14px; }
    .bubble { font-size: 16px; padding: 9px 13px; }
    .note { font-size: 14px; }
    .narration { font-size: 15px; padding: 10px 12px; gap: 10px; }
    .narration__photo { width: 52px; height: 52px; border-width: 2px; }
    .avatar { width: 36px; height: 36px; font-size: 20px; }
    .option-btn { font-size: 15px; padding: 10px 14px; }
    .options__title { font-size: 14px; }
    .popup { padding: 24px 20px 22px; }
    .popup-title { font-size: 20px; }
    .popup-text { font-size: 17px; }
    .final-block h3 { font-size: 19px; }
    .final-block p { font-size: 16px; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body>

<div class="trainer">

  <!-- Стартовый экран -->
  <div class="start-screen" id="start-screen">
    <div class="portrait">
      <img src="https://www.cultmanager.ru/images/Vibecoding/image---2026-11-18t005104.454.jpeg" alt="Портрет">
    </div>
    <h1 class="start-title">Ветеран СВО в вашем учреждении культуры: диалоговый тренажер</h1>
    <p class="start-sub">Постройте разговор с посетителем, который впервые пришёл к вам после возвращения с СВО. Выбирайте реплики по ходу диалога. Каждый выбор влияет на состояние ветерана.</p>
    <button class="start-btn" id="start-btn">Начать</button>
  </div>

  <!-- Чат (скрыт до старта) -->
  <div class="stage" id="stage" style="display:none;"></div>
  <div class="footer" id="footer" style="display:none;"></div>
</div>

<div class="popup-overlay" id="popup-overlay">
  <div class="popup">
    <button class="popup-close" aria-label="Закрыть">✕</button>
    <div class="popup-icon">💭</div>
    <div class="popup-title"></div>
    <div class="popup-text"></div>
  </div>
</div>

<script>
  const startScreen = document.getElementById('start-screen');
  const startBtn = document.getElementById('start-btn');
  const stage = document.getElementById('stage');
  const footer = document.getElementById('footer');
  const popupOverlay = document.getElementById('popup-overlay');
  const PHOTO = 'https://www.cultmanager.ru/images/Vibecoding/image---2026-11-18t005104.454.jpeg';
  const EMP = '👩‍💼';

  const scenario = [
    {
      narration: 'Мужчина около 40 лет, ветеран СВО. Пришёл впервые, остановился у стойки информации. Молчит, переминается с ноги на ногу.',
      prompt: 'Шаг 1. Как поприветствуете?',
      options: [
        {
          text: 'Здравствуйте! Вы к нам на мероприятие? У нас сегодня концерт, очень рекомендую! Проходите, раздевайтесь, сейчас всё покажу!',
          reaction: 'Да я… я просто посмотреть.',
          reactionNote: 'Отшатывается, делает шаг назад. Плечи напряжены.',
          comment: 'Резкие стимулы — громкий голос, быстрый темп, требование действия — для человека с ПТСР могут восприниматься как угроза. Он не успевает оценить обстановку и чувствует давление. Гипервозбудимость — один из симптомов ПТСР.'
        },
        {
          text: 'Здравствуйте. Рад вас видеть. Если хотите, можете осмотреться — я рядом, если что-то понадобится.',
          reaction: 'Спасибо. Я посмотрю.',
          reactionNote: 'Чуть расслабляет плечи, кивает.',
          comment: 'Вы дали понять, что рады, но не требуете немедленного контакта. Ветеран сохраняет контроль над ситуацией — а контроль для человека с ПТСР часто важнее, чем сама тема разговора.'
        },
        {
          text: 'Здравствуйте. Что вы хотели?',
          reaction: 'Да нет, ничего…',
          reactionNote: 'Сжимается, говорит тише и делает движение к выходу.',
          comment: 'Человек и так насторожен — холодный приём подтверждает его опасения, что здесь «не место для него». Формально вежливо, но по сути — закрытая дверь.'
        }
      ]
    },
    {
      veteranLine: 'Да я узнать хотел. Что у вас тут есть.',
      prompt: 'Шаг 2. Что ответите?',
      options: [
        {
          text: 'О, у нас много всего! Вот список на три страницы, вот афиша, вот расписание кружков…',
          reaction: 'Ага… спасибо.',
          reactionNote: 'Смотрит на бумаги, отводит взгляд. Видно, что потерялся.',
          comment: 'Много данных сразу — для человека с ПТСР это дополнительная нагрузка: трудно удерживать внимание и выбирать. Списки и афиши не помогают, а добавляют тревоги.'
        },
        {
          text: 'Конечно. Расскажу коротко, а если что-то заинтересует — подробнее. У нас есть клуб общения, настольные игры, экскурсии. Что-то из этого близко?',
          reaction: 'Настольные игры? Ну, я раньше играл…',
          reactionNote: 'Оживляется, чуть подаётся вперёд.',
          comment: 'Короткая структура, выбор и мягкий вопрос — ветеран получает ориентиры, но не обязан отвечать развёрнуто. Вопрос «что-то из этого близко?» приглашает, а не давит.'
        },
        {
          text: 'А вы вообще чем интересуетесь? Расскажите о себе.',
          reaction: 'Да не знаю… просто зашёл.',
          reactionNote: 'Напрягается, разговор глохнет.',
          comment: 'Личный вопрос на первом контакте звучит как вторжение в пространство. Доверие ещё не установлено — такой вопрос скорее закроет разговор, чем откроет.'
        }
      ]
    },
    {
      veteranLine: 'Не знаю… я давно не был в таких местах.',
      prompt: 'Шаг 3. Что скажете?',
      options: [
        {
          text: 'Да ладно вам, все свои, быстро освоитесь!',
          reaction: 'Может, и правда…',
          reactionNote: 'Натянуто улыбается, но плечи напряжены. Через минуту уходит.',
          comment: 'Фраза «да ладно вам» обесценивает чувство: «твои переживания — ерунда». Для ветерана это сигнал, что его не понимают, и он закрывается.'
        },
        {
          text: 'Понимаю. Если хотите, можно сначала просто посмотреть — посидеть в стороне, познакомиться с ведущим. Без обязательств.',
          reaction: 'А можно? Ну, давайте попробую.',
          reactionNote: 'Выдыхает, чуть расслабляется.',
          comment: 'Вы признали чувство («понимаю»), не стали давить и предложили безопасный формат — посмотреть, не участвовать. Контроль остаётся у ветерана, тревога снижается.'
        },
        {
          text: 'Ну, тогда приходите, когда будете готовы.',
          reaction: 'Ага. Спасибо.',
          reactionNote: 'Кивает и уходит. Скорее всего, не вернётся.',
          comment: 'Вежливо, но по сути — отказ от контакта. Человек и так сомневается; такая фраза подтверждает, что «здесь не ждут».'
        }
      ]
    }
  ];

  let stepIndex = 0;
  const wait = ms => new Promise(r => setTimeout(r, ms));

  function scrollStage() { stage.scrollTop = stage.scrollHeight; }

  function addVetBubble(text, note) {
    const msg = document.createElement('div');
    msg.className = 'msg msg--left';
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    const img = document.createElement('img');
    img.src = PHOTO;
    img.alt = 'Ветеран';
    avatar.appendChild(img);
    const body = document.createElement('div');
    body.className = 'msg__body';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    body.appendChild(bubble);
    if (note) {
      const n = document.createElement('div');
      n.className = 'note';
      n.textContent = note;
      body.appendChild(n);
    }
    msg.appendChild(avatar);
    msg.appendChild(body);
    stage.appendChild(msg);
    scrollStage();
  }

  function addEmpBubble(text) {
    const msg = document.createElement('div');
    msg.className = 'msg msg--right';
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = EMP;
    const body = document.createElement('div');
    body.className = 'msg__body';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    body.appendChild(bubble);
    msg.appendChild(avatar);
    msg.appendChild(body);
    stage.appendChild(msg);
    scrollStage();
  }

  async function addVeteranMessage(text, note) {
    const typing = document.createElement('div');
    typing.className = 'msg msg--left';
    typing.innerHTML = `<div class="avatar"><img src="${PHOTO}" alt="Ветеран"></div><div class="bubble typing"><span></span><span></span><span></span></div>`;
    stage.appendChild(typing);
    scrollStage();
    await wait(700);
    typing.remove();
    addVetBubble(text, note);
  }

  function addNarration(text) {
    const el = document.createElement('div');
    el.className = 'narration';
    el.innerHTML = `
      <div class="narration__photo"><img src="${PHOTO}" alt="Ветеран"></div>
      <div class="narration__text">${text}</div>
    `;
    stage.appendChild(el);
    scrollStage();
  }

  function showPopup(title, text, onClose) {
    popupOverlay.querySelector('.popup-title').textContent = title;
    popupOverlay.querySelector('.popup-text').textContent = text;
    popupOverlay.classList.add('visible');

    const close = () => {
      popupOverlay.classList.remove('visible');
      popupOverlay.querySelector('.popup-close').removeEventListener('click', close);
      popupOverlay.removeEventListener('click', overlayClick);
      document.removeEventListener('keydown', escClose);
      if (onClose) onClose();
    };
    const overlayClick = (e) => { if (e.target === popupOverlay) close(); };
    const escClose = (e) => { if (e.key === 'Escape') close(); };

    popupOverlay.querySelector('.popup-close').addEventListener('click', close);
    popupOverlay.addEventListener('click', overlayClick);
    document.addEventListener('keydown', escClose);
  }

  function renderOptions(step) {
    footer.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'options';
    const title = document.createElement('div');
    title.className = 'options__title';
    title.textContent = step.prompt;
    wrap.appendChild(title);

    step.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt.text;
      btn.addEventListener('click', () => selectOption(opt));
      wrap.appendChild(btn);
    });
    footer.appendChild(wrap);
  }

  async function selectOption(opt) {
    footer.querySelectorAll('button').forEach(b => b.disabled = true);
    addEmpBubble(opt.text);
    await wait(500);
    await addVeteranMessage(opt.reaction, opt.reactionNote);
    await wait(300);
    showPopup('Что произошло', opt.comment, () => {
      footer.innerHTML = '';
      if (stepIndex < scenario.length - 1) {
        stepIndex++;
        renderStep();
      } else {
        showFinal();
      }
    });
  }

  async function renderStep() {
    const step = scenario[stepIndex];
    if (step.narration) addNarration(step.narration);
    if (step.veteranLine) await addVeteranMessage(step.veteranLine);
    renderOptions(step);
  }

  function showFinal() {
    const final = document.createElement('div');
    final.className = 'final-block';
    final.innerHTML = `
      <h3>Вы прошли три шага</h3>
      <p>Вы увидели, как разные реплики меняют состояние ветерана: где-то он расслабляется, где-то закрывается. В реальном разговоре выбор всегда за вами — но теперь у вас есть ориентиры. Помимо слов, обращайте внимание на позу, взгляд, дыхание. Порой они дают больше информации, чем реплики собеседника.</p>
    `;
    stage.appendChild(final);
    scrollStage();

    footer.innerHTML = '';
    const btn = document.createElement('button');
    btn.className = 'restart-btn';
    btn.textContent = 'Пройти ещё раз';
    btn.addEventListener('click', restart);
    footer.appendChild(btn);
  }

  function restart() {
    stepIndex = 0;
    stage.innerHTML = '';
    footer.innerHTML = '';
    startScreen.style.display = 'flex';
    stage.style.display = 'none';
    footer.style.display = 'none';
  }

  startBtn.addEventListener('click', () => {
    startScreen.style.display = 'none';
    stage.style.display = 'flex';
    footer.style.display = 'block';
    renderStep();
  });
</script>

</body>
</html>
