<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр: Короткие аудиообзоры книг по воспитанию</title>
<style>
  :root{
    --brand:#FF8A3D;
    --brand-dark:#E06014;
    --brand-soft:#FFE9D6;
    --ok:#20b26c;
    --err:#ff5252;
    --ink:#2b1e15;
    --muted:#8a7566;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 500px at 10% -10%, #ffe3c9 0%, transparent 60%),
      radial-gradient(800px 500px at 100% 0%, #ffd0a8 0%, transparent 55%),
      #fff6ee;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:820px;margin:0 auto;}

  .head{text-align:center;margin-bottom:22px;}
  .badge{
    display:inline-block;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-weight:700;
    color:#fff;
    background:linear-gradient(135deg,var(--brand),var(--brand-dark));
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:16px;
    box-shadow:0 6px 14px -6px rgba(224,96,20,.55);
  }

  .head-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .head-icon{
    flex:0 0 auto;
    width:56px;
    height:56px;
    display:grid;
    place-items:center;
    filter:drop-shadow(0 6px 12px rgba(224,96,20,.35));
  }
  .head-icon svg{display:block;}

  .head-text{text-align:left;}

  h1{
    font-size:clamp(20px,4vw,28px);
    margin:0 0 6px;
    line-height:1.25;
  }
  .sub{margin:0;color:var(--muted);font-size:15px;line-height:1.4;}

  .bar{
    height:8px;
    background:#ffe6d2;
    border-radius:99px;
    overflow:hidden;
    margin:22px 0 8px;
  }
  .bar-fill{
    height:100%;
    width:0;
    border-radius:99px;
    background:linear-gradient(90deg,var(--brand),var(--brand-dark));
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }
  .counter{
    text-align:right;
    font-size:13px;
    color:var(--muted);
    font-weight:600;
    letter-spacing:.02em;
    margin-bottom:14px;
  }

  .card{
    background:#fff;
    border-radius:22px;
    padding:26px 24px;
    box-shadow:0 18px 40px -22px rgba(160,70,20,.35), 0 2px 6px rgba(160,70,20,.06);
    animation:pop .3s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .q-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .q-num{
    font-size:12px;
    font-weight:800;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--brand-dark);
    background:var(--brand-soft);
    padding:5px 12px;
    border-radius:8px;
  }
  .q-head h2{font-size:19px;margin:0;}

  .options{display:flex;flex-direction:column;gap:12px;}
  .opt{
    display:flex;
    gap:14px;
    align-items:flex-start;
    width:100%;
    text-align:left;
    font:inherit;
    font-size:15px;
    line-height:1.5;
    color:var(--ink);
    background:#fff;
    border:2px solid #f3e5d8;
    border-radius:16px;
    padding:16px 18px;
    cursor:pointer;
    transition:border-color .18s, transform .18s, box-shadow .18s, background .18s;
  }
  .opt:hover:not(:disabled){
    border-color:var(--brand);
    transform:translateY(-2px);
    box-shadow:0 12px 24px -16px rgba(224,96,20,.55);
  }
  .opt:disabled{cursor:default;}

  .mark{
    flex:0 0 26px;
    height:26px;
    border-radius:50%;
    background:var(--brand-soft);
    color:#fff;
    font-size:15px;
    font-weight:800;
    display:grid;
    place-items:center;
    margin-top:1px;
    transition:.2s;
  }
  .txt{flex:1;}

  .opt.correct{border-color:var(--ok);background:#f2fdf7;}
  .opt.correct .mark{background:var(--ok);}
  .opt.wrong{border-color:var(--err);background:#fff4f4;}
  .opt.wrong .mark{background:var(--err);}
  .opt.dim{opacity:.62;}

  .actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-top:22px;
    flex-wrap:wrap;
  }
  .actions-right{display:flex;gap:10px;margin-left:auto;}

  .btn{
    font:inherit;
    font-weight:700;
    font-size:15px;
    color:#fff;
    background:linear-gradient(135deg,var(--brand),var(--brand-dark));
    border:none;
    border-radius:14px;
    padding:13px 26px;
    cursor:pointer;
    box-shadow:0 12px 24px -14px rgba(224,96,20,.85);
    transition:transform .15s, box-shadow .15s, opacity .2s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 28px -14px rgba(224,96,20,.95);}
  .btn:active{transform:translateY(0);}
  .btn[hidden]{display:none;}

  .btn-ghost{
    background:#fff;
    color:var(--brand-dark);
    border:2px solid #ffd7b5;
    box-shadow:none;
  }
  .btn-ghost:hover{
    background:#fff5ec;
    box-shadow:none;
  }

  /* ---------- Модальное окно ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(60,25,0,.55);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
  }
  .overlay.show{display:flex;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .modal{
    position:relative;
    background:#fff;
    border-radius:20px;
    width:100%;
    max-width:520px;
    max-height:85vh;
    overflow-y:auto;
    padding:34px 30px 30px;
    box-shadow:0 30px 60px -20px rgba(60,25,0,.55);
    animation:pop .28s cubic-bezier(.4,0,.2,1);
  }

  .modal-close{
    position:absolute;
    top:14px;
    right:14px;
    width:36px;
    height:36px;
    border:none;
    border-radius:50%;
    background:#fff2e5;
    color:var(--muted);
    font-size:22px;
    line-height:1;
    cursor:pointer;
    display:grid;
    place-items:center;
    transition:background .18s, color .18s, transform .25s;
  }
  .modal-close:hover{background:#ffe1c6;color:var(--ink);transform:rotate(90deg);}

  .m-content{
    display:flex;
    gap:16px;
    align-items:flex-start;
    padding-right:28px;
  }
  .m-icon{
    flex:0 0 40px;
    width:40px;
    height:40px;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:22px;
    font-weight:800;
    color:#fff;
    line-height:1;
  }
  .m-icon.bad{background:var(--err);}
  .m-icon.good{background:var(--ok);}

  .m-text{
    flex:1;
    font-size:15.5px;
    line-height:1.6;
    color:var(--ink);
    padding-top:8px;
  }

  /* ---------- Результат ---------- */
  .result{text-align:center;}
  .score{
    font-size:56px;
    font-weight:800;
    line-height:1;
    background:linear-gradient(135deg,var(--brand),var(--brand-dark));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin:6px 0 4px;
  }
  .score small{font-size:22px;color:#e2cdbb;-webkit-text-fill-color:#e2cdbb;}
  .result h3{margin:6px 0 20px;font-size:19px;}

  .summary{
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:24px;
  }
  .sum-item{
    border:1px solid #fbeede;
    border-left:4px solid var(--ok);
    border-radius:12px;
    padding:12px 14px;
    background:#fffaf4;
    font-size:14px;
    line-height:1.5;
  }
  .sum-item b{display:block;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--brand-dark);margin-bottom:4px;}

  @media(max-width:520px){
    .card{padding:20px 16px;border-radius:18px;}
    .opt{padding:14px;font-size:14.5px;}
    .actions{flex-direction:column;align-items:stretch;}
    .actions-right{margin-left:0;flex-direction:column;}
    .btn{width:100%;}
    .modal{padding:30px 20px 24px;}
    .m-content{gap:12px;padding-right:24px;}
    .m-icon{flex-basis:34px;width:34px;height:34px;font-size:18px;}
    .m-text{font-size:14.5px;}

    .head-row{gap:12px;flex-direction:column;}
    .head-text{text-align:center;}
    .head-icon{width:48px;height:48px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="head">
    <div class="badge">Проект №2</div>

    <div class="head-row">
      <!-- Иконка: наушники + звуковые волны, оранжевый градиент -->
      <div class="head-icon" aria-hidden="true">
        <svg width="56" height="56" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="grad2" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#FF8A3D"/>
              <stop offset="100%" stop-color="#E06014"/>
            </linearGradient>
          </defs>
          <path d="M14 34 V28 a18 18 0 0 1 36 0 v6"
                stroke="url(#grad2)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
          <rect x="8" y="32" width="12" height="18" rx="6" fill="url(#grad2)"/>
          <rect x="44" y="32" width="12" height="18" rx="6" fill="url(#grad2)"/>
          <path d="M28 40 q4 -4 8 0" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9"/>
          <path d="M30 45 q2 -2 4 0" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9"/>
        </svg>
      </div>

      <div class="head-text">
        <h1>Короткие аудиообзоры книг по воспитанию</h1>
        <p class="sub">На каждом шаге выберите необходимое действие</p>
      </div>
    </div>
  </header>

  <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  <div class="counter" id="counter"></div>

  <main id="app"></main>
</div>

<!-- Модальное окно с расшифровкой -->
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" aria-label="Закрыть">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
/* ================== ДАННЫЕ ================== */
const STEPS = [
  {
    n: 1,
    title: "Анализ запроса",
    options: [
      {
        text: "Выявить через фокус-группу с молодыми родителями, что у них нет времени читать объёмные книги, но есть потребность в психологии.",
        ok: true,
        why: "Правильно. Точное попадание в боль конкретной аудитории (дефицит времени)."
      },
      {
        text: "Проанализировать списки бестселлеров в книжных интернет-магазинах за текущий месяц.",
        ok: false,
        why: "Ошибка. Коммерческие рейтинги показывают продажи рынка, но не реальный запрос читателей вашей библиотеки."
      }
    ]
  },
  {
    n: 2,
    title: "Отбор контента и ресурсов",
    options: [
      {
        text: "Привлечь библиографов для отбора лучших книг из фонда и экспертов для создания текстов обзоров.",
        ok: true,
        why: "Правильно. Задействован внутренний ресурс (фонд) и экспертные знания."
      },
      {
        text: "Записать первые пять аудиообзоров сразу на диктофон без предварительного отбора литературы.",
        ok: false,
        why: "Ошибка. Нарушена этапность: переходить к созданию продукта (шаг 3) до отбора и структурирования контента нельзя."
      }
    ]
  },
  {
    n: 3,
    title: "Создание продукта",
    options: [
      {
        text: "Записать короткие аудиообзоры ключевых идей отобранных книг.",
        ok: true,
        why: "Правильно. Формат аудио идеально решает проблему занятых родителей."
      },
      {
        text: "Опубликовать ссылки на покупку отобранных книг в стороннем интернет-магазине.",
        ok: false,
        why: "Ошибка. Вместо создания собственного цифрового продукта вы занимаетесь коммерческой реферативной ссылкой."
      }
    ]
  },
  {
    n: 4,
    title: "Упаковка и дистрибуция",
    options: [
      {
        text: "Опубликовать аудиозаписи в соцсетях библиотеки со ссылкой на бронирование печатных версий книг в фонде.",
        ok: true,
        why: "Правильно. Удобная дистрибуция в сети с прямой связкой на выдачу книг из фонда."
      },
      {
        text: "Сделать красивую презентацию о пользе чтения и показать её на очной встрече клуба.",
        ok: false,
        why: "Ошибка. Презентация и очная встреча — это полезно, но это офлайн-мероприятие, а не дистрибуция цифрового аудиопродукта."
      }
    ]
  },
  {
    n: 5,
    title: "Сбор обратной связи и аналитика",
    options: [
      {
        text: "Посмотреть количество прослушиваний в сети и проверить, выросла ли бронь бумажных книг из подборки.",
        ok: true,
        why: "Правильно. Оцениваются и сетевой охват, и конвертация в реальных читателей фонда."
      },
      {
        text: "Провести опрос среди тех, кто прослушал обзоры, чтобы узнать, какую тему выбрать для следующего выпуска.",
        ok: false,
        why: "Ошибка. Это ценное действие, но оно относится к первому шагу (анализу запроса для нового проекта), а не к оценке эффективности уже завершённого запуска."
      }
    ]
  }
];

/* ================== ЛОГИКА ================== */
const app        = document.getElementById('app');
const barFill    = document.getElementById('barFill');
const counter    = document.getElementById('counter');
const overlay    = document.getElementById('overlay');
const modalBody  = document.getElementById('modalBody');
const modalClose = document.getElementById('modalClose');

let quiz     = [];
let idx      = 0;
let score    = 0;
let answered = false;
let log      = [];

const shuffle = arr => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

function init() {
  quiz = STEPS.map(s => ({ ...s, options: shuffle(s.options) }));
  idx = 0; score = 0; answered = false; log = [];
  overlay.classList.remove('show');
  renderQuestion();
}

function setBar(percent) { barFill.style.width = percent + '%'; }

function renderQuestion() {
  if (idx >= quiz.length) return renderResult();

  const q = quiz[idx];
  answered = false;

  counter.textContent = `Шаг ${q.n} из ${quiz.length}`;
  setBar(idx / quiz.length * 100);

  app.innerHTML = `
    <div class="card">
      <div class="q-head">
        <span class="q-num">Шаг ${q.n}</span>
        <h2>${q.title}</h2>
      </div>
      <div class="options" id="options">
        ${q.options.map((o, i) => `
          <button class="opt" data-i="${i}">
            <span class="mark"></span>
            <span class="txt">${o.text}</span>
          </button>
        `).join('')}
      </div>
      <div class="actions">
        <button class="btn btn-ghost" id="restart">Начать заново</button>
        <div class="actions-right">
          <button class="btn" id="next" hidden>${idx === quiz.length - 1 ? 'Показать результат' : 'Далее →'}</button>
        </div>
      </div>
    </div>
  `;

  document.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => choose(Number(btn.dataset.i)));
  });

  document.getElementById('restart').addEventListener('click', init);
  document.getElementById('next').addEventListener('click', () => {
    idx++;
    renderQuestion();
  });
}

function choose(pickedIdx) {
  if (answered) return;
  answered = true;

  const q       = quiz[idx];
  const picked  = q.options[pickedIdx];
  const correct = q.options.find(o => o.ok);
  const btns    = [...document.querySelectorAll('.opt')];

  btns.forEach((btn, i) => {
    const opt = q.options[i];
    btn.disabled = true;

    if (opt.ok) {
      btn.classList.add('correct');
      btn.querySelector('.mark').textContent = '✓';
    } else if (i !== pickedIdx) {
      btn.classList.add('dim');
    }

    if (i === pickedIdx && !opt.ok) {
      btn.classList.add('wrong');
      btn.querySelector('.mark').textContent = '✕';
    }
  });

  if (picked.ok) score++;

  log.push({
    n: q.n,
    title: q.title,
    ok: picked.ok,
    right: correct.text
  });

  openModal(picked);

  document.getElementById('next').hidden = false;

  counter.textContent = `Отвечено ${idx + 1} из ${quiz.length}`;
  setBar((idx + 1) / quiz.length * 100);
}

/* ---------- Модальное окно: только иконка + расшифровка ---------- */
function openModal(picked) {
  const isOk = picked.ok;

  modalBody.innerHTML = `
    <div class="m-content">
      <span class="m-icon ${isOk ? 'good' : 'bad'}">${isOk ? '✓' : '✕'}</span>
      <div class="m-text">${picked.why}</div>
    </div>
  `;

  overlay.classList.add('show');
}

function closeModal() {
  overlay.classList.remove('show');
}

modalClose.addEventListener('click', closeModal);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && overlay.classList.contains('show')) closeModal();
});

/* ---------- Результат ---------- */
function renderResult() {
  setBar(100);
  counter.textContent = `Результат: ${score} из ${quiz.length}`;

  const total = quiz.length;
  const title =
    score === total ? 'Идеально!' :
    score >= total - 1 ? 'Отличный результат!' :
    score >= 3 ? 'Неплохо!' : 'Стоит повторить';

  app.innerHTML = `
    <div class="card result">
      <div class="score">${score}<small> / ${total}</small></div>
      <h3>${title}</h3>

      <div class="summary">
        ${log.map(item => `
          <div class="sum-item">
            <b>Шаг ${item.n}. ${item.title}</b>
            ✓ ${item.right}
          </div>
        `).join('')}
      </div>

      <button class="btn" id="restart">Начать заново</button>
    </div>
  `;

  document.getElementById('restart').addEventListener('click', init);
}

init();
</script>
</body>
</html>
