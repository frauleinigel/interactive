<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Формулировки для заявки в ПФКИ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #eef3fb 0%, #e3ecf7 100%);
    min-height: 100vh;
    padding: 30px 16px;
    color: #1a2233;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  .container {
    width: 100%;
    max-width: 820px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(23, 55, 110, 0.12);
    padding: 34px 32px 32px;
  }

  .slide {
    display: none;
    animation: fade .3s ease;
  }
  .slide.active { display: block; }
  @keyframes fade {
    from { opacity: 0; transform: translateX(16px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* Вопрос + картинка справа */
  .question-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
  }
  .question {
    flex: 1;
    font-size: 17px;
    font-weight: 700;
    color: #143a7a;
    line-height: 1.45;
  }
  .case-img {
    flex-shrink: 0;
    width: 96px;
    height: 96px;
    object-fit: cover;
    border-radius: 12px;
    background: #eef3fb;
    display: block;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: 1fr;
    gap: 14px;
    align-items: stretch;
  }
  .option {
    position: relative;
    border: 2px solid #dbe3f0;
    background: #f9fbff;
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 14px;
    line-height: 1.6;
    color: #22304a;
    cursor: pointer;
    transition: border-color .2s ease, background .2s ease, transform .18s ease;
    display: flex;
    align-items: flex-start;
    height: 100%;
  }
  .option:hover {
    border-color: #b7c8e8;
    background: #f2f7ff;
    transform: translateY(-1px);
  }
  .option .text { display: block; }

  .option.correct {
    border-color: #1f9e5c;
    background: #eafaf1;
  }
  .option.correct::after {
    content: "✓";
    position: absolute;
    top: 12px;
    right: 12px;
    width: 22px;
    height: 22px;
    background: #1f9e5c;
    color: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
  }

  .option.wrong {
    border-color: #d94848;
    background: #fdecec;
  }
  .option.wrong::after {
    content: "✕";
    position: absolute;
    top: 12px;
    right: 12px;
    width: 22px;
    height: 22px;
    background: #d94848;
    color: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
  }

  .bottom {
    margin-top: 26px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .btn-reset {
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    padding: 14px 26px;
    cursor: pointer;
    background: #7c3aed;
    color: #fff;
    transition: all .2s ease;
  }
  .btn-reset:hover {
    background: #6a2fd6;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(124, 58, 237, .35);
  }

  .btn-next {
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    padding: 14px 34px;
    cursor: pointer;
    background: #f5c518;
    color: #3a2c00;
    transition: all .2s ease;
  }
  .btn-next:hover:not(:disabled) {
    background: #e8b800;
    transform: translateY(-1px);
    box-shadow: 0 8px 18px rgba(245, 197, 24, .45);
  }
  .btn-next:disabled {
    background: #ece0b0;
    color: #8a7c50;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 28, 55, 0.55);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    z-index: 100;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .modal {
    position: relative;
    background: #fff;
    border-radius: 18px;
    max-width: 540px;
    width: 100%;
    padding: 30px 30px 26px;
    box-shadow: 0 20px 60px rgba(10, 25, 55, .35);
    transform: translateY(12px) scale(.97);
    transition: transform .25s ease;
  }
  .modal-overlay.open .modal {
    transform: translateY(0) scale(1);
  }
  .modal .title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 10px;
    line-height: 1.35;
    padding-right: 30px;
  }
  .modal.good .title { color: #12663a; }
  .modal.bad .title { color: #8f2a2a; }
  .modal .desc {
    font-size: 14.5px;
    line-height: 1.6;
    color: #3a4663;
  }
  .modal .close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: #eef3fb;
    color: #3a5fa8;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .18s ease, transform .18s ease;
  }
  .modal .close:hover {
    background: #dde7f6;
    transform: rotate(90deg);
  }

  .options.locked .option:not(.correct):not(.wrong) {
    opacity: .5;
    cursor: not-allowed;
  }
  .options.locked .option:not(.correct):not(.wrong):hover {
    border-color: #dbe3f0;
    background: #f9fbff;
    transform: none;
  }
</style>
</head>
<body>
  <div class="container">
    <div id="slides"></div>

    <div class="bottom">
      <button class="btn-reset" id="resetBtn">Начать заново</button>
      <button class="btn-next" id="nextBtn">Далее</button>
    </div>
  </div>

  <div class="modal-overlay" id="overlay">
    <div class="modal" id="modal">
      <button class="close" id="closeBtn" aria-label="Закрыть">✕</button>
      <div class="title" id="modalTitle"></div>
      <div class="desc" id="modalDesc"></div>
    </div>
  </div>

<script>
  const QUESTIONS = [
    {
      img: "https://www.cultmanager.ru/images/Vibecoding/rukovoditel1.jpg",
      q: "Какая формулировка убедит эксперта, что сообщество НКО — живой актив с реальной аудиторией?",
      options: [
        {
          text: "«Сообщество организации ВКонтакте насчитывает 5000 подписчиков. Группа создана три года назад, обновляется регулярно, зрители активно лайкают посты».",
          correct: false,
          title: "Слабая формулировка",
          explain: "Число подписчиков и абстрактные «лайки» не доказывают реальный охват. Эксперт не сможет перевести это описание в деньги."
        },
        {
          text: "«Официальное сообщество организации ВКонтакте с подтверждением через Госуслуги. По данным статистики за 6 месяцев: средний охват одного поста — 3 200 человек, показатель вовлеченности (ER) — 12%, прирост аудитории — 18% за квартал».",
          correct: true,
          title: "Отличная формулировка!",
          explain: "Вы указали конкретные коммерческие метрики (охват и вовлеченность) и подтвердили официальный статус страницы."
        }
      ]
    },
    {
      img: "https://www.cultmanager.ru/images/Vibecoding/rukovoditel2.jpg",
      q: "Как правильно сформулировать расчет стоимости публикаций в сообществе НКО для таблицы софинансирования?",
      options: [
        {
          text: "«Информационная поддержка проекта в социальных сетях оценивается нами в 20 000 рублей, так как мы планируем опубликовать 10 анонсов мероприятий».",
          correct: false,
          title: "Слабая формулировка",
          explain: "Сумма взята «из головы» без ссылки на тарификацию. Эксперт обнулит эту строку софинансирования."
        },
        {
          text: "«Информационный вклад официального паблика НКО составляет 15 500 рублей. Расчет выполнен на основе прайс-листа рекламного агентства — партнера проекта (1 550 рублей за 1 рекламный пост с гарантированным охватом от 3 000 просмотров, итого 10 публикаций)».",
          correct: true,
          title: "Отличная формулировка!",
          explain: "Вы сослались на коммерческий прайс-лист партнера, привязали стоимость к охвату и дали прозрачную математику."
        }
      ]
    },
    {
      img: "https://www.cultmanager.ru/images/Vibecoding/rukovoditel3.jpg",
      q: "Как показать экспертам, что организация умеет работать с информационной кампанией?",
      options: [
        {
          text: "«Команда проекта имеет большой опыт работы в социальных сетях и неоднократно освещала культурные события нашего района».",
          correct: false,
          title: "Слабая формулировка",
          explain: "Общие слова без цифр и примеров не дают баллов по критерию «Опыт заявителя»."
        },
        {
          text: "«В рамках прошлого спецпроекта команда привлекла 400 новых участников через таргетированные анонсы в паблике НКО, сохранив средний охват публикаций на уровне 3 200 человек. Скриншоты статистики прошлых кампаний приложены к заявке».",
          correct: true,
          title: "Отличная формулировка!",
          explain: "Вы подтвердили опыт конкретными цифрами прошлого проекта и сослались на скриншоты-доказательства."
        }
      ]
    }
  ];

  const slidesWrap = document.getElementById('slides');
  const nextBtn = document.getElementById('nextBtn');
  const resetBtn = document.getElementById('resetBtn');
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modalTitle');
  const modalDesc = document.getElementById('modalDesc');
  const closeBtn = document.getElementById('closeBtn');

  const TOTAL = QUESTIONS.length;
  let current = 0;
  let answered = new Array(TOTAL).fill(false);

  function build() {
    slidesWrap.innerHTML = '';
    answered = new Array(TOTAL).fill(false);
    current = 0;
    overlay.classList.remove('open');

    QUESTIONS.forEach((item, i) => {
      const slide = document.createElement('div');
      slide.className = 'slide' + (i === 0 ? ' active' : '');
      slide.dataset.index = i;

      const row = document.createElement('div');
      row.className = 'question-row';

      const q = document.createElement('div');
      q.className = 'question';
      q.textContent = item.q;
      row.appendChild(q);

      if (item.img) {
        const img = document.createElement('img');
        img.className = 'case-img';
        img.src = item.img;
        img.alt = '';
        row.appendChild(img);
      }

      slide.appendChild(row);

      const opts = document.createElement('div');
      opts.className = 'options';
      item.options.forEach((opt, j) => {
        const el = document.createElement('div');
        el.className = 'option';
        el.dataset.correct = opt.correct ? '1' : '0';
        el.dataset.qIndex = i;
        el.dataset.oIndex = j;
        el.innerHTML = `<span class="text">${opt.text}</span>`;
        opts.appendChild(el);
      });
      slide.appendChild(opts);
      slidesWrap.appendChild(slide);
    });

    render();
  }

  function getSlides() { return slidesWrap.querySelectorAll('.slide'); }

  function render() {
    const slides = getSlides();
    slides.forEach((s, i) => {
      s.classList.remove('active');
      if (i === current) s.classList.add('active');
    });
    nextBtn.disabled = current === TOTAL - 1;
  }

  nextBtn.addEventListener('click', () => {
    if (current < TOTAL - 1) {
      current++;
      render();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  slidesWrap.addEventListener('click', (e) => {
    const opt = e.target.closest('.option');
    if (!opt) return;
    const qIndex = parseInt(opt.dataset.qIndex, 10);
    const oIndex = parseInt(opt.dataset.oIndex, 10);
    if (answered[qIndex]) return;

    answered[qIndex] = true;
    const slides = getSlides();
    const slide = slides[qIndex];
    const optsWrap = slide.querySelector('.options');
    const allOpts = optsWrap.querySelectorAll('.option');

    const chosen = QUESTIONS[qIndex].options[oIndex];
    const isCorrect = chosen.correct;

    opt.classList.add(isCorrect ? 'correct' : 'wrong');

    if (!isCorrect) {
      allOpts.forEach((el, j) => {
        if (QUESTIONS[qIndex].options[j].correct) {
          el.classList.add('correct');
        }
      });
    }

    optsWrap.classList.add('locked');

    modal.classList.remove('good', 'bad');
    modal.classList.add(isCorrect ? 'good' : 'bad');
    modalTitle.textContent = chosen.title;
    modalDesc.textContent = chosen.explain;
    overlay.classList.add('open');
  });

  function closeModal() {
    overlay.classList.remove('open');
  }
  closeBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal();
  });

  resetBtn.addEventListener('click', () => {
    closeModal();
    build();
  });

  build();
</script>
</body>
</html>
