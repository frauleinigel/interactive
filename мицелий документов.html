<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>УФ-лампа — Тренажер</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        [hidden] { display: none !important; }

        body {
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #002b80;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .card {
            max-width: 900px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 43, 128, 0.12);
            padding: 36px 32px 40px;
            transition: box-shadow 0.2s;
            position: relative;
        }

        .top-section {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 24px;
        }

        .context { flex: 1; }

        .situation-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #5a3e2b;
            text-align: center;
            line-height: 1.3;
        }

        .subhead {
            font-size: 1.45rem;
            font-weight: 600;
            color: #003d99;
            line-height: 1.7;
            padding: 16px 20px;
            border-left: 4px solid #002b80;
            background: #ffffff;
            word-break: break-word;
        }

        .image-box {
            flex-shrink: 0;
            width: 160px;
            max-width: 160px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #d9e0ed;
            padding: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8fbff;
        }

        .image-box img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            background: #ffffff;
        }

        .question {
            font-size: 1.2rem;
            font-weight: 500;
            color: #cc0000;
            margin-bottom: 24px;
            line-height: 1.5;
            padding: 16px 20px;
            border: 1px solid #d9e0ed;
            border-radius: 14px;
            background: #ffffff;
            word-break: break-word;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 28px;
        }

        .answer-btn {
            background: linear-gradient(145deg, #f7f7f7, #e8e8e8);
            border: 2px solid #002b80;
            border-radius: 16px;
            padding: 16px 16px 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 1.05rem;
            font-weight: 600;
            color: #001a4d;
            line-height: 1.5;
            box-shadow: 0 2px 6px rgba(0, 43, 128, 0.03);
            min-height: 80px;
            word-break: break-word;
            font-family: inherit;
            display: flex;
            align-items: center;
        }

        .answer-btn:hover:not(.disabled) {
            border-color: #001a4d;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 43, 128, 0.08);
            background: linear-gradient(145deg, #f0f0f0, #e0e0e0);
        }

        .answer-btn .text { font-weight: 600; }

        .answer-btn.correct {
            border-color: #1a8c4a;
            background: #e6f5ed;
            box-shadow: 0 0 0 3px rgba(26, 140, 74, 0.2);
        }

        .answer-btn.wrong {
            border-color: #b3002d;
            background: #fce8eb;
            box-shadow: 0 0 0 3px rgba(204, 51, 68, 0.2);
        }

        .answer-btn.disabled { cursor: default; opacity: 0.85; }
        .answer-btn.disabled:hover { transform: none; box-shadow: none; }
        .answer-btn.correct.disabled:hover { background: #e6f5ed; box-shadow: 0 0 0 3px rgba(26, 140, 74, 0.2); }
        .answer-btn.wrong.disabled:hover { background: #fce8eb; box-shadow: 0 0 0 3px rgba(204, 51, 68, 0.2); }

        .nav-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-right { display: flex; gap: 12px; flex-wrap: wrap; }

        .done-message {
            font-size: 1.15rem;
            font-weight: 700;
            color: #1a8c4a;
            text-align: center;
            letter-spacing: 0.3px;
            animation: doneAppear 0.4s ease;
        }

        @keyframes doneAppear {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        .reset-btn {
            background: linear-gradient(145deg, #ffe066, #ffcc00);
            border: 2px solid #e6b800;
            border-radius: 30px;
            padding: 10px 28px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #000000;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.3px;
            font-family: inherit;
        }
        .reset-btn:hover { background: linear-gradient(145deg, #ffe680, #ffd633); border-color: #cc9900; transform: scale(1.02); }
        .reset-btn:active { transform: scale(0.97); }

        .home-btn {
            background: linear-gradient(145deg, #8e44ad, #6c3483);
            border: 2px solid #6c3483;
            border-radius: 30px;
            padding: 10px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.3px;
            font-family: inherit;
        }
        .home-btn:hover { background: linear-gradient(145deg, #9b59b6, #7d3c98); border-color: #5b2c6f; transform: scale(1.02); }
        .home-btn:active { transform: scale(0.97); }

        .next-btn {
            background: linear-gradient(145deg, #1a8c4a, #14703a);
            border: 2px solid #1a8c4a;
            border-radius: 30px;
            padding: 10px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.3px;
            font-family: inherit;
        }
        .next-btn:hover { background: linear-gradient(145deg, #1fa055, #178244); transform: scale(1.02); }
        .next-btn:active { transform: scale(0.97); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 20, 50, 0.6);
            backdrop-filter: blur(3px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal-box {
            background: #ffffff;
            max-width: 640px;
            width: 100%;
            border-radius: 24px;
            padding: 32px 30px 28px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
            position: relative;
            animation: fadeSlide 0.25s ease;
            border: 2px solid #002b80;
            max-height: 85vh;
            overflow-y: auto;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-close {
            position: absolute;
            top: 14px; right: 18px;
            font-size: 2rem;
            line-height: 1;
            cursor: pointer;
            color: #002b80;
            background: transparent;
            border: none;
            padding: 4px 10px;
            border-radius: 30px;
            transition: background 0.15s;
            font-weight: 300;
            font-family: inherit;
        }
        .modal-close:hover { background: #f0f4fc; }

        .modal-content {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #002b80;
            padding-right: 20px;
            word-break: break-word;
        }
        .modal-content strong { color: #001f5e; }

        @media (max-width: 640px) {
            .card { padding: 24px 16px 28px; }
            .top-section { flex-direction: column; align-items: stretch; gap: 16px; }
            .image-box { width: 100%; max-width: 100%; padding: 8px; }
            .image-box img { max-height: 200px; object-fit: contain; }
            .answers-grid { grid-template-columns: 1fr; gap: 12px; }
            .answer-btn { min-height: 70px; padding: 16px 16px; font-size: 1.05rem; }
            .question { font-size: 1.1rem; padding: 14px 16px; }
            .subhead { font-size: 1.2rem; padding: 14px 16px; }
            .modal-box { padding: 24px 20px 20px; margin: 10px; }
            .modal-content { font-size: 1rem; }
            .modal-close { font-size: 1.8rem; top: 10px; right: 12px; }
            .situation-title { font-size: 1.3rem; }
            .nav-wrap { flex-direction: column; align-items: stretch; }
            .nav-right { flex-direction: column; width: 100%; }
            .done-message { order: 1; margin: 8px 0; }
            .reset-btn { order: 2; }
            .nav-right { order: 3; }
            .reset-btn, .home-btn, .next-btn { width: 100%; text-align: center; }
        }

        @media (max-width: 400px) {
            .card { padding: 16px 10px 20px; }
            .answer-btn { font-size: 0.98rem; padding: 14px 14px; min-height: 60px; }
            .subhead { font-size: 1.05rem; padding: 12px 14px; }
            .question { font-size: 1rem; padding: 10px 12px; }
            .situation-title { font-size: 1.1rem; }
            .done-message { font-size: 1.05rem; }
        }
    </style>
</head>

        </div>

    </div>

                    dots.forEach(function(p) {
                        content += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.2" fill="#8a00ff" opacity="0.92"/>';
                        content += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="5.5" fill="#8a00ff" opacity="0.18"/>';
                    });
                } else if (type === 'pink-spot') {
                    content =
                        '<ellipse cx="100" cy="100" rx="38" ry="32" fill="#ff66b3" opacity="0.55"/>' +
                        '<ellipse cx="99" cy="99" rx="26" ry="21" fill="#ff80bf" opacity="0.75"/>' +
                        '<ellipse cx="97" cy="97" rx="14" ry="11" fill="#ffb3d9" opacity="0.85"/>';
                } else if (type === 'yellow-spot') {
                    content =
                        '<ellipse cx="100" cy="100" rx="40" ry="34" fill="#ffd633" opacity="0.6"/>' +
                        '<ellipse cx="101" cy="101" rx="27" ry="23" fill="#ffe066" opacity="0.8"/>' +
                        '<ellipse cx="99" cy="99" rx="14" ry="12" fill="#fff2a8" opacity="0.9"/>';
                } else if (type === 'salad-spot') {
                    content =
                        '<ellipse cx="100" cy="100" rx="38" ry="32" fill="#a8e063" opacity="0.6"/>' +
                        '<ellipse cx="100" cy="99" rx="25" ry="21" fill="#c5ed8f" opacity="0.8"/>' +
                        '<ellipse cx="98" cy="98" rx="13" ry="11" fill="#dff5b8" opacity="0.9"/>';
                } else if (type === 'lilac-spot') {
                    content =
                        '<ellipse cx="100" cy="100" rx="42" ry="36" fill="#c77dff" opacity="0.55"/>' +
                        '<ellipse cx="100" cy="100" rx="28" ry="24" fill="#dba8ff" opacity="0.75"/>' +
                        '<ellipse cx="99" cy="99" rx="15" ry="12" fill="#ebccff" opacity="0.9"/>';
                } else if (type === 'bright-green-threads') {
                    content =
                        '<path d="M 35 65 Q 65 90, 55 130 T 85 165" stroke="#00e676" stroke-width="3.5" fill="none" opacity="0.9" stroke-linecap="round"/>' +
                        '<path d="M 78 48 Q 108 78, 98 118 T 128 168" stroke="#00e676" stroke-width="3.5" fill="none" opacity="0.9" stroke-linecap="round"/>' +
                        '<path d="M 122 58 Q 152 88, 142 128 T 168 158" stroke="#00e676" stroke-width="3.5" fill="none" opacity="0.9" stroke-linecap="round"/>' +
                        '<path d="M 55 90 Q 90 100, 120 75" stroke="#00e676" stroke-width="2.5" fill="none" opacity="0.75" stroke-linecap="round"/>' +
                        '<path d="M 100 130 Q 130 145, 160 120" stroke="#00e676" stroke-width="2.5" fill="none" opacity="0.75" stroke-linecap="round"/>';
                } else if (type === 'light-green-threads') {
                    content =
                        '<path d="M 35 65 Q 65 90, 55 130 T 85 165" stroke="#7cb342" stroke-width="3.5" fill="none" opacity="0.85" stroke-linecap="round"/>' +
                        '<path d="M 78 48 Q 108 78, 98 118 T 128 168" stroke="#7cb342" stroke-width="3.5" fill="none" opacity="0.85" stroke-linecap="round"/>' +
                        '<path d="M 122 58 Q 152 88, 142 128 T 168 158" stroke="#7cb342" stroke-width="3.5" fill="none" opacity="0.85" stroke-linecap="round"/>' +
                        '<path d="M 55 90 Q 90 100, 120 75" stroke="#7cb342" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round"/>' +
                        '<path d="M 100 130 Q 130 145, 160 120" stroke="#7cb342" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round"/>';
                } else if (type === 'purple-threads') {
                    content =
                        '<path d="M 35 65 Q 65 90, 55 130 T 85 165" stroke="#7b1fa2" stroke-width="3.5" fill="none" opacity="0.9" stroke-linecap="round"/>' +
                        '<path d="M 78 48 Q 108 78, 98 118 T 128 168" stroke="#7b1fa2" stroke-width="3.5" fill="none" opacity="0.9" stroke-linecap="round"/>' +
                        '<path d="M 122 58 Q 152 88, 142 128 T 168 158" stroke="#7b1fa2" stroke-width="3.5" fill="none" opacity="0.9" stroke-linecap="round"/>' +
                        '<path d="M 55 90 Q 90 100, 120 75" stroke="#7b1fa2" stroke-width="2.5" fill="none" opacity="0.75" stroke-linecap="round"/>' +
                        '<path d="M 100 130 Q 130 145, 160 120" stroke="#7b1fa2" stroke-width="2.5" fill="none" opacity="0.75" stroke-linecap="round"/>';
                }

                const svg =
                    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">' +
                    '<rect width="200" height="200" fill="' + bg + '"/>' +
                    '<rect x="4" y="4" width="192" height="192" fill="none" stroke="' + border + '" stroke-width="1"/>' +
                    content +
                    '</svg>';
                return 'data:image/svg+xml,' + encodeURIComponent(svg);
            }

            function renderCase() {
                const data = CASES[currentIndex];

                situationTitle.textContent = data.title;
                situationText.textContent = data.situation;
                questionText.textContent = 'Что это значит?';
                caseImage.src = visualSvg(data.visual);
                caseImage.alt = 'Изображение под УФ-лампой к кейсу ' + (currentIndex + 1);

                grid.innerHTML = '';
                data.options.forEach(function(option, index) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'answer-btn';
                    btn.dataset.index = String(index);

                    const span = document.createElement('span');
                    span.className = 'text';
                    span.textContent = option.text;
                    btn.appendChild(span);

                    btn.addEventListener('click', function() {
                        handleOptionClick(btn, index);
                    });

                    grid.appendChild(btn);
                });

                nextBtn.hidden = true;
                doneMessage.hidden = true;

                modalOverlay.classList.remove('active');
                modalMessage.innerHTML = 'Кликните по варианту ответа, чтобы проверить себя.';

                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function handleOptionClick(btn, index) {
                if (btn.disabled) return;

                const option = CASES[currentIndex].options[index];
                if (!option) return;

                const allButtons = grid.querySelectorAll('.answer-btn');

                allButtons.forEach(function(b) {
                    b.disabled = true;
                    b.classList.add('disabled');
                });

                if (option.correct) {
                    btn.classList.add('correct');

                    const isLastCase = (currentIndex === CASES.length - 1);

                    if (isLastCase) {
                        doneMessage.hidden = false;
                    } else {
                        nextBtn.hidden = false;
                    }
                } else {
                    btn.classList.add('wrong');
                }

                showModal(option);
            }

            function showModal(option) {
                modalMessage.innerHTML = option.message;
                modalOverlay.classList.add('active');
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
            }

            function goNext() {
                if (currentIndex < CASES.length - 1) {
                    currentIndex += 1;
                    renderCase();
                }
            }

            function goHome() {
                currentIndex = 0;
                renderCase();
            }

            nextBtn.addEventListener('click', goNext);
            homeBtn.addEventListener('click', goHome);

            resetBtn.addEventListener('click', function() {
                renderCase();
            });

            modalCloseBtn.addEventListener('click', closeModal);

            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) {
                    closeModal();
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });

            renderCase();

        })();
    </script>
</body>
</html>
