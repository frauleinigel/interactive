<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Круг воспитательной работы</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: system-ui, 'Segoe UI', 'Roboto', 'Noto Sans', sans-serif;
            background: #eef2ea;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .exercise {
            max-width: 1300px;
            width: 100%;
            background: #fffdf7;
            border-radius: 56px;
            box-shadow: 0 20px 32px rgba(0, 20, 0, 0.12);
            padding: 24px 24px 32px;
        }

        .title-block {
            text-align: center;
            margin-bottom: 24px;
        }
        .title-block h1 {
            font-size: 2rem;
            margin: 0 0 10px 0;
            color: #d9381e; /* красный */
            font-weight: 700;
        }
        .subhead {
            color: #1e5aa7; /* синий */
            font-size: 1rem;
            font-weight: 500;
            background: transparent;
            display: block;
            width: 100%;
            text-align: center;
            padding: 0;
            margin: 0 auto;
            line-height: 1.4;
        }

        .game-field {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 660px;
            background: #fef8ec;
            border-radius: 48px;
            overflow: hidden;
        }

        .circle {
            width: 620px;
            height: 620px;
            border-radius: 50%;
            background: #d4e8cf;
            background-image: radial-gradient(circle at 28% 32%, rgba(150, 200, 120, 0.3) 2%, transparent 2.5%);
            background-size: 28px 28px;
            box-shadow: 0 14px 28px rgba(0, 32, 0, 0.2), inset 0 1px 5px rgba(255, 248, 200, 0.7);
            border: 3px solid #2c6e46;
            overflow: auto;
            padding: 20px;
            position: relative;
            z-index: 20;
        }

        .inside-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(110px, 140px));
            justify-content: center;
            align-items: center;
            gap: 14px 16px;
            width: 100%;
            margin-top: 110px;
            margin-bottom: 30px;
        }

        .floating-cards {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
        }
        .floating-cards .card {
            pointer-events: auto;
            position: absolute;
            margin: 0;
            width: auto;
            min-width: 110px;
            max-width: 140px;
            white-space: normal;
            word-break: break-word;
        }

        .card {
            background: white;
            border-radius: 60px;
            padding: 8px 12px;
            font-weight: 600;
            font-size: 0.85rem;
            text-align: center;
            color: #1f3b2c;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            cursor: grab;
            border: 1px solid #cbe2cb;
            backdrop-filter: blur(2px);
            line-height: 1.3;
            white-space: normal;
            word-break: break-word;
        }
        @media (max-width: 720px) {
            .circle {
                width: 480px;
                height: 480px;
            }
            .inside-grid {
                grid-template-columns: repeat(3, minmax(90px, 1fr));
                gap: 10px 12px;
                margin-top: 80px;
            }
            .card, .floating-cards .card {
                font-size: 0.75rem;
                padding: 6px 8px;
                min-width: 90px;
            }
        }
        .card:active {
            cursor: grabbing;
        }
        .card.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }
        .card.error-card {
            border: 3px solid #d9534f;
            background: #ffe6e5;
            box-shadow: 0 0 0 2px #ffb3b3;
            animation: shake 0.2s ease-in-out 0s 2;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
            100% { transform: translateX(0); }
        }

        .action-bar {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 28px;
        }
        button {
            background: #2c5e3a;
            border: none;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 8px 28px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            font-family: inherit;
        }
        button.reset-btn {
            background: #7a5a3a;
        }
        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.04);
        }

        .circle::-webkit-scrollbar {
            width: 6px;
        }
        .circle::-webkit-scrollbar-track {
            background: #bdd8b0;
            border-radius: 10px;
        }
        .circle::-webkit-scrollbar-thumb {
            background: #2b6e41;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="exercise">
    <div class="title-block">
        <h1>🧩 Круг воспитательной работы</h1>
        <div class="subhead">Перетащите карточки с признаками бюрократии и формализма за границы круга</div>
    </div>

    <div class="game-field" id="gameField">
        <div class="circle" id="circleZone">
            <div class="inside-grid" id="circleGrid"></div>
        </div>
        <div class="floating-cards" id="floatingContainer"></div>
    </div>

    <div class="action-bar">
        <button id="checkBtn">✔️ ПРОВЕРИТЬ</button>
        <button id="resetBtn" class="reset-btn">🔄 СБРОСИТЬ</button>
    </div>
</div>

<script>
    // ---------- СПИСКИ КАРТОЧЕК ----------
    const goodCards = [
        "Добровольность", "Диалог на равных", "Искренность",
        "Сопричастность", "Гибкость формата", "Уважение к зрителю",
        "Эстетика подачи", "Открытость к критике", "Личный пример"
    ];
    const badCards = [
        "Принуждение", "Канцеляризм", "Шаблонность",
        "Назидательность", "Работа для галочки", "Однобокость"
    ];

    // DOM элементы
    const circleGrid = document.getElementById('circleGrid');
    const floatingContainer = document.getElementById('floatingContainer');
    const circleZone = document.getElementById('circleZone');
    const gameField = document.getElementById('gameField');
    const checkBtn = document.getElementById('checkBtn');
    const resetBtn = document.getElementById('resetBtn');

    let draggedCard = null;
    let dragOffsetX = 0, dragOffsetY = 0;

    // Сообщение по центру на 5 секунд
    function showCenteredMessage(text, isError = false) {
        let msgDiv = document.getElementById('centerMessage');
        if (!msgDiv) {
            msgDiv = document.createElement('div');
            msgDiv.id = 'centerMessage';
            msgDiv.style.position = 'fixed';
            msgDiv.style.top = '50%';
            msgDiv.style.left = '50%';
            msgDiv.style.transform = 'translate(-50%, -50%)';
            msgDiv.style.backgroundColor = '#2c5e3a';
            msgDiv.style.color = 'white';
            msgDiv.style.padding = '20px 40px';
            msgDiv.style.borderRadius = '60px';
            msgDiv.style.fontWeight = 'bold';
            msgDiv.style.fontSize = '1.3rem';
            msgDiv.style.textAlign = 'center';
            msgDiv.style.zIndex = '10000';
            msgDiv.style.boxShadow = '0 8px 20px rgba(0,0,0,0.3)';
            msgDiv.style.opacity = '0';
            msgDiv.style.transition = 'opacity 0.3s';
            msgDiv.style.pointerEvents = 'none';
            document.body.appendChild(msgDiv);
        }
        msgDiv.textContent = text;
        msgDiv.style.backgroundColor = isError ? '#d9534f' : '#2c5e3a';
        msgDiv.style.opacity = '1';
        setTimeout(() => {
            msgDiv.style.opacity = '0';
        }, 5000);
    }

    // Создание карточки
    function createCard(text, type) {
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('draggable', 'true');
        card.setAttribute('data-type', type);
        card.setAttribute('data-text', text);
        card.textContent = text;

        card.addEventListener('dragstart', (e) => {
            draggedCard = card;
            const rect = card.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;
            e.dataTransfer.setData('text/plain', text);
            e.dataTransfer.effectAllowed = 'move';
            card.classList.add('dragging');
            e.dataTransfer.setDragImage(new Image(), 0, 0);
        });
        card.addEventListener('dragend', () => {
            if (draggedCard) draggedCard.classList.remove('dragging');
            draggedCard = null;
        });
        return card;
    }

    // Сброс: все карточки внутри круга в случайном порядке
    function resetGame() {
        circleGrid.innerHTML = '';
        floatingContainer.innerHTML = '';
        const allCards = [];
        goodCards.forEach(t => allCards.push(createCard(t, 'good')));
        badCards.forEach(t => allCards.push(createCard(t, 'bad')));
        // Перемешиваем
        for (let i = allCards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [allCards[i], allCards[j]] = [allCards[j], allCards[i]];
        }
        allCards.forEach(card => {
            card.style.position = '';
            card.style.left = '';
            card.style.top = '';
            card.style.width = '';
            card.style.margin = '';
            circleGrid.appendChild(card);
        });
        clearErrorsHighlight();
    }

    function clearErrorsHighlight() {
        document.querySelectorAll('.card').forEach(c => c.classList.remove('error-card'));
    }

    // Проверка
    function checkPlacement() {
        clearErrorsHighlight();
        let badInside = 0;
        let goodOutside = 0;

        const insideCards = circleGrid.querySelectorAll('.card');
        insideCards.forEach(card => {
            if (card.getAttribute('data-type') !== 'good') {
                badInside++;
                card.classList.add('error-card');
            }
        });

        const outsideCards = floatingContainer.querySelectorAll('.card');
        outsideCards.forEach(card => {
            if (card.getAttribute('data-type') !== 'bad') {
                goodOutside++;
                card.classList.add('error-card');
            }
        });

        if (badInside === 0 && goodOutside === 0) {
            showCenteredMessage("✅ Все верно! Отличная работа!", false);
        } else {
            showCenteredMessage("❌ Ошибка. Нажмите «Сбросить» и выполните задание еще раз.", true);
        }
    }

    // Возврат в круг
    function dropInsideCircle(e) {
        if (!draggedCard) return;
        if (draggedCard.parentNode === circleGrid) return;
        if (draggedCard.parentNode === floatingContainer) {
            draggedCard.remove();
        }
        draggedCard.style.position = '';
        draggedCard.style.left = '';
        draggedCard.style.top = '';
        draggedCard.style.width = '';
        draggedCard.style.margin = '';
        circleGrid.appendChild(draggedCard);
        clearErrorsHighlight();
        draggedCard.classList.remove('dragging');
    }

    // Сброс за круг
    function dropOutsideCircle(e) {
        if (!draggedCard) return;
        if (draggedCard.parentNode !== floatingContainer) {
            if (draggedCard.parentNode === circleGrid) {
                draggedCard.remove();
            }
            floatingContainer.appendChild(draggedCard);
        }
        const rect = draggedCard.getBoundingClientRect();
        draggedCard.style.width = rect.width + 'px';
        const fieldRect = gameField.getBoundingClientRect();
        let left = e.clientX - fieldRect.left - dragOffsetX;
        let top = e.clientY - fieldRect.top - dragOffsetY;
        const maxLeft = Math.max(0, fieldRect.width - draggedCard.offsetWidth);
        const maxTop = Math.max(0, fieldRect.height - draggedCard.offsetHeight);
        left = Math.min(Math.max(left, 0), maxLeft);
        top = Math.min(Math.max(top, 0), maxTop);
        draggedCard.style.position = 'absolute';
        draggedCard.style.left = left + 'px';
        draggedCard.style.top = top + 'px';
        draggedCard.style.margin = '0';
        clearErrorsHighlight();
        draggedCard.classList.remove('dragging');
    }

    // Глобальные обработчики
    function onDragOver(e) {
        e.preventDefault();
    }

    function onDrop(e) {
        e.preventDefault();
        if (!draggedCard) return;
        let target = e.target;
        let isInsideCircle = false;
        while (target && target !== document.body) {
            if (target === circleZone || target === circleGrid || target.closest?.('#circleZone')) {
                isInsideCircle = true;
                break;
            }
            target = target.parentNode;
        }
        if (isInsideCircle) {
            dropInsideCircle(e);
        } else {
            dropOutsideCircle(e);
        }
    }

    document.body.addEventListener('dragover', onDragOver);
    document.body.addEventListener('drop', onDrop);

    window.addEventListener('dragstart', (e) => {
        if (!e.target.closest('.card')) {
            e.preventDefault();
            return false;
        }
    });

    function repositionFloatingCards() {
        if (!gameField) return;
        const fieldRect = gameField.getBoundingClientRect();
        const cards = floatingContainer.querySelectorAll('.card');
        cards.forEach(card => {
            let left = parseFloat(card.style.left);
            let top = parseFloat(card.style.top);
            if (isNaN(left)) left = 20;
            if (isNaN(top)) top = 20;
            const maxLeft = Math.max(0, fieldRect.width - card.offsetWidth);
            const maxTop = Math.max(0, fieldRect.height - card.offsetHeight);
            card.style.left = Math.min(left, maxLeft) + 'px';
            card.style.top = Math.min(top, maxTop) + 'px';
        });
    }

    window.addEventListener('resize', repositionFloatingCards);

    resetBtn.addEventListener('click', resetGame);
    checkBtn.addEventListener('click', checkPlacement);

    resetGame();
</script>
</body>
</html>
