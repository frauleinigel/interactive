<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Оценка идей методиста</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
            background: #f0f2f5;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .card {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 48px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: all 0.2s;
        }
        .header {
            background: #2c3e4e;
            padding: 20px 30px;
            text-align: center;
            color: white;
        }
        .header h1 {
            font-size: 1.8rem;
            margin: 0 0 8px;
            font-weight: 800;
        }
        .header p {
            margin: 0;
            opacity: 0.9;
            font-size: 1rem;
        }
        .methodist {
            background: #fef5e7;
            padding: 20px 25px;
            display: flex;
            align-items: center;
            gap: 18px;
            border-bottom: 1px solid #e2dcd0;
        }
        .avatar {
            background: #c49a6c;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .methodist-info h3 {
            margin: 0 0 5px;
            font-size: 1.3rem;
            color: #5a3e2e;
        }
        .methodist-info p {
            margin: 0;
            color: #7e5a44;
            font-style: italic;
        }
        .idea-container {
            padding: 30px 30px 20px;
            background: #fff;
        }
        .idea-text {
            background: #f8f9fc;
            border-radius: 32px;
            padding: 24px 28px;
            font-size: 1.2rem;
            font-weight: 500;
            color: #1e2a3a;
            text-align: center;
            border-left: 6px solid #e67e22;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            line-height: 1.4;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 30px 0 20px;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 28px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            font-family: inherit;
        }
        .btn-good {
            background: #2ecc71;
            color: white;
        }
        .btn-good:hover {
            background: #27ae60;
            transform: scale(1.02);
        }
        .btn-bad {
            background: #e74c3c;
            color: white;
        }
        .btn-bad:hover {
            background: #c0392b;
            transform: scale(1.02);
        }
        .btn:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }
        .next-btn, .restart-btn {
            background: #3498db;
            color: white;
            border: none;
            font-size: 0.9rem;
            padding: 10px 24px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            display: block;
            margin: 0 auto 20px;
            font-weight: 600;
        }
        .next-btn:hover, .restart-btn:hover {
            background: #2980b9;
        }
        .feedback-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #2c3e50;
            color: white;
            padding: 20px 32px;
            border-radius: 48px;
            font-size: 1rem;
            font-weight: 500;
            line-height: 1.5;
            max-width: 85%;
            width: auto;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            white-space: normal;
            backdrop-filter: blur(4px);
            background: rgba(0,0,0,0.85);
            border: 1px solid #fff3;
        }
        .progress {
            text-align: center;
            margin: 10px 0 20px;
            font-size: 0.85rem;
            color: #5a6c7e;
            font-weight: 500;
        }
        @media (max-width: 600px) {
            .idea-text { font-size: 1rem; padding: 18px; }
            .btn { padding: 8px 20px; font-size: 0.85rem; }
            .feedback-overlay { font-size: 0.85rem; padding: 16px 24px; width: 90%; }
            .avatar { width: 55px; height: 55px; font-size: 2rem; }
        }
    </style>
</head>
<body>
<div class="card" id="app">
    <div class="header">
        <h1>🧠 Оцените идеи методиста</h1>
        <p>Нажмите для ответа одну из кнопок</p>
    </div>
    <div class="methodist">
        <div class="avatar">👩‍🏫</div>
        <div class="methodist-info">
            <h3>Галина Петровна</h3>
            <p>методист, стаж 25 лет</p>
        </div>
    </div>

    <div id="ideaArea" class="idea-container">
        <!-- динамическое содержимое -->
    </div>
</div>

<!-- Плашка для обратной связи + разбора -->
<div id="feedbackPopup" class="feedback-overlay"></div>

<script>
    const ideas = [
        {
            text: "«Сделать замечание подросткам со сцены за то, что они не встали во время минуты молчания».",
            analysis: "Публичный стыд вызывает глухой протест. Конфликт только усугубит ситуацию и настроит зал против вас."
        },
        {
            text: "«Требовать от детей добавлять флаг или герб на каждый рисунок для участия в художественном конкурсе».",
            analysis: "Навязанные шаблоны отбивают желание творчески самовыражаться. Искреннее теплое отношение к стране нельзя выразить по указке сверху."
        },
        {
            text: "«Сделать постановочный кадр, где подростки держат плакаты с лозунгами в поддержку СВО, которые мы им раздали перед съемкой».",
            analysis: "Неискренность подростков на фото считывается сразу. Это “показуха” для отчетности, а не патриотическое воспитание."
        },
        {
            text: "«Договориться со школами, чтобы учеников принудительно привели на выставку фронтовых писем вместо уроков».",
            analysis: "Принудительная явка лишает подростков мотивации. Они проведут всё время в телефонах и запомнят выставку как скучную повинность."
        },
        {
            text: "«Обязать подростков надеть на мероприятие военные пилотки, а самой вести программу в мини-юбке и на высоких каблуках».",
            analysis: "Тематическая внешняя атрибутика подростков в сочетании с неуместным нарядом ведущего выглядит карикатурно. Молодежь остро чувствует лицемерие и двойные стандарты, а навязанный «карнавал» провоцирует обесценивание истории."
        }
    ];

    let currentIndex = 0;
    let answered = false;
    let popupTimeout = null;

    const ideaArea = document.getElementById('ideaArea');
    const feedbackPopup = document.getElementById('feedbackPopup');

    function renderIdea() {
        if (currentIndex >= ideas.length) {
            // Все идеи пройдены: показываем только кнопку "Вернуться к началу", без поздравлений
            ideaArea.innerHTML = `
                <div style="text-align: center; margin: 30px 0 20px;">
                    <button class="restart-btn" id="restartBtn">🔄 Вернуться к началу</button>
                </div>
            `;
            const restartBtn = document.getElementById('restartBtn');
            if (restartBtn) {
                restartBtn.addEventListener('click', () => {
                    resetToBeginning();
                });
            }
            return;
        }
        const idea = ideas[currentIndex];
        ideaArea.innerHTML = `
            <div class="idea-text">${idea.text}</div>
            <div class="buttons">
                <button class="btn btn-good" id="goodBtn">✅ Идея — супер!</button>
                <button class="btn btn-bad" id="badBtn">❌ Это ошибка!</button>
            </div>
            <div class="progress">Идея ${currentIndex+1} из ${ideas.length}</div>
            <div id="nextContainer" style="text-align: center;"></div>
        `;

        const goodBtn = document.getElementById('goodBtn');
        const badBtn = document.getElementById('badBtn');
        
        if (answered) {
            goodBtn.disabled = true;
            badBtn.disabled = true;
        } else {
            goodBtn.disabled = false;
            badBtn.disabled = false;
        }

        goodBtn.addEventListener('click', () => handleAnswer(true));
        badBtn.addEventListener('click', () => handleAnswer(false));
    }

    function handleAnswer(isSuper) {
        if (answered) return;
        answered = true;
        
        const goodBtn = document.getElementById('goodBtn');
        const badBtn = document.getElementById('badBtn');
        if (goodBtn) goodBtn.disabled = true;
        if (badBtn) badBtn.disabled = true;
        
        // Все идеи ошибочны, правильный ответ — "Это ошибка!" (badBtn)
        const isCorrect = !isSuper;
        const shortMsg = isCorrect ? "✅ Верный ответ!" : "❌ Неправильный ответ!";
        const analysis = ideas[currentIndex].analysis;
        
        showFeedback(`${shortMsg}\n\n${analysis}`);
        
        const nextContainer = document.getElementById('nextContainer');
        nextContainer.innerHTML = '<button class="next-btn" id="nextIdeaBtn">➡️ Следующая идея</button>';
        const nextBtn = document.getElementById('nextIdeaBtn');
        nextBtn.addEventListener('click', () => {
            hideFeedback();
            currentIndex++;
            answered = false;
            renderIdea();
        });
    }

    function showFeedback(text) {
        if (popupTimeout) clearTimeout(popupTimeout);
        feedbackPopup.textContent = text;
        feedbackPopup.style.opacity = '1';
    }

    function hideFeedback() {
        feedbackPopup.style.opacity = '0';
    }

    function resetToBeginning() {
        currentIndex = 0;
        answered = false;
        hideFeedback();
        renderIdea();
    }

    renderIdea();
</script>
</body>
</html>
