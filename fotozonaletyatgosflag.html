<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Создай фотозону «Я люблю Россию»</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #f9fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 20px;
        }
        .game-wrapper {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0, 53, 128, 0.12);
            padding: 28px 28px 20px;
            border: 1px solid rgba(0, 57, 166, 0.15);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px 20px;
            margin-bottom: 8px;
        }
        .header h1 {
            margin: 0;
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #D52B1E 0%, #0039A6 50%, #D52B1E 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .subtitle {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 500;
            color: #0039A6;
            margin-top: -4px;
            margin-bottom: 16px;
            letter-spacing: 0.3px;
            border-bottom: 2px dashed rgba(0,57,166,0.15);
            padding-bottom: 12px;
        }
        .stats {
            display: flex;
            gap: 20px;
            background: #f0f4fe;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            color: #0039A6;
            font-size: 1rem;
            align-items: center;
        }
        .stats span {
            background: white;
            padding: 2px 14px;
            border-radius: 30px;
            color: #D52B1E;
            min-width: 30px;
            text-align: center;
        }
        .game-area {
            position: relative;
            width: 100%;
            height: 500px;
            background: #ffffff;
            border-radius: 28px;
            border: 3px solid #0039A6;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.8), 0 8px 20px rgba(0,0,0,0.03);
            margin-bottom: 18px;
            cursor: default;
        }
        .game-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #ffffff 33.33%, #0039A6 33.33%, #0039A6 66.66%, #D52B1E 66.66%);
            z-index: 10;
            pointer-events: none;
        }
        .basket {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: rgba(0, 57, 166, 0.04);
            border-top: 3px dashed #0039A6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: #0039A6;
            gap: 8px;
            pointer-events: none;
            z-index: 5;
            flex-wrap: wrap;
            padding: 0 10px;
        }
        .basket span {
            background: white;
            padding: 2px 16px;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .basket .collected-items {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-left: 4px;
        }
        .basket .collected-badge {
            background: white;
            border-radius: 30px;
            padding: 2px 14px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #0039A6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,57,166,0.1);
        }
        .falling-item {
            position: absolute;
            cursor: pointer;
            background: rgba(255,255,255,0.96);
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.3;
            will-change: transform, top, left;
            z-index: 20;
            pointer-events: auto;
            border: 2px solid rgba(0,57,166,0.12);
            min-width: 110px;
            max-width: 160px;
            text-align: center;
            transition: transform 0.05s, box-shadow 0.2s;
        }
        .falling-item .item-emoji {
            font-size: 2.2rem;
            line-height: 1.2;
        }
        .falling-item .item-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #0039A6;
            margin-top: 4px;
            background: rgba(255,255,255,0.7);
            padding: 2px 6px;
            border-radius: 12px;
            word-break: break-word;
            line-height: 1.3;
        }
        .falling-item:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 28px rgba(0, 57, 166, 0.18);
        }
        .falling-item.correct-hit {
            animation: flyToBasket 0.5s ease-in forwards;
            pointer-events: none;
        }
        @keyframes flyToBasket {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.3) translateY(calc(100% - 20px)); opacity: 0.2; }
        }
        /* Анимация для неправильного больше не используется, но оставим */
        .falling-item.wrong-hit {
            /* не используется */
        }
        .falling-item.disabled-click {
            pointer-events: none;
            opacity: 0.8;
        }
        .error-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 3rem;
            font-weight: 900;
            color: #D52B1E;
            background: rgba(255,255,255,0.92);
            padding: 12px 24px;
            border-radius: 32px;
            border: 3px solid #D52B1E;
            box-shadow: 0 16px 32px rgba(213,43,30,0.25);
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transition: none;
        }
        .error-popup.show {
            animation: popError 0.8s ease forwards;
        }
        @keyframes popError {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            70% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
        }
        .controls {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .btn {
            background: transparent;
            border: 2px solid #0039A6;
            color: #0039A6;
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: white;
        }
        .btn:hover {
            background: #0039A6;
            color: white;
            box-shadow: 0 6px 14px rgba(0, 57, 166, 0.2);
        }
        .btn-primary {
            background: #D52B1E;
            border-color: #D52B1E;
            color: white;
        }
        .btn-primary:hover {
            background: #b82218;
            border-color: #b82218;
            color: white;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: white;
            max-width: 480px;
            width: 90%;
            padding: 36px 32px 28px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
            border: 2px solid #0039A6;
            animation: popIn 0.4s ease;
        }
        @keyframes popIn {
            0% { transform: scale(0.8) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .modal h2 {
            font-size: 2rem;
            color: #D52B1E;
            margin: 0 0 12px;
        }
        .modal p {
            font-size: 1.1rem;
            color: #1a1a1a;
            margin: 16px 0 24px;
            line-height: 1.5;
        }
        .modal .btn {
            font-size: 1.1rem;
            padding: 12px 40px;
        }
        .modal .emoji-big {
            font-size: 4rem;
            display: block;
            margin-bottom: 8px;
        }
        .modal .kit-list {
            font-size: 1.05rem;
            font-weight: 600;
            color: #0039A6;
            background: #f0f4fe;
            padding: 8px 16px;
            border-radius: 30px;
            display: inline-block;
            margin: 8px 0 16px;
        }
        .footer-note {
            text-align: center;
            margin-top: 16px;
            font-size: 0.8rem;
            color: #6a7a8e;
        }
        @media (max-width: 600px) {
            .game-wrapper { padding: 16px; }
            .header h1 { font-size: 1.4rem; }
            .stats { font-size: 0.85rem; padding: 4px 12px; gap: 10px; }
            .falling-item { min-width: 80px; max-width: 130px; padding: 6px 8px; }
            .falling-item .item-emoji { font-size: 1.8rem; }
            .falling-item .item-label { font-size: 0.6rem; }
            .game-area { height: 400px; }
            .basket { height: 65px; font-size: 0.9rem; }
            .modal h2 { font-size: 1.6rem; }
            .error-popup { font-size: 2.2rem; padding: 8px 16px; }
            .subtitle { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="header">
        <h1>📸 Фотозона «Я люблю Россию»</h1>
        <div class="stats">
            <span>✅ <span id="collectedCount">0</span>/4</span>
            <span>❌ <span id="errorCount">0</span></span>
        </div>
    </div>
    <div class="subtitle">Поймайте все подходящие элементы</div>

    <div class="game-area" id="gameArea">
        <div class="basket">
            <span>🧺 Корзина</span>
            <div class="collected-items" id="collectedItems"></div>
        </div>
        <div class="error-popup" id="errorPopup">❌ Ошибка!</div>
    </div>

    <div class="controls">
        <button class="btn" id="resetBtn">🔄 Начать заново</button>
    </div>
    <div class="footer-note">Сделано в Школе менеджера культуры · Актион</div>
</div>

<!-- Модальное окно победы -->
<div class="modal-overlay" id="winModal">
    <div class="modal">
        <span class="emoji-big">🎉</span>
        <h2>Поздравляем!</h2>
        <p>Фотозона <strong>«Я люблю Россию»</strong> успешно укомплектована!</p>
        <div class="kit-list">📦 В комплекте: Растяжка, Флажки, Карта, Сердце</div>
        <button class="btn btn-primary" id="playAgainBtn">🏁 Сыграть ещё</button>
    </div>
</div>

<script>
    (function() {
        const CORRECT_ITEMS = [
            { id: 'banner', label: 'Растяжка с надписью "Я люблю Россию"', shortLabel: 'Растяжка', emoji: '📜' },
            { id: 'flags', label: 'Бумажные флажки в цветах триколора', shortLabel: 'Флажки', emoji: '🚩' },
            { id: 'map', label: 'Контурная карта России', shortLabel: 'Карта', emoji: '🗺️' },
            { id: 'heart', label: 'Мягкая игрушка в форме сердца', shortLabel: 'Сердце', emoji: '❤️' }
        ];
        const WRONG_ITEMS = [
            { id: 'boot', label: 'Старый сапог', shortLabel: 'Сапог', emoji: '👢' },
            { id: 'cactus', label: 'Кактус', shortLabel: 'Кактус', emoji: '🌵' },
            { id: 'cream', label: 'Крем для рук', shortLabel: 'Крем', emoji: '🧴' },
            { id: 'rag', label: 'Пыльная губка', shortLabel: 'Губка', emoji: '🧽' }
        ];

        const state = {
            collected: 0,
            errors: 0,
            isGameOver: false,
            items: [],
            spawnInterval: null,
            animationId: null,
            lastWrongId: null,
        };

        const gameArea = document.getElementById('gameArea');
        const collectedSpan = document.getElementById('collectedCount');
        const errorSpan = document.getElementById('errorCount');
        const collectedContainer = document.getElementById('collectedItems');
        const winModal = document.getElementById('winModal');
        const resetBtn = document.getElementById('resetBtn');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const errorPopup = document.getElementById('errorPopup');

        const ITEM_WIDTH = 130;

        function updateUI() {
            collectedSpan.textContent = state.collected;
            errorSpan.textContent = state.errors;
        }

        function addCollectedToBasket(emoji, shortLabel) {
            const badge = document.createElement('span');
            badge.className = 'collected-badge';
            badge.innerHTML = `${emoji} ${shortLabel}`;
            badge.dataset.id = shortLabel;
            collectedContainer.appendChild(badge);
        }

        function showErrorPopup() {
            errorPopup.classList.remove('show');
            void errorPopup.offsetWidth;
            errorPopup.classList.add('show');
            setTimeout(() => {
                errorPopup.classList.remove('show');
            }, 900);
        }

        function checkWin() {
            if (state.collected >= CORRECT_ITEMS.length && !state.isGameOver) {
                state.isGameOver = true;
                clearInterval(state.spawnInterval);
                winModal.classList.add('active');
                if (state.animationId) {
                    cancelAnimationFrame(state.animationId);
                    state.animationId = null;
                }
                document.querySelectorAll('.falling-item').forEach(el => {
                    el.style.pointerEvents = 'none';
                });
                return true;
            }
            return false;
        }

        function isOverlapping(newX, activeItems, padding = 10) {
            for (let item of activeItems) {
                if (!item.alive) continue;
                const el = item.element;
                const left = parseFloat(el.style.left) || 0;
                if (newX < left + ITEM_WIDTH + padding && newX + ITEM_WIDTH + padding > left) {
                    return true;
                }
            }
            return false;
        }

        function createItem(isCorrect, data) {
            const el = document.createElement('div');
            el.className = 'falling-item';
            el.dataset.correct = isCorrect ? 'true' : 'false';
            el.dataset.id = data.id;

            const emojiSpan = document.createElement('div');
            emojiSpan.className = 'item-emoji';
            emojiSpan.textContent = data.emoji || '📦';
            const labelSpan = document.createElement('div');
            labelSpan.className = 'item-label';
            labelSpan.textContent = data.label;

            el.appendChild(emojiSpan);
            el.appendChild(labelSpan);

            const areaWidth = gameArea.clientWidth || 700;
            const maxX = areaWidth - ITEM_WIDTH - 10;
            let x = 10 + Math.random() * (maxX - 10);
            const active = state.items.filter(it => it.alive);
            let attempts = 0;
            while (isOverlapping(x, active) && attempts < 20) {
                x = 10 + Math.random() * (maxX - 10);
                attempts++;
            }
            const y = -80 - Math.random() * 40;
            el.style.left = x + 'px';
            el.style.top = y + 'px';

            gameArea.appendChild(el);

            const speed = 0.4 + Math.random() * 0.4;
            const itemObj = {
                element: el,
                x: x,
                y: y,
                speed: speed,
                isCorrect: isCorrect,
                data: data,
                alive: true,
                clicked: false // флаг, чтобы не повторять клик
            };
            state.items.push(itemObj);
            return itemObj;
        }

        function spawnItem() {
            if (state.isGameOver) return;

            const activeItems = state.items.filter(item => item.alive);
            if (activeItems.length >= 3) return;

            const collectedLabels = [];
            collectedContainer.querySelectorAll('.collected-badge').forEach(b => {
                collectedLabels.push(b.dataset.id);
            });

            const activeCorrectIds = activeItems.filter(it => it.isCorrect).map(it => it.data.id);
            const activeWrongIds = activeItems.filter(it => !it.isCorrect).map(it => it.data.id);

            const remainingCorrect = CORRECT_ITEMS.filter(item => 
                !collectedLabels.includes(item.shortLabel) && !activeCorrectIds.includes(item.id)
            );

            let chosen = null;
            if (remainingCorrect.length > 0 && Math.random() < 0.5) {
                const rand = Math.floor(Math.random() * remainingCorrect.length);
                chosen = { isCorrect: true, data: remainingCorrect[rand] };
            } else {
                const allPossible = [];
                if (remainingCorrect.length > 0) {
                    remainingCorrect.forEach(item => allPossible.push({ isCorrect: true, data: item }));
                }
                const wrongPool = WRONG_ITEMS.filter(item => 
                    !activeWrongIds.includes(item.id) && item.id !== state.lastWrongId
                );
                if (wrongPool.length > 0) {
                    wrongPool.forEach(item => allPossible.push({ isCorrect: false, data: item }));
                } else {
                    const fallbackWrong = WRONG_ITEMS.filter(item => item.id !== state.lastWrongId);
                    if (fallbackWrong.length > 0) {
                        fallbackWrong.forEach(item => allPossible.push({ isCorrect: false, data: item }));
                    } else {
                        WRONG_ITEMS.forEach(item => allPossible.push({ isCorrect: false, data: item }));
                    }
                }
                if (allPossible.length === 0) return;
                const rand = Math.floor(Math.random() * allPossible.length);
                chosen = allPossible[rand];
            }

            if (chosen) {
                if (!chosen.isCorrect) {
                    state.lastWrongId = chosen.data.id;
                }
                createItem(chosen.isCorrect, chosen.data);
            }
        }

        function handleItemClick(e) {
            if (state.isGameOver) return;
            const target = e.target.closest('.falling-item');
            if (!target) return;
            if (target.classList.contains('correct-hit')) return;
            if (target.classList.contains('disabled-click')) return; // игнорируем уже обработанные неправильные

            const isCorrect = target.dataset.correct === 'true';
            const itemObj = state.items.find(it => it.element === target);
            if (!itemObj || !itemObj.alive) return;

            if (isCorrect) {
                // Проверяем, не собрали ли уже такой предмет
                const short = itemObj.data.shortLabel;
                const alreadyInBasket = collectedContainer.querySelector(`.collected-badge[data-id="${short}"]`);
                if (alreadyInBasket) return;

                // Помечаем как собранный
                itemObj.alive = false;
                target.classList.add('correct-hit');
                addCollectedToBasket(itemObj.data.emoji, short);
                state.collected++;
                updateUI();

                setTimeout(() => {
                    if (target.parentNode) target.remove();
                }, 600);

                if (checkWin()) { /* игра остановлена */ }
            } else {
                // Неправильный элемент: показываем ошибку, но не удаляем элемент
                showErrorPopup();
                state.errors++;
                updateUI();
                // Блокируем повторные клики на этот элемент
                target.classList.add('disabled-click');
                // Можно также слегка затемнить, но не обязательно
                // Элемент продолжит падать и будет удалён при достижении границы
            }
        }

        function update() {
            if (state.isGameOver) {
                if (state.animationId) {
                    cancelAnimationFrame(state.animationId);
                    state.animationId = null;
                }
                return;
            }

            const areaHeight = gameArea.clientHeight || 500;
            const basketTop = areaHeight - 80; // верхняя граница корзины
            const itemsToRemove = [];
            for (let i = 0; i < state.items.length; i++) {
                const item = state.items[i];
                if (!item.alive) continue;
                item.y += item.speed;
                item.element.style.top = item.y + 'px';
                // Если предмет достиг верхней границы корзины или ниже, удаляем
                if (item.y > basketTop - 30) {
                    item.alive = false;
                    if (item.element.parentNode) {
                        item.element.remove();
                    }
                    itemsToRemove.push(i);
                }
            }
            for (let i = itemsToRemove.length - 1; i >= 0; i--) {
                state.items.splice(itemsToRemove[i], 1);
            }

            state.animationId = requestAnimationFrame(update);
        }

        function startGame() {
            if (state.animationId) cancelAnimationFrame(state.animationId);
            clearInterval(state.spawnInterval);
            document.querySelectorAll('.falling-item').forEach(el => el.remove());
            state.items = [];
            state.collected = 0;
            state.errors = 0;
            state.isGameOver = false;
            state.lastWrongId = null;
            collectedContainer.innerHTML = '';
            updateUI();
            winModal.classList.remove('active');
            errorPopup.classList.remove('show');

            state.spawnInterval = setInterval(() => {
                spawnItem();
            }, 2000);

            state.animationId = requestAnimationFrame(update);

            setTimeout(() => {
                if (!state.isGameOver) spawnItem();
            }, 800);
        }

        gameArea.addEventListener('click', handleItemClick);
        resetBtn.addEventListener('click', startGame);
        playAgainBtn.addEventListener('click', startGame);

        startGame();
    })();
</script>
</body>
</html>
