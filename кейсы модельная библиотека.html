<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зоны обслуживания — Тренажер</title>
    <style>
        /* ── reset & base ── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        [hidden] {
            display: none !important;
        }

        body {
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #002b80;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .card {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 43, 128, 0.12);
            padding: 36px 32px 40px;
            transition: box-shadow 0.2s;
            position: relative;
        }

        .top-section {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 24px;
        }

        .context {
            flex: 1;
        }

        .situation-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #5a3e2b;
            text-align: center;
            line-height: 1.3;
        }

        .subhead {
            font-size: 1.45rem;
            font-weight: 600;
            color: #003d99;
            line-height: 1.7;
            padding: 16px 20px;
            border-left: 4px solid #002b80;
            background: #ffffff;
            word-break: break-word;
        }

        .image-box {
            flex-shrink: 0;
            width: 140px;
            max-width: 140px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #d9e0ed;
            padding: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8fbff;
        }

        .image-box img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            background: #ffffff;
        }

        .question {
            font-size: 1.2rem;
            font-weight: 500;
            color: #cc0000;
            margin-bottom: 24px;
            line-height: 1.5;
            padding: 16px 20px;
            border: 1px solid #d9e0ed;
            border-radius: 14px;
            background: #ffffff;
            word-break: break-word;
        }

        /* ─── СЕТКА ОТВЕТОВ 2×2 ─── */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 28px;
        }

        .answer-btn {
            background: linear-gradient(145deg, #f7f7f7, #e8e8e8);
            border: 2px solid #002b80;
            border-radius: 16px;
            padding: 18px 18px 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 1.1rem;
            font-weight: 600;
            color: #001a4d;
            line-height: 1.5;
            box-shadow: 0 2px 6px rgba(0, 43, 128, 0.03);
            min-height: 90px;
            word-break: break-word;
            font-family: inherit;
            display: flex;
            align-items: center;
        }

        .answer-btn:hover:not(.disabled) {
            border-color: #001a4d;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 43, 128, 0.08);
            background: linear-gradient(145deg, #f0f0f0, #e0e0e0);
        }

        .answer-btn .text {
            font-weight: 600;
        }

        .answer-btn.correct {
            border-color: #1a8c4a;
            background: #e6f5ed;
            box-shadow: 0 0 0 3px rgba(26, 140, 74, 0.2);
        }

        .answer-btn.wrong {
            border-color: #b3002d;
            background: #fce8eb;
            box-shadow: 0 0 0 3px rgba(204, 51, 68, 0.2);
        }

        .answer-btn.disabled {
            cursor: default;
            opacity: 0.85;
        }

        .answer-btn.disabled:hover {
            transform: none;
            box-shadow: none;
        }

        .answer-btn.correct.disabled:hover {
            background: #e6f5ed;
            box-shadow: 0 0 0 3px rgba(26, 140, 74, 0.2);
        }
        .answer-btn.wrong.disabled:hover {
            background: #fce8eb;
            box-shadow: 0 0 0 3px rgba(204, 51, 68, 0.2);
        }

        /* ── навигация ── */
        .nav-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-right {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Текст «Задание выполнено!» между кнопками */
        .done-message {
            font-size: 1.15rem;
            font-weight: 700;
            color: #1a8c4a;
            text-align: center;
            letter-spacing: 0.3px;
            animation: doneAppear 0.4s ease;
        }

        @keyframes doneAppear {
            from {
                opacity: 0;
                transform: scale(0.85);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* «Попробовать снова» — желтая с черным шрифтом */
        .reset-btn {
            background: linear-gradient(145deg, #ffe066, #ffcc00);
            border: 2px solid #e6b800;
            border-radius: 30px;
            padding: 10px 28px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #000000;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.3px;
            font-family: inherit;
        }

        .reset-btn:hover {
            background: linear-gradient(145deg, #ffe680, #ffd633);
            border-color: #cc9900;
            transform: scale(1.02);
        }

        .reset-btn:active {
            transform: scale(0.97);
        }

        /* «Вернуться к началу» — фиолетовая с белым шрифтом */
        .home-btn {
            background: linear-gradient(145deg, #8e44ad, #6c3483);
            border: 2px solid #6c3483;
            border-radius: 30px;
            padding: 10px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.3px;
            font-family: inherit;
        }

        .home-btn:hover {
            background: linear-gradient(145deg, #9b59b6, #7d3c98);
            border-color: #5b2c6f;
            transform: scale(1.02);
        }

        .home-btn:active {
            transform: scale(0.97);
        }

        /* «Следующий кейс» — зеленая */
        .next-btn {
            background: linear-gradient(145deg, #1a8c4a, #14703a);
            border: 2px solid #1a8c4a;
            border-radius: 30px;
            padding: 10px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.3px;
            font-family: inherit;
        }

        .next-btn:hover {
            background: linear-gradient(145deg, #1fa055, #178244);
            transform: scale(1.02);
        }

        .next-btn:active {
            transform: scale(0.97);
        }

        /* ── модальное окно ── */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 20, 50, 0.6);
            backdrop-filter: blur(3px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #ffffff;
            max-width: 640px;
            width: 100%;
            border-radius: 24px;
            padding: 32px 30px 28px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
            position: relative;
            animation: fadeSlide 0.25s ease;
            border: 2px solid #002b80;
            max-height: 85vh;
            overflow-y: auto;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 2rem;
            line-height: 1;
            cursor: pointer;
            color: #002b80;
            background: transparent;
            border: none;
            padding: 4px 10px;
            border-radius: 30px;
            transition: background 0.15s;
            font-weight: 300;
            font-family: inherit;
        }

        .modal-close:hover {
            background: #f0f4fc;
        }

        .modal-content {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #002b80;
            padding-right: 20px;
            word-break: break-word;
        }

        .modal-content strong {
            color: #001f5e;
        }

        /* ─── АДАПТИВ ─── */
        @media (max-width: 640px) {
            .card {
                padding: 24px 16px 28px;
            }
            .top-section {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
            }
            .image-box {
                width: 100%;
                max-width: 100%;
                padding: 8px;
            }
            .image-box img {
                max-height: 160px;
                object-fit: contain;
            }
            .answers-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .answer-btn {
                min-height: 70px;
                padding: 16px 16px;
                font-size: 1.05rem;
            }
            .question {
                font-size: 1.1rem;
                padding: 14px 16px;
            }
            .subhead {
                font-size: 1.2rem;
                padding: 14px 16px;
            }
            .modal-box {
                padding: 24px 20px 20px;
                margin: 10px;
            }
            .modal-content {
                font-size: 1rem;
            }
            .modal-close {
                font-size: 1.8rem;
                top: 10px;
                right: 12px;
            }
            .situation-title {
                font-size: 1.3rem;
            }
            .nav-wrap {
                flex-direction: column;
                align-items: stretch;
            }
            .nav-right {
                flex-direction: column;
                width: 100%;
            }
            .done-message {
                order: 1;
                margin: 8px 0;
            }
            .reset-btn {
                order: 2;
            }
            .nav-right {
                order: 3;
            }
            .reset-btn,
            .home-btn,
            .next-btn {
                width: 100%;
                text-align: center;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 16px 10px 20px;
            }
            .answer-btn {
                font-size: 1rem;
                padding: 14px 14px;
                min-height: 60px;
            }
            .subhead {
                font-size: 1.05rem;
                padding: 12px 14px;
            }
            .question {
                font-size: 1rem;
                padding: 10px 12px;
            }
            .situation-title {
                font-size: 1.1rem;
            }
            .done-message {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>

    <div class="card" role="main" aria-label="Тренажер по зонам обслуживания">

        <!-- верхняя часть: текст слева, картинка справа -->
        <div class="top-section">
            <div class="context">
                <div class="situation-title" id="situationTitle">Кейс 1. Зона обслуживания</div>
                <div class="subhead" id="situationText"></div>
            </div>
            <div class="image-box">
                <img id="caseImage" src="" alt="Иллюстрация к кейсу" loading="lazy" />
            </div>
        </div>

        <!-- вопрос -->
        <div class="question" id="questionText">Выберите верный вариант ответа</div>

        <!-- ответы (сетка 2×2) -->
        <div class="answers-grid" id="answersGrid" role="group" aria-label="Варианты ответов"></div>

        <!-- навигация -->
        <div class="nav-wrap">
            <button class="reset-btn" id="resetBtn" type="button" aria-label="Сбросить и попробовать снова">⟳ Попробовать снова</button>
            <span class="done-message" id="doneMessage" hidden>🎉 Задание выполнено!</span>
            <div class="nav-right">
                <button class="home-btn" id="homeBtn" type="button" aria-label="Вернуться к началу">⌂ Вернуться к началу</button>
                <button class="next-btn" id="nextBtn" type="button" hidden>Следующий кейс →</button>
            </div>
        </div>

    </div>

    <!-- ─── Модальное окно ─── -->
    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
        <div class="modal-box">
            <button class="modal-close" id="modalCloseBtn" type="button" aria-label="Закрыть">✕</button>
            <div class="modal-content" id="modalContent">
                <span class="msg-text" id="modalMessage">Кликните по варианту ответа, чтобы проверить себя.</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            /* ─────────── ДАННЫЕ КЕЙСОВ ─────────── */
            const CASES = [
                {
                    emoji: '📖',
                    title: 'Кейс 1. Зона обслуживания',
                    situation: 'Посетитель требует книгу, которой нет в фонде. Говорит громко, рядом другие люди.',
                    options: [
                        {
                            text: 'Извиниться и предложить поискать в другой библиотеке',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Посетитель уйдет без книги. Извинения не заменяют решение.'
                        },
                        {
                            text: 'Спокойно объяснить, что книги нет, предложить аналог или записать на бронь',
                            correct: true,
                            message: '<strong>✅ Верно.</strong> Вы решаете проблему: человек получает альтернативу или гарантию, что книгу найдут. Напряжение спадает.'
                        },
                        {
                            text: 'Позвать заведующего, чтобы он разобрался',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Посетитель видит, что вы не владеете ситуацией. Заведующий нужен там, где не хватает ваших полномочий.'
                        },
                        {
                            text: 'Сказать, что фонд формирует не библиотека, и отправить с претензией в администрацию',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Посетителю все равно, кто формирует фонд. Он уходит с ощущением, что его отфутболили.'
                        }
                    ]
                },
                {
                    emoji: '🎤',
                    title: 'Кейс 2. Зона публичных мероприятий',
                    situation: 'До лекции 10 минут. Спикер не пришел, телефон недоступен. В зале уже сидят 15 человек.',
                    options: [
                        {
                            text: 'Объявить, что лекция отменяется, извиниться и отпустить людей',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Люди уже пришли. Вы теряете аудиторию и доверие.'
                        },
                        {
                            text: 'Предложить подождать 15 минут, тем временем включить запись прошлой лекции',
                            correct: true,
                            message: '<strong>✅ Верно.</strong> Вы держите аудиторию и даете спикеру время. Если он не придет, у людей останется полезный материал.'
                        },
                        {
                            text: 'Начать лекцию самому — рассказать по теме то, что знаете',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Рискованно. Если владеете темой недостаточно хорошо, провал запомнится надолго.'
                        },
                        {
                            text: 'Сказать, что спикер задерживается, и не предпринимать ничего',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Пассивное поведение. Через 10 минут люди начнут уходить, и удержать их будет нечем.'
                        }
                    ]
                },
                {
                    emoji: '💻',
                    title: 'Кейс 3. Зона компьютерных технологий',
                    situation: 'Посетитель просит помочь зайти в Госуслуги. У вас очередь из трех человек на запись книг.',
                    options: [
                        {
                            text: 'Отказать: это не входит в обязанности библиотекаря',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Обязанности соблюдены, но посетитель уходит без помощи. Для модельной библиотеки это потеря.'
                        },
                        {
                            text: 'Помочь, а очередь подождет',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Очередь растет, другие посетители начинают нервничать. Вы создаете конфликт на пустом месте.'
                        },
                        {
                            text: 'Попросить подождать, пока обслужите очередь, потом подойти и помочь',
                            correct: true,
                            message: '<strong>✅ Верно.</strong> Вы расставляете приоритеты и никого не бросаете. Посетитель понимает, что его не игнорируют.'
                        },
                        {
                            text: 'Показать, где стоит компьютер, и вернуться к своим делам',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Человек остается один на один с системой. Скорее всего, он не справится и уйдет.'
                        }
                    ]
                },
                {
                    emoji: '🧻',
                    title: 'Кейс 4. Санузел',
                    situation: 'Посетитель жалуется, что в санузле нет бумаги. Вы знаете, что пополняли час назад.',
                    options: [
                        {
                            text: 'Извиниться и пополнить еще раз',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Бумага снова закончится через час, и жалоба повторится. Вы решаете следствие, а не причину.'
                        },
                        {
                            text: 'Сказать, что бумага была, и, возможно, ее убрали другие посетители',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Посетителю все равно, кто забрал бумагу. Он остался без нее и ушел с плохим впечатлением.'
                        },
                        {
                            text: 'Передать заявку в техслужбу, а потом проверить, сколько бумаги уходит за час, и скорректировать график обхода',
                            correct: true,
                            message: '<strong>✅ Верно.</strong> Вы решаете проблему сейчас — заявка ушла, бумагу принесут. И выясняете, почему запас закончился за час: возможно, бумагу взяли больше обычного или вы неверно рассчитали норму. Дальше меняете график обхода или объем — и жалоба не повторяется.'
                        },
                        {
                            text: 'Предложить написать жалобу в книгу отзывов',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Посетитель просил бумагу, а не книгу жалоб. Вы перекладываете решение на него.'
                        }
                    ]
                },
                {
                    emoji: '🧥',
                    title: 'Кейс 5. Гардероб',
                    situation: 'Посетитель отказывается сдавать пуховик: боится, что украдут. Хочет пройти в зал в верхней одежде.',
                    options: [
                        {
                            text: 'Настоять на правилах: без сдачи куртки вход запрещен',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Правило соблюдено, но конфликт создан на ровном месте. Посетитель уходит злым.'
                        },
                        {
                            text: 'Разрешить пройти так — один раз, без скандала',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Правило перестает работать. Завтра так пройдут пятеро, послезавтра — десять человек.'
                        },
                        {
                            text: 'Позвать охрану',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Избыточное действие. Ситуация не требует вмешательства охраны, вы только пугаете людей.'
                        },
                        {
                            text: 'Оставить пуховик в шкафчике с замком или рядом с кафедрой',
                            correct: true,
                            message: '<strong>✅ Верно.</strong> Вы учитываете страх посетителя и сохраняете порядок. Компромисс, который работает.'
                        }
                    ]
                }
            ];

            /* ─────────── ЭЛЕМЕНТЫ ─────────── */
            const grid = document.getElementById('answersGrid');
            const resetBtn = document.getElementById('resetBtn');
            const homeBtn = document.getElementById('homeBtn');
            const nextBtn = document.getElementById('nextBtn');
            const situationTitle = document.getElementById('situationTitle');
            const situationText = document.getElementById('situationText');
            const questionText = document.getElementById('questionText');
            const caseImage = document.getElementById('caseImage');
            const doneMessage = document.getElementById('doneMessage');

            const modalOverlay = document.getElementById('modalOverlay');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const modalMessage = document.getElementById('modalMessage');

            let currentIndex = 0;

            /* ─────────── ИЛЛЮСТРАЦИЯ-ЗАГЛУШКА ─────────── */
            function emojiSvg(emoji) {
                const svg =
                    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">' +
                    '<rect width="200" height="200" fill="#f0f6ff"/>' +
                    '<text x="100" y="132" font-size="96" text-anchor="middle">' + emoji + '</text>' +
                    '</svg>';
                return 'data:image/svg+xml,' + encodeURIComponent(svg);
            }

            /* ─────────── ОТРИСОВКА КЕЙСА ─────────── */
            function renderCase() {
                const data = CASES[currentIndex];

                situationTitle.textContent = data.title;
                situationText.textContent = data.situation;
                questionText.textContent = 'Выберите верный вариант ответа';
                caseImage.src = emojiSvg(data.emoji);
                caseImage.alt = 'Иллюстрация к кейсу №' + (currentIndex + 1);

                grid.innerHTML = '';
                data.options.forEach(function(option, index) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'answer-btn';
                    btn.dataset.index = String(index);

                    const span = document.createElement('span');
                    span.className = 'text';
                    span.textContent = option.text;
                    btn.appendChild(span);

                    btn.addEventListener('click', function() {
                        handleOptionClick(btn, index);
                    });

                    grid.appendChild(btn);
                });

                nextBtn.hidden = true;
                doneMessage.hidden = true;

                modalOverlay.classList.remove('active');
                modalMessage.innerHTML = 'Кликните по варианту ответа, чтобы проверить себя.';

                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            /* ─────────── КЛИК ПО ВАРИАНТУ ─────────── */
            function handleOptionClick(btn, index) {
                if (btn.disabled) return;

                const option = CASES[currentIndex].options[index];
                if (!option) return;

                const allButtons = grid.querySelectorAll('.answer-btn');

                /* блокируем все кнопки, чтобы нельзя было переиграть */
                allButtons.forEach(function(b) {
                    b.disabled = true;
                    b.classList.add('disabled');
                });

                /* подсвечиваем ТОЛЬКО выбранную кнопку */
                if (option.correct) {
                    btn.classList.add('correct');

                    const isLastCase = (currentIndex === CASES.length - 1);

                    if (isLastCase) {
                        /* последний кейс — показываем текст «Задание выполнено!» */
                        doneMessage.hidden = false;
                    } else {
                        /* не последний — показываем кнопку «Следующий кейс» */
                        nextBtn.hidden = false;
                    }
                } else {
                    btn.classList.add('wrong');
                }

                /* сразу показываем модальное окно с пояснением */
                showModal(option);
            }

            function showModal(option) {
                modalMessage.innerHTML = option.message;
                modalOverlay.classList.add('active');
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
            }

            /* ─────────── ПЕРЕХОДЫ ─────────── */
            function goNext() {
                if (currentIndex < CASES.length - 1) {
                    currentIndex += 1;
                    renderCase();
                }
            }

            function goHome() {
                currentIndex = 0;
                renderCase();
            }

            /* ─────────── СОБЫТИЯ ─────────── */
            nextBtn.addEventListener('click', goNext);
            homeBtn.addEventListener('click', goHome);

            resetBtn.addEventListener('click', function() {
                renderCase();
            });

            modalCloseBtn.addEventListener('click', closeModal);

            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) {
                    closeModal();
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });

            /* ─────────── СТАРТ ─────────── */
            renderCase();

        })();
    </script>
</body>
</html>
