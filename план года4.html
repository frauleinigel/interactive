<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оцените формулировки</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #ffffff;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 28px 18px;
    line-height: 1.5;
}

.widget {
    max-width: 820px;
    width: 100%;
    background: #ffffff;
    padding: 8px 4px 0;
}

/* ── заголовок: алый + эмодзи, по центру ── */
.widget-title {
    font-size: 1.9rem;
    font-weight: 700;
    color: #cc0000;
    line-height: 1.3;
    margin-bottom: 14px;
    text-align: center;
}

/* ── подзаголовок: крупнее и по центру ── */
.widget-desc {
    font-size: 1.4rem;
    color: #333333;
    line-height: 1.5;
    margin-bottom: 30px;
    text-align: center;
}

/* ── стопка карточек ── */
.stack-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 24px;
    padding: 16px 0;
    user-select: none;
}
.stack-arrow {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: #1a1a1a;
    font-size: 2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    flex-shrink: 0;
    font-weight: 300;
}
.stack-arrow:hover:not(:disabled) { background: #f2f2f2; }
.stack-arrow:disabled { opacity: 0.2; cursor: default; }

.stack {
    position: relative;
    flex: 1;
    max-width: 520px;
    min-height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.stack-card {
    background: #ffffff;
    border: 2px solid #000000;
    border-radius: 16px;
    padding: 28px 32px;
    text-align: center;
    font-size: 1.15rem;
    font-weight: 500;
    line-height: 1.55;
    color: #1a1a1a;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.10);
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    transition: opacity 0.2s;
    touch-action: none;
    user-select: none;
}
.stack-card.behind-1 {
    transform: translateY(-50%) scale(0.96);
    top: calc(50% + 8px);
    z-index: 1;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
}
.stack-card.behind-2 {
    transform: translateY(-50%) scale(0.92);
    top: calc(50% + 16px);
    z-index: 0;
    box-shadow: none;
}
.stack-card.current {
    z-index: 10;
    cursor: grab;
}
.stack-card.current:hover {
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
}
.stack-card.current.dragging {
    opacity: 0.25;
}
.stack-empty {
    text-align: center;
    color: #666;
    font-size: 1.1rem;
    padding: 28px;
}

/* ── гость при перетаскивании ── */
.drag-ghost {
    position: fixed;
    z-index: 1000;
    pointer-events: none;
    padding: 28px 32px;
    background: #ffffff;
    border: 2px solid #000000;
    border-radius: 16px;
    color: #1a1a1a;
    font-size: 1.15rem;
    font-weight: 500;
    line-height: 1.55;
    text-align: center;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
    max-width: 480px;
    word-break: break-word;
}

/* ── две колонки ── */
.columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
}
.column {
    background: #ffffff;
    border: 2px solid #000000;
    border-radius: 14px;
    overflow: hidden;
    transition: all 0.2s;
}
.column.hover {
    border-color: #2196f3;
    box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.25);
}

.column-header {
    padding: 28px 20px 22px;
    text-align: center;
    border-bottom: 2px solid #000000;
    pointer-events: none;
}
.column-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.column-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}
.column-title {
    font-size: 1.2rem;
    font-weight: 700;
    color: #1a1a1a;
    line-height: 1.35;
}

.column-body {
    min-height: 240px;
    padding: 14px;
    background: #fafafa;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: background 0.2s;
}
.column.hover .column-body { background: #e8f4fd; }

.placed-card {
    background: #ffffff;
    border: 2px solid #000000;
    border-radius: 10px;
    padding: 16px 36px 16px 20px;
    font-size: 1rem;
    line-height: 1.5;
    color: #1a1a1a;
    text-align: center;
    animation: fadeIn 0.3s ease;
    position: relative;
    word-break: break-word;
    font-weight: 500;
}
.placed-card.correct {
    border-color: #2ea44f;
}
.placed-card.wrong {
    border-color: #dc2626;
}

.placed-card .remove-btn {
    position: absolute;
    top: 6px;
    right: 8px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: transparent;
    border: none;
    color: #bbbbbb;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    padding: 0;
    transition: background 0.15s;
}
.placed-card .remove-btn:hover { background: #fee2e2; color: #dc2626; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ── кнопка ── */
.main-btn {
    width: 100%;
    padding: 20px;
    border: none;
    border-radius: 12px;
    font-size: 1.15rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    background: #f2f2f2;
    color: #a0a0a0;
    letter-spacing: 0.2px;
}
.main-btn.active {
    background: #2196f3;
    color: #ffffff;
    cursor: pointer;
}
.main-btn.active:hover { background: #1976d2; }
.main-btn.reset-mode {
    background: #f5f5f5;
    color: #1a1a1a;
    border: 2px solid #000000;
    cursor: pointer;
}
.main-btn.reset-mode:hover { background: #ececec; }

@media (max-width: 700px) {
    body { padding: 20px 12px; }
    .widget-title { font-size: 1.6rem; margin-bottom: 12px; }
    .widget-desc { font-size: 1.2rem; margin-bottom: 24px; }
    .stack-area { gap: 8px; padding: 10px 0; margin-bottom: 18px; }
    .stack-card { padding: 22px 20px; font-size: 1.05rem; }
    .drag-ghost { padding: 20px 18px; font-size: 1.05rem; max-width: 340px; }
    .stack-arrow { width: 40px; height: 40px; font-size: 1.7rem; }
    .columns { gap: 12px; }
    .column-header { padding: 22px 12px 18px; }
    .column-icon { width: 60px; height: 60px; margin-bottom: 10px; }
    .column-title { font-size: 1.05rem; }
    .column-body { min-height: 180px; padding: 10px; gap: 8px; }
    .placed-card { padding: 14px 30px 14px 16px; font-size: 0.92rem; }
    .main-btn { padding: 16px; font-size: 1.05rem; }
}

@media (max-width: 440px) {
    body { padding: 14px 8px; }
    .widget-title { font-size: 1.35rem; }
    .widget-desc { font-size: 1.02rem; }
    .column-title { font-size: 0.92rem; }
    .column-icon { width: 50px; height: 50px; }
    .stack-card { font-size: 0.95rem; padding: 18px 16px; }
    .drag-ghost { padding: 18px 14px; font-size: 0.95rem; max-width: 260px; }
    .placed-card { font-size: 0.85rem; padding: 12px 26px 12px 14px; }
    .main-btn { font-size: 0.95rem; padding: 14px; }
}
</style>
</head>
<body>

<div class="widget" role="main">

    <div class="widget-title">🔍 Оцените формулировки</div>
    <div class="widget-desc">Распределите карточки по двум колонкам</div>

    <div class="stack-area">
        <button class="stack-arrow" id="prevBtn" aria-label="Предыдущая">‹</button>
        <div class="stack" id="stack"></div>
        <button class="stack-arrow" id="nextBtn" aria-label="Следующая">›</button>
    </div>

    <div class="columns" id="columns">
        <div class="column" data-target="report">
            <div class="column-header">
                <div class="column-icon">
                    <img src="https://www.cultmanager.ru/images/Vibecoding/c65.png" alt="">
                </div>
                <div class="column-title">Для отчета по госзаданию</div>
            </div>
            <div class="column-body" id="colReport"></div>
        </div>
        <div class="column" data-target="grant">
            <div class="column-header">
                <div class="column-icon">
                    <img src="https://www.cultmanager.ru/images/Vibecoding/fur.png" alt="">
                </div>
                <div class="column-title">Для грантовой заявки</div>
            </div>
            <div class="column-body" id="colGrant"></div>
        </div>
    </div>

    <button class="main-btn" id="mainBtn" disabled>Проверить результат</button>

</div>

<script>
(function () {
    'use strict';

    const CARDS = [
        { id: 'R1', target: 'report', text: 'Направлено на сохранение исторической памяти и укрепление патриотических ценностей; ветеранам и участникам СВО обеспечен бесплатный вход.' },
        { id: 'R2', target: 'report', text: 'Укрепляет семейные отношения и связь между поколениями через совместную творческую и читательскую деятельность.' },
        { id: 'R3', target: 'report', text: 'Развивает у молодежи навыки критического мышления, публичного выступления и командной работы через обсуждение книг.' },
        { id: 'R4', target: 'report', text: 'Формирует у аудитории историческую память о подвиге защитников и жителей Ленинграда, воспитывает готовность к сохранению преемственности поколений.' },
        { id: 'R5', target: 'report', text: 'Создаёт условия для выявления и поддержки молодых талантов, предоставляет участникам площадку для публичной презентации творческих работ.' },
        { id: 'G1', target: 'grant', text: 'Создаёт условия для межпоколенческого диалога и поддержки ветеранов через культурное событие, посвящённое Победе в Великой Отечественной войне.' },
        { id: 'G2', target: 'grant', text: 'Поддерживает институт семьи и формирует у детей и родителей общие культурные практики через семейный досуг.' },
        { id: 'G3', target: 'grant', text: 'Формирует у студентов и молодых специалистов компетенции будущих лидеров через читательские практики и менторские встречи с деятелями культуры.' },
        { id: 'G4', target: 'grant', text: 'Сохраняет память о героических страницах истории Отечества и формирует у молодёжи ценностные ориентиры на примере подвига ленинградцев.' },
        { id: 'G5', target: 'grant', text: 'Даёт молодым дарованиям старт в профессиональной среде и демонстрирует возможности самореализации в регионе через конкурсную и образовательную программу.' }
    ];

    const stackEl = document.getElementById('stack');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const colReport = document.getElementById('colReport');
    const colGrant = document.getElementById('colGrant');
    const columns = document.querySelectorAll('.column');
    const mainBtn = document.getElementById('mainBtn');

    let pool = [];
    let currentIndex = 0;
    let placed = [];
    let checked = false;
    let drag = null;

    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function init() {
        pool = shuffle(CARDS);
        currentIndex = 0;
        placed = [];
        checked = false;
        colReport.innerHTML = '';
        colGrant.innerHTML = '';
        mainBtn.className = 'main-btn';
        mainBtn.disabled = true;
        mainBtn.textContent = 'Проверить результат';
        renderStack();
        updateButton();
    }

    function renderStack() {
        stackEl.innerHTML = '';

        if (pool.length === 0) {
            stackEl.innerHTML = '<div class="stack-empty">Все карточки разложены</div>';
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            return;
        }

        if (currentIndex >= pool.length) currentIndex = pool.length - 1;
        if (currentIndex < 0) currentIndex = 0;

        for (let i = 2; i >= 0; i--) {
            const card = pool[currentIndex + i];
            if (!card) continue;
            const el = document.createElement('div');
            el.className = 'stack-card';
            if (i === 1) el.classList.add('behind-1');
            if (i === 2) el.classList.add('behind-2');
            if (i === 0) el.classList.add('current');
            el.textContent = card.text;
            el.dataset.id = card.id;
            stackEl.appendChild(el);
        }

        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex >= pool.length - 1;
    }

    function placeCard(cardId, target) {
        if (checked) return;

        const idx = pool.findIndex(c => c.id === cardId);
        if (idx === -1) return;
        const card = pool[idx];

        const el = document.createElement('div');
        el.className = 'placed-card';
        el.dataset.id = card.id;
        el.innerHTML = `<button class="remove-btn" aria-label="Вернуть карточку">✕</button>${card.text}`;

        el.querySelector('.remove-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (checked) return;
            returnCard(card.id);
        });

        const wrap = target === 'report' ? colReport : colGrant;
        wrap.appendChild(el);

        placed.push({ id: card.id, target: card.target, placedTo: target });
        pool.splice(idx, 1);

        if (currentIndex >= pool.length && currentIndex > 0) {
            currentIndex = pool.length - 1;
        }

        renderStack();
        updateButton();
    }

    function returnCard(id) {
        const idx = placed.findIndex(p => p.id === id);
        if (idx === -1) return;
        const card = CARDS.find(c => c.id === id);
        placed.splice(idx, 1);
        pool.push(card);

        const el = document.querySelector(`.placed-card[data-id="${id}"]`);
        if (el) el.remove();

        renderStack();
        updateButton();
    }

    function updateButton() {
        if (checked) return;
        if (placed.length === CARDS.length) {
            mainBtn.disabled = false;
            mainBtn.classList.add('active');
        } else {
            mainBtn.disabled = true;
            mainBtn.classList.remove('active');
        }
    }

    function checkResult() {
        checked = true;
        mainBtn.disabled = false;
        mainBtn.classList.remove('active');
        mainBtn.classList.add('reset-mode');
        mainBtn.textContent = '↻ Попробовать еще раз';

        placed.forEach(p => {
            const el = document.querySelector(`.placed-card[data-id="${p.id}"]`);
            if (!el) return;
            const correct = p.target === p.placedTo;
            el.classList.add(correct ? 'correct' : 'wrong');
        });
    }

    function onPointerDown(e) {
        if (checked) return;
        const card = e.target.closest('.stack-card.current');
        if (!card) return;

        e.preventDefault();
        const rect = card.getBoundingClientRect();

        const ghost = document.createElement('div');
        ghost.className = 'drag-ghost';
        ghost.textContent = card.textContent;
        ghost.style.left = rect.left + 'px';
        ghost.style.top = rect.top + 'px';
        ghost.style.width = rect.width + 'px';
        document.body.appendChild(ghost);

        drag = {
            cardId: card.dataset.id,
            ghost,
            offsetX: e.clientX - rect.left,
            offsetY: e.clientY - rect.top
        };

        card.classList.add('dragging');
        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
    }

    function onPointerMove(e) {
        if (!drag) return;
        drag.ghost.style.left = (e.clientX - drag.offsetX) + 'px';
        drag.ghost.style.top = (e.clientY - drag.offsetY) + 'px';

        columns.forEach(c => c.classList.remove('hover'));
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const col = el ? el.closest('.column') : null;
        if (col) col.classList.add('hover');
    }

    function onPointerUp(e) {
        if (!drag) return;
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);

        drag.ghost.remove();
        columns.forEach(c => c.classList.remove('hover'));

        const el = document.elementFromPoint(e.clientX, e.clientY);
        const col = el ? el.closest('.column') : null;

        const dragEl = document.querySelector('.stack-card.current.dragging');
        if (dragEl) dragEl.classList.remove('dragging');

        const cardId = drag.cardId;
        drag = null;

        if (col) {
            placeCard(cardId, col.dataset.target);
        } else {
            renderStack();
        }
    }

    document.addEventListener('pointerdown', onPointerDown);

    prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) { currentIndex--; renderStack(); }
    });
    nextBtn.addEventListener('click', () => {
        if (currentIndex < pool.length - 1) { currentIndex++; renderStack(); }
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' && currentIndex > 0) {
            currentIndex--;
            renderStack();
        } else if (e.key === 'ArrowRight' && currentIndex < pool.length - 1) {
            currentIndex++;
            renderStack();
        }
    });

    mainBtn.addEventListener('click', () => {
        if (mainBtn.classList.contains('reset-mode')) {
            init();
        } else if (!mainBtn.disabled) {
            checkResult();
        }
    });

    init();
})();
</script>
</body>
</html>
