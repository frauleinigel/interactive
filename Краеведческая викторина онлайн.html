<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр: Краеведческая викторина онлайн</title>
<style>
  :root{
    --brand:#2BB673;
    --brand-dark:#149A5A;
    --brand-soft:#DDF5E8;
    --ok:#20b26c;
    --err:#ff5252;
    --ink:#12281d;
    --muted:#5d7a6b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 500px at 10% -10%, #d3f3e3 0%, transparent 60%),
      radial-gradient(800px 500px at 100% 0%, #c5eedb 0%, transparent 55%),
      #f1faf5;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:820px;margin:0 auto;}

  .head{text-align:center;margin-bottom:22px;}
  .badge{
    display:inline-block;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-weight:700;
    color:#fff;
    background:linear-gradient(135deg,var(--brand),var(--brand-dark));
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:16px;
    box-shadow:0 6px 14px -6px rgba(20,154,90,.55);
  }

  .head-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .head-icon{
    flex:0 0 auto;
    width:56px;
    height:56px;
    display:grid;
    place-items:center;
    filter:drop-shadow(0 6px 12px rgba(20,154,90,.35));
  }
  .head-icon svg{display:block;}

  .head-text{text-align:left;}

  h1{
    font-size:clamp(20px,4vw,28px);
    margin:0 0 6px;
    line-height:1.25;
  }
  .sub{margin:0;color:var(--muted);font-size:15px;line-height:1.4;}

  .bar{
    height:8px;
    background:#daf1e6;
    border-radius:99px;
    overflow:hidden;
    margin:22px 0 8px;
  }
  .bar-fill{
    height:100%;
    width:0;
    border-radius:99px;
    background:linear-gradient(90deg,var(--brand),var(--brand-dark));
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }
  .counter{
    text-align:right;
    font-size:13px;
    color:var(--muted);
    font-weight:600;
    letter-spacing:.02em;
    margin-bottom:14px;
  }

  .card{
    background:#fff;
    border-radius:22px;
    padding:26px 24px;
    box-shadow:0 18px 40px -22px rgba(20,90,55,.35), 0 2px 6px rgba(20,90,55,.06);
    animation:pop .3s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .q-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .q-num{
    font-size:12px;
    font-weight:800;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--brand-dark);
    background:var(--brand-soft);
    padding:5px 12px;
    border-radius:8px;
  }
  .q-head h2{font-size:19px;margin:0;}

  .options{display:flex;flex-direction:column;gap:12px;}
  .opt{
    display:flex;
    gap:14px;
    align-items:flex-start;
    width:100%;
    text-align:left;
    font:inherit;
    font-size:15px;
    line-height:1.5;
    color:var(--ink);
    background:#fff;
    border:2px solid #dcefe5;
    border-radius:16px;
    padding:16px 18px;
    cursor:pointer;
    transition:border-color .18s, transform .18s, box-shadow .18s, background .18s;
  }
  .opt:hover:not(:disabled){
    border-color:var(--brand);
    transform:translateY(-2px);
    box-shadow:0 12px 24px -16px rgba(20,154,90,.55);
  }
  .opt:disabled{cursor:default;}

  .mark{
    flex:0 0 26px;
    height:26px;
    border-radius:50%;
    background:var(--brand-soft);
    color:#fff;
    font-size:15px;
    font-weight:800;
    display:grid;
    place-items:center;
    margin-top:1px;
    transition:.2s;
  }
  .txt{flex:1;}

  .opt.correct{border-color:var(--ok);background:#f2fdf7;}
  .opt.correct .mark{background:var(--ok);}
  .opt.wrong{border-color:var(--err);background:#fff4f4;}
  .opt.wrong .mark{background:var(--err);}
  .opt.dim{opacity:.62;}

  .actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-top:22px;
    flex-wrap:wrap;
  }
  .actions-right{display:flex;gap:10px;margin-left:auto;}

  .btn{
    font:inherit;
    font-weight:700;
    font-size:15px;
    color:#fff;
    background:linear-gradient(135deg,var(--brand),var(--brand-dark));
    border:none;
    border-radius:14px;
    padding:13px 26px;
    cursor:pointer;
    box-shadow:0 12px 24px -14px rgba(20,154,90,.85);
    transition:transform .15s, box-shadow .15s, opacity .2s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 28px -14px rgba(20,154,90,.95);}
  .btn:active{transform:translateY(0);}
  .btn[hidden]{display:none;}

  .btn-ghost{
    background:#fff;
    color:var(--brand-dark);
    border:2px solid #b7e8ce;
    box-shadow:none;
  }
  .btn-ghost:hover{
    background:#f2fbf7;
    box-shadow:none;
  }

  /* ---------- Модальное окно ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(10,50,30,.55);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
  }
  .overlay.show{display:flex;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .modal{
    position:relative;
    background:#fff;
    border-radius:20px;
    width:100%;
    max-width:520px;
    max-height:85vh;
    overflow-y:auto;
    padding:34px 30px 30px;
    box-shadow:0 30px 60px -20px rgba(10,50,30,.55);
    animation:pop .28s cubic-bezier(.4,0,.2,1);
  }

  .modal-close{
    position:absolute;
    top:14px;
    right:14px;
    width:36px;
    height:36px;
    border:none;
    border-radius:50%;
    background:#e9f7ef;
    color:var(--muted);
    font-size:22px;
    line-height:1;
    cursor:pointer;
    display:grid;
    place-items:center;
    transition:background .18s, color .18s, transform .25s;
  }
  .modal-close:hover{background:#cdeedb;color:var(--ink);transform:rotate(90deg);}

  .m-content{
    display:flex;
    gap:16px;
    align-items:flex-start;
    padding-right:28px;
  }
  .m-icon{
    flex:0 0 40px;
    width:40px;
    height:40px;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:22px;
    font-weight:800;
    color:#fff;
    line-height:1;
  }
  .m-icon.bad{background:var(--err);}
  .m-icon.good{background:var(--ok);}

  .m-text{
    flex:1;
    font-size:15.5px;
    line-height:1.6;
    color:var(--ink);
    padding-top:8px;
  }

  /* ---------- Результат ---------- */
  .result{text-align:center;}
  .score{
    font-size:56px;
    font-weight:800;
    line-height:1;
    background:linear-gradient(135deg,var(--brand),var(--brand-dark));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin:6px 0 4px;
  }
  .score small{font-size:22px;color:#bcd9c9;-webkit-text-fill-color:#bcd9c9;}
  .result h3{margin:6px 0 20px;font-size:19px;}

  .summary{
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:24px;
  }
  .sum-item{
    border:1px solid #e5f1eb;
    border-left:4px solid var(--ok);
    border-radius:12px;
    padding:12px 14px;
    background:#f7fdfa;
    font-size:14px;
    line-height:1.5;
  }
  .sum-item b{display:block;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--brand-dark);margin-bottom:4px;}

  @media(max-width:520px){
    .card{padding:20px 16px;border-radius:18px;}
    .opt{padding:14px;font-size:14.5px;}
    .actions{flex-direction:column;align-items:stretch;}
    .actions-right{margin-left:0;flex-direction:column;}
    .btn{width:100%;}
    .modal{padding:30px 20px 24px;}
    .m-content{gap:12px;padding-right:24px;}
    .m-icon{flex-basis:34px;width:34px;height:34px;font-size:18px;}
    .m-text{font-size:14.5px;}

    .head-row{gap:12px;flex-direction:column;}
    .head-text{text-align:center;}
    .head-icon{width:48px;height:48px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="head">
    <div class="badge">Проект №3</div>

    <div class="head-row">
      <!-- Иконка: знак вопроса в круге + мини-точки, зелёный градиент -->
      <div class="head-icon" aria-hidden="true">
        <svg width="56" height="56" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="grad3" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#2BB673"/>
              <stop offset="100%" stop-color="#149A5A"/>
            </linearGradient>
          </defs>
          <!-- круг-основа -->
          <circle cx="32" cy="32" r="24" fill="url(#grad3)"/>
          <!-- знак вопроса -->
          <path d="M24 24 a8 8 0 1 1 12 7 c-3 1.6-4 3-4 6 v1"
                stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
          <!-- точка вопроса -->
          <circle cx="32" cy="44" r="2.4" fill="#ffffff"/>
          <!-- мини-точка-акцент -->
          <circle cx="49" cy="15" r="3" fill="#FFD86B"/>
        </svg>
      </div>

      <div class="head-text">
        <h1>Краеведческая викторина онлайн</h1>
        <p class="sub">На каждом шаге выберите необходимое действие</p>
      </div>
    </div>
  </header>

  <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  <div class="counter" id="counter"></div>

  <main id="app"></main>
</div>

<!-- Модальное окно с расшифровкой -->
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" aria-label="Закрыть">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
/* ================== ДАННЫЕ ================== */
const STEPS = [
  {
    n: 1,
    title: "Анализ запроса",
    options: [
      {
        text: "Проанализировать прошлые мероприятия и понять, что местным жителям интересен интерактивный досуг и история города.",
        ok: true,
        why: "Правильно. Опора на прошлый опыт и интересы аудитории."
      },
      {
        text: "Составить список вопросов по истории города с помощью краеведческого отдела.",
        ok: false,
        why: "Ошибка. Составление вопросов — это шаг отбора контента (шаг 2), а не анализ потребностей аудитории (шаг 1)."
      }
    ]
  },
  {
    n: 2,
    title: "Отбор контента и ресурсов",
    options: [
      {
        text: "Отобрать самые интересные исторические факты из краеведческого фонда с помощью сотрудников отдела.",
        ok: true,
        why: "Правильно. Использование профильных ресурсов и уникального контента."
      },
      {
        text: "Собрать участников на специальной платформе для онлайн-игр и запустить тестовый эфир.",
        ok: false,
        why: "Ошибка. Сбор людей на платформе — это дистрибуция (шаг 4) и создание продукта (шаг 3), но никак не отбор контента."
      }
    ]
  },
  {
    n: 3,
    title: "Создание продукта",
    options: [
      {
        text: "Загрузить вопросы на платформу для онлайн-викторин и протестировать работоспособность ссылки.",
        ok: true,
        why: "Правильно. Техническая сборка и проверка интерактивного продукта."
      },
      {
        text: "Опубликовать анонс викторины в группе ВКонтакте со ссылкой на регистрацию.",
        ok: false,
        why: "Ошибка. Анонс и приглашение людей — это упаковка и дистрибуция (шаг 4), а не создание самого продукта."
      }
    ]
  },
  {
    n: 4,
    title: "Упаковка и дистрибуция",
    options: [
      {
        text: "Запустить яркий анонс викторины в соцсетях и пригласить к участию местные сообщества.",
        ok: true,
        why: "Правильно. Выход на широкую аудиторию через подходящие каналы связи."
      },
      {
        text: "Проанализировать количество участников и процент правильных ответов после завершения игры.",
        ok: false,
        why: "Ошибка. Аналитика результатов — это финальный, пятый шаг алгоритма, а не этап дистрибуции."
      }
    ]
  },
  {
    n: 5,
    title: "Сбор обратной связи и аналитика",
    options: [
      {
        text: "Подвести итоги, оценить количество участников и почитать отзывы в комментариях.",
        ok: true,
        why: "Правильно. Сбор метрик и качественной обратной связи."
      },
      {
        text: "Назначить ответственного сотрудника и выдать ему регламент проведения игры.",
        ok: false,
        why: "Ошибка. Назначение ответственных и регламент — это подготовка (шаг 2), а не аналитика результатов."
      }
    ]
  }
];

/* ================== ЛОГИКА ================== */
const app        = document.getElementById('app');
const barFill    = document.getElementById('barFill');
const counter    = document.getElementById('counter');
const overlay    = document.getElementById('overlay');
const modalBody  = document.getElementById('modalBody');
const modalClose = document.getElementById('modalClose');

let quiz     = [];
let idx      = 0;
let score    = 0;
let answered = false;
let log      = [];

const shuffle = arr => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

function init() {
  quiz = STEPS.map(s => ({ ...s, options: shuffle(s.options) }));
  idx = 0; score = 0; answered = false; log = [];
  overlay.classList.remove('show');
  renderQuestion();
}

function setBar(percent) { barFill.style.width = percent + '%'; }

function renderQuestion() {
  if (idx >= quiz.length) return renderResult();

  const q = quiz[idx];
  answered = false;

  counter.textContent = `Шаг ${q.n} из ${quiz.length}`;
  setBar(idx / quiz.length * 100);

  app.innerHTML = `
    <div class="card">
      <div class="q-head">
        <span class="q-num">Шаг ${q.n}</span>
        <h2>${q.title}</h2>
      </div>
      <div class="options" id="options">
        ${q.options.map((o, i) => `
          <button class="opt" data-i="${i}">
            <span class="mark"></span>
            <span class="txt">${o.text}</span>
          </button>
        `).join('')}
      </div>
      <div class="actions">
        <button class="btn btn-ghost" id="restart">Начать заново</button>
        <div class="actions-right">
          <button class="btn" id="next" hidden>${idx === quiz.length - 1 ? 'Показать результат' : 'Далее →'}</button>
        </div>
      </div>
    </div>
  `;

  document.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => choose(Number(btn.dataset.i)));
  });

  document.getElementById('restart').addEventListener('click', init);
  document.getElementById('next').addEventListener('click', () => {
    idx++;
    renderQuestion();
  });
}

function choose(pickedIdx) {
  if (answered) return;
  answered = true;

  const q       = quiz[idx];
  const picked  = q.options[pickedIdx];
  const correct = q.options.find(o => o.ok);
  const btns    = [...document.querySelectorAll('.opt')];

  btns.forEach((btn, i) => {
    const opt = q.options[i];
    btn.disabled = true;

    if (opt.ok) {
      btn.classList.add('correct');
      btn.querySelector('.mark').textContent = '✓';
    } else if (i !== pickedIdx) {
      btn.classList.add('dim');
    }

    if (i === pickedIdx && !opt.ok) {
      btn.classList.add('wrong');
      btn.querySelector('.mark').textContent = '✕';
    }
  });

  if (picked.ok) score++;

  log.push({
    n: q.n,
    title: q.title,
    ok: picked.ok,
    right: correct.text
  });

  openModal(picked);

  document.getElementById('next').hidden = false;

  counter.textContent = `Отвечено ${idx + 1} из ${quiz.length}`;
  setBar((idx + 1) / quiz.length * 100);
}

/* ---------- Модальное окно: только иконка + расшифровка ---------- */
function openModal(picked) {
  const isOk = picked.ok;

  modalBody.innerHTML = `
    <div class="m-content">
      <span class="m-icon ${isOk ? 'good' : 'bad'}">${isOk ? '✓' : '✕'}</span>
      <div class="m-text">${picked.why}</div>
    </div>
  `;

  overlay.classList.add('show');
}

function closeModal() {
  overlay.classList.remove('show');
}

modalClose.addEventListener('click', closeModal);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && overlay.classList.contains('show')) closeModal();
});

/* ---------- Результат ---------- */
function renderResult() {
  setBar(100);
  counter.textContent = `Результат: ${score} из ${quiz.length}`;

  const total = quiz.length;
  const title =
    score === total ? 'Идеально!' :
    score >= total - 1 ? 'Отличный результат!' :
    score >= 3 ? 'Неплохо!' : 'Стоит повторить';

  app.innerHTML = `
    <div class="card result">
      <div class="score">${score}<small> / ${total}</small></div>
      <h3>${title}</h3>

      <div class="summary">
        ${log.map(item => `
          <div class="sum-item">
            <b>Шаг ${item.n}. ${item.title}</b>
            ✓ ${item.right}
          </div>
        `).join('')}
      </div>

      <button class="btn" id="restart">Начать заново</button>
    </div>
  `;

  document.getElementById('restart').addEventListener('click', init);
}

init();
</script>
</body>
</html>
