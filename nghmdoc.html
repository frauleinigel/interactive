<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Слайдер с увеличением</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #eef2f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .slider-container {
            max-width: 960px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.10);
            padding: 30px 30px 35px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #0b1e33;
            margin-bottom: 20px;
            letter-spacing: -0.3px;
        }

        .slider-wrapper {
            position: relative;
            background: #f8fafc;
            border-radius: 18px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 320px;
        }

        .slides {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            width: 100%;
        }

        .slide {
            min-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background: #f8fafc;
            cursor: pointer; /* указываем, что кликабельно */
        }

        .slide img {
            display: block;
            max-width: 100%;
            max-height: 60vh;
            height: auto;
            width: auto;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            background: #ffffff;
            transition: box-shadow 0.3s, transform 0.2s;
            pointer-events: auto; /* чтобы клик по картинке срабатывал */
        }

        .slide img:hover {
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
            transform: scale(1.01);
        }

        /* Кнопки навигации */
        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(4px);
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 26px;
            font-weight: 300;
            color: #1e293b;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            transition: background 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            user-select: none;
        }

        .slider-btn:hover {
            background: #ffffff;
            transform: translateY(-50%) scale(1.04);
        }
        .slider-btn:active {
            transform: translateY(-50%) scale(0.94);
        }
        .slider-btn.prev { left: 16px; }
        .slider-btn.next { right: 16px; }

        /* Точки */
        .dots {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 24px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #d1d9e6;
            border: none;
            padding: 0;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        .dot.active {
            background: #2563eb;
            transform: scale(1.2);
        }
        .dot:hover {
            background: #94a3b8;
        }
        .dot.active:hover {
            background: #2563eb;
        }

        /* ----- Модальное окно (лайтбокс) ----- */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 40px 20px;
            animation: fadeIn 0.25s ease;
        }
        .lightbox.open {
            display: flex;
        }

        .lightbox-content {
            position: relative;
            max-width: 95%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .lightbox-close {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
            border: none;
            color: #fff;
            font-size: 32px;
            line-height: 1;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            margin-bottom: 12px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 300;
        }
        .lightbox-close:hover {
            background: rgba(255,255,255,0.3);
        }

        .lightbox-image {
            max-width: 100%;
            max-height: 82vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            background: #fff;
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to   { opacity: 1; transform: scale(1); }
        }

        /* Адаптив */
        @media (max-width: 640px) {
            .slider-container {
                padding: 20px 16px 30px;
            }
            h1 {
                font-size: 22px;
            }
            .slider-btn {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            .slider-btn.prev { left: 8px; }
            .slider-btn.next { right: 8px; }
            .slide img {
                max-height: 45vh;
            }
            .lightbox-close {
                width: 44px;
                height: 44px;
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

<div class="slider-container">
    <h1>Пример расположения документов</h1>

    <div class="slider-wrapper">
        <div class="slides" id="slides">
            <div class="slide" data-img="https://www.cultmanager.ru/images/Vibecoding/nghm1.png">
                <img src="https://www.cultmanager.ru/images/Vibecoding/nghm1.png" alt="Документ 1" loading="lazy" />
            </div>
            <div class="slide" data-img="https://www.cultmanager.ru/images/Vibecoding/nghm2.png">
                <img src="https://www.cultmanager.ru/images/Vibecoding/nghm2.png" alt="Документ 2" loading="lazy" />
            </div>
        </div>

        <button class="slider-btn prev" id="prevBtn" aria-label="Назад">‹</button>
        <button class="slider-btn next" id="nextBtn" aria-label="Вперёд">›</button>
    </div>

    <div class="dots" id="dots">
        <button class="dot active" data-index="0" aria-label="Слайд 1"></button>
        <button class="dot" data-index="1" aria-label="Слайд 2"></button>
    </div>
</div>

<!-- Модальное окно -->
<div class="lightbox" id="lightbox">
    <div class="lightbox-content">
        <button class="lightbox-close" id="lightboxClose" aria-label="Закрыть">✕</button>
        <img class="lightbox-image" id="lightboxImage" src="" alt="Увеличенное изображение" />
    </div>
</div>

<script>
    (function() {
        // ---- Слайдер ----
        const slides = document.getElementById('slides');
        const dots = document.querySelectorAll('.dot');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideElements = document.querySelectorAll('.slide');
        let currentIndex = 0;
        const total = 2;

        function updateSlider(index) {
            slides.style.transform = `translateX(-${index * 100}%)`;
            dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
        }

        function goTo(index) {
            if (index < 0) index = total - 1;
            if (index >= total) index = 0;
            currentIndex = index;
            updateSlider(currentIndex);
        }

        prevBtn.addEventListener('click', () => goTo(currentIndex - 1));
        nextBtn.addEventListener('click', () => goTo(currentIndex + 1));

        dots.forEach(dot => {
            dot.addEventListener('click', function() {
                goTo(parseInt(this.dataset.index, 10));
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(currentIndex - 1); }
            if (e.key === 'ArrowRight') { e.preventDefault(); goTo(currentIndex + 1); }
        });

        // ---- Лайтбокс (увеличение) ----
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxClose = document.getElementById('lightboxClose');

        // Открыть лайтбокс с картинкой
        function openLightbox(src) {
            lightboxImage.src = src;
            lightbox.classList.add('open');
            document.body.style.overflow = 'hidden'; // запрещаем прокрутку
        }

        // Закрыть лайтбокс
        function closeLightbox() {
            lightbox.classList.remove('open');
            document.body.style.overflow = '';
            // небольшая задержка, чтобы убрать src после анимации (опционально)
            // но можно оставить, чтобы при повторном открытии не было мерцания
        }

        // Клик по слайду (по картинке) — открываем увеличенную версию
        slideElements.forEach(slide => {
            slide.addEventListener('click', function(e) {
                // Если клик именно по картинке или по самому слайду — берём src из data-атрибута или из img
                let imgSrc = this.dataset.img;
                if (!imgSrc) {
                    const img = this.querySelector('img');
                    if (img) imgSrc = img.src;
                }
                if (imgSrc) {
                    openLightbox(imgSrc);
                }
            });
        });

        // Закрытие по клику на фон (на сам lightbox, но не на контент)
        lightbox.addEventListener('click', function(e) {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        // Закрытие по кнопке
        lightboxClose.addEventListener('click', closeLightbox);

        // Закрытие по Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightbox.classList.contains('open')) {
                closeLightbox();
            }
        });

        // Инициализация
        updateSlider(0);
    })();
</script>

</body>
</html>
