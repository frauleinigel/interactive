<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Слайдер с зумом</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #eef2f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .slider-container {
            max-width: 960px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.10);
            padding: 30px 30px 35px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #0b1e33;
            margin-bottom: 20px;
            letter-spacing: -0.3px;
        }

        .slider-wrapper {
            position: relative;
            background: #f8fafc;
            border-radius: 18px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 320px;
        }

        .slides {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            width: 100%;
        }

        .slide {
            min-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background: #f8fafc;
            cursor: pointer;
        }

        .slide img {
            display: block;
            max-width: 100%;
            max-height: 65vh;
            height: auto;
            width: auto;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            background: #ffffff;
            transition: box-shadow 0.3s, transform 0.2s;
            pointer-events: auto;
        }

        .slide img:hover {
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
            transform: scale(1.01);
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(4px);
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 26px;
            font-weight: 300;
            color: #1e293b;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            transition: background 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            user-select: none;
        }

        .slider-btn:hover {
            background: #ffffff;
            transform: translateY(-50%) scale(1.04);
        }
        .slider-btn:active {
            transform: translateY(-50%) scale(0.94);
        }
        .slider-btn.prev { left: 16px; }
        .slider-btn.next { right: 16px; }

        .dots {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 24px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #d1d9e6;
            border: none;
            padding: 0;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        .dot.active {
            background: #2563eb;
            transform: scale(1.2);
        }
        .dot:hover {
            background: #94a3b8;
        }
        .dot.active:hover {
            background: #2563eb;
        }

        /* ----- Модальное окно с зумом ----- */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }
        .lightbox.open {
            display: flex;
        }

        .lightbox-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Контейнер для картинки с возможностью скролла */
        .lightbox-image-wrapper {
            width: 100%;
            height: calc(100% - 70px); /* оставляем место для кнопок */
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            background: transparent;
            position: relative;
        }

        .lightbox-image-wrapper:active {
            cursor: grabbing;
        }

        .lightbox-image {
            display: block;
            max-width: none;
            max-height: none;
            width: auto;
            height: auto;
            transform-origin: center center;
            transition: transform 0.1s ease;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            background: #fff;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Панель управления зумом */
        .zoom-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            background: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(8px);
            padding: 10px 18px;
            border-radius: 40px;
            align-items: center;
            z-index: 10;
        }

        .zoom-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 24px;
            font-weight: 300;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .zoom-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .zoom-level {
            color: #fff;
            font-size: 14px;
            min-width: 50px;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 30px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
            border: none;
            color: #fff;
            font-size: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            font-weight: 300;
        }

        .close-lightbox:hover {
            background: rgba(255,255,255,0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* Адаптив */
        @media (max-width: 640px) {
            .slider-container {
                padding: 20px 16px 30px;
            }
            h1 {
                font-size: 22px;
            }
            .slider-btn {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            .slider-btn.prev { left: 8px; }
            .slider-btn.next { right: 8px; }
            .slide img {
                max-height: 45vh;
            }
            .close-lightbox {
                top: 12px;
                right: 16px;
                width: 44px;
                height: 44px;
                font-size: 26px;
            }
            .zoom-controls {
                padding: 8px 14px;
                gap: 12px;
                bottom: 12px;
            }
            .zoom-btn {
                width: 36px;
                height: 36px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

<div class="slider-container">
    <h1>Пример расположения документов</h1>

    <div class="slider-wrapper">
        <div class="slides" id="slides">
            <div class="slide" data-img="https://www.cultmanager.ru/images/Vibecoding/nghm1.png">
                <img src="https://www.cultmanager.ru/images/Vibecoding/nghm1.png" alt="Документ 1" loading="lazy" />
            </div>
            <div class="slide" data-img="https://www.cultmanager.ru/images/Vibecoding/nghm2.png">
                <img src="https://www.cultmanager.ru/images/Vibecoding/nghm2.png" alt="Документ 2" loading="lazy" />
            </div>
        </div>

        <button class="slider-btn prev" id="prevBtn" aria-label="Назад">‹</button>
        <button class="slider-btn next" id="nextBtn" aria-label="Вперёд">›</button>
    </div>

    <div class="dots" id="dots">
        <button class="dot active" data-index="0" aria-label="Слайд 1"></button>
        <button class="dot" data-index="1" aria-label="Слайд 2"></button>
    </div>
</div>

<!-- Модальное окно с зумом -->
<div class="lightbox" id="lightbox">
    <div class="lightbox-content">
        <button class="close-lightbox" id="lightboxClose" aria-label="Закрыть">✕</button>

        <div class="lightbox-image-wrapper" id="imageWrapper">
            <img class="lightbox-image" id="lightboxImage" src="" alt="Увеличенное изображение" />
        </div>

        <div class="zoom-controls">
            <button class="zoom-btn" id="zoomOut" aria-label="Уменьшить">−</button>
            <span class="zoom-level" id="zoomLevel">100%</span>
            <button class="zoom-btn" id="zoomIn" aria-label="Увеличить">+</button>
            <button class="zoom-btn" id="zoomReset" aria-label="Сбросить масштаб" style="font-size:18px;">⟲</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---- Слайдер ----
        const slides = document.getElementById('slides');
        const dots = document.querySelectorAll('.dot');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideElements = document.querySelectorAll('.slide');
        let currentIndex = 0;
        const total = 2;

        function updateSlider(index) {
            slides.style.transform = `translateX(-${index * 100}%)`;
            dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
        }

        function goTo(index) {
            if (index < 0) index = total - 1;
            if (index >= total) index = 0;
            currentIndex = index;
            updateSlider(currentIndex);
        }

        prevBtn.addEventListener('click', () => goTo(currentIndex - 1));
        nextBtn.addEventListener('click', () => goTo(currentIndex + 1));

        dots.forEach(dot => {
            dot.addEventListener('click', function() {
                goTo(parseInt(this.dataset.index, 10));
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(currentIndex - 1); }
            if (e.key === 'ArrowRight') { e.preventDefault(); goTo(currentIndex + 1); }
        });

        // ---- Лайтбокс с зумом ----
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const imageWrapper = document.getElementById('imageWrapper');
        const closeBtn = document.getElementById('lightboxClose');
        const zoomInBtn = document.getElementById('zoomIn');
        const zoomOutBtn = document.getElementById('zoomOut');
        const zoomResetBtn = document.getElementById('zoomReset');
        const zoomLevelSpan = document.getElementById('zoomLevel');

        let scale = 1;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let startX, startY, startTranslateX, startTranslateY;

        // Функция обновления трансформации картинки
        function updateImageTransform() {
            lightboxImage.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
            zoomLevelSpan.textContent = Math.round(scale * 100) + '%';
        }

        // Сброс позиции и масштаба
        function resetZoom() {
            scale = 1;
            translateX = 0;
            translateY = 0;
            updateImageTransform();
            // центрируем картинку в вьюпорте (скроллим в начало)
            imageWrapper.scrollTo(0, 0);
        }

        // Открыть лайтбокс с картинкой
        function openLightbox(src) {
            lightboxImage.src = src;
            lightbox.classList.add('open');
            document.body.style.overflow = 'hidden';
            // Сбрасываем масштаб при открытии новой картинки
            resetZoom();
            // Ждём загрузки, чтобы отцентрировать (опционально)
            lightboxImage.onload = function() {
                // Можем попытаться подогнать под размер экрана, но оставим как есть
            };
        }

        function closeLightbox() {
            lightbox.classList.remove('open');
            document.body.style.overflow = '';
        }

        // Обработчики открытия по клику на слайд
        slideElements.forEach(slide => {
            slide.addEventListener('click', function(e) {
                let imgSrc = this.dataset.img;
                if (!imgSrc) {
                    const img = this.querySelector('img');
                    if (img) imgSrc = img.src;
                }
                if (imgSrc) {
                    openLightbox(imgSrc);
                }
            });
        });

        // Закрытие
        closeBtn.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', function(e) {
            if (e.target === lightbox || e.target === imageWrapper) {
                closeLightbox();
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightbox.classList.contains('open')) {
                closeLightbox();
            }
        });

        // ---- Управление зумом ----
        function zoomIn() {
            scale = Math.min(scale + 0.2, 5); // максимум 500%
            updateImageTransform();
        }

        function zoomOut() {
            scale = Math.max(scale - 0.2, 0.2); // минимум 20%
            updateImageTransform();
        }

        zoomInBtn.addEventListener('click', zoomIn);
        zoomOutBtn.addEventListener('click', zoomOut);
        zoomResetBtn.addEventListener('click', resetZoom);

        // Колесико мыши для зума (над картинкой)
        imageWrapper.addEventListener('wheel', function(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.1 : 0.1;
            scale = Math.min(Math.max(scale + delta, 0.2), 5);
            updateImageTransform();
        }, { passive: false });

        // ---- Перетаскивание (drag) ----
        imageWrapper.addEventListener('mousedown', function(e) {
            // Если картинка не увеличена (scale=1) или мало увеличена, возможно, не нужно перетаскивать?
            // Но разрешим всегда.
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            startTranslateX = translateX;
            startTranslateY = translateY;
            imageWrapper.style.cursor = 'grabbing';
            e.preventDefault();
        });

        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            translateX = startTranslateX + dx;
            translateY = startTranslateY + dy;
            updateImageTransform();
        });

        document.addEventListener('mouseup', function() {
            if (isDragging) {
                isDragging = false;
                imageWrapper.style.cursor = 'grab';
            }
        });

        // Поддержка touch (для мобильных)
        let touchStartX, touchStartY, touchStartTranslateX, touchStartTranslateY;
        imageWrapper.addEventListener('touchstart', function(e) {
            if (e.touches.length === 1) {
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
                touchStartTranslateX = translateX;
                touchStartTranslateY = translateY;
                isDragging = true;
            }
        }, { passive: true });

        document.addEventListener('touchmove', function(e) {
            if (!isDragging || e.touches.length !== 1) return;
            const touch = e.touches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            translateX = touchStartTranslateX + dx;
            translateY = touchStartTranslateY + dy;
            updateImageTransform();
        }, { passive: true });

        document.addEventListener('touchend', function() {
            isDragging = false;
        }, { passive: true });

        // Инициализация слайдера
        updateSlider(0);
    })();
</script>

</body>
</html>
