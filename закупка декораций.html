<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Экономия по закупке</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: #f2f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.12);
            padding: 40px 36px 44px;
        }

        /* ----- шапка: Ситуация (зелёный) + лампочка ----- */
        .header {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 20px;
        }

        .header-icon {
            font-size: 32px;
            line-height: 1.2;
            background: #eef3fc;
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1f8b4c; /* зелёный */
            letter-spacing: -0.3px;
            line-height: 1.3;
            margin-top: 2px;
        }

        /* ----- сценарий ----- */
        .scenario {
            margin-bottom: 28px;
            padding: 0 4px;
        }

        .scenario-subtitle {
            font-size: 20px;
            font-weight: 700;
            color: #7b2fbe; /* фиолетовый */
            margin-bottom: 12px;
            letter-spacing: -0.2px;
        }

        .data-row {
            display: flex;
            flex-wrap: wrap;
            gap: 24px 40px;
            font-size: 20px;
            font-weight: 600;
            color: #0a1e2e;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .data-row span {
            background: transparent;
            padding: 0;
            border-radius: 0;
            white-space: nowrap;
        }

        .data-row .label {
            font-weight: 400;
            color: #4a617c;
            font-size: 16px;
        }

        .question {
            font-size: 18px;
            font-weight: 700;
            color: #c73a3a;
            margin: 12px 0 4px;
        }

        .instruction {
            font-size: 15px;
            color: #4a617c;
            font-weight: 400;
            margin-top: 2px;
        }

        /* ----- поле ввода ----- */
        .input-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px 18px;
            margin-bottom: 8px;
        }

        .input-area label {
            font-size: 15px;
            font-weight: 600;
            color: #1f3348;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 2px solid #dce2ec;
            border-radius: 60px;
            padding: 0 6px 0 20px;
            transition: border-color 0.2s, box-shadow 0.2s;
            flex: 1 1 200px;
            min-width: 160px;
        }

        .input-wrapper:focus-within {
            border-color: #1a6bb0;
            box-shadow: 0 0 0 4px rgba(26, 107, 176, 0.10);
        }

        .input-wrapper .rub-symbol {
            font-size: 17px;
            font-weight: 600;
            color: #4a617c;
            margin-right: 8px;
            user-select: none;
        }

        .input-wrapper input {
            border: none;
            outline: none;
            padding: 14px 8px 14px 0;
            font-size: 18px;
            font-weight: 600;
            color: #0a1e2e;
            background: transparent;
            width: 100%;
            min-width: 60px;
            font-family: inherit;
        }

        .input-wrapper input::placeholder {
            color: #b0c0d2;
            font-weight: 400;
            font-size: 15px;
        }

        /* ----- кнопки равного размера ----- */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 16px;
            margin-top: 18px;
        }

        .actions .btn {
            flex: 1 1 0;
            min-width: 140px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 20px;
            border: none;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s, border-color 0.2s;
            line-height: 1;
            letter-spacing: 0.2px;
            text-align: center;
            white-space: nowrap;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: #1a6bb0;
            color: #fff;
            box-shadow: 0 4px 12px rgba(26, 107, 176, 0.25);
        }

        .btn-primary:hover {
            background: #135a96;
            box-shadow: 0 6px 18px rgba(26, 107, 176, 0.30);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-reset {
            background: #ffb300;
            color: #3d2b00;
            font-weight: 700;
            border: 2px solid #e6a200;
            box-shadow: 0 4px 12px rgba(255, 179, 0, 0.4);
        }

        .btn-reset:hover {
            background: #ffa000;
            box-shadow: 0 6px 20px rgba(255, 179, 0, 0.6);
            border-color: #cc8800;
        }

        .btn-reset svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            stroke: #3d2b00;
        }

        .status-hint {
            font-size: 13px;
            color: #6a7f99;
            margin-top: 12px;
            padding-left: 4px;
            min-height: 22px;
            transition: opacity 0.2s;
        }

        .status-hint .correct {
            color: #1f8b4c;
            font-weight: 500;
        }

        .status-hint .error {
            color: #c73a3a;
            font-weight: 500;
        }

        /* ----- поп-ап ----- */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 30, 46, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .popup-card {
            background: #ffffff;
            border-radius: 28px;
            max-width: 520px;
            width: 100%;
            padding: 32px 32px 36px;
            box-shadow: 0 40px 80px rgba(0, 20, 40, 0.30);
            transform: translateY(20px) scale(0.96);
            transition: transform 0.25s ease, opacity 0.25s ease;
            opacity: 0;
            position: relative;
        }

        .popup-overlay.active .popup-card {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .popup-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: #f0f4fa;
            border: none;
            border-radius: 40px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            font-weight: 300;
            color: #3a526a;
            transition: background 0.15s, color 0.15s;
            padding: 0;
            line-height: 1;
        }

        .popup-close:hover {
            background: #e2e8f2;
            color: #0a1e2e;
        }

        .popup-icon {
            font-size: 44px;
            margin-bottom: 10px;
            display: block;
        }

        .popup-title {
            font-size: 20px;
            font-weight: 700;
            color: #0a1e2e;
            margin-bottom: 10px;
            letter-spacing: -0.2px;
        }

        .popup-title.success {
            color: #1f8b4c;
        }
        .popup-title.error {
            color: #c73a3a;
        }

        .popup-body {
            font-size: 15px;
            line-height: 1.65;
            color: #1f3348;
        }

        .popup-body strong {
            color: #0a1e2e;
        }

        @media (max-width: 540px) {
            .container {
                padding: 28px 18px 32px;
            }
            .header h1 {
                font-size: 22px;
            }
            .scenario-subtitle {
                font-size: 18px;
            }
            .data-row {
                font-size: 17px;
                gap: 16px 20px;
            }
            .data-row .label {
                font-size: 14px;
            }
            .question {
                font-size: 16px;
            }
            .input-area {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .input-wrapper {
                flex: 1 1 auto;
                padding: 0 4px 0 16px;
            }
            .input-wrapper input {
                font-size: 16px;
                padding: 12px 6px 12px 0;
            }
            .actions {
                flex-direction: column;
                align-items: stretch;
            }
            .actions .btn {
                flex: 1 1 auto;
                white-space: normal;
                padding: 14px 20px;
            }
            .popup-card {
                padding: 28px 20px 30px;
            }
            .popup-title {
                font-size: 18px;
            }
            .popup-body {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- шапка: Ситуация (зелёный) + лампочка -->
        <div class="header">
            <div class="header-icon">💡</div>
            <h1>Ситуация</h1>
        </div>

        <!-- сценарий -->
        <div class="scenario">
            <div class="scenario-subtitle">Закупка декораций</div>

            <div class="data-row">
                <span><span class="label">НМЦК</span> 500 000 руб.</span>
                <span><span class="label">цена победителя</span> 420 000 руб.</span>
            </div>

            <div class="question">Сколько составила экономия?</div>
            <div class="instruction">Введите в пустое поле верное значение и нажмите “Проверить”</div>
        </div>

        <!-- поле ввода и кнопки -->
        <div class="input-area">
            <label for="answerInput">Ваш ответ:</label>
            <div class="input-wrapper">
                <span class="rub-symbol">₽</span>
                <input
                type="text"
                id="answerInput"
                placeholder=""
                autocomplete="off"
                inputmode="numeric"
                />
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="checkBtn">Проверить</button>
            <button class="btn btn-reset" id="resetBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 4v6h6" />
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
                </svg>
                Начать заново
            </button>
        </div>

        <div class="status-hint" id="statusHint">&nbsp;</div>
    </div>

    <!-- всплывающая карточка (без нижней строки) -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-card" role="dialog" aria-modal="true">
            <button class="popup-close" id="popupClose" aria-label="Закрыть">✕</button>
            <span class="popup-icon" id="popupIcon">✅</span>
            <div class="popup-title" id="popupTitle">Верно!</div>
            <div class="popup-body" id="popupBody"></div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const input = document.getElementById('answerInput');
            const checkBtn = document.getElementById('checkBtn');
            const resetBtn = document.getElementById('resetBtn');
            const statusHint = document.getElementById('statusHint');

            const popupOverlay = document.getElementById('popupOverlay');
            const popupClose = document.getElementById('popupClose');
            const popupIcon = document.getElementById('popupIcon');
            const popupTitle = document.getElementById('popupTitle');
            const popupBody = document.getElementById('popupBody');

            const NMCC = 500000;
            const WINNER_PRICE = 420000;
            const CORRECT_SAVINGS = NMCC - WINNER_PRICE; // 80 000

            let isAnswered = false;

            function formatRubles(n) {
                return new Intl.NumberFormat('ru-RU').format(n) + ' руб.';
            }

            function showPopup(type, title, bodyHTML, icon) {
                popupIcon.textContent = icon || (type === 'success' ? '✅' : '❌');
                popupTitle.textContent = title;
                popupTitle.className = 'popup-title ' + (type === 'success' ? 'success' : 'error');
                popupBody.innerHTML = bodyHTML;
                popupOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function hidePopup() {
                popupOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            function handleCheck() {
                if (isAnswered) {
                    statusHint.innerHTML = '⏳ <span style="color:#6a7f99;">Вы уже проверили. Нажмите «Начать заново» для новой попытки.</span>';
                    return;
                }

                const raw = input.value.trim();
                if (raw === '') {
                    statusHint.innerHTML = '⚠️ <span style="color:#c73a3a;">Введите сумму экономии.</span>';
                    return;
                }

                let cleaned = raw.replace(/\s/g, '').replace(',', '.');
                cleaned = cleaned.replace(/[^\d.]/g, '');
                if (cleaned === '' || cleaned === '.') {
                    statusHint.innerHTML = '⚠️ <span style="color:#c73a3a;">Введите числовое значение.</span>';
                    return;
                }

                const num = parseFloat(cleaned);
                if (isNaN(num) || !isFinite(num)) {
                    statusHint.innerHTML = '⚠️ <span style="color:#c73a3a;">Введите корректное число.</span>';
                    return;
                }

                const isCorrect = (Math.abs(num - CORRECT_SAVINGS) < 0.01);

                if (isCorrect) {
                    isAnswered = true;
                    statusHint.innerHTML = '✅ <span class="correct">Верно! ' + formatRubles(CORRECT_SAVINGS) +
                        ' — именно та сумма, которую можно законно высвободить.</span>';

                    showPopup(
                        'success',
                        'Верно!',
                        '<p><strong>80 000 руб.</strong> — именно та сумма, которую можно законно высвободить из плана закупок.</p>' +
                        '<p style="margin-top: 8px;">Теперь важно оперативно внести изменения в План ФХД, чтобы у бухгалтерии было основание отразить эти средства как экономию, а не как неиспользованный остаток лимитов.</p>',
                        '✅'
                    );

                } else {
                    statusHint.innerHTML = '❌ <span class="error">Ошибка! Попробуйте ещё раз.</span>';

                    showPopup(
                        'error',
                        'Ошибка!',
                        '<p>Экономия — это разница между тем, что вы «забронировали» в бюджете, и тем, что фактически ушло по контракту.</p>' +
                        '<p style="margin-top: 8px;">Попробуйте посчитать еще раз.</p>',
                        '❌'
                    );
                }
            }

            function resetAll() {
                hidePopup();
                input.value = '';
                isAnswered = false;
                statusHint.innerHTML = '&nbsp;';
                input.focus();
            }

            checkBtn.addEventListener('click', handleCheck);

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    checkBtn.click();
                }
            });

            resetBtn.addEventListener('click', resetAll);
            popupClose.addEventListener('click', hidePopup);

            popupOverlay.addEventListener('click', function(e) {
                if (e.target === popupOverlay) {
                    hidePopup();
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && popupOverlay.classList.contains('active')) {
                    hidePopup();
                }
            });

            window.addEventListener('load', function() {
                input.focus();
            });

        })();
    </script>

</body>
</html>
