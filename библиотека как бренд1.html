<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Выберите три визуальных элемента</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(160deg, #f8fafc 0%, #eef2ff 100%);
    color: #111827;
    line-height: 1.5;
    padding: 32px 20px 50px;
    min-height: 100vh;
  }
  .visual-wrap { max-width: 820px; margin: 0 auto; }

  .visual-title-row {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 20px;
    margin-bottom: 8px;
  }
  .visual-title {
    font-size: 26px;
    font-weight: 800;
    color: #dc2626;
    letter-spacing: -0.02em;
    line-height: 1.25;
    flex: 0 1 auto;
  }
  .visual-title-img {
    flex-shrink: 0;
    width: 110px;
    height: 110px;
    border-radius: 14px;
    object-fit: cover;
    box-shadow: 0 8px 22px rgba(15, 23, 42, 0.15);
  }
  @media (max-width: 700px) {
    .visual-title { font-size: 20px; }
    .visual-title-img { width: 80px; height: 80px; }
  }

  .visual-subtitle {
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 24px;
  }

  .visual-case-name {
    font-size: 26px;
    font-weight: 800;
    color: #1d4ed8;
    text-align: center;
    margin-bottom: 22px;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }
  @media (max-width: 700px) {
    .visual-case-name { font-size: 20px; }
  }

  .visual-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    width: 100%;
  }
  @media (max-width: 640px) {
    .visual-grid { grid-template-columns: minmax(0, 1fr); }
  }

  .visual-card {
    position: relative;
    background: #ffffff;
    border: 2px solid #e5e7eb;
    border-radius: 14px;
    padding: 16px 18px;
    min-height: 72px;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease, opacity .18s ease;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    user-select: none;
    display: flex;
    align-items: center;
    min-width: 0;
  }
  .visual-card:hover:not(.disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(15, 23, 42, 0.10);
    border-color: #93c5fd;
  }

  .visual-card .label {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.4;
    padding-right: 32px;
    overflow-wrap: break-word;
    word-break: break-word;
  }

  .visual-card::after {
    content: "";
    position: absolute;
    top: 16px;
    right: 16px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid #d1d5db;
    background: #fff;
    transition: all .2s ease;
    flex-shrink: 0;
  }

  .visual-card.correct {
    border-color: #10b981;
    background: linear-gradient(180deg, #ecfdf5 0%, #ffffff 100%);
    box-shadow: 0 8px 20px rgba(16, 185, 129, 0.18);
  }
  .visual-card.correct::after {
    background: #10b981;
    border-color: #10b981;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>");
    background-repeat: no-repeat;
    background-position: center;
    background-size: 14px;
  }

  .visual-card.wrong {
    border-color: #ef4444;
    background: linear-gradient(180deg, #fef2f2 0%, #ffffff 100%);
    box-shadow: 0 8px 20px rgba(239, 68, 68, 0.15);
  }
  .visual-card.wrong::after {
    background: #ef4444;
    border-color: #ef4444;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><line x1='18' y1='6' x2='6' y2='18'/><line x1='6' y1='6' x2='18' y2='18'/></svg>");
    background-repeat: no-repeat;
    background-position: center;
    background-size: 12px;
  }

  .visual-card.disabled {
    opacity: .35;
    pointer-events: none;
  }

  .visual-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 32px;
    flex-wrap: wrap;
  }

  .visual-btn {
    border: none;
    border-radius: 12px;
    padding: 13px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease;
  }

  .visual-btn-restart {
    background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
    color: #78350f;
    box-shadow: 0 6px 16px rgba(245, 158, 11, 0.35);
  }
  .visual-btn-restart:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(245, 158, 11, 0.45);
  }

  .visual-btn-reset {
    background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%);
    color: #ffffff;
    box-shadow: 0 6px 16px rgba(124, 58, 237, 0.35);
    display: none;
  }
  .visual-btn-reset.visible { display: inline-block; }
  .visual-btn-reset:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(124, 58, 237, 0.45);
  }

  .visual-btn-next {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: #ffffff;
    box-shadow: 0 10px 24px rgba(16, 185, 129, 0.35);
    opacity: 0;
    pointer-events: none;
  }
  .visual-btn-next.visible {
    opacity: 1;
    pointer-events: auto;
  }
  .visual-btn-next:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(16, 185, 129, 0.45);
  }

  .visual-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 100;
  }
  .visual-modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .visual-modal {
    background: #ffffff;
    border-radius: 22px;
    max-width: 560px;
    width: 100%;
    padding: 42px 38px 38px;
    position: relative;
    box-shadow: 0 30px 80px rgba(15, 23, 42, 0.3);
    transform: translateY(14px) scale(0.97);
    transition: transform .22s ease;
  }
  .visual-modal-overlay.open .visual-modal {
    transform: translateY(0) scale(1);
  }
  .visual-modal.correct { border-top: 8px solid #10b981; }
  .visual-modal.wrong { border-top: 8px solid #ef4444; }
  .visual-modal.done { border-top: 8px solid #10b981; text-align: center; }

  .visual-modal-text {
    font-size: 18px;
    line-height: 1.55;
    color: #1f2937;
  }
  .visual-modal.correct .visual-modal-text { color: #065f46; }
  .visual-modal.wrong .visual-modal-text { color: #991b1b; }
  .visual-modal.done .visual-modal-text {
    font-size: 24px;
    font-weight: 800;
    color: #065f46;
  }
  .visual-modal-text strong { font-weight: 800; }

  .visual-modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: #f3f4f6;
    color: #4b5563;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s ease, color .15s ease;
  }
  .visual-modal-close:hover {
    background: #e5e7eb;
    color: #111827;
  }

  @media (max-width: 600px) {
    .visual-modal { padding: 36px 24px 28px; }
    .visual-modal-text { font-size: 16px; }
    .visual-modal.done .visual-modal-text { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="visual-wrap">
  <div class="visual-title-row">
    <h1 class="visual-title">Выберите три визуальных элемента в библиотеке, которые подходят для конкретной аудитории</h1>
    <img class="visual-title-img" src="https://www.cultmanager.ru/images/Vibecoding/rukovoditel2.jpg" alt="">
  </div>
  <p class="visual-subtitle">Нажмите на карточки, чтобы выбрать элементы</p>

  <div id="visualCaseContainer"></div>

  <div class="visual-controls">
    <button class="visual-btn visual-btn-restart" id="visualRestart">Начать заново</button>
    <button class="visual-btn visual-btn-reset" id="visualReset">Сбросить выбор карточек</button>
    <button class="visual-btn visual-btn-next" id="visualNext">Перейти к следующей аудитории</button>
  </div>
</div>

<div class="visual-modal-overlay" id="visualModalOverlay">
  <div class="visual-modal" id="visualModal">
    <button class="visual-modal-close" id="visualModalClose" aria-label="Закрыть">×</button>
    <div class="visual-modal-text" id="visualModalText"></div>
  </div>
</div>

<script>
const visualData = [
  {
    title: 'Аудитория — дети',
    options: [
      { text: 'Низкие открытые стеллажи.', feedback: 'Верно. Открытые полки на уровне ребенка визуально приглашают к самостоятельному выбору.', correct: true },
      { text: 'Мелкий шрифт на указателях.', feedback: 'Неверно. Мелкий шрифт визуально перегружает и плохо считывается ребенком.', correct: false },
      { text: 'Стеклянные полки.', feedback: 'Неверно. Стекло визуально считывается как хрупкое и вызывает у родителей тревогу.', correct: false },
      { text: 'Навигация в картинках и символах.', feedback: 'Верно. Картинки и символы визуально заменяют сложный текст и упрощают поиск.', correct: true },
      { text: 'Мягкое покрытие пола.', feedback: 'Верно. Мягкая фактура визуально считывается как детская зона, где можно свободно двигаться.', correct: true },
      { text: 'Антикварная мебель.', feedback: 'Неверно. Антикварный визуал считывается как «музей, где нельзя активно двигаться».', correct: false }
    ]
  },
  {
    title: 'Аудитория — молодежь',
    options: [
      { text: 'Портреты в золотых рамах.', feedback: 'Неверно. Золоченые рамы и портреты создают музейно-архивный образ.', correct: false },
      { text: 'Зона для съемки видео.', feedback: 'Верно. Свет и фон воспринимаются как площадка для создания контента.', correct: true },
      { text: 'Граффити-оформление стен.', feedback: 'Верно. Яркие изображения снимают ощущение «строгого места».', correct: true },
      { text: 'Тяжелые бархатные шторы.', feedback: 'Неверно. Плотный темный текстиль визуально старит пространство.', correct: false },
      { text: 'Массивные картотеки с рукописными карточками.', feedback: 'Неверно. Бумажные ящики и рукописные карточки создают образ технологической отсталости.', correct: false },
      { text: 'Мебель-трансформер на колесиках.', feedback: 'Верно. Мобильные элементы создают образ гибкого, современного пространства.', correct: true }
    ]
  },
  {
    title: 'Аудитория — взрослые интеллектуалы',
    options: [
      { text: 'Плакаты с мультгероями.', feedback: 'Неверно. Яркий детский декор противоречит профессиональной атмосфере.', correct: false },
      { text: 'Массивные деревянные столы.', feedback: 'Верно. Такая мебель задает ощущение основательности и качества.', correct: true },
      { text: 'Неоновая подсветка.', feedback: 'Неверно. Динамичный неоновый свет мешает сосредоточиться.', correct: false },
      { text: 'Пластиковые складные стулья.', feedback: 'Неверно. Пластик визуально удешевляет обстановку.', correct: false },
      { text: 'Зеленые настольные лампы.', feedback: 'Верно. Лампы под абажуром настраивают на глубокую интеллектуальную работу.', correct: true },
      { text: 'Глубокие древесные тона в отделке.', feedback: 'Верно. Темные древесные тона вызывают ассоциацию с престижным пространством.', correct: true }
    ]
  },
  {
    title: 'Аудитория — пенсионеры',
    options: [
      { text: 'Крупный шрифт на указателях.', feedback: 'Верно. Крупный шрифт — сигнал заботы о комфорте возрастного посетителя.', correct: true },
      { text: 'Глянцевый металл в интерьере.', feedback: 'Неверно. Глянцевый металл выглядит холодно и неуютно.', correct: false },
      { text: 'Прозрачная мебель из оргстекла.', feedback: 'Неверно. Прозрачные предметы сливаются с фоном и дезориентируют пожилых.', correct: false },
      { text: 'Кресла с высокой спинкой и подлокотниками.', feedback: 'Верно. Привычная форма кресел располагает к отдыху.', correct: true },
      { text: 'Абстрактные картины-инсталляции.', feedback: 'Неверно. Абстрактные образы пенсионеры воспринимают как чужеродные.', correct: false },
      { text: 'Традиционная отделка.', feedback: 'Верно. Дерево, ткань и спокойные цвета вызывают доверие и ощущение стабильности.', correct: true }
    ]
  }
];

let visualIndex = 0;
let visualFailed = false;
let visualDoneShown = false;

const visualContainer = document.getElementById('visualCaseContainer');
const visualNext = document.getElementById('visualNext');
const visualRestart = document.getElementById('visualRestart');
const visualReset = document.getElementById('visualReset');
const visualOverlay = document.getElementById('visualModalOverlay');
const visualModal = document.getElementById('visualModal');
const visualModalText = document.getElementById('visualModalText');
const visualModalClose = document.getElementById('visualModalClose');

function visualFormat(text) {
  return text.replace(/^(Верно|Неверно)\./, '<strong>$1.</strong>');
}

function visualOpenModal(type, content) {
  visualModal.classList.remove('correct', 'wrong', 'done');
  visualModal.classList.add(type);
  if (type === 'correct' || type === 'wrong') {
    visualModalText.innerHTML = visualFormat(content);
  } else {
    visualModalText.innerHTML = content;
  }
  visualOverlay.classList.add('open');
}

function visualCloseModal() {
  const isDone = visualModal.classList.contains('done');
  visualOverlay.classList.remove('open');
  visualModal.classList.remove('correct', 'wrong', 'done');
  if (isDone) return;
  visualCheckDone();
  if (visualFailed) {
    document.body.classList.add('visual-locked');
    // блокируем не через body класс, а через карточки
    Array.from(visualContainer.querySelectorAll('.visual-card')).forEach(c => {
      if (!c.classList.contains('correct') && !c.classList.contains('wrong')) {
        c.classList.add('disabled');
      }
    });
  }
}

function visualRender() {
  visualContainer.innerHTML = '';
  visualNext.classList.remove('visible');
  visualOverlay.classList.remove('open');
  visualFailed = false;
  visualDoneShown = false;

  if (visualIndex > 0) {
    visualReset.classList.add('visible');
  } else {
    visualReset.classList.remove('visible');
  }

  const c = visualData[visualIndex];

  const h2 = document.createElement('h2');
  h2.className = 'visual-case-name';
  h2.textContent = c.title;
  visualContainer.appendChild(h2);

  const grid = document.createElement('div');
  grid.className = 'visual-grid';

  c.options.forEach(opt => {
    const card = document.createElement('div');
    card.className = 'visual-card';
    card.dataset.correct = opt.correct ? 'true' : 'false';

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = opt.text;
    card.appendChild(label);

    card.addEventListener('click', () => {
      if (visualFailed) return;
      if (card.classList.contains('correct') || card.classList.contains('wrong')) {
        card.classList.remove('correct', 'wrong');
        visualCheckDone();
        return;
      }
      card.classList.add(opt.correct ? 'correct' : 'wrong');
      if (!opt.correct) {
        visualFailed = true;
        visualNext.classList.remove('visible');
      }
      visualOpenModal(opt.correct ? 'correct' : 'wrong', opt.feedback);
    });

    grid.appendChild(card);
  });

  visualContainer.appendChild(grid);
}

function visualCheckDone() {
  if (visualFailed) {
    visualNext.classList.remove('visible');
    return;
  }
  const cards = Array.from(visualContainer.querySelectorAll('.visual-card'));
  const correctCards = cards.filter(c => c.dataset.correct === 'true');
  const allCorrectGreen = correctCards.every(c => c.classList.contains('correct'));
  const anyWrongRed = cards.some(c => c.classList.contains('wrong'));
  const isLast = visualIndex === visualData.length - 1;

  if (allCorrectGreen && !anyWrongRed) {
    if (isLast) {
      visualNext.classList.remove('visible');
      if (!visualDoneShown) {
        visualDoneShown = true;
        setTimeout(() => visualOpenModal('done', 'Упражнение выполнено!'), 250);
      }
    } else {
      visualNext.classList.add('visible');
    }
  } else {
    visualNext.classList.remove('visible');
  }
}

visualModalClose.addEventListener('click', visualCloseModal);
visualOverlay.addEventListener('click', (e) => {
  if (e.target === visualOverlay) visualCloseModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && visualOverlay.classList.contains('open')) visualCloseModal();
});

visualNext.addEventListener('click', () => {
  if (visualIndex < visualData.length - 1) {
    visualIndex++;
    visualRender();
  }
});

visualRestart.addEventListener('click', () => {
  visualIndex = 0;
  visualRender();
});

visualReset.addEventListener('click', visualRender);

visualRender();
</script>
</body>
</html>
