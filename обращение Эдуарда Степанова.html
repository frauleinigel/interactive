<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обращение Эдуарда Степанова</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .player {
      width: 100%;
      max-width: 720px;
      background: #ffffff;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      color: #000000;
      margin-bottom: 20px;
      line-height: 1.3;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* ===== КНОПКА PLAY — ГЛУБОКИЙ ИНДИГО ===== */
    .play-btn-wrap {
      position: relative;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-btn-wrap::before,
    .play-btn-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #1e1b4b, #3730a3, #4f46e5, #7c3aed, #1e1b4b);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 0;
    }
    .play-btn-wrap.playing::before {
      opacity: 0.55;
      animation: pulseRing 2s ease-out infinite;
    }
    .play-btn-wrap.playing::after {
      opacity: 0.3;
      animation: pulseRing 2s ease-out infinite 0.6s;
    }
    @keyframes pulseRing {
      0%   { transform: scale(1);   opacity: 0.55; }
      70%  { transform: scale(1.6); opacity: 0;    }
      100% { transform: scale(1.6); opacity: 0;    }
    }

    button {
      position: relative;
      z-index: 1;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 25%, #4f46e5 55%, #7c3aed 80%, #a78bfa 100%);
      background-size: 300% 300%;
      background-position: 0% 50%;
      border: none;
      color: #fff;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow:
        0 10px 26px rgba(49, 46, 129, 0.45),
        0 4px 10px rgba(79, 70, 229, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        inset 0 -3px 6px rgba(15, 12, 41, 0.35);
      transition: transform 0.15s ease, box-shadow 0.25s ease, background-position 0.6s ease;
      outline: none;
      overflow: hidden;
    }
    button::before {
      content: "";
      position: absolute;
      top: 0; left: -120%;
      width: 80%;
      height: 100%;
      background: linear-gradient(
        115deg,
        transparent 0%,
        rgba(199, 210, 254, 0.55) 50%,
        transparent 100%
      );
      transform: skewX(-20deg);
      transition: left 0.7s ease;
      pointer-events: none;
    }
    button:hover::before { left: 130%; }
    button:hover {
      background-position: 100% 50%;
      transform: translateY(-2px);
      box-shadow:
        0 14px 32px rgba(49, 46, 129, 0.55),
        0 6px 16px rgba(124, 58, 237, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.35),
        inset 0 -3px 6px rgba(15, 12, 41, 0.4);
    }
    button:active {
      transform: translateY(1px) scale(0.96);
      box-shadow:
        0 5px 12px rgba(49, 46, 129, 0.45),
        0 2px 4px rgba(79, 70, 229, 0.3),
        inset 0 2px 8px rgba(15, 12, 41, 0.5);
    }
    button:focus-visible {
      box-shadow:
        0 0 0 4px rgba(79, 70, 229, 0.35),
        0 10px 26px rgba(49, 46, 129, 0.45);
    }
    button svg {
      width: 22px;
      height: 22px;
      fill: #fff;
      display: block;
      filter: drop-shadow(0 1px 2px rgba(15, 12, 41, 0.35));
    }

    /* ===== ДОРОЖКА ПРОГРЕССА ===== */
    .bar {
      flex: 1;
      height: 10px;
      background: #e5e7eb;
      border-radius: 5px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1e1b4b, #3730a3, #4f46e5, #7c3aed);
      transition: width 0.1s linear;
    }
    .time {
      font-variant-numeric: tabular-nums;
      font-size: 14px;
      color: #6b7280;
      min-width: 95px;
      text-align: right;
    }

    /* ===== ПОЛЗУНОК ГРОМКОСТИ — ГЛУБОКИЙ ИНДИГО ===== */
    .volume-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 4px;
    }
    .volume-icon {
      width: 22px;
      height: 22px;
      color: #d4af37;
      fill: currentColor;
      filter: drop-shadow(0 1px 3px rgba(212, 175, 55, 0.5));
      transition: filter 0.2s ease, transform 0.2s ease;
    }
    .volume-wrap:hover .volume-icon {
      filter: drop-shadow(0 2px 6px rgba(212, 175, 55, 0.8));
      transform: scale(1.08);
    }

    input[type="range"].styled {
      -webkit-appearance: none;
      appearance: none;
      width: 100px;
      height: 8px;
      border-radius: 4px;
      background:
        linear-gradient(90deg, #1e1b4b, #3730a3, #4f46e5, #7c3aed) 0/100% 100% no-repeat,
        #e5e7eb;
      cursor: pointer;
      outline: none;
      box-shadow:
        inset 0 1px 2px rgba(15, 12, 41, 0.15),
        0 1px 2px rgba(255, 255, 255, 0.8);
    }

    input[type="range"].styled::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e1b4b 0%, #3730a3 40%, #4f46e5 75%, #7c3aed 100%);
      border: 2px solid #ffffff;
      cursor: pointer;
      box-shadow:
        0 3px 10px rgba(49, 46, 129, 0.55),
        0 1px 3px rgba(124, 58, 237, 0.5),
        inset 0 1px 0 rgba(199, 210, 254, 0.4);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }
    input[type="range"].styled::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      box-shadow:
        0 5px 14px rgba(49, 46, 129, 0.75),
        0 2px 6px rgba(124, 58, 237, 0.6),
        inset 0 1px 0 rgba(199, 210, 254, 0.5);
    }
    input[type="range"].styled::-webkit-slider-thumb:active {
      transform: scale(0.95);
    }

    input[type="range"].styled::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e1b4b 0%, #3730a3 40%, #4f46e5 75%, #7c3aed 100%);
      border: 2px solid #ffffff;
      cursor: pointer;
      box-shadow:
        0 3px 10px rgba(49, 46, 129, 0.55),
        0 1px 3px rgba(124, 58, 237, 0.5),
        inset 0 1px 0 rgba(199, 210, 254, 0.4);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }
    input[type="range"].styled::-moz-range-thumb:hover {
      transform: scale(1.15);
      box-shadow:
        0 5px 14px rgba(49, 46, 129, 0.75),
        0 2px 6px rgba(124, 58, 237, 0.6);
    }

    input[type="range"].styled::-moz-range-track {
      background: #e5e7eb;
      border-radius: 4px;
      height: 8px;
    }
    input[type="range"].styled::-moz-range-progress {
      background: linear-gradient(90deg, #1e1b4b, #3730a3, #4f46e5, #7c3aed);
      border-radius: 4px;
      height: 8px;
    }

    input[type="range"].styled:focus-visible {
      box-shadow:
        0 0 0 4px rgba(79, 70, 229, 0.3),
        inset 0 1px 2px rgba(15, 12, 41, 0.15);
    }

    .error-message {
      margin-top: 16px;
      padding: 12px;
      background: #fef2f2;
      border-radius: 8px;
      color: #dc2626;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="player">
    <div class="title">Обращение Эдуарда Степанова</div>
    <div class="controls">
      <div class="play-btn-wrap" id="playWrap">
        <button id="playBtn" aria-label="Play">
          <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" aria-hidden="true" style="display:none;">
            <path d="M6 5h4v14H6zM14 5h4v14h-4z"/>
          </svg>
        </button>
      </div>
      <div class="bar" id="bar">
        <div class="bar-fill" id="barFill"></div>
      </div>
      <div class="time" id="time">0:00 / 0:00</div>

      <div class="volume-wrap">
        <svg class="volume-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/>
        </svg>
        <input type="range" id="volume" class="styled" min="0" max="1" step="0.01" value="1" aria-label="Громкость">
      </div>
    </div>
    <div class="error-message" id="errorMsg">
      Не удалось загрузить аудио. Проверьте ссылку или настройки сервера.
    </div>
    <audio id="audio" src="https://academymk.ru/storage/sounds/38534688-1f61-4ec7-aac6-b88820975b5f.mp3" preload="metadata"></audio>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const playWrap = document.getElementById('playWrap');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const bar = document.getElementById('bar');
    const barFill = document.getElementById('barFill');
    const timeEl = document.getElementById('time');
    const volume = document.getElementById('volume');
    const errorMsg = document.getElementById('errorMsg');

    const fmt = s => {
      if (!isFinite(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    };

    playBtn.addEventListener('click', () => {
      audio.paused ? audio.play() : audio.pause();
    });

    audio.addEventListener('play', () => {
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
      playWrap.classList.add('playing');
    });
    audio.addEventListener('pause', () => {
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
      playWrap.classList.remove('playing');
    });
    audio.addEventListener('ended', () => {
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
      playWrap.classList.remove('playing');
    });

    audio.addEventListener('timeupdate', () => {
      const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      barFill.style.width = pct + '%';
      timeEl.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
    });

    audio.addEventListener('loadedmetadata', () => {
      timeEl.textContent = `0:00 / ${fmt(audio.duration)}`;
      errorMsg.style.display = 'none';
    });

    audio.addEventListener('error', () => {
      errorMsg.style.display = 'block';
    });

    bar.addEventListener('click', e => {
      if (!audio.duration) return;
      const rect = bar.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pct * audio.duration;
    });

    function updateVolumeFill() {
      const pct = volume.value * 100;
      volume.style.background =
        `linear-gradient(90deg, #1e1b4b, #3730a3, #4f46e5, #7c3aed) 0/${pct}% 100% no-repeat, #e5e7eb`;
    }
    volume.addEventListener('input', () => {
      audio.volume = volume.value;
      updateVolumeFill();
    });
    updateVolumeFill();

    audio.volume = volume.value;
  </script>
</body>
</html>
