<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обращение Эдуарда Степанова</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .player {
      width: 100%;
      max-width: 560px;
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #000000;
      margin-bottom: 20px;
      line-height: 1.3;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    button {
      background: #2563eb;
      border: none;
      color: #fff;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    button:hover { background: #1d4ed8; }
    button:active { transform: scale(0.96); }
    .bar {
      flex: 1;
      height: 8px;
      background: #e5e7eb;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: #2563eb;
      transition: width 0.1s linear;
    }
    .time {
      font-variant-numeric: tabular-nums;
      font-size: 14px;
      color: #6b7280;
      min-width: 90px;
      text-align: right;
    }
    /* Блок громкости: значок сверху, ползунок снизу */
    .volume-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .volume-icon {
      width: 20px;
      height: 20px;
      color: #d4af37; /* золотой */
      fill: currentColor;
    }
    input[type="range"] {
      width: 80px;
      accent-color: #2563eb;
    }
    .error-message {
      margin-top: 16px;
      padding: 12px;
      background: #fef2f2;
      border-radius: 8px;
      color: #dc2626;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="player">
    <div class="title">Обращение Эдуарда Степанова</div>
    <div class="controls">
      <button id="playBtn" aria-label="Play">▶</button>
      <div class="bar" id="bar">
        <div class="bar-fill" id="barFill"></div>
      </div>
      <div class="time" id="time">0:00 / 0:00</div>

      <div class="volume-wrap">
        <svg class="volume-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/>
        </svg>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1" aria-label="Громкость">
      </div>
    </div>
    <div class="error-message" id="errorMsg">
      Не удалось загрузить аудио. Проверьте ссылку или настройки сервера.
    </div>
    <audio id="audio" src="https://academymk.ru/storage/sounds/38534688-1f61-4ec7-aac6-b88820975b5f.mp3" preload="metadata"></audio>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const bar = document.getElementById('bar');
    const barFill = document.getElementById('barFill');
    const timeEl = document.getElementById('time');
    const volume = document.getElementById('volume');
    const errorMsg = document.getElementById('errorMsg');

    const fmt = s => {
      if (!isFinite(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    };

    playBtn.addEventListener('click', () => {
      audio.paused ? audio.play() : audio.pause();
    });

    audio.addEventListener('play', () => playBtn.textContent = '❚❚');
    audio.addEventListener('pause', () => playBtn.textContent = '▶');

    audio.addEventListener('timeupdate', () => {
      const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      barFill.style.width = pct + '%';
      timeEl.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
    });

    audio.addEventListener('loadedmetadata', () => {
      timeEl.textContent = `0:00 / ${fmt(audio.duration)}`;
      errorMsg.style.display = 'none';
    });

    audio.addEventListener('error', () => {
      errorMsg.style.display = 'block';
    });

    bar.addEventListener('click', e => {
      if (!audio.duration) return;
      const rect = bar.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pct * audio.duration;
    });

    volume.addEventListener('input', () => audio.volume = volume.value);
  </script>
</body>
</html>
