<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Услуги библиотеки — Тренажер</title>
    <style>
        /* ── reset & base ── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        [hidden] {
            display: none !important;
        }

        body {
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #002b80;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .card {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 43, 128, 0.12);
            padding: 36px 32px 40px;
            transition: box-shadow 0.2s;
            position: relative;
        }

        .top-section {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 24px;
        }

        .context {
            flex: 1;
        }

        .situation-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #5a3e2b;
            text-align: center;
            line-height: 1.3;
        }

        .subhead {
            font-size: 1.45rem;
            font-weight: 600;
            color: #003d99;
            line-height: 1.7;
            padding: 16px 20px;
            border-left: 4px solid #002b80;
            background: #ffffff;
            word-break: break-word;
        }

        .image-box {
            flex-shrink: 0;
            width: 140px;
            max-width: 140px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #d9e0ed;
            padding: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8fbff;
        }

        .image-box img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            background: #ffffff;
        }

        .question {
            font-size: 1.2rem;
            font-weight: 500;
            color: #cc0000;
            margin-bottom: 24px;
            line-height: 1.5;
            padding: 16px 20px;
            border: 1px solid #d9e0ed;
            border-radius: 14px;
            background: #ffffff;
            word-break: break-word;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .question .counter {
            font-size: 0.95rem;
            font-weight: 700;
            color: #002b80;
            background: #eef4ff;
            border: 1px solid #cddcf7;
            border-radius: 30px;
            padding: 4px 14px;
            white-space: nowrap;
        }

        /* ─── СЕТКА ОТВЕТОВ 2×2 ─── */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 28px;
        }

        .answer-btn {
            background: linear-gradient(145deg, #f7f7f7, #e8e8e8);
            border: 2px solid #002b80;
            border-radius: 16px;
            padding: 18px 18px 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 1.1rem;
            font-weight: 600;
            color: #001a4d;
            line-height: 1.5;
            box-shadow: 0 2px 6px rgba(0, 43, 128, 0.03);
            min-height: 90px;
            word-break: break-word;
            font-family: inherit;
            display: flex;
            align-items: center;
        }

        .answer-btn:hover:not(.disabled) {
            border-color: #001a4d;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 43, 128, 0.08);
            background: linear-gradient(145deg, #f0f0f0, #e0e0e0);
        }

        .answer-btn .text {
            font-weight: 600;
        }

        .answer-btn.correct {
            border-color: #1a8c4a;
            background: #e6f5ed;
            box-shadow: 0 0 0 3px rgba(26, 140, 74, 0.2);
        }

        .answer-btn.wrong {
            border-color: #b3002d;
            background: #fce8eb;
            box-shadow: 0 0 0 3px rgba(204, 51, 68, 0.2);
        }

        .answer-btn.disabled {
            cursor: default;
            opacity: 0.85;
        }

        .answer-btn.disabled:hover {
            transform: none;
            box-shadow: none;
        }

        .answer-btn.correct.disabled:hover {
            background: #e6f5ed;
            box-shadow: 0 0 0 3px rgba(26, 140, 74, 0.2);
        }
        .answer-btn.wrong.disabled:hover {
            background: #fce8eb;
            box-shadow: 0 0 0 3px rgba(204, 51, 68, 0.2);
        }

        /* ── навигация ── */
        .nav-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-right {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* «Попробовать снова» — желтая */
        .reset-btn {
            background: linear-gradient(145deg, #fdf6e3, #f5e6c8);
            border: 2px solid #b8860b;
            border-radius: 30px;
            padding: 10px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #6b4a00;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.3px;
            font-family: inherit;
        }

        .reset-btn:hover {
            background: linear-gradient(145deg, #faf0da, #f0dbb8);
            border-color: #8a6508;
            transform: scale(1.02);
        }

        .reset-btn:active {
            transform: scale(0.97);
        }

        /* «Вернуться к началу» — синяя */
        .home-btn {
            background: linear-gradient(145deg, #e6f0ff, #cfe0ff);
            border: 2px solid #002b80;
            border-radius: 30px;
            padding: 10px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #002b80;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.3px;
            font-family: inherit;
        }

        .home-btn:hover {
            background: linear-gradient(145deg, #d6e6ff, #b8d2ff);
            border-color: #001a4d;
            transform: scale(1.02);
        }

        .home-btn:active {
            transform: scale(0.97);
        }

        /* «Следующий кейс» — зеленая */
        .next-btn {
            background: linear-gradient(145deg, #1a8c4a, #14703a);
            border: 2px solid #1a8c4a;
            border-radius: 30px;
            padding: 10px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.3px;
            font-family: inherit;
        }

        .next-btn:hover {
            background: linear-gradient(145deg, #1fa055, #178244);
            transform: scale(1.02);
        }

        .next-btn:active {
            transform: scale(0.97);
        }

        /* ── модальное окно ── */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 20, 50, 0.6);
            backdrop-filter: blur(3px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #ffffff;
            max-width: 640px;
            width: 100%;
            border-radius: 24px;
            padding: 32px 30px 28px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
            position: relative;
            animation: fadeSlide 0.25s ease;
            border: 2px solid #002b80;
            max-height: 85vh;
            overflow-y: auto;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 2rem;
            line-height: 1;
            cursor: pointer;
            color: #002b80;
            background: transparent;
            border: none;
            padding: 4px 10px;
            border-radius: 30px;
            transition: background 0.15s;
            font-weight: 300;
            font-family: inherit;
        }

        .modal-close:hover {
            background: #f0f4fc;
        }

        .modal-content {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #002b80;
            padding-right: 20px;
            word-break: break-word;
        }

        .modal-content strong {
            color: #001f5e;
        }

        .modal-content .option-name {
            display: block;
            font-weight: 700;
            color: #002b80;
            margin-bottom: 6px;
        }

        /* ─── АДАПТИВ ─── */
        @media (max-width: 640px) {
            .card {
                padding: 24px 16px 28px;
            }
            .top-section {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
            }
            .image-box {
                width: 100%;
                max-width: 100%;
                padding: 8px;
            }
            .image-box img {
                max-height: 160px;
                object-fit: contain;
            }
            .answers-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .answer-btn {
                min-height: 70px;
                padding: 16px 16px;
                font-size: 1.05rem;
            }
            .question {
                font-size: 1.1rem;
                padding: 14px 16px;
            }
            .subhead {
                font-size: 1.2rem;
                padding: 14px 16px;
            }
            .modal-box {
                padding: 24px 20px 20px;
                margin: 10px;
            }
            .modal-content {
                font-size: 1rem;
            }
            .modal-close {
                font-size: 1.8rem;
                top: 10px;
                right: 12px;
            }
            .situation-title {
                font-size: 1.3rem;
            }
            .nav-wrap {
                flex-direction: column-reverse;
                align-items: stretch;
            }
            .nav-right {
                flex-direction: column;
                width: 100%;
            }
            .reset-btn,
            .home-btn,
            .next-btn {
                width: 100%;
                text-align: center;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 16px 10px 20px;
            }
            .answer-btn {
                font-size: 1rem;
                padding: 14px 14px;
                min-height: 60px;
            }
            .subhead {
                font-size: 1.05rem;
                padding: 12px 14px;
            }
            .question {
                font-size: 1rem;
                padding: 10px 12px;
            }
            .situation-title {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <div class="card" role="main" aria-label="Тренажер по услугам библиотеки">

        <!-- верхняя часть: текст слева, картинка справа -->
        <div class="top-section">
            <div class="context">
                <div class="situation-title" id="situationTitle">Кейс №1</div>
                <div class="subhead" id="situationText"></div>
            </div>
            <div class="image-box">
                <img id="caseImage" src="" alt="Иллюстрация к кейсу" loading="lazy" />
            </div>
        </div>

        <!-- вопрос с счетчиком -->
        <div class="question">
            <span id="questionText">Выберите две услуги из четырех — кликните по верным вариантам ответа.</span>
            <span class="counter" id="selectionCounter">Найдено верных: 0 / 2</span>
        </div>

        <!-- ответы (сетка 2×2) -->
        <div class="answers-grid" id="answersGrid" role="group" aria-label="Варианты ответов"></div>

        <!-- навигация -->
        <div class="nav-wrap">
            <button class="reset-btn" id="resetBtn" type="button" aria-label="Сбросить и попробовать снова">⟳ Попробовать снова</button>
            <div class="nav-right">
                <button class="home-btn" id="homeBtn" type="button" aria-label="Вернуться к началу">⌂ Вернуться к началу</button>
                <button class="next-btn" id="nextBtn" type="button" hidden>Следующий кейс →</button>
            </div>
        </div>

    </div>

    <!-- ─── Модальное окно ─── -->
    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
        <div class="modal-box">
            <button class="modal-close" id="modalCloseBtn" type="button" aria-label="Закрыть">✕</button>
            <div class="modal-content" id="modalContent">
                <span class="msg-text" id="modalMessage">Кликните по варианту ответа, чтобы проверить себя.</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            /* ─────────── ДАННЫЕ КЕЙСОВ ─────────── */
            const CASES = [
                {
                    emoji: '📚',
                    title: 'Сельская библиотека',
                    audience: 'Целевая аудитория — школьники, пенсионеры, молодые родители',
                    options: [
                        {
                            text: 'Кружок по краеведению',
                            correct: true,
                            message: '<strong>✅ Верно.</strong> Вы используете те ресурсы, что уже есть в фонде, и закрываете потребность местных жителей в полезном досуге.'
                        },
                        {
                            text: 'Библионяня',
                            correct: true,
                            message: '<strong>✅ Верно.</strong> Это попадание в целевую аудиторию: родители нуждаются в помощи с детьми, а услуга почти не требует затрат, поэтому ее экономическая оправданность максимальна.'
                        },
                        {
                            text: 'VR-зона',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Это провальный выбор по критерию ресурсов: оборудование стоит дорого, требует постоянного обслуживания и качественного интернета, чего в сельской библиотеке нет.'
                        },
                        {
                            text: 'Платный доступ к розеткам и Wi-Fi',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Эта услуга уже оплачена налогами. Брать за розетки и Wi-Fi деньги нельзя.'
                        }
                    ]
                },
                {
                    emoji: '🏙️',
                    title: 'Библиотека в спальном районе',
                    audience: 'Целевая аудитория — семьи, удаленщики',
                    options: [
                        {
                            text: 'Студия звукозаписи',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Это ошибка по критерию экономики: оборудование дорогое, а спрос в обычном спальном районе на профессиональную запись не позволит окупить вложения.'
                        },
                        {
                            text: 'Издание узкопрофильных каталогов',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Это промах по целевой аудитории: вашим посетителям нужны повседневные сервисы, а не академические издания.'
                        },
                        {
                            text: 'Индивидуальные кабинки',
                            correct: true,
                            message: '<strong>✅ Верно.</strong> Это идеальное решение по критерию инфраструктуры: вы создаете пространство, которое нужно людям для работы, так как дома им часто негде уединиться.'
                        },
                        {
                            text: 'Прокат вещей',
                            correct: true,
                            message: '<strong>✅ Верно.</strong> Эта услуга отлично работает на экономическую модель: жители района ценят возможность не покупать вещи, которые нужны на один раз.'
                        }
                    ]
                },
                {
                    emoji: '🏭',
                    title: 'Библиотека при промышленном заводе',
                    audience: 'Целевая аудитория — рабочие, инженеры',
                    options: [
                        {
                            text: 'Снэковый автомат',
                            correct: true,
                            message: '<strong>✅ Верно.</strong> Это решение по критерию инфраструктуры: у рабочих плотный график, им нужно быстро перекусить, не уходя далеко от места работы.'
                        },
                        {
                            text: 'Клуб поэзии',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Это не соответствует интересам целевой аудитории: производственный коллектив не рассматривает библиотеку как площадку для поэтических вечеров.'
                        },
                        {
                            text: 'ФабЛаб',
                            correct: true,
                            message: '<strong>✅ Верно.</strong> Это попадание в цель по критерию ресурсов и аудитории: заводские специалисты оценят мастерскую, где можно что-то собрать или починить своими руками.'
                        },
                        {
                            text: 'Игровая зона',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Это плохой выбор по критерию инфраструктуры: игровое пространство на заводе будет выглядеть неуместно и несерьезно.'
                        }
                    ]
                },
                {
                    emoji: '🎧',
                    title: 'Молодежная библиотека в центре',
                    audience: 'Целевая аудитория — студенты, блогеры',
                    options: [
                        {
                            text: 'VR-игры',
                            correct: true,
                            message: '<strong>✅ Верно.</strong> Игровой подход к образованию отлично работает с молодежью, так как это совпадает с их образом жизни и интересами.'
                        },
                        {
                            text: 'Медиазона для прослушивания виниловых пластинок',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Это нишевое предложение, которое не создает достаточного притока массовой молодежной аудитории.'
                        },
                        {
                            text: 'Библиографический кружок',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Это провал по критерию экономики: на неинтересную молодежи тему вы потратите время эксперта, но не получите ни одного посетителя.'
                        },
                        {
                            text: 'Видеостудия',
                            correct: true,
                            message: '<strong>✅ Верно.</strong> Вы даете инструмент для создания контента, который нужен этой аудитории, эффективно используя имеющиеся технические ресурсы.'
                        }
                    ]
                },
                {
                    emoji: '🏛️',
                    title: 'Библиотека в историческом центре',
                    audience: 'Целевая аудитория — туристы, краеведы',
                    options: [
                        {
                            text: 'Издательство',
                            correct: true,
                            message: '<strong>✅ Верно.</strong> Вы используете уникальные архивные фонды как ресурс для создания продукта, который можно успешно реализовать.'
                        },
                        {
                            text: 'Прокат лыж',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Это грубая ошибка по критерию инфраструктуры: библиотека не должна превращаться в спортивную базу, это размывает профессиональный профиль.'
                        },
                        {
                            text: 'Экскурсии',
                            correct: true,
                            message: '<strong>✅ Верно.</strong> Это отличная экономическая модель: вы берете то, что уже знаете о районе, и превращаете это в понятную и востребованную услугу для туристов.'
                        },
                        {
                            text: 'Мастер-класс по вышивке',
                            correct: false,
                            message: '<strong>❌ Неверно.</strong> Вы не используете свой главный ресурс — уникальные исторические фонды. Вы делаете то же самое, что любой другой кружок, теряя свою уникальность.'
                        }
                    ]
                }
            ];

            const REQUIRED_CORRECT = 2;

            /* ─────────── ЭЛЕМЕНТЫ ─────────── */
            const grid = document.getElementById('answersGrid');
            const resetBtn = document.getElementById('resetBtn');
            const homeBtn = document.getElementById('homeBtn');
            const nextBtn = document.getElementById('nextBtn');
            const situationTitle = document.getElementById('situationTitle');
            const situationText = document.getElementById('situationText');
            const questionText = document.getElementById('questionText');
            const selectionCounter = document.getElementById('selectionCounter');
            const caseImage = document.getElementById('caseImage');

            const modalOverlay = document.getElementById('modalOverlay');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const modalMessage = document.getElementById('modalMessage');

            let currentIndex = 0;
            let foundCorrect = 0;
            let clickedCount = 0;

            /* ─────────── ИЛЛЮСТРАЦИЯ-ЗАГЛУШКА ─────────── */
            function emojiSvg(emoji) {
                const svg =
                    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">' +
                    '<rect width="200" height="200" fill="#f0f6ff"/>' +
                    '<text x="100" y="132" font-size="96" text-anchor="middle">' + emoji + '</text>' +
                    '</svg>';
                return 'data:image/svg+xml,' + encodeURIComponent(svg);
            }

            function updateCounter() {
                selectionCounter.textContent = 'Найдено верных: ' + foundCorrect + ' / ' + REQUIRED_CORRECT;
            }

            /* ─────────── ОТРИСОВКА КЕЙСА ─────────── */
            function renderCase() {
                const data = CASES[currentIndex];
                foundCorrect = 0;
                clickedCount = 0;

                situationTitle.textContent = 'Кейс №' + (currentIndex + 1) + '. ' + data.title;
                situationText.textContent = data.audience;
                questionText.textContent = 'Выберите две услуги из четырех — кликните по верным вариантам ответа.';
                caseImage.src = emojiSvg(data.emoji);
                caseImage.alt = 'Иллюстрация к кейсу №' + (currentIndex + 1);

                grid.innerHTML = '';
                data.options.forEach(function(option, index) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'answer-btn';
                    btn.dataset.index = String(index);
                    btn.setAttribute('aria-pressed', 'false');

                    const span = document.createElement('span');
                    span.className = 'text';
                    span.textContent = option.text;
                    btn.appendChild(span);

                    btn.addEventListener('click', function() {
                        handleOptionClick(btn, index);
                    });

                    grid.appendChild(btn);
                });

                nextBtn.hidden = true;
                updateCounter();

                modalOverlay.classList.remove('active');
                modalMessage.innerHTML = 'Кликните по варианту ответа, чтобы проверить себя.';

                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            /* ─────────── КЛИК ПО ВАРИАНТУ ─────────── */
            function handleOptionClick(btn, index) {
                if (btn.disabled) return;

                const option = CASES[currentIndex].options[index];
                if (!option) return;

                /* блокируем кнопку и красим */
                btn.disabled = true;
                btn.classList.add('disabled');
                btn.setAttribute('aria-pressed', 'true');

                if (option.correct) {
                    btn.classList.add('correct');
                    foundCorrect += 1;
                } else {
                    btn.classList.add('wrong');
                }
                clickedCount += 1;

                updateCounter();

                /* сразу показываем модальное окно с пояснением */
                showModal(option);

                /* показываем «Следующий кейс», когда найдены обе верные услуги
                   или когда пользователь кликнул по всем вариантам */
                if (foundCorrect >= REQUIRED_CORRECT || clickedCount >= CASES[currentIndex].options.length) {
                    if (currentIndex < CASES.length - 1) {
                        nextBtn.hidden = false;
                    }
                }
            }

            function showModal(option) {
                modalMessage.innerHTML =
                    '<span class="option-name">' + option.text + '</span>' +
                    option.message;
                modalOverlay.classList.add('active');
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
            }

            /* ─────────── ПЕРЕХОДЫ ─────────── */
            function goNext() {
                if (currentIndex < CASES.length - 1) {
                    currentIndex += 1;
                    renderCase();
                }
            }

            function goHome() {
                currentIndex = 0;
                renderCase();
            }

            /* ─────────── СОБЫТИЯ ─────────── */
            nextBtn.addEventListener('click', goNext);
            homeBtn.addEventListener('click', goHome);

            resetBtn.addEventListener('click', function() {
                renderCase();
            });

            modalCloseBtn.addEventListener('click', closeModal);

            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) {
                    closeModal();
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });

            /* ─────────── СТАРТ ─────────── */
            renderCase();

        })();
    </script>
</body>
</html>
