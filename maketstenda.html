<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Макет стенда — интерактив</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 24px 16px;
        }

        .interactive-card {
            max-width: 950px;
            width: 100%;
            background: rgba(255, 250, 240, 0.7);
            border-radius: 48px;
            padding: 20px 20px 28px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(2px);
        }

        .title-block {
            text-align: center;
            margin-bottom: 20px;
        }
        .title-block h1 {
            font-size: 2rem;
            margin: 0 0 8px;
            color: #1e3c2c;
            font-weight: 700;
        }

        /* ---------- Пул карточек (наверху) ---------- */
        .cards-pool {
            background: #fff6e8;
            border-radius: 32px;
            padding: 18px 20px;
            margin: 0 auto 25px;
            max-width: 700px;
            border: 2px dashed #bcb09b;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
        }
        .drag-hint {
            text-align: center;
            font-size: 0.9rem;
            color: #735e3a;
            margin-bottom: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            align-items: center;
            min-height: 100px;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 10px 16px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1f3b2c;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.15);
            cursor: grab;
            transition: 0.08s linear;
            border-left: 6px solid #8bc34a;
            line-height: 1.3;
            word-break: break-word;
        }
        .card:active {
            cursor: grabbing;
        }
        .card.dragging {
            opacity: 0.4;
            cursor: grabbing;
        }

        /* ---------- СТЕНД ---------- */
        .stand-board {
            display: grid;
            grid-template-columns: 2.5fr 4fr 3.5fr;
            grid-template-rows: 80px 260px 120px;
            gap: 2px;
            width: 100%;
            max-width: 700px;
            margin: 15px auto;
            background-color: #000000;
            border: 2px solid #000000;
            box-sizing: border-box;
            box-shadow: 0 12px 24px rgba(0,0,0,0.2);
        }

        .drop-zone {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            box-sizing: border-box;
            transition: all 0.15s ease;
            flex-direction: column;
            position: relative;
        }

        .drop-zone.drag-over {
            background-color: rgba(255, 240, 150, 0.8) !important;
            box-shadow: inset 0 0 0 3px #ffb347;
        }

        .zone-header {
            grid-column: span 3;
            background-color: #e2f0f9;
        }
        .zone-bonus {
            grid-column: 1;
            background-color: #fdede2;
        }
        .zone-anchor {
            grid-column: 2;
            background-color: #ecdfe9;
        }
        .zone-game {
            grid-column: 3;
            background-color: #daf2be;
        }
        .zone-books {
            grid-column: span 3;
            background-color: #aae2be;
        }

        .drop-zone .card {
            border-left: 6px solid #ffa559;
            background: white;
        }

        /* Кнопка проверки и плашка результата */
        .check-btn {
            display: block;
            margin: 24px auto 12px;
            background: #ff9800;
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 60px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.15s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .check-btn:hover {
            background: #e68900;
            transform: scale(1.02);
        }

        .result-message {
            text-align: center;
            margin: 10px auto 0;
            max-width: 520px;
            padding: 12px 18px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.2s;
            background: #ffffffdb;
            backdrop-filter: blur(8px);
            border: 1px solid #e0dbc8;
        }
        .success {
            background: #c8e6d9;
            color: #1f543b;
            border-left: 8px solid #2e7d32;
        }
        .error {
            background: #ffe1cf;
            color: #b13e3e;
            border-left: 8px solid #d9534f;
        }
        .neutral {
            background: #e9eef3;
            color: #3a5a6e;
            border-left: 8px solid #90a4ae;
        }

        .reset-btn {
            display: block;
            margin: 12px auto 0;
            background: #2c5f3e;
            border: none;
            color: white;
            font-weight: bold;
            padding: 8px 28px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.15s;
        }
        .reset-btn:hover {
            background: #1e462f;
        }

        @media (max-width: 560px) {
            .stand-board {
                grid-template-rows: 70px 220px 100px;
            }
            .card {
                font-size: 0.7rem;
                padding: 8px 12px;
            }
            .check-btn {
                font-size: 1rem;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
<div class="interactive-card">
    <div class="title-block">
        <h1>Заполните макет стенда</h1>
    </div>

    <!-- Пул карточек с пояснением -->
    <div class="cards-pool">
        <div class="drag-hint">✋ Перетащите карточки в соответствующие зоны стенда</div>
        <div class="cards-container" id="cardsContainer"></div>
    </div>

    <!-- Стенд -->
    <div class="stand-board" id="standBoard">
        <div class="drop-zone zone-header" data-zone="header"></div>
        <div class="drop-zone zone-bonus" data-zone="bonus"></div>
        <div class="drop-zone zone-anchor" data-zone="anchor"></div>
        <div class="drop-zone zone-game" data-zone="game"></div>
        <div class="drop-zone zone-books" data-zone="books"></div>
    </div>

    <!-- Кнопка проверки -->
    <button class="check-btn" id="checkBtn">Макет стенда готов</button>

    <!-- Плашка результата (изначально нейтральная) -->
    <div id="resultMessage" class="result-message neutral">
        Нажмите «Макет стенда готов» для проверки
    </div>
    <button class="reset-btn" id="resetBtn">Вернуть все карточки обратно</button>
</div>

<script>
    // Данные карточек (без эмодзи)
    const cardsData = [
        { id: "card_header", text: "Вывеска-заголовок", targetZone: "header" },
        { id: "card_bonus", text: "Раздаточный материал", targetZone: "bonus" },
        { id: "card_anchor", text: "Плакат", targetZone: "anchor" },
        { id: "card_game", text: "Интерактивное развлечение", targetZone: "game" },
        { id: "card_books", text: "Книги", targetZone: "books" }
    ];

    const cardsContainer = document.getElementById('cardsContainer');
    const resultDiv = document.getElementById('resultMessage');
    const resetBtn = document.getElementById('resetBtn');
    const checkBtn = document.getElementById('checkBtn');

    let draggedCardId = null;

    function createCardElement(cardInfo) {
        const div = document.createElement('div');
        div.className = 'card';
        div.setAttribute('data-id', cardInfo.id);
        div.setAttribute('data-target-zone', cardInfo.targetZone);
        div.setAttribute('draggable', 'true');
        div.textContent = cardInfo.text;
        div.addEventListener('dragstart', handleDragStart);
        div.addEventListener('dragend', handleDragEnd);
        return div;
    }

    function handleDragStart(e) {
        const card = e.target.closest('.card');
        if (!card) {
            e.preventDefault();
            return false;
        }
        draggedCardId = card.getAttribute('data-id');
        e.dataTransfer.setData('text/plain', draggedCardId);
        e.dataTransfer.effectAllowed = 'move';
        card.classList.add('dragging');
        const dragIcon = document.createElement('div');
        dragIcon.textContent = card.textContent.substring(0, 20);
        dragIcon.style.position = 'absolute';
        dragIcon.style.top = '-1000px';
        document.body.appendChild(dragIcon);
        e.dataTransfer.setDragImage(dragIcon, 10, 10);
        setTimeout(() => document.body.removeChild(dragIcon), 0);
    }

    function handleDragEnd(e) {
        const card = e.target.closest('.card');
        if (card) card.classList.remove('dragging');
        draggedCardId = null;
        document.querySelectorAll('.drop-zone').forEach(zone => zone.classList.remove('drag-over'));
    }

    function getCardById(id) {
        return document.querySelector(`.card[data-id="${id}"]`);
    }

    function moveCard(cardId, targetZoneElement) {
        const cardElem = getCardById(cardId);
        if (!cardElem) return false;

        if (targetZoneElement && targetZoneElement.classList && targetZoneElement.classList.contains('drop-zone')) {
            const existingCard = targetZoneElement.querySelector('.card');
            if (existingCard && existingCard !== cardElem) {
                const poolContainer = document.getElementById('cardsContainer');
                if (poolContainer) poolContainer.appendChild(existingCard);
            }
            targetZoneElement.appendChild(cardElem);
            return true;
        } else {
            const pool = document.getElementById('cardsContainer');
            if (pool) {
                pool.appendChild(cardElem);
                return true;
            }
        }
        return false;
    }

    // Проверка правильности заполнения (без вызова автоматически)
    function isLayoutPerfect() {
        const zones = document.querySelectorAll('.drop-zone');
        let correctCount = 0;
        let totalFilled = 0;

        for (let zone of zones) {
            const zoneType = zone.getAttribute('data-zone');
            const cardInside = zone.querySelector('.card');
            if (!cardInside) continue;
            totalFilled++;
            const cardTarget = cardInside.getAttribute('data-target-zone');
            if (cardTarget === zoneType) correctCount++;
        }
        const allCardsPlaced = (document.querySelectorAll('#cardsContainer .card').length === 0);
        return (totalFilled === 5 && correctCount === 5 && allCardsPlaced);
    }

    // Функция обновления результата по нажатию кнопки
    function onCheck() {
        const perfect = isLayoutPerfect();
        if (perfect) {
            resultDiv.innerHTML = 'Ура! Вы отлично справились с заданием!';
            resultDiv.className = 'result-message success';
        } else {
            resultDiv.innerHTML = 'Кажется, в макете есть недоработки. Проверьте еще раз.';
            resultDiv.className = 'result-message error';
        }
    }

    // Drag & Drop без автоматической проверки
    function onDropToTarget(event, targetElement, isPool = false) {
        event.preventDefault();
        document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drag-over'));

        let cardId = draggedCardId;
        if (!cardId) {
            const data = event.dataTransfer.getData('text/plain');
            if (data) cardId = data;
            else return;
        }

        const cardElem = getCardById(cardId);
        if (!cardElem) return;

        if (isPool || targetElement.id === 'cardsContainer' || targetElement.classList?.contains('cards-container')) {
            const pool = document.getElementById('cardsContainer');
            if (pool && cardElem.parentElement !== pool) {
                pool.appendChild(cardElem);
            }
            return;
        }

        const dropZone = targetElement.closest('.drop-zone');
        if (!dropZone) return;
        if (cardElem.parentElement === dropZone) return;

        moveCard(cardId, dropZone);
        // При перемещении карточек результат не обновляем, ждём кнопку
        // только убираем сообщение, если оно было об ошибке — возвращаем нейтральное
        if (resultDiv.classList.contains('error') || resultDiv.classList.contains('success')) {
            resultDiv.innerHTML = 'Нажмите «Макет стенда готов» для проверки';
            resultDiv.className = 'result-message neutral';
        }
    }

    function setupDragAndDrop() {
        const dropZones = document.querySelectorAll('.drop-zone');
        dropZones.forEach(zone => {
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                zone.classList.add('drag-over');
            });
            zone.addEventListener('dragleave', () => {
                zone.classList.remove('drag-over');
            });
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('drag-over');
                onDropToTarget(e, zone, false);
            });
        });

        const poolContainer = document.getElementById('cardsContainer');
        if (poolContainer) {
            poolContainer.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                poolContainer.style.background = '#fff2e0';
            });
            poolContainer.addEventListener('dragleave', () => {
                poolContainer.style.background = '';
            });
            poolContainer.addEventListener('drop', (e) => {
                e.preventDefault();
                poolContainer.style.background = '';
                onDropToTarget(e, poolContainer, true);
            });
        }
    }

    function resetGame() {
        const allZones = document.querySelectorAll('.drop-zone');
        allZones.forEach(zone => {
            const cards = zone.querySelectorAll('.card');
            cards.forEach(card => card.remove());
        });
        if (cardsContainer) cardsContainer.innerHTML = '';
        cardsData.forEach(data => {
            const card = createCardElement(data);
            cardsContainer.appendChild(card);
        });
        // Сбрасываем сообщение в нейтральное
        resultDiv.innerHTML = 'Нажмите «Макет стенда готов» для проверки';
        resultDiv.className = 'result-message neutral';
        document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drag-over'));
    }

    window.addEventListener('dragstart', (e) => {
        if (!e.target.closest('.card')) {
            e.preventDefault();
            return false;
        }
    });

    resetGame();
    setupDragAndDrop();
    resetBtn.addEventListener('click', resetGame);
    checkBtn.addEventListener('click', onCheck);
</script>
</body>
</html>
