<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Суперигра «Поле финансовых рисков» — Урок 2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: #f4f6fb; color: #1a2456; min-height: 100vh;
    padding: 40px 20px; display: flex; justify-content: center; align-items: flex-start;
  }
  .container { max-width: 960px; width: 100%; }
  .game-title { text-align: center; margin-bottom: 28px; }
  .game-title .label {
    font-family: sans-serif; font-size: 1em; letter-spacing: 6px;
    text-transform: uppercase; color: #c89400; font-weight: bold; margin-bottom: 6px;
  }
  .game-title h1 {
    font-size: 2.4em; letter-spacing: 4px; color: #1a2456;
    font-weight: normal; text-transform: uppercase; line-height: 1.2;
  }
  .motto-block {
    background: #ffffff; border: 2px solid #e2e7f0; border-radius: 14px;
    padding: 22px 26px; box-shadow: 0 8px 30px rgba(26, 36, 86, 0.08); margin-bottom: 24px;
  }
  .motto-block .label {
    font-family: sans-serif; font-size: 0.78em; letter-spacing: 2.5px;
    text-transform: uppercase; color: #c89400; font-weight: bold; margin-bottom: 14px;
  }
  .motto-display { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; min-height: 44px; }
  .letter {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 32px; font-size: 1.3em; font-weight: bold;
    border-radius: 4px; transition: all 0.4s ease; padding: 0 2px;
  }
  .letter.space { width: 12px; min-width: 12px; }
  .letter.dash { min-width: 28px; }
  .letter.shown { color: #1a2456; }
  .letter.revealed { color: #c89400; background: #fff8e0; animation: pop 0.5s ease; }
  .letter.hidden { background: #eef1f8; border: 1px solid #d4dbe8; color: transparent; }
  @keyframes pop {
    0% { transform: scale(0.6); opacity: 0; }
    50% { transform: scale(1.35); }
    100% { transform: scale(1); opacity: 1; }
  }
  .play-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 24px; margin-bottom: 30px; min-height: 260px;
  }
  .drum-col {
    flex: 0 0 auto; width: 240px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; min-height: 260px;
  }
  .drum-wrapper { position: relative; width: 200px; height: 200px; margin-bottom: 18px; flex-shrink: 0; }
  .drum-pointer {
    position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 14px solid transparent;
    border-right: 14px solid transparent; border-top: 22px solid #c89400; z-index: 3;
  }
  .drum {
    width: 100%; height: 100%; border-radius: 50%;
    background: conic-gradient(
      #3a4a8e 0deg 45deg, #6a4bb8 45deg 90deg, #3a4a8e 90deg 135deg,
      #6a4bb8 135deg 180deg, #3a4a8e 180deg 225deg, #6a4bb8 225deg 270deg,
      #3a4a8e 270deg 315deg, #6a4bb8 315deg 360deg
    );
    border: 4px solid #c89400; box-shadow: 0 8px 30px rgba(26, 36, 86, 0.25);
    position: relative; display: flex; align-items: center; justify-content: center;
  }
  .drum::after {
    content: '1 2 3'; position: absolute; width: 60px; height: 60px;
    background: #ffffff; border: 3px solid #c89400; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #1a2456; font-size: 0.85em; letter-spacing: 3px; font-weight: bold;
    box-shadow: 0 0 20px rgba(200, 148, 0, 0.4);
  }
  .spin-btn {
    font-family: inherit; font-size: 0.95em; padding: 12px 28px;
    background: linear-gradient(135deg, #ffd84d, #c89400); color: #1a2456;
    border: none; border-radius: 30px; font-weight: bold; letter-spacing: 1px;
    cursor: pointer; box-shadow: 0 6px 20px rgba(200, 148, 0, 0.35);
    transition: all 0.3s; text-transform: uppercase; white-space: nowrap;
  }
  .spin-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(200, 148, 0, 0.5); }
  .spin-btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
  .host-col {
    flex: 0 0 auto; width: 240px; height: 260px; border-radius: 14px;
    overflow: hidden; background: #f0f2f8; border: 2px solid #e2e7f0;
    box-shadow: 0 8px 30px rgba(26, 36, 86, 0.08);
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .host-col img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
  .host-col .placeholder {
    font-family: sans-serif; font-size: 0.72em; color: #94a3c4;
    text-align: center; padding: 12px; line-height: 1.5;
  }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10, 15, 46, 0.55);
    backdrop-filter: blur(4px); display: none; align-items: center;
    justify-content: center; padding: 20px; z-index: 100; animation: fadeIn 0.25s ease;
  }
  .modal-overlay.active { display: flex; }
  .modal-overlay.feedback-overlay { z-index: 200; background: rgba(10, 15, 46, 0.7); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: #ffffff; border-radius: 16px; width: 100%; max-width: 640px;
    max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(10, 15, 46, 0.4);
    animation: slideUp 0.35s cubic-bezier(0.2, 0.8, 0.3, 1); position: relative;
  }
  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-close {
    position: absolute; top: 14px; right: 18px; width: 32px; height: 32px;
    background: #f0f2f8; border: none; border-radius: 50%; cursor: pointer;
    font-size: 1.2em; color: #6b7794; display: flex; align-items: center;
    justify-content: center; transition: all 0.2s; font-family: sans-serif; line-height: 1;
  }
  .modal-close:hover { background: #e2e7f0; color: #1a2456; }
  .modal-inner { padding: 32px; }
  .modal-counter {
    color: #c89400; font-size: 0.85em; letter-spacing: 3px;
    text-transform: uppercase; margin-bottom: 12px;
    font-family: sans-serif; font-weight: bold;
  }
  .modal-situation { color: #3a4460; font-size: 1.05em; line-height: 1.65; margin-bottom: 24px; }
  .answers { display: flex; flex-direction: column; gap: 12px; }
  .answer-btn {
    font-family: inherit; text-align: left; padding: 16px 20px;
    background: #f8f9fc; color: #1a2456; border: 2px solid #e2e7f0;
    border-radius: 8px; cursor: pointer; font-size: 1em; line-height: 1.45;
    transition: all 0.2s;
  }
  .answer-btn:hover:not(:disabled) {
    background: #fff8e0; border-color: #c89400; transform: translateX(4px);
  }
  .answer-btn:disabled { cursor: default; }
  .answer-btn.correct { background: #e8f8ee; border-color: #2ea860; color: #1a5c33; box-shadow: 0 0 15px rgba(46, 168, 96, 0.2); }
  .answer-btn.wrong { background: #fdeaea; border-color: #d94a4a; color: #8a1f1f; }
  .feedback-modal { max-width: 480px; }
  .feedback-content { padding: 36px 32px 28px; text-align: left; }
  .feedback-icon {
    width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8em; font-weight: bold; margin-bottom: 20px; font-family: sans-serif;
  }
  .feedback-icon.correct { background: #e8f8ee; color: #2ea860; }
  .feedback-icon.wrong { background: #fdeaea; color: #d94a4a; }
  .feedback-content h3 { font-size: 1.4em; font-weight: normal; margin-bottom: 16px; }
  .feedback-content h3.correct { color: #2ea860; }
  .feedback-content h3.wrong { color: #d94a4a; }
  .feedback-text { color: #3a4460; font-size: 1.05em; line-height: 1.65; }
  .modal-btn {
    font-family: inherit; padding: 12px 26px;
    background: linear-gradient(135deg, #ffd84d, #c89400); color: #1a2456;
    border: none; border-radius: 25px; font-weight: bold; cursor: pointer;
    font-size: 0.95em; letter-spacing: 0.5px; transition: all 0.2s;
  }
  .modal-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(200, 148, 0, 0.4); }
  .modal-actions { margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end; }
  .final-section {
    text-align: center; padding: 44px 32px; background: #ffffff;
    border: 3px solid #c89400; border-radius: 14px;
    animation: fadeIn 0.6s ease; box-shadow: 0 8px 40px rgba(200, 148, 0, 0.2);
    display: none;
  }
  .final-section.active { display: block; }
  .final-section h2 {
    color: #1a2456; font-size: 2em; margin-bottom: 20px;
    font-weight: normal; letter-spacing: 3px;
  }
  .final-section > p { color: #6b7794; font-size: 1.05em; }
  .final-motto {
    font-size: 1.5em; color: #1a2456; font-weight: bold; padding: 24px;
    background: #fff8e0; border-radius: 8px; margin: 24px 0 0;
    letter-spacing: 1.5px; line-height: 1.5; border: 2px dashed #c89400;
  }
  .final-restart-btn {
    font-family: inherit; margin-top: 28px; padding: 14px 34px;
    background: linear-gradient(135deg, #ffd84d, #c89400); color: #1a2456;
    border: none; border-radius: 30px; font-weight: bold; cursor: pointer;
    font-size: 1em; letter-spacing: 1px; text-transform: uppercase;
    transition: all 0.25s; box-shadow: 0 6px 20px rgba(200, 148, 0, 0.35);
  }
  .final-restart-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(200, 148, 0, 0.5); }
  @media (max-width: 640px) {
    .play-row { flex-direction: column; min-height: auto; }
    .drum-col, .host-col { width: 100%; max-width: 280px; }
    .host-col { height: 280px; }
    .game-title h1 { font-size: 1.7em; letter-spacing: 2px; }
    .modal-inner { padding: 24px 20px; }
    .feedback-content { padding: 28px 22px 22px; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="game-title">
    <div class="label">Суперигра</div>
    <h1>Поле финансовых рисков</h1>
  </div>

  <div class="motto-block">
    <div class="label">Девиз урока</div>
    <div class="motto-display" id="mottoDisplay"></div>
  </div>

  <div class="play-row" id="playRow">
    <div class="drum-col">
      <div class="drum-wrapper">
        <div class="drum-pointer"></div>
        <div class="drum" id="drum"></div>
      </div>
      <button class="spin-btn" id="spinBtn">Вращать барабан</button>
    </div>

    <div class="host-col">
      <img src="https://www.cultmanager.ru/images/Vibecoding/image---2026-10-07t185240.760.jpeg" 
           alt="Ведущий"
           onerror="this.style.display='none'; this.parentNode.innerHTML='<div class=&quot;placeholder&quot;>Портрет ведущего</div>';">
    </div>
  </div>

  <div class="final-section" id="finalSection">
    <h2>СУПЕРИГРА ПРОЙДЕНА!</h2>
    <p>Вы собрали девиз урока:</p>
    <div class="final-motto">ЧЕГО НЕТ В УСТАВЕ — ТОГО НЕТ В ПРАЙСЕ</div>
    <button class="final-restart-btn" id="finalRestartBtn">Начать суперигру заново</button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">×</button>
    <div class="modal-inner" id="modalInner"></div>
  </div>
</div>

<div class="modal-overlay feedback-overlay" id="feedbackOverlay">
  <div class="modal feedback-modal">
    <button class="modal-close" id="feedbackClose">×</button>
    <div class="feedback-content" id="feedbackContent"></div>
  </div>
</div>

<script>
const phrase = [
  {ch:'Ч', group:0}, {ch:'Е', group:0}, {ch:'Г', group:0}, {ch:'О', group:0},
  {ch:' ', group:0},
  {ch:'Н', group:0}, {ch:'Е', group:0}, {ch:'Т', group:0},
  {ch:' ', group:0},
  {ch:'В', group:0},
  {ch:' ', group:0},
  {ch:'У', group:1}, {ch:'С', group:1}, {ch:'Т', group:1}, {ch:'А', group:1},
  {ch:'В', group:2}, {ch:'Е', group:2},
  {ch:' ', group:0}, {ch:'—', group:0}, {ch:' ', group:0},
  {ch:'Т', group:0}, {ch:'О', group:0}, {ch:'Г', group:0}, {ch:'О', group:0},
  {ch:' ', group:0},
  {ch:'Н', group:0}, {ch:'Е', group:0}, {ch:'Т', group:0},
  {ch:' ', group:0},
  {ch:'В', group:0},
  {ch:' ', group:0},
  {ch:'П', group:2}, {ch:'Р', group:2},
  {ch:'А', group:3}, {ch:'Й', group:3}, {ch:'С', group:3}, {ch:'Е', group:3}
];

const cases = [
  {
    situation: 'Директор музея хочет открыть платную школу живописи для детей. Занятия будут вести приглашённые художники в свободных залах. В уставе музея указано «хранение, изучение и публичный показ музейных предметов, организация выставок». Образовательных услуг в уставе нет.',
    answers: [
      {
        text: 'Открыть школу — свободные залы всё равно простаивают.',
        correct: false,
        feedback: 'Услуга, которой нет в уставе, не может быть включена в платный перечень. Это нарушение статьи 9.2 Федерального закона № 7-ФЗ. Проверяющие расценят доход от такой услуги как незаконный, а учреждению грозит предписание. Свободные залы — не основание для новой деятельности.'
      },
      {
        text: 'Внести изменения в устав, закрепив образовательную деятельность, и только потом включить услугу в перечень.',
        correct: true,
        feedback: 'Верно. Право на приносящую доход деятельность должно быть закреплено в уставе. Только после внесения изменений можно включать услугу в перечень и устанавливать цену. Это единственный законный путь.'
      },
      {
        text: 'Открыть школу под названием «просветительские встречи с художниками».',
        correct: false,
        feedback: 'Переименование не меняет сути услуги. Если фактически это систематические занятия живописью, проверяющие увидят подмену. Такая схема не защищает от предписаний, а усугубляет ситуацию — это уже попытка обмана.'
      }
    ]
  },
  {
    situation: 'Посетители часто просят разрешить профессиональные фотосессии в экспозиционных залах музея. В уставе музея есть «организация досуга и просветительская деятельность», а также формулировка «иные виды деятельности, не запрещённые законом». Можно ли ввести платную услугу?',
    answers: [
      {
        text: 'Проверить, служит ли услуга уставным целям, зафиксировать в перечне и убедиться, что она не дублирует бесплатные услуги из госзадания.',
        correct: true,
        feedback: 'Верно. Даже при наличии права в уставе нужно проверить соответствие целям и отсутствие дублирования с госзаданием. Иногда требуется согласование с учредителем. Тогда услуга законна и безопасна.'
      },
      {
        text: 'Ввести сразу — устав позволяет иные виды деятельности.',
        correct: false,
        feedback: 'Формулировка «иные виды деятельности» — не карт-бланш на любые услуги. Услуга должна служить достижению уставных целей и не дублировать бесплатные услуги. Прежде чем включать её в перечень, нужно проверить это и зафиксировать в документах.'
      },
      {
        text: 'Разрешить фотосессии бесплатно, чтобы не менять документы.',
        correct: false,
        feedback: 'Бесплатная услуга вне госзадания — это тоже риск. Учреждение тратит ресурсы (электричество, износ залов, время сотрудников), не получая дохода. Это может быть расценено как неэффективное использование имущества и повод для претензий учредителя.'
      }
    ]
  },
  {
    situation: 'Музей продаёт абонемент на 10 посещений выставки за 1500 рублей. Выставка профинансирована из субсидии на госзадание и по условиям должна быть бесплатной. В уставе музея услуга «продажа абонементов» не указана.',
    answers: [
      {
        text: 'Продавать абонемент — это дополнительная услуга, она не отменяет бесплатный вход.',
        correct: false,
        feedback: 'Абонемент на бесплатную выставку — это платная услуга, дублирующая бесплатную. Плюс её нет в уставе. Здесь два нарушения сразу: и по госзаданию, и по уставу. Проверяющие расценят это как незаконный доход.'
      },
      {
        text: 'Переименовать абонемент в «пожертвование за расширенный доступ».',
        correct: false,
        feedback: 'Переименование не меняет сути. Если посетитель платит за доступ, это платная услуга, и она должна быть в уставе. Плюс выставка бесплатная по госзаданию — значит, любая плата за неё незаконна. Схема с переименованием только усилит претензии.'
      },
      {
        text: 'Отменить абонемент: услуги нет в уставе, а выставка должна быть бесплатной по госзаданию.',
        correct: true,
        feedback: 'Верно. Платные услуги не должны дублировать бесплатные из госзадания, а любой платный перечень начинается с устава. Здесь нарушены оба правила сразу. Абонемент нужно отменить или полностью пересмотреть условия выставки.'
      }
    ]
  }
];

let currentCase = 0;
let nextCaseIndex = 0;
let revealedGroups = new Set();

const overlay = document.getElementById('modalOverlay');
const modalInner = document.getElementById('modalInner');
const modalClose = document.getElementById('modalClose');
const feedbackOverlay = document.getElementById('feedbackOverlay');
const feedbackContent = document.getElementById('feedbackContent');
const feedbackClose = document.getElementById('feedbackClose');
const spinBtn = document.getElementById('spinBtn');

function renderMotto() {
  const container = document.getElementById('mottoDisplay');
  container.innerHTML = '';
  phrase.forEach(item => {
    const span = document.createElement('span');
    span.className = 'letter';
    if (item.ch === ' ') {
      span.classList.add('space');
      span.textContent = ' ';
    } else if (item.ch === '—') {
      span.classList.add('dash');
      span.textContent = '—';
      if (item.group === 0) span.classList.add('shown');
    } else if (item.group === 0) {
      span.classList.add('shown');
      span.textContent = item.ch;
    } else if (revealedGroups.has(item.group)) {
      span.classList.add('revealed');
      span.textContent = item.ch;
    } else {
      span.classList.add('hidden');
      span.textContent = item.ch;
    }
    container.appendChild(span);
  });
}

function revealGroup(group) { revealedGroups.add(group); renderMotto(); }
function openModal(html) { modalInner.innerHTML = html; overlay.classList.add('active'); }
function closeModal() { overlay.classList.remove('active'); }

function showCaseModal(index) {
  currentCase = index;
  const c = cases[index];
  let html = '<div class="modal-counter">Кейс ' + (index + 1) + ' из ' + cases.length + '</div>';
  html += '<p class="modal-situation">' + c.situation + '</p>';
  html += '<div class="answers">';
  c.answers.forEach((a, i) => {
    html += '<button class="answer-btn" data-idx="' + i + '">' + a.text + '</button>';
  });
  html += '</div>';
  openModal(html);
  modalInner.querySelectorAll('.answer-btn').forEach(btn => {
    btn.onclick = () => handleAnswer(parseInt(btn.dataset.idx));
  });
}

function openFeedback(isCorrect, text) {
  let html = '<div class="feedback-icon ' + (isCorrect ? 'correct' : 'wrong') + '">' + (isCorrect ? '✓' : '✕') + '</div>';
  html += '<h3 class="' + (isCorrect ? 'correct' : 'wrong') + '">' + (isCorrect ? 'Верно!' : 'Ошибка') + '</h3>';
  html += '<p class="feedback-text">' + text + '</p>';
  feedbackContent.innerHTML = html;
  feedbackOverlay.classList.add('active');
}

function closeFeedback() { feedbackOverlay.classList.remove('active'); }

function handleAnswer(answerIdx) {
  const c = cases[currentCase];
  const answer = c.answers[answerIdx];
  const allBtns = modalInner.querySelectorAll('.answer-btn');
  allBtns.forEach(b => b.disabled = true);
  allBtns.forEach((b, i) => {
    if (c.answers[i].correct) b.classList.add('correct');
    else if (i === answerIdx) b.classList.add('wrong');
  });
  openFeedback(answer.correct, answer.feedback);

  if (answer.correct) {
    revealGroup(currentCase + 1);
    nextCaseIndex = currentCase + 1;
  }

  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  const actionBtn = document.createElement('button');
  actionBtn.className = 'modal-btn';

  if (answer.correct) {
    if (currentCase < cases.length - 1) {
      actionBtn.textContent = 'Следующий кейс →';
      actionBtn.onclick = () => {
        closeModal();
        closeFeedback();
        spinBtn.disabled = false;
      };
    } else {
      actionBtn.textContent = 'Завершить суперигру';
      actionBtn.onclick = () => {
        closeModal();
        closeFeedback();
        document.getElementById('playRow').style.display = 'none';
        document.getElementById('finalSection').classList.add('active');
      };
    }
  } else {
    actionBtn.textContent = 'Попробовать снова';
    actionBtn.onclick = () => {
      closeModal();
      closeFeedback();
      setTimeout(() => { showCaseModal(currentCase); }, 300);
    };
  }
  actions.appendChild(actionBtn);
  modalInner.appendChild(actions);
}

function resetGame() {
  currentCase = 0;
  nextCaseIndex = 0;
  revealedGroups = new Set();
  renderMotto();
  document.getElementById('playRow').style.display = 'flex';
  document.getElementById('finalSection').classList.remove('active');
  spinBtn.disabled = false;
  const drum = document.getElementById('drum');
  drum.style.transition = 'none';
  drum.style.transform = 'rotate(0deg)';
}

feedbackClose.onclick = () => { closeFeedback(); };
feedbackOverlay.onclick = (e) => { if (e.target === feedbackOverlay) closeFeedback(); };

modalClose.onclick = () => {
  closeModal();
  closeFeedback();
  spinBtn.disabled = false;
};

overlay.onclick = (e) => {
  if (e.target === overlay) {
    closeModal();
    closeFeedback();
    spinBtn.disabled = false;
  }
};

spinBtn.onclick = function() {
  const drum = document.getElementById('drum');
  spinBtn.disabled = true;
  const turns = 3 + Math.random() * 2;
  const degrees = turns * 360;
  drum.style.transition = 'transform 2.5s cubic-bezier(0.2, 0.8, 0.3, 1)';
  drum.style.transform = 'rotate(' + degrees + 'deg)';
  setTimeout(() => {
    drum.style.transition = 'none';
    drum.style.transform = 'rotate(0deg)';
    showCaseModal(nextCaseIndex);
  }, 2600);
};

document.getElementById('finalRestartBtn').onclick = () => {
  resetGame();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

renderMotto();
</script>
</body>
</html>
