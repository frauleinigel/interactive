<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Собери урожай решений</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f5f0eb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: #ffffff;
            border-radius: 40px;
            padding: 32px 30px 40px;
            border: 2px solid #5a3e2b;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #5a3e2b;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sub {
            font-size: 16px;
            color: #5a3e2b;
            margin-bottom: 28px;
            padding: 10px 16px;
            border-left: 4px solid #c41e3a;
            background: transparent;
            border-radius: 12px;
        }

        .game-area {
            display: flex;
            flex-direction: row;
            gap: 0;
            flex-wrap: wrap;
            align-items: stretch;
            position: relative;
        }

        .cards-area {
            flex: 2;
            min-width: 320px;
            position: relative;
            min-height: 680px;
            background-image: url('https://www.cultmanager.ru/images/Vibecoding/image---2026-08-05t154618.169.jpeg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center bottom;
            border-radius: 20px;
            background-color: #d4e8c8;
            z-index: 1;
        }

        .cards-grid {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 24px;
            padding: 2% 10% 25% 10%;
            height: 100%;
            min-height: 680px;
        }

        .row-container {
            display: flex;
            justify-content: center;
            gap: 36px;
            width: 100%;
            flex-wrap: wrap;
        }

        .row-container:nth-child(1) {
            gap: 42px;
        }
        .row-container:nth-child(2) {
            gap: 38px;
        }
        .row-container:nth-child(3) {
            gap: 48px;
        }

        /* ——— ЯБЛОКИ ——— */
        .card-item {
            width: 112px;
            height: 112px;
            background: #e83030;
            border: 3px solid #b01a1a;
            border-radius: 50%;
            padding: 10px 8px;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            cursor: grab;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                box-shadow 0.2s ease,
                background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 4px 0 #8a1414, inset 0 -4px 0 rgba(0, 0, 0, 0.1), inset 0 4px 10px rgba(255, 200, 100, 0.3);
            user-select: none;
            word-break: normal;
            overflow-wrap: normal;
            hyphens: none;
            position: relative;
            line-height: 1.3;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
        }

        .card-item::before {
            content: '';
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 18px;
            background: #5a7a3a;
            border-radius: 3px;
            z-index: 2;
        }
        .card-item::after {
            content: '';
            position: absolute;
            top: -16px;
            left: calc(50% + 6px);
            transform: rotate(30deg);
            width: 14px;
            height: 12px;
            background: #7ba34a;
            border-radius: 0 80% 0 80%;
            z-index: 1;
            border: 1px solid #5a7a3a;
        }

        /* ——— ТЕКСТ ВНУТРИ ЯБЛОКА (УМЕНЬШЕН) ——— */
        .card-item .text {
            font-size: 8px;
            font-weight: 700;
            line-height: 1.25;
            padding: 0 2px;
            max-width: 95%;
            display: block;
            word-break: normal;
            overflow-wrap: normal;
            hyphens: none;
            white-space: normal;
        }

        /* ——— ОБЫЧНЫЙ ХОВЕР (для активных яблок) ——— */
        .card-item:hover:not(.placed):not(.locked) {
            transform: translateY(-20px) scale(2.2);
            box-shadow: 0 20px 35px rgba(138, 20, 20, 0.5),
                inset 0 -4px 0 rgba(0, 0, 0, 0.15),
                0 0 25px rgba(255, 80, 80, 0.7);
            background: #ff3333;
            z-index: 50;
        }

        .card-item:active:not(.placed):not(.locked) {
            cursor: grabbing;
            transform: scale(0.92);
        }

        .card-item.placed {
            opacity: 0.15;
            cursor: default;
            pointer-events: none;
            transform: scale(0.8);
            filter: grayscale(0.9);
            box-shadow: 0 2px 0 #8a1414;
        }

        /* ——— ПОЧЕРНЕВШИЕ НЕВЕРНЫЕ (теперь реагируют на ховер) ——— */
        .card-item.locked {
            opacity: 1;
            cursor: not-allowed;
            pointer-events: auto;          /* разрешаем наведение */
            transform: scale(0.95);
            background: #2a2523;
            border-color: #121010;
            box-shadow: 0 4px 0 #121010, inset 0 -4px 0 rgba(0, 0, 0, 0.5);
            transition: all 0.5s ease;
        }
        .card-item.locked::before {
            background: #4a403a;
        }
        .card-item.locked::after {
            background: #3a4230;
            border-color: #2a3020;
        }
        .card-item.locked .text {
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        }

        /* ——— ХОВЕР ДЛЯ ПОЧЕРНЕВШИХ (увеличение без подъёма) ——— */
        .card-item.locked:hover {
            transform: scale(2.2);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(255, 255, 255, 0.1);
            z-index: 50;
            background: #2a2523;          /* цвет не меняем */
        }

        /* ——— КОРЗИНА ——— */
        .basket-area {
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            align-self: flex-end;
            margin-left: -180px;
            margin-bottom: 20px;
            z-index: 10;
        }

        .basket {
            width: 100%;
            min-height: 300px;
            border: 6px solid #8b6b4a;
            border-radius: 20px 20px 40px 40px;
            padding: 12px 14px;
            background: #f5ede4;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25), inset 0 -10px 20px rgba(0, 0, 0, 0.05);
            background-image:
                repeating-linear-gradient(45deg, rgba(139, 107, 74, 0.08) 0px, rgba(139, 107, 74, 0.08) 2px, transparent 2px, transparent 6px),
                repeating-linear-gradient(-45deg, rgba(139, 107, 74, 0.08) 0px, rgba(139, 107, 74, 0.08) 2px, transparent 2px, transparent 6px);
        }

        .basket.drag-over {
            background-color: rgba(240, 230, 216, 0.7);
            background-blend-mode: overlay;
            border-color: #6b4a2a;
            box-shadow: 0 0 0 4px rgba(196, 30, 58, 0.15);
        }

        .basket-icon {
            display: block;
            width: 150px;
            height: 130px;
            background-image: url('https://www.cultmanager.ru/images/Vibecoding/image---2026-08-05t154034.751.jpeg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            flex-shrink: 0;
            margin-bottom: 2px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.15));
        }

        .basket-label {
            font-weight: 700;
            font-size: 14px;
            color: #5a3e2b;
            border-top: 3px solid #8b6b4a;
            padding-top: 6px;
            width: 100%;
            text-align: center;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 0 0 10px 10px;
            margin-top: auto;
            flex-shrink: 0;
        }

        .basket-items {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
            background: transparent;
            padding: 4px 2px;
        }

        .basket-item {
            background: rgba(252, 234, 234, 0.95);
            border: 2px solid #c41e3a;
            border-radius: 20px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            color: #5a3e2b;
            text-align: center;
            box-shadow: 0 2px 0 #c41e3a;
            animation: popIn 0.3s ease;
            word-break: break-word;
            position: relative;
            line-height: 1.35;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.7);
                opacity: 0.4;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .basket-empty {
            color: #5a3e2b;
            font-size: 13px;
            font-weight: 600;
            padding: 12px 8px;
            text-align: center;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            margin: auto 0;
        }

        /* ——— МОДАЛКА ЗАВЕРШЕНИЯ ——— */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(90, 62, 43, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #ffffff;
            border: 4px solid #c41e3a;
            border-radius: 40px;
            padding: 40px 48px;
            max-width: 560px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            animation: toastIn 0.4s ease;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
            color: #5a3e2b;
            background: none;
            border: none;
            padding: 4px 10px;
            border-radius: 30px;
            transition: background 0.15s;
            font-weight: 300;
        }

        .modal-close:hover {
            background: #f5ede4;
        }

        @keyframes toastIn {
            0% {
                transform: scale(0.85) translateY(20px);
                opacity: 0;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .modal-icon {
            font-size: 52px;
            display: block;
            margin-bottom: 10px;
        }

        .modal-text {
            font-size: 22px;
            font-weight: 700;
            color: #5a3e2b;
            line-height: 1.4;
        }

        .modal-sub {
            font-size: 15px;
            font-weight: 400;
            color: #5a3e2b;
            margin-top: 8px;
            opacity: 0.7;
        }

        .btn-reset {
            background: #ffffff;
            color: #5a3e2b;
            border: 2px solid #5a3e2b;
            padding: 10px 28px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            margin-top: 16px;
        }

        .btn-reset:hover {
            background: #f5ede4;
        }

        /* ——— ТОСТЫ ——— */
        .toast-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(90, 62, 43, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            backdrop-filter: blur(4px);
            padding: 20px;
        }

        .toast-overlay.active {
            display: flex;
        }

        .toast-box {
            background: #ffffff;
            border: 4px solid #5a3e2b;
            border-radius: 40px;
            padding: 32px 40px;
            max-width: 560px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
            animation: toastIn 0.3s ease;
            position: relative;
        }

        .toast-close {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 26px;
            line-height: 1;
            cursor: pointer;
            color: #5a3e2b;
            background: none;
            border: none;
            padding: 4px 8px;
            border-radius: 30px;
            transition: background 0.15s;
            font-weight: 300;
        }

        .toast-close:hover {
            background: #f5ede4;
        }

        .toast-box .toast-emoji {
            font-size: 44px;
            display: block;
            margin-bottom: 6px;
        }

        .toast-box .toast-text {
            font-size: 20px;
            font-weight: 700;
            color: #5a3e2b;
            line-height: 1.4;
        }

        .toast-box .toast-sub {
            font-size: 15px;
            font-weight: 400;
            color: #5a3e2b;
            margin-top: 6px;
            opacity: 0.8;
        }

        /* ——— АДАПТИВ ——— */
        @media (max-width: 768px) {
            .game-area {
                flex-direction: column;
                align-items: center;
            }
            .cards-area {
                width: 100%;
                min-height: 520px;
                background-size: cover;
            }
            .basket-area {
                margin-left: 0;
                margin-top: -120px;
                width: 90%;
                max-width: 380px;
                align-self: center;
            }
            .basket {
                min-height: 240px;
            }
            .toast-box {
                padding: 24px 18px;
            }
            .toast-box .toast-text {
                font-size: 17px;
            }
            .cards-grid {
                padding: 2% 6% 25% 6%;
                min-height: 500px;
                gap: 20px;
            }
            .row-container {
                gap: 20px;
            }
            .row-container:nth-child(1) {
                gap: 24px;
            }
            .row-container:nth-child(2) {
                gap: 22px;
            }
            .row-container:nth-child(3) {
                gap: 28px;
            }
            .card-item {
                width: 84px;
                height: 84px;
                font-size: 9px;
                padding: 8px 6px;
            }
            .card-item .text {
                font-size: 7px;
            }
            .card-item::before {
                height: 14px;
                top: -12px;
            }
            .card-item::after {
                width: 12px;
                height: 10px;
                top: -14px;
            }
            .card-item:hover:not(.placed):not(.locked) {
                transform: translateY(-12px) scale(2.0);
            }
            .card-item.locked:hover {
                transform: scale(2.0);
            }
            .toast-close {
                top: 10px;
                right: 12px;
                font-size: 22px;
            }
            .basket-icon {
                width: 110px;
                height: 90px;
            }
            .modal-box {
                padding: 28px 20px;
            }
            .modal-text {
                font-size: 18px;
            }
            .modal-icon {
                font-size: 40px;
            }
            .basket-empty {
                font-size: 11px;
            }
            .basket-item {
                font-size: 11px;
                padding: 6px 8px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍎 Соберите урожай решений</h1>
        <div class="sub">Перетащите яблоки с верными решениями в корзину. Ошибочные оставьте на дереве.</div>

        <div class="game-area">
            <div class="cards-area" id="treeArea">
                <div class="cards-grid" id="cardsContainer">
                    <!-- Ряды создаются JS -->
                </div>
            </div>

            <div class="basket-area">
                <div class="basket" id="basket">
                    <div class="basket-icon"></div>
                    <div class="basket-items" id="basketItems">
                        <div class="basket-empty">Собирайте сюда яблоки 🍎</div>
                    </div>
                    <div class="basket-label">КОРЗИНА</div>
                </div>
            </div>
        </div>

        <button class="btn-reset" id="resetBtn">⟳ Начать заново</button>
    </div>

    <!-- Модалка завершения -->
    <div class="modal-overlay" id="completeModal">
        <div class="modal-box">
            <button class="modal-close" id="completeModalClose" aria-label="Закрыть">✕</button>
            <span class="modal-icon">🎉</span>
            <div class="modal-text">Урожай собран!</div>
            <div class="modal-sub">Все верные решения в корзине!</div>
        </div>
    </div>

    <!-- Тосты -->
    <div class="toast-overlay" id="toastOverlay">
        <div class="toast-box">
            <button class="toast-close" id="toastCloseBtn" aria-label="Закрыть">✕</button>
            <span class="toast-emoji" id="toastEmoji">✅</span>
            <div class="toast-text" id="toastText">Верно!</div>
            <div class="toast-sub" id="toastSub"> </div>
        </div>
    </div>

    <script>
        (function() {
            const items = [{
                id: 'coffee',
                text: 'Установить автоматы с&nbsp;напитками и&nbsp;снеками',
                correct: true,
                toast: 'Верно! Сытый и согретый гость — самый лояльный и доброжелательный респондент.'
            }, {
                id: 'mailing',
                text: 'Настроить систему персональных рассылок и&nbsp;поздравлений для&nbsp;постояльцев',
                correct: true,
                toast: 'Верно! Так будет проще собрать лояльное «ядро» аудитории, которое поддержит вас при проверке.'
            }, {
                id: 'promise',
                text: 'Применять правило «обещать меньше, а&nbsp;делать больше»',
                correct: true,
                toast: 'Верно! Это гарантирует «вау-эффект» и восторженные рекомендации друзьям.'
            }, {
                id: 'backstage',
                text: 'Проводить экскурсии «за&nbsp;кулисы» и&nbsp;рассказывать о&nbsp;«внутрянке» учреждения',
                correct: true,
                toast: 'Верно! Это повышает эмпатию: люди начинают понимать реальные сложности и снижают завышенные требования.'
            }, {
                id: 'early',
                text: 'Начинать рабочий день сотрудников одновременно с&nbsp;открытием дверей для&nbsp;посетителей', // исправлено
                correct: false,
                toast: 'Ошибка! Это гарантирует очереди на входе и неготовность залов к приему.'
            }, {
                id: 'ignore',
                text: 'Игнорировать негативные комментарии на&nbsp;сайте и&nbsp;в&nbsp;соцсетях',
                correct: false,
                toast: 'Ошибка! Это провоцирует публичные скандалы и официальные жалобы в вышестоящие органы.'
            }, {
                id: 'sanitary',
                text: 'Отменить санитарные дни ради максимального времени работы учреждения',
                correct: false,
                toast: 'Ошибка! Это ведет к ухудшению чистоты, что посетители охотно отметят в анкетах.'
            }, {
                id: 'qr',
                text: 'Заменить все бумажные афиши, буклеты и&nbsp;программы на&nbsp;QR-коды',
                correct: false,
                toast: 'Ошибка! Посетители старшего возраста и гости без мобильного интернета лишатся информации, что приведет к низким оценкам.'
            }];

            let placedIds = [];
            const totalCorrect = items.filter(i => i.correct).length;
            let isComplete = false;

            const cardsContainer = document.getElementById('cardsContainer');
            const basketItems = document.getElementById('basketItems');
            const resetBtn = document.getElementById('resetBtn');

            const completeModal = document.getElementById('completeModal');
            const completeModalClose = document.getElementById('completeModalClose');

            const toastOverlay = document.getElementById('toastOverlay');
            const toastText = document.getElementById('toastText');
            const toastEmoji = document.getElementById('toastEmoji');
            const toastSub = document.getElementById('toastSub');
            const toastCloseBtn = document.getElementById('toastCloseBtn');
            const basket = document.getElementById('basket');

            const rowsIndices = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7]
            ];

            function isGameComplete() {
                const correctPlaced = items.filter(i => i.correct && placedIds.includes(i.id)).length;
                return correctPlaced === totalCorrect;
            }

            function renderCards() {
                const complete = isGameComplete();
                cardsContainer.innerHTML = '';

                rowsIndices.forEach(row => {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'row-container';
                    row.forEach(idx => {
                        const item = items[idx];
                        const div = document.createElement('div');
                        div.className = 'card-item';
                        if (placedIds.includes(item.id)) {
                            div.classList.add('placed');
                        } else if (complete && !item.correct) {
                            div.classList.add('locked');
                        }
                        div.dataset.id = item.id;
                        div.dataset.correct = item.correct;
                        div.draggable = !div.classList.contains('placed') && !div.classList.contains('locked');
                        div.innerHTML = `<span class="text">${item.text}</span>`;

                        if (div.draggable) {
                            div.addEventListener('dragstart', handleDragStart);
                            div.addEventListener('dragend', handleDragEnd);
                        }

                        rowDiv.appendChild(div);
                    });
                    cardsContainer.appendChild(rowDiv);
                });

                renderBasket();
                checkComplete();
            }

            function renderBasket() {
                basketItems.innerHTML = '';
                const placedCorrect = items.filter(i => placedIds.includes(i.id) && i.correct);
                if (placedCorrect.length === 0) {
                    basketItems.innerHTML = '<div class="basket-empty">Собирайте сюда яблоки 🍎</div>';
                } else {
                    placedCorrect.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'basket-item';
                        div.innerHTML = item.text;
                        basketItems.appendChild(div);
                    });
                }
            }

            function checkComplete() {
                const complete = isGameComplete();
                if (complete) {
                    isComplete = true;
                    completeModal.classList.add('active');
                    renderCards();
                } else {
                    isComplete = false;
                    completeModal.classList.remove('active');
                }
            }

            function showToast(message, isError = false) {
                toastEmoji.textContent = isError ? '❌' : '✅';
                toastText.textContent = message;
                toastSub.textContent = isError ? 'Попробуйте выбрать только верные решения' : ' ';
                toastOverlay.classList.add('active');
            }

            function closeToast() {
                toastOverlay.classList.remove('active');
            }

            let draggedId = null;

            function handleDragStart(e) {
                const el = e.target.closest('.card-item');
                if (!el) return;
                if (el.classList.contains('placed') || el.classList.contains('locked')) {
                    e.preventDefault();
                    return false;
                }
                draggedId = el.dataset.id;
                e.dataTransfer.setData('text/plain', draggedId);
                e.dataTransfer.effectAllowed = 'move';
                setTimeout(() => el.style.opacity = '0.4', 0);
            }

            function handleDragEnd(e) {
                const el = e.target.closest('.card-item');
                if (el) el.style.opacity = '1';
                basket.classList.remove('drag-over');
            }

            basket.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                basket.classList.add('drag-over');
            });

            basket.addEventListener('dragleave', () => {
                basket.classList.remove('drag-over');
            });

            basket.addEventListener('drop', (e) => {
                e.preventDefault();
                basket.classList.remove('drag-over');

                if (isComplete) {
                    showToast('Урожай уже собран!', true);
                    return;
                }

                const id = e.dataTransfer.getData('text/plain');
                if (!id) return;

                const item = items.find(i => i.id === id);
                if (!item) return;

                if (placedIds.includes(id)) return;

                if (!item.correct) {
                    showToast(item.toast, true);
                    return;
                }

                placedIds.push(id);
                renderCards();
                renderBasket();
                checkComplete();
                showToast(item.toast, false);
            });

            document.addEventListener('dragover', (e) => e.preventDefault());
            document.addEventListener('drop', (e) => e.preventDefault());

            toastCloseBtn.addEventListener('click', closeToast);
            toastOverlay.addEventListener('click', function(e) {
                if (e.target === toastOverlay) closeToast();
            });

            completeModalClose.addEventListener('click', function() {
                completeModal.classList.remove('active');
            });
            completeModal.addEventListener('click', function(e) {
                if (e.target === completeModal) completeModal.classList.remove('active');
            });

            function resetGame() {
                placedIds = [];
                isComplete = false;
                closeToast();
                completeModal.classList.remove('active');
                renderCards();
                renderBasket();
                checkComplete();
            }

            resetBtn.addEventListener('click', resetGame);

            renderCards();
            renderBasket();
            checkComplete();
        })();
    </script>
</body>
</html>
