<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренажёр НОК</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }

    .container {
      max-width: 820px;
      width: 100%;
      background: #ffffff;
      border-radius: 40px;
      padding: 32px 30px 40px;
      box-shadow: 0 12px 40px rgba(0, 43, 128, 0.12);
      border: 2px solid #002b80;
      transition: all 0.2s;
    }

    h1 {
      display: none;
    }

    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .progress-bar-track {
      flex: 1;
      min-width: 140px;
      height: 10px;
      background: #d9e0ed;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #002b80;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #002b80;
      border-radius: 12px;
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .step-indicator {
      font-weight: 600;
      font-size: 15px;
      color: #002b80;
      background: #f2f6fc;
      padding: 4px 16px;
      border-radius: 40px;
      white-space: nowrap;
      letter-spacing: 0.2px;
      border: 1px solid #002b80;
    }

    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 28px 30px 30px;
      border: 2px solid #002b80;
      margin-bottom: 24px;
    }

    .top-section {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 20px;
    }

    .context {
      flex: 1;
    }

    .stage-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #8b0000;
      line-height: 1.3;
    }

    .scenario {
      font-size: 16px;
      color: #001a4d;
      background: #ffffff;
      padding: 14px 18px;
      border-radius: 18px;
      margin: 12px 0 16px 0;
      border-left: 6px solid #002b80;
      line-height: 1.6;
    }

    .image-wrap {
      flex-shrink: 0;
      width: 180px;
      max-width: 180px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #d9e0ed;
      padding: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8fbff;
    }

    .image-wrap img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      background: #ffffff;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 16px 0 10px;
    }

    .option-btn {
      background: linear-gradient(145deg, #f7f7f7, #e8e8e8);
      border: 2px solid #002b80;
      border-radius: 16px;
      padding: 14px 22px;
      font-size: 14px;
      font-weight: 600;
      color: #001a4d;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 2px 6px rgba(0, 43, 128, 0.03);
      word-break: break-word;
    }

    .option-btn:hover:not(.disabled) {
      border-color: #001a4d;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 43, 128, 0.08);
      background: linear-gradient(145deg, #f0f0f0, #e0e0e0);
    }

    .option-btn.selected-correct {
      background: #e6f5ed;
      border-color: #1a8c4a;
      box-shadow: 0 0 0 3px rgba(26, 140, 74, 0.2);
    }

    .option-btn.selected-wrong {
      background: #fce8eb;
      border-color: #b3002d;
      box-shadow: 0 0 0 3px rgba(204, 51, 68, 0.2);
    }

    .option-btn.show-correct {
      background: #e6f5ed;
      border-color: #1a8c4a;
      box-shadow: 0 0 0 3px rgba(26, 140, 74, 0.2);
    }

    .option-btn.disabled {
      cursor: default;
      opacity: 0.8;
    }
    .option-btn.disabled:hover {
      transform: none;
      box-shadow: none;
      background: linear-gradient(145deg, #f7f7f7, #e8e8e8);
    }
    .option-btn.disabled.selected-correct:hover,
    .option-btn.disabled.show-correct:hover {
      background: #e6f5ed;
    }
    .option-btn.disabled.selected-wrong:hover {
      background: #fce8eb;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      margin-top: 10px;
    }

    .btn-next {
      background: #002b80;
      color: #ffffff;
      border: 2px solid #002b80;
      border-radius: 60px;
      padding: 14px 36px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: none;
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.3px;
    }

    .btn-next:hover:not(:disabled) {
      background: #001a4d;
      transform: translateY(-2px);
    }

    .btn-next:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
      background: #666666;
      border-color: #666666;
    }

    .btn-reset {
      background: linear-gradient(145deg, #fdf6e3, #f5e6c8);
      border: 2px solid #000000;
      border-radius: 60px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      color: #000000;
      cursor: pointer;
      transition: 0.15s;
      margin-top: 6px;
    }

    .btn-reset:hover {
      background: linear-gradient(145deg, #faf0da, #f0dbb8);
      border-color: #000000;
      transform: scale(1.02);
    }

    .result-summary {
      background: #ffffff;
      border-radius: 28px;
      padding: 28px 30px;
      text-align: center;
      border: 3px solid #002b80;
      margin-top: 10px;
    }

    .result-summary h2 {
      font-size: 26px;
      color: #002b80;
      margin-bottom: 6px;
    }

    .result-summary .score {
      font-size: 48px;
      font-weight: 700;
      color: #002b80;
    }

    .result-summary .desc {
      font-size: 17px;
      color: #003d99;
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 20, 50, 0.6);
      backdrop-filter: blur(3px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      max-width: 600px;
      width: 100%;
      border-radius: 24px;
      padding: 32px 30px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
      position: relative;
      animation: fadeSlide 0.25s ease;
      border: 2px solid #002b80;
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 18px;
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
      color: #002b80;
      background: transparent;
      border: none;
      padding: 4px 10px;
      border-radius: 30px;
      transition: background 0.15s;
      font-weight: 300;
    }

    .modal-close:hover {
      background: #f0f4fc;
    }

    .modal-icon {
      font-size: 2rem;
      margin-right: 12px;
      vertical-align: middle;
      display: inline-block;
    }

    .modal-content {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #002b80;
      padding-right: 20px;
      word-break: break-word;
    }

    .modal-content strong {
      color: #001f5e;
    }

    .modal-content .msg-text {
      display: inline;
    }

    @media (max-width: 600px) {
      .container { padding: 20px 16px 28px; }
      .card { padding: 20px 16px; }
      .top-section { flex-direction: column; align-items: stretch; gap: 16px; }
      .image-wrap { width: 100%; max-width: 100%; padding: 8px; }
      .image-wrap img { max-height: 160px; object-fit: contain; }
      .stage-title { font-size: 1.2rem; }
      .option-btn { font-size: 13px; padding: 12px 16px; }
      .btn-next { width: 100%; justify-content: center; }
      .action-row { flex-direction: column; align-items: stretch; }
      .modal-box { padding: 24px 20px 20px; margin: 10px; }
      .modal-content { font-size: 0.95rem; }
      .modal-close { font-size: 1.8rem; top: 10px; right: 12px; }
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="progress-wrapper">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill" style="width: 0%;"></div>
      </div>
      <span class="step-indicator" id="stepIndicator">1 / 3</span>
    </div>

    <div id="cardContainer">
      <div class="card" id="stageCard">
        <div class="top-section">
          <div class="context">
            <div class="stage-title" id="stageTitle">Первая реакция и контакт</div>
            <div class="scenario" id="scenarioText">Вы наблюдаете, как администратор подходит к гостю с белой тростью и собакой-поводырем. Какую фразу закрепите в регламенте как обязательную?</div>
          </div>
          <div class="image-wrap">
            <img src="https://www.cultmanager.ru/images/Vibecoding/image---2026-08-05t145233.040.jpeg" alt="Тренажёр НОК" loading="lazy" onerror="this.style.display='none'">
          </div>
        </div>

        <div class="options" id="optionsContainer"></div>

        <div class="action-row">
          <button class="btn-next" id="nextBtn" disabled>Далее →</button>
          <button class="btn-reset" id="resetBtn">⟳ Начать заново</button>
        </div>
      </div>
    </div>

    <div id="resultContainer" class="result-summary hidden">
      <h2>🏁 Тренировка завершена</h2>
      <div class="score" id="resultScore">3 / 3</div>
      <div class="desc" id="resultDesc">Отлично! Вы выбрали все правильные ответы.</div>
      <button class="btn-reset" style="margin-top:20px;" id="resetFromResultBtn">⟳ Пройти снова</button>
    </div>

    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
      <div class="modal-box">
        <button class="modal-close" id="modalCloseBtn" aria-label="Закрыть">✕</button>
        <div class="modal-content" id="modalContent">
          <span class="modal-icon" id="modalIcon">💡</span>
          <span class="msg-text" id="modalMessage">Сообщение</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const stages = [{
        id: 1,
        title: 'Первая реакция и контакт',
        scenario: 'Вы наблюдаете, как администратор подходит к гостю с белой тростью и собакой-поводырем. Какую фразу закрепите в регламенте как обязательную?',
        options: [
          '«Постойте, я сейчас позову кого-нибудь, кто вам поможет».',
          '«Здравствуйте! Проходите к кассе, она прямо и чуть левее».',
          '«Добрый день! Я администратор [имя]. Вам нужно содействие в передвижении или вы сориентируетесь самостоятельно?»'
        ],
        correctIndex: 2,
        explanation: 'Показатель 3.2 требует «оказания помощи работниками, прошедшими обучение». Правильный стандарт — представиться и предложить помощь, не навязывая её. Фраза «Постойте, я сейчас позову кого-нибудь» — признак необученного персонала, а «Проходите к кассе, она прямо и чуть левее» — небезопасна, так как вы не знаете, сможет ли человек самостоятельно сориентироваться.'
      }, {
        id: 2,
        title: 'Работа с собакой-поводырем',
        scenario: 'Посетитель уточняет: «Я с собакой, мне можно в зал или её нужно оставить в фойе?» Какой ответ администратора гарантирует отсутствие жалоб и штрафов?',
        options: [
          '«Конечно, проходите. Собака-поводырь — это средство реабилитации, доступ с ней разрешен везде. Хотите, я принесу ей воды?»',
          '«С собаками нельзя по правилам безопасности, но я могу за ней присмотреть здесь».',
          '«Можно, если у вас есть паспорт собаки и она в наморднике».'
        ],
        correctIndex: 0,
        explanation: 'По закону собака-поводырь имеет доступ в любое помещение. Ответ «С собаками нельзя» — прямое нарушение, а требование паспорта или намордника — незаконно. Правильный подход — разрешить доступ и предложить заботу (например, воду для собаки).'
      }, {
        id: 3,
        title: 'Физическое сопровождение',
        scenario: 'Гость просит проводить его в зал. Как вы обучите персонал это делать правильно?',
        options: [
          'Идти впереди и громко комментировать дорогу: «Тут ступенька! Теперь направо!»',
          'Предложить гостю взять администратора за локоть и идти на полшага впереди, спокойно предупреждая о препятствиях.',
          'Взять гостя за руку и вести его за собой.'
        ],
        correctIndex: 1,
        explanation: 'Показатель 3.2 требует «оказания помощи работниками, прошедшими обучение». Правильный стандарт — представиться и предложить помощь, не навязывая её. Громкие выкрики дезориентируют человека, а ведение за руку — нарушение личных границ и этикета.'
      }];

      const progressFill = document.getElementById('progressFill');
      const stepIndicator = document.getElementById('stepIndicator');
      const stageTitle = document.getElementById('stageTitle');
      const scenarioText = document.getElementById('scenarioText');
      const optionsContainer = document.getElementById('optionsContainer');
      const nextBtn = document.getElementById('nextBtn');
      const resetBtn = document.getElementById('resetBtn');
      const resetFromResultBtn = document.getElementById('resetFromResultBtn');
      const cardContainer = document.getElementById('cardContainer');
      const resultContainer = document.getElementById('resultContainer');
      const resultScore = document.getElementById('resultScore');
      const resultDesc = document.getElementById('resultDesc');

      const modalOverlay = document.getElementById('modalOverlay');
      const modalCloseBtn = document.getElementById('modalCloseBtn');
      const modalIcon = document.getElementById('modalIcon');
      const modalMessage = document.getElementById('modalMessage');

      let currentStage = 0;
      let correctCount = 0;
      let isAnswered = false;
      let waitingForModalClose = false;

      function renderStage(index) {
        const stage = stages[index];
        if (!stage) return;

        const progress = ((index) / stages.length) * 100;
        progressFill.style.width = progress + '%';
        stepIndicator.textContent = `${index + 1} / ${stages.length}`;

        stageTitle.textContent = stage.title;
        scenarioText.textContent = stage.scenario;

        optionsContainer.innerHTML = '';
        stage.options.forEach((text, i) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.dataset.index = i;
          btn.textContent = text;
          btn.addEventListener('click', () => handleOptionClick(i));
          optionsContainer.appendChild(btn);
        });

        isAnswered = false;
        nextBtn.disabled = true;
        document.querySelectorAll('.option-btn').forEach(el => {
          el.classList.remove('selected-correct', 'selected-wrong', 'show-correct', 'disabled');
        });

        if (index === stages.length - 1) {
          nextBtn.textContent = '🏁 Завершить';
        } else {
          nextBtn.textContent = 'Далее →';
        }
      }

      function handleOptionClick(index) {
        if (isAnswered || waitingForModalClose) return;

        const stage = stages[currentStage];
        const isCorrect = (index === stage.correctIndex);
        const btns = document.querySelectorAll('.option-btn');

        btns.forEach(btn => btn.classList.remove('selected-wrong'));

        if (!isCorrect) {
          btns.forEach(btn => {
            if (parseInt(btn.dataset.index) === index) {
              btn.classList.add('selected-wrong');
            }
          });
        }

        if (isCorrect) {
          modalIcon.textContent = '✅';
          modalMessage.innerHTML = `<strong>Верно!</strong><br>${stage.explanation}`;
        } else {
          modalIcon.textContent = '❌';
          modalMessage.innerHTML = `<strong>Ошибка!</strong><br>Попробуйте выбрать другой вариант.`;
        }

        modalOverlay.classList.add('active');
        waitingForModalClose = true;

        window._tempResult = {
          isCorrect,
          index,
          stage
        };
      }

      function handleModalClose() {
        modalOverlay.classList.remove('active');
        waitingForModalClose = false;

        const temp = window._tempResult;
        if (!temp) return;

        const { isCorrect, index, stage } = temp;
        const btns = document.querySelectorAll('.option-btn');

        if (isCorrect) {
          correctCount++;
          btns.forEach(btn => {
            btn.classList.add('disabled');
            if (parseInt(btn.dataset.index) === index) {
              btn.classList.add('selected-correct');
            }
            if (parseInt(btn.dataset.index) === stage.correctIndex) {
              btn.classList.add('show-correct');
            }
          });
          isAnswered = true;
          nextBtn.disabled = false;
        } else {
          // ничего не блокируем
        }

        window._tempResult = null;
      }

      function goToNext() {
        if (!isAnswered) return;

        if (currentStage === stages.length - 1) {
          showResult();
        } else {
          currentStage++;
          renderStage(currentStage);
        }
      }

      function showResult() {
        cardContainer.classList.add('hidden');
        resultContainer.classList.remove('hidden');

        const total = stages.length;
        resultScore.textContent = `${correctCount} / ${total}`;

        let desc = '';
        if (correctCount === total) {
          desc = '🎉 Отлично! Попробуйте понаблюдать за персоналом в таком режиме, чтобы отточить культуру обслуживания маломобильных посетителей.';
        } else if (correctCount >= total - 1) {
          desc = '👍 Хороший результат! Повторите материал по ошибкам.';
        } else {
          desc = '📖 Рекомендуем пересмотреть регламенты и пройти тренировку заново.';
        }
        resultDesc.textContent = desc;

        progressFill.style.width = '100%';
        stepIndicator.textContent = '🏁 Завершено';
      }

      function resetAll() {
        currentStage = 0;
        correctCount = 0;
        isAnswered = false;
        waitingForModalClose = false;
        modalOverlay.classList.remove('active');

        cardContainer.classList.remove('hidden');
        resultContainer.classList.add('hidden');

        renderStage(0);
        nextBtn.disabled = true;
      }

      modalCloseBtn.addEventListener('click', handleModalClose);
      modalOverlay.addEventListener('click', function(e) {
        if (e.target === modalOverlay) handleModalClose();
      });

      nextBtn.addEventListener('click', goToNext);
      resetBtn.addEventListener('click', resetAll);
      resetFromResultBtn.addEventListener('click', resetAll);

      resetAll();
    })();
  </script>
</body>
</html>
