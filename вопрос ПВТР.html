<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="google" content="notranslate" />
    <title>ПВТР: тест</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            color: #1a1a1a;
            background: #fff;
        }
        .card {
            max-width: 820px;
            margin: 0 auto;
            padding: 16px;
        }
        .card__head {
            display: flex;
            align-items: stretch;
            gap: 14px;
            margin-bottom: 14px;
        }
        .card__text {
            flex: 1 1 auto;
        }
        .card__label {
            margin: 0 0 10px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #8b1a2f;
        }
        .card__question {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            line-height: 1.35;
            color: #0b4fd9;
        }
        .card__sub {
            margin: 22px 0 0;
            font-size: 17px;
            line-height: 1.4;
            font-weight: 600;
            color: #1a1a1a;
        }
        .card__media {
            flex: 0 0 auto;
            width: 140px;
            border-radius: 8px;
            overflow: hidden;
            background: #f1f3f5;
        }
        .card__media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 9px 12px;
            border: 1px solid #e3e6ea;
            border-radius: 8px;
            cursor: pointer;
            transition: border-color .15s, background .15s;
            user-select: none;
        }
        .option:hover {
            border-color: #c7ccd1;
            background: #fafbfc;
        }
        .option input {
            margin: 3px 0 0;
            flex-shrink: 0;
            accent-color: #0b4fd9;
        }
        .option__text { flex: 1 1 auto; }
        .option__mark {
            flex-shrink: 0;
            font-size: 13px;
            font-weight: 500;
            margin-left: 8px;
            opacity: 0;
        }
        .option.correct {
            border-color: #2f9e44;
            background: #ebfbee;
        }
        .option.correct .option__mark {
            color: #2f9e44;
            opacity: 1;
        }
        .option.wrong {
            border-color: #e03131;
            background: #fff5f5;
        }
        .option.wrong .option__mark {
            color: #e03131;
            opacity: 1;
        }
        .actions {
            margin-top: 16px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 9px 20px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-family: inherit;
        }
        .btn--check { background: #0b4fd9; color: #fff; }
        .btn--check:hover { background: #093fae; }
        .btn--reset { background: #f1f3f5; color: #333; }
        .btn--reset:hover { background: #e3e6ea; }
        .result {
            margin-top: 12px;
            padding: 11px 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            display: none;
        }
        .result--ok {
            display: block;
            background: #ebfbee;
            color: #2f9e44;
            border: 1px solid #2f9e44;
        }
        .result--fail {
            display: block;
            background: #fff5f5;
            color: #e03131;
            border: 1px solid #e03131;
        }
        @media (max-width: 520px) {
            .card__head { flex-direction: column-reverse; gap: 12px; }
            .card__media { width: 100%; height: 140px; }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card__head">
            <div class="card__text">
                <p class="card__label">Вопрос</p>
                <h2 class="card__question">
                    В каких сферах появились новые условия и поэтому нужно внести изменения в ПВТР учреждения культуры?
                </h2>
                <p class="card__sub">Отметьте галочками несколько вариантов ответа.</p>
            </div>
            <div class="card__media">
                <img src="https://www.cultmanager.ru/images/Vibecoding/image---2026-09-13t025115.707.jpeg" alt="" />
            </div>
        </div>

        <div class="options" id="options"></div>

        <div class="actions">
            <button class="btn btn--check" id="btnCheck" type="button">Проверить</button>
            <button class="btn btn--reset" id="btnReset" type="button">Сбросить</button>
        </div>

        <div class="result" id="result" role="status" aria-live="polite"></div>
    </div>

    <script>
        var options = [
            { text: "Испытание при приёме на работу", correct: true },
            { text: "Срочные трудовые договоры", correct: false },
            { text: "Сверхурочная работа", correct: true },
            { text: "Неполное рабочее время", correct: true },
            { text: "Дополнительный отдых в связи с чрезвычайными ситуациями", correct: true },
            { text: "Увольнение за хищение", correct: true },
            { text: "Преимущественное право при сокращении", correct: true },
            { text: "Отзыв из отпуска работников с вредными условиями труда", correct: true },
            { text: "Сроки выплаты зарплаты", correct: false },
            { text: "Меры поощрений и взысканий", correct: false },
            { text: "Правила премирования", correct: false }
        ];

        var optionsEl = document.getElementById('options');
        var resultEl = document.getElementById('result');

        options.forEach(function (item, i) {
            var label = document.createElement('label');
            label.className = 'option';
            label.dataset.correct = item.correct ? '1' : '0';

            var input = document.createElement('input');
            input.type = 'checkbox';
            input.value = i;

            var text = document.createElement('span');
            text.className = 'option__text';
            text.textContent = item.text;

            var mark = document.createElement('span');
            mark.className = 'option__mark';

            label.appendChild(input);
            label.appendChild(text);
            label.appendChild(mark);
            optionsEl.appendChild(label);
        });

        document.getElementById('btnCheck').addEventListener('click', function () {
            var labels = optionsEl.querySelectorAll('.option');
            var allRight = true;

            labels.forEach(function (label) {
                var input = label.querySelector('input');
                var isCorrect = label.dataset.correct === '1';
                var mark = label.querySelector('.option__mark');

                label.classList.remove('correct', 'wrong');
                mark.textContent = '';

                if (input.checked && isCorrect) {
                    label.classList.add('correct');
                    mark.textContent = '✓';
                } else if (input.checked && !isCorrect) {
                    label.classList.add('wrong');
                    mark.textContent = '✗';
                    allRight = false;
                } else if (!input.checked && isCorrect) {
                    label.classList.add('correct');
                    mark.textContent = '✓';
                    allRight = false;
                } else {
                    allRight = false;
                }
            });

            var checkedCount = optionsEl.querySelectorAll('input:checked').length;
            var correctCount = options.filter(function (o) { return o.correct; }).length;
            if (checkedCount !== correctCount) allRight = false;

            if (allRight) {
                resultEl.className = 'result result--ok';
                resultEl.textContent = 'Верно';
            } else {
                resultEl.className = 'result result--fail';
                resultEl.textContent = 'Неверно';
            }
        });

        document.getElementById('btnReset').addEventListener('click', function () {
            optionsEl.querySelectorAll('input').forEach(function (i) { i.checked = false; });
            optionsEl.querySelectorAll('.option').forEach(function (l) {
                l.classList.remove('correct', 'wrong');
                l.querySelector('.option__mark').textContent = '';
            });
            resultEl.className = 'result';
            resultEl.textContent = '';
        });
    </script>

    <script type="text/javascript" src="../../common/js/iframeResizer.contentWindow.min.js"></script>
</body>

</html>
