<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аукцион ценностей</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(160deg, #f8fafc 0%, #eef2ff 100%);
    color: #111827;
    line-height: 1.5;
    padding: 40px 20px 60px;
    min-height: 100vh;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }

  .title {
    font-size: 30px;
    font-weight: 800;
    color: #dc2626;
    letter-spacing: -0.02em;
    text-align: center;
    margin-bottom: 10px;
    line-height: 1.25;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .title .stars {
    font-size: 0.8em;
    letter-spacing: 4px;
    white-space: nowrap;
  }
  @media (max-width: 700px) {
    .title { font-size: 22px; }
  }

  .subtitle {
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    color: #1d4ed8;
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .subtitle span {
    display: block;
  }
  @media (max-width: 700px) {
    .subtitle { font-size: 14px; }
  }

  .budget {
    display: flex;
    justify-content: center;
    gap: 28px;
    flex-wrap: wrap;
    background: #ffffff;
    border: 2px solid #e5e7eb;
    border-radius: 16px;
    padding: 16px 22px;
    margin-bottom: 32px;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
    font-size: 16px;
  }
  .budget-item { display: flex; align-items: baseline; gap: 6px; }
  .budget-item span:first-child { color: #6b7280; font-size: 14px; }
  .budget-item span:last-child { font-weight: 700; font-size: 20px; color: #111827; }
  .budget-item.spent span:last-child { color: #7c3aed; }
  .budget-item.left span:last-child { color: #059669; }
  .budget-item.left.low span:last-child { color: #dc2626; }

  /* закреплённая сетка — flex с жёсткой шириной карточек */
  #lots {
    display: flex !important;
    flex-wrap: wrap !important;
    gap: 16px !important;
    align-items: stretch !important;
  }
  #lots > .card {
    flex: 0 0 calc(50% - 8px) !important;
    width: calc(50% - 8px) !important;
    max-width: calc(50% - 8px) !important;
    min-width: 0 !important;
  }
  @media (max-width: 700px) {
    #lots > .card {
      flex: 0 0 100% !important;
      width: 100% !important;
      max-width: 100% !important;
    }
  }

  .card {
    position: relative;
    background: #ffffff;
    border: 2px solid #e5e7eb;
    border-radius: 18px;
    padding: 22px 24px;
    min-height: 120px;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease, opacity .18s ease;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    user-select: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .card:hover:not(.disabled):not(.correct):not(.wrong) {
    transform: translateY(-3px);
    box-shadow: 0 12px 24px rgba(15, 23, 42, 0.10);
    border-color: #93c5fd;
  }

  .card .name {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.35;
    margin-bottom: 6px;
    padding-right: 60px;
    color: #1f2937;
  }
  .card .desc {
    font-size: 14px;
    color: #4b5563;
    line-height: 1.45;
    padding-right: 60px;
  }

  .card .price {
    position: absolute;
    top: 18px;
    right: 18px;
    background: #eef2ff;
    color: #1d4ed8;
    font-weight: 700;
    font-size: 14px;
    padding: 4px 10px;
    border-radius: 8px;
    white-space: nowrap;
  }

  .card::after {
    content: "";
    position: absolute;
    bottom: 18px;
    right: 18px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #d1d5db;
    background: #fff;
    transition: all .2s ease;
  }

  .card.correct {
    border-color: #10b981;
    background: linear-gradient(180deg, #ecfdf5 0%, #ffffff 100%);
    box-shadow: 0 10px 24px rgba(16, 185, 129, 0.18);
  }
  .card.correct::after {
    background: #10b981;
    border-color: #10b981;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>");
    background-repeat: no-repeat;
    background-position: center;
    background-size: 14px;
  }

  .card.wrong {
    border-color: #ef4444;
    background: linear-gradient(180deg, #fef2f2 0%, #ffffff 100%);
    box-shadow: 0 10px 24px rgba(239, 68, 68, 0.15);
  }
  .card.wrong::after {
    background: #ef4444;
    border-color: #ef4444;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><line x1='18' y1='6' x2='6' y2='18'/><line x1='6' y1='6' x2='18' y2='18'/></svg>");
    background-repeat: no-repeat;
    background-position: center;
    background-size: 12px;
  }

  .card.disabled {
    opacity: .4;
    pointer-events: none;
  }

  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 36px;
    flex-wrap: wrap;
  }

  .btn {
    border: none;
    border-radius: 12px;
    padding: 13px 26px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease, opacity .18s ease;
  }

  .btn-restart {
    background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
    color: #78350f;
    box-shadow: 0 6px 16px rgba(245, 158, 11, 0.35);
  }
  .btn-restart:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(245, 158, 11, 0.45);
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 100;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .modal {
    background: #ffffff;
    border-radius: 22px;
    max-width: 620px;
    width: 100%;
    padding: 48px 44px 44px;
    position: relative;
    box-shadow: 0 30px 80px rgba(15, 23, 42, 0.3);
    transform: translateY(14px) scale(0.97);
    transition: transform .22s ease;
  }
  .modal-overlay.open .modal {
    transform: translateY(0) scale(1);
  }
  .modal.correct { border-top: 8px solid #10b981; }
  .modal.wrong { border-top: 8px solid #ef4444; }
  .modal.done { border-top: 8px solid #10b981; text-align: center; }
  .modal.summary { border-top: 8px solid #f59e0b; }

  .modal-text {
    font-size: 20px;
    line-height: 1.55;
    color: #1f2937;
    font-weight: 400;
  }
  .modal.correct .modal-text { color: #065f46; }
  .modal.wrong .modal-text { color: #991b1b; }
  .modal.summary .modal-text { color: #92400e; }
  .modal.done .modal-text {
    font-size: 24px;
    font-weight: 800;
    color: #065f46;
  }
  .modal-text strong { font-weight: 800; }

  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: #f3f4f6;
    color: #4b5563;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s ease, color .15s ease;
  }
  .modal-close:hover {
    background: #e5e7eb;
    color: #111827;
  }

  @media (max-width: 600px) {
    .modal { padding: 40px 26px 32px; }
    .modal-text { font-size: 17px; }
    .modal.done .modal-text { font-size: 19px; }
    .budget { gap: 14px; font-size: 14px; padding: 14px 16px; }
    .budget-item span:last-child { font-size: 17px; }
    .card .name, .card .desc { padding-right: 0; }
    .card .price { position: static; display: inline-block; margin-bottom: 8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title"><span class="stars">⭐⭐⭐</span><span>Аукцион ценностей</span><span class="stars">⭐⭐⭐</span></h1>
  <p class="subtitle">
    <span>Соберите набор лотов, который максимально поднимет статус читателя.</span>
    <span>Бюджет — 120 токенов.</span>
  </p>

  <div class="budget">
    <div class="budget-item"><span>Бюджет</span><span>120</span></div>
    <div class="budget-item spent"><span>Потрачено</span><span id="spent">0</span></div>
    <div class="budget-item left" id="leftBox"><span>Осталось</span><span id="left">120</span></div>
  </div>

  <div id="lots"></div>

  <div class="controls">
    <button class="btn btn-restart" id="restart">Начать заново</button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose" aria-label="Закрыть">×</button>
    <div class="modal-text" id="modalText"></div>
  </div>
</div>

<script>
const lots = [
  { name: '«Истории успеха»', desc: 'Стенд с биографиями известных людей, которые начинали путь в вашей библиотеке.', cost: 40, correct: true, feedback: 'Верно. Это создает образ учреждения как мощного социального лифта.' },
  { name: '«Бульварная пресса»', desc: 'Подписка на 100 наименований дешевых развлекательных газет и журналов.', cost: 40, correct: false, feedback: 'Неверно. Обилие таких изданий привлекает массу людей, но снижает статусность библиотеки.' },
  { name: '«Личный эксперт»', desc: 'Служба по индивидуальному поиску сложной отраслевой информации.', cost: 30, correct: true, feedback: 'Верно. Персонализация — признак высокого уровня обслуживания.' },
  { name: '«Золотой устав»', desc: 'Оформление всех правил библиотеки в массивные позолоченные рамы.', cost: 30, correct: false, feedback: 'Неверно. Акцент на правилах создает ощущение строгого госучреждения, а не престижного пространства.' },
  { name: '«Доска почета»', desc: 'Большой стенд с портретами лучших сотрудников библиотеки и их грамотами.', cost: 30, correct: false, feedback: 'Неверно. Фокус на достижениях сотрудников не работает на статус читателя: ему важно видеть собственный успех, а не достижения коллектива.' },
  { name: '«Аромат статуса»', desc: 'Ароматизация залов тонкими нотами кофе и дерева.', cost: 20, correct: true, feedback: 'Верно. Такой запах подчеркивает качество и престиж пространства.' },
  { name: '«Детский праздник»', desc: 'Ароматизация залов запахом сладкой ваты и жвачки.', cost: 20, correct: false, feedback: 'Неверно. Инфантильный аромат разрушает образ серьезного места для развития.' },
  { name: '«Брендированные закладки»', desc: 'Книжные вкладыши, на которых читатель сможет фиксировать цитаты или инсайты из книги.', cost: 20, correct: true, feedback: 'Верно. Библиотека показывает, что она — инструмент для личностного роста гостя. Внимание к деталям и целям читателя — признак премиального сервиса.' }
];

const BUDGET = 120;
const REQUIRED_SPENT = 110;
const MIN_LOT = 20;
let spent = 0;
let doneShown = false;

const lotsContainer = document.getElementById('lots');
const spentEl = document.getElementById('spent');
const leftEl = document.getElementById('left');
const leftBox = document.getElementById('leftBox');
const overlay = document.getElementById('modalOverlay');
const modal = document.getElementById('modal');
const modalText = document.getElementById('modalText');
const modalClose = document.getElementById('modalClose');
const restart = document.getElementById('restart');

function pluralize(n, one, few, many) {
  n = Math.abs(n) % 100;
  if (n >= 11 && n <= 14) return many;
  const n1 = n % 10;
  if (n1 === 1) return one;
  if (n1 >= 2 && n1 <= 4) return few;
  return many;
}

function formatFeedback(text) {
  return text.replace(/^(Верно|Неверно)\./, '<strong>$1.</strong>');
}

function openModal(type, content) {
  modal.classList.remove('correct', 'wrong', 'done', 'summary');
  modal.classList.add(type);
  if (type === 'correct' || type === 'wrong') {
    modalText.innerHTML = formatFeedback(content);
  } else {
    modalText.innerHTML = content;
  }
  overlay.classList.add('open');
}

function closeModal() {
  const isTerminal = modal.classList.contains('done') || modal.classList.contains('summary');
  overlay.classList.remove('open');
  modal.classList.remove('correct', 'wrong', 'done', 'summary');
  if (!isTerminal) {
    setTimeout(checkEndState, 250);
  }
}

function isSelectionPossible() {
  return Array.from(lotsContainer.children).some(card => {
    const cost = Number(card.dataset.cost);
    const isSelected = card.classList.contains('correct') || card.classList.contains('wrong');
    return !isSelected && spent + cost <= BUDGET;
  });
}

function updateBudget() {
  spentEl.textContent = spent;
  const left = BUDGET - spent;
  leftEl.textContent = left;
  leftBox.classList.toggle('low', left < MIN_LOT);

  Array.from(lotsContainer.children).forEach(card => {
    const cost = Number(card.dataset.cost);
    const isSelected = card.classList.contains('correct') || card.classList.contains('wrong');
    if (!isSelected) {
      if (spent + cost > BUDGET) {
        card.classList.add('disabled');
      } else {
        card.classList.remove('disabled');
      }
    } else {
      card.classList.remove('disabled');
    }
  });
}

function checkEndState() {
  if (doneShown) return;

  const cards = Array.from(lotsContainer.children);
  const anyWrong = cards.some(c => c.classList.contains('wrong'));
  const correctCount = cards.filter(c => c.classList.contains('correct')).length;
  const wrongCount = cards.filter(c => c.classList.contains('wrong')).length;
  const left = BUDGET - spent;

  if (spent === REQUIRED_SPENT && !anyWrong) {
    doneShown = true;
    const lotWord = pluralize(correctCount, 'лот', 'лота', 'лотов');
    let msg = `Вы потратили ${spent} токенов, выбрали ${correctCount} ${lotWord} и выполнили задание абсолютно верно!`;
    if (left > 0) {
      const tokenWord = pluralize(left, 'токен', 'токена', 'токенов');
      msg += ` Оставшиеся ${left} ${tokenWord} — в запасе: минимальный лот стоит ${MIN_LOT}.`;
    }
    openModal('done', msg);
    return;
  }

  if (spent > 0 && !isSelectionPossible()) {
    const lotWord = pluralize(correctCount, 'лот', 'лота', 'лотов');
    const errWord = pluralize(wrongCount, 'ошибку', 'ошибки', 'ошибок');
    let msg = `Вы потратили ${spent} токенов, выбрали ${correctCount} ${lotWord} верно и допустили ${wrongCount} ${errWord}.`;
    if (left > 0) {
      const tokenWord = pluralize(left, 'токен', 'токена', 'токенов');
      msg += ` Ещё ${left} ${tokenWord} остались неиспользованными — на минимальный лот их уже не хватает.`;
    }
    msg += ' Попробуйте выполнить задание снова.';
    openModal('summary', msg);
  }
}

function render() {
  lotsContainer.innerHTML = '';
  spent = 0;
  doneShown = false;
  overlay.classList.remove('open');
  updateBudget();

  lots.forEach(lot => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.cost = lot.cost;
    card.dataset.correct = lot.correct ? 'true' : 'false';

    const price = document.createElement('div');
    price.className = 'price';
    price.textContent = lot.cost + ' токенов';
    card.appendChild(price);

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = lot.name;
    card.appendChild(name);

    const desc = document.createElement('div');
    desc.className = 'desc';
    desc.textContent = lot.desc;
    card.appendChild(desc);

    card.addEventListener('click', () => {
      if (card.classList.contains('disabled')) return;

      if (card.classList.contains('correct') || card.classList.contains('wrong')) {
        card.classList.remove('correct', 'wrong');
        spent -= lot.cost;
        updateBudget();
        checkEndState();
        return;
      }

      if (spent + lot.cost > BUDGET) return;

      card.classList.add(lot.correct ? 'correct' : 'wrong');
      spent += lot.cost;
      updateBudget();
      openModal(lot.correct ? 'correct' : 'wrong', lot.feedback);
    });

    lotsContainer.appendChild(card);
  });
}

modalClose.addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
});

restart.addEventListener('click', render);

render();
</script>
</body>
</html>
render();
</script>
</body>
</html>
