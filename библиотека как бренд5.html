<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аукцион ценностей</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(160deg, #f8fafc 0%, #eef2ff 100%);
    color: #111827;
    line-height: 1.5;
    padding: 32px 20px 50px;
    min-height: 100vh;
  }
  .auc-wrap { max-width: 820px; margin: 0 auto; }

  .auc-title {
    font-size: 26px;
    font-weight: 800;
    color: #dc2626;
    letter-spacing: -0.02em;
    text-align: center;
    margin-bottom: 8px;
    line-height: 1.25;
  }
  .auc-title .stars {
    font-size: 0.8em;
    letter-spacing: 3px;
    white-space: nowrap;
  }
  @media (max-width: 700px) {
    .auc-title { font-size: 20px; }
  }

  .auc-subtitle {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    color: #1d4ed8;
    margin-bottom: 18px;
    line-height: 1.5;
  }
  .auc-subtitle span { display: block; }

  .auc-budget {
    display: flex;
    justify-content: center;
    gap: 22px;
    flex-wrap: wrap;
    background: #ffffff;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    padding: 10px 18px;
    margin-bottom: 22px;
    box-shadow: 0 3px 10px rgba(15, 23, 42, 0.05);
    font-size: 14px;
  }
  .auc-budget-item { display: flex; align-items: baseline; gap: 6px; }
  .auc-budget-item span:first-child { color: #6b7280; font-size: 12px; }
  .auc-budget-item span:last-child { font-weight: 700; font-size: 17px; color: #111827; }
  .auc-budget-item.spent span:last-child { color: #7c3aed; }
  .auc-budget-item.left span:last-child { color: #059669; }
  .auc-budget-item.left.low span:last-child { color: #dc2626; }

  .auc-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    width: 100%;
  }
  @media (max-width: 640px) {
    .auc-grid { grid-template-columns: minmax(0, 1fr); }
  }

  .auc-card {
    position: relative;
    background: #ffffff;
    border: 2px solid #e5e7eb;
    border-radius: 14px;
    padding: 14px 16px;
    min-height: 88px;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease, opacity .18s ease;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    user-select: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }
  .auc-card:hover:not(.disabled):not(.correct):not(.wrong) {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(15, 23, 42, 0.10);
    border-color: #93c5fd;
  }

  .auc-card .name {
    font-size: 14px;
    font-weight: 700;
    line-height: 1.35;
    margin-bottom: 4px;
    padding-right: 52px;
    color: #1f2937;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .auc-card .desc {
    font-size: 12.5px;
    color: #4b5563;
    line-height: 1.4;
    padding-right: 52px;
    overflow-wrap: break-word;
    word-break: break-word;
  }

  .auc-card .price {
    position: absolute;
    top: 12px;
    right: 12px;
    background: #eef2ff;
    color: #1d4ed8;
    font-weight: 700;
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 7px;
    white-space: nowrap;
  }

  .auc-card::after {
    content: "";
    position: absolute;
    bottom: 12px;
    right: 12px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #d1d5db;
    background: #fff;
    transition: all .2s ease;
  }

  .auc-card.correct {
    border-color: #10b981;
    background: linear-gradient(180deg, #ecfdf5 0%, #ffffff 100%);
    box-shadow: 0 8px 20px rgba(16, 185, 129, 0.18);
  }
  .auc-card.correct::after {
    background: #10b981;
    border-color: #10b981;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>");
    background-repeat: no-repeat;
    background-position: center;
    background-size: 12px;
  }

  .auc-card.wrong {
    border-color: #ef4444;
    background: linear-gradient(180deg, #fef2f2 0%, #ffffff 100%);
    box-shadow: 0 8px 20px rgba(239, 68, 68, 0.15);
  }
  .auc-card.wrong::after {
    background: #ef4444;
    border-color: #ef4444;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><line x1='18' y1='6' x2='6' y2='18'/><line x1='6' y1='6' x2='18' y2='18'/></svg>");
    background-repeat: no-repeat;
    background-position: center;
    background-size: 10px;
  }

  .auc-card.disabled {
    opacity: .35;
    pointer-events: none;
  }

  .auc-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  .auc-btn {
    border: none;
    border-radius: 12px;
    padding: 12px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease;
  }

  .auc-btn-restart {
    background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
    color: #78350f;
    box-shadow: 0 6px 16px rgba(245, 158, 11, 0.35);
  }
  .auc-btn-restart:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(245, 158, 11, 0.45);
  }

  .auc-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 100;
  }
  .auc-modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .auc-modal {
    background: #ffffff;
    border-radius: 22px;
    max-width: 560px;
    width: 100%;
    padding: 42px 38px 38px;
    position: relative;
    box-shadow: 0 30px 80px rgba(15, 23, 42, 0.3);
    transform: translateY(14px) scale(0.97);
    transition: transform .22s ease;
  }
  .auc-modal-overlay.open .auc-modal {
    transform: translateY(0) scale(1);
  }
  .auc-modal.correct { border-top: 8px solid #10b981; }
  .auc-modal.wrong { border-top: 8px solid #ef4444; }
  .auc-modal.done { border-top: 8px solid #10b981; text-align: center; }
  .auc-modal.summary { border-top: 8px solid #f59e0b; }

  .auc-modal-text {
    font-size: 18px;
    line-height: 1.55;
    color: #1f2937;
  }
  .auc-modal.correct .auc-modal-text { color: #065f46; }
  .auc-modal.wrong .auc-modal-text { color: #991b1b; }
  .auc-modal.summary .auc-modal-text { color: #92400e; }
  .auc-modal.done .auc-modal-text {
    font-size: 22px;
    font-weight: 800;
    color: #065f46;
  }
  .auc-modal-text strong { font-weight: 800; }

  .auc-modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: #f3f4f6;
    color: #4b5563;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s ease, color .15s ease;
  }
  .auc-modal-close:hover {
    background: #e5e7eb;
    color: #111827;
  }

  @media (max-width: 600px) {
    .auc-modal { padding: 36px 24px 28px; }
    .auc-modal-text { font-size: 16px; }
    .auc-modal.done .auc-modal-text { font-size: 19px; }
    .auc-budget { gap: 12px; padding: 10px 14px; font-size: 13px; }
    .auc-budget-item span:last-child { font-size: 15px; }
    .auc-card .name, .auc-card .desc { padding-right: 0; }
    .auc-card .price { position: static; display: inline-block; margin-bottom: 6px; align-self: flex-start; }
  }
</style>
</head>
<body>
<div class="auc-wrap">
  <h1 class="auc-title"><span class="stars">⭐⭐⭐</span> Аукцион ценностей <span class="stars">⭐⭐⭐</span></h1>
  <p class="auc-subtitle">
    <span>Соберите набор лотов, который максимально поднимет статус читателя.</span>
    <span>Бюджет — 120 токенов.</span>
  </p>

  <div class="auc-budget">
    <div class="auc-budget-item"><span>Бюджет</span><span>120</span></div>
    <div class="auc-budget-item spent"><span>Потрачено</span><span id="aucSpent">0</span></div>
    <div class="auc-budget-item left" id="aucLeftBox"><span>Осталось</span><span id="aucLeft">120</span></div>
  </div>

  <div id="aucLots" class="auc-grid"></div>

  <div class="auc-controls">
    <button class="auc-btn auc-btn-restart" id="aucRestart">Начать заново</button>
  </div>
</div>

<div class="auc-modal-overlay" id="aucModalOverlay">
  <div class="auc-modal" id="aucModal">
    <button class="auc-modal-close" id="aucModalClose" aria-label="Закрыть">×</button>
    <div class="auc-modal-text" id="aucModalText"></div>
  </div>
</div>

<script>
const aucLots = [
  { name: '«Истории успеха»', desc: 'Стенд с биографиями известных людей, которые начинали путь в вашей библиотеке.', cost: 40, correct: true, feedback: 'Верно. Это создает образ учреждения как мощного социального лифта.' },
  { name: '«Бульварная пресса»', desc: 'Подписка на 100 наименований дешевых развлекательных газет и журналов.', cost: 40, correct: false, feedback: 'Неверно. Обилие таких изданий привлекает массу людей, но снижает статусность библиотеки.' },
  { name: '«Личный эксперт»', desc: 'Служба по индивидуальному поиску сложной отраслевой информации.', cost: 30, correct: true, feedback: 'Верно. Персонализация — признак высокого уровня обслуживания.' },
  { name: '«Золотой устав»', desc: 'Оформление всех правил библиотеки в массивные позолоченные рамы.', cost: 30, correct: false, feedback: 'Неверно. Акцент на правилах создает ощущение строгого госучреждения, а не престижного пространства.' },
  { name: '«Доска почета»', desc: 'Большой стенд с портретами лучших сотрудников библиотеки и их грамотами.', cost: 30, correct: false, feedback: 'Неверно. Фокус на достижениях сотрудников не работает на статус читателя: ему важно видеть собственный успех, а не достижения коллектива.' },
  { name: '«Аромат статуса»', desc: 'Ароматизация залов тонкими нотами кофе и дерева.', cost: 20, correct: true, feedback: 'Верно. Такой запах подчеркивает качество и престиж пространства.' },
  { name: '«Детский праздник»', desc: 'Ароматизация залов запахом сладкой ваты и жвачки.', cost: 20, correct: false, feedback: 'Неверно. Инфантильный аромат разрушает образ серьезного места для развития.' },
  { name: '«Брендированные закладки»', desc: 'Книжные вкладыши, на которых читатель сможет фиксировать цитаты или инсайты из книги.', cost: 20, correct: true, feedback: 'Верно. Библиотека показывает, что она — инструмент для личностного роста гостя. Внимание к деталям и целям читателя — признак премиального сервиса.' }
];

const AUC_BUDGET = 120;
const AUC_REQUIRED = 110;
const AUC_MIN = 20;
let aucSpent = 0;
let aucDoneShown = false;

const aucContainer = document.getElementById('aucLots');
const aucSpentEl = document.getElementById('aucSpent');
const aucLeftEl = document.getElementById('aucLeft');
const aucLeftBox = document.getElementById('aucLeftBox');
const aucOverlay = document.getElementById('aucModalOverlay');
const aucModal = document.getElementById('aucModal');
const aucModalText = document.getElementById('aucModalText');
const aucModalClose = document.getElementById('aucModalClose');
const aucRestart = document.getElementById('aucRestart');

function aucPlural(n, one, few, many) {
  n = Math.abs(n) % 100;
  if (n >= 11 && n <= 14) return many;
  const n1 = n % 10;
  if (n1 === 1) return one;
  if (n1 >= 2 && n1 <= 4) return few;
  return many;
}

function aucFormat(text) {
  return text.replace(/^(Верно|Неверно)\./, '<strong>$1.</strong>');
}

function aucOpenModal(type, content) {
  aucModal.classList.remove('correct', 'wrong', 'done', 'summary');
  aucModal.classList.add(type);
  if (type === 'correct' || type === 'wrong') {
    aucModalText.innerHTML = aucFormat(content);
  } else {
    aucModalText.innerHTML = content;
  }
  aucOverlay.classList.add('open');
}

function aucCloseModal() {
  const isTerminal = aucModal.classList.contains('done') || aucModal.classList.contains('summary');
  aucOverlay.classList.remove('open');
  aucModal.classList.remove('correct', 'wrong', 'done', 'summary');
  if (!isTerminal) {
    setTimeout(aucCheckEnd, 250);
  }
}

function aucIsSelectionPossible() {
  return Array.from(aucContainer.children).some(card => {
    const cost = Number(card.dataset.cost);
    const isSelected = card.classList.contains('correct') || card.classList.contains('wrong');
    return !isSelected && aucSpent + cost <= AUC_BUDGET;
  });
}

function aucUpdateBudget() {
  aucSpentEl.textContent = aucSpent;
  const left = AUC_BUDGET - aucSpent;
  aucLeftEl.textContent = left;
  aucLeftBox.classList.toggle('low', left < AUC_MIN);

  Array.from(aucContainer.children).forEach(card => {
    const cost = Number(card.dataset.cost);
    const isSelected = card.classList.contains('correct') || card.classList.contains('wrong');
    if (!isSelected) {
      if (aucSpent + cost > AUC_BUDGET) {
        card.classList.add('disabled');
      } else {
        card.classList.remove('disabled');
      }
    } else {
      card.classList.remove('disabled');
    }
  });
}

function aucCheckEnd() {
  if (aucDoneShown) return;

  const cards = Array.from(aucContainer.children);
  const anyWrong = cards.some(c => c.classList.contains('wrong'));
  const correctCount = cards.filter(c => c.classList.contains('correct')).length;
  const wrongCount = cards.filter(c => c.classList.contains('wrong')).length;
  const left = AUC_BUDGET - aucSpent;

  if (aucSpent === AUC_REQUIRED && !anyWrong) {
    aucDoneShown = true;
    const lotWord = aucPlural(correctCount, 'лот', 'лота', 'лотов');
    let msg = `Вы потратили ${aucSpent} токенов, выбрали ${correctCount} ${lotWord} и выполнили задание абсолютно верно!`;
    if (left > 0) {
      const tokenWord = aucPlural(left, 'токен', 'токена', 'токенов');
      msg += ` Оставшиеся ${left} ${tokenWord} — в запасе: минимальный лот стоит ${AUC_MIN}.`;
    }
    aucOpenModal('done', msg);
    return;
  }

  if (aucSpent > 0 && !aucIsSelectionPossible()) {
    const lotWord = aucPlural(correctCount, 'лот', 'лота', 'лотов');
    const errWord = aucPlural(wrongCount, 'ошибку', 'ошибки', 'ошибок');
    let msg = `Вы потратили ${aucSpent} токенов, выбрали ${correctCount} ${lotWord} верно и допустили ${wrongCount} ${errWord}.`;
    if (left > 0) {
      const tokenWord = aucPlural(left, 'токен', 'токена', 'токенов');
      msg += ` Ещё ${left} ${tokenWord} остались неиспользованными — на минимальный лот их уже не хватает.`;
    }
    msg += ' Попробуйте выполнить задание снова.';
    aucOpenModal('summary', msg);
  }
}

function aucRender() {
  aucContainer.innerHTML = '';
  aucSpent = 0;
  aucDoneShown = false;
  aucOverlay.classList.remove('open');
  aucUpdateBudget();

  aucLots.forEach(lot => {
    const card = document.createElement('div');
    card.className = 'auc-card';
    card.dataset.cost = lot.cost;
    card.dataset.correct = lot.correct ? 'true' : 'false';

    const price = document.createElement('div');
    price.className = 'price';
    price.textContent = lot.cost + ' токенов';
    card.appendChild(price);

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = lot.name;
    card.appendChild(name);

    const desc = document.createElement('div');
    desc.className = 'desc';
    desc.textContent = lot.desc;
    card.appendChild(desc);

    card.addEventListener('click', () => {
      if (card.classList.contains('disabled')) return;

      if (card.classList.contains('correct') || card.classList.contains('wrong')) {
        card.classList.remove('correct', 'wrong');
        aucSpent -= lot.cost;
        aucUpdateBudget();
        aucCheckEnd();
        return;
      }

      if (aucSpent + lot.cost > AUC_BUDGET) return;

      card.classList.add(lot.correct ? 'correct' : 'wrong');
      aucSpent += lot.cost;
      aucUpdateBudget();
      aucOpenModal(lot.correct ? 'correct' : 'wrong', lot.feedback);
    });

    aucContainer.appendChild(card);
  });
}

aucModalClose.addEventListener('click', aucCloseModal);
aucOverlay.addEventListener('click', (e) => {
  if (e.target === aucOverlay) aucCloseModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && aucOverlay.classList.contains('open')) aucCloseModal();
});

aucRestart.addEventListener('click', aucRender);

aucRender();
</script>
</body>
</html>
