<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Упрямый кандидат — Вася</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #eef2fa 0%, #e0e8f2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 1.5rem;
        }

        .interactive-card {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 3rem;
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.25);
            padding: 2rem 1.5rem;
            position: relative;
        }

        /* подсказка вверху */
        .hint {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1rem;
            font-weight: 500;
            color: #2c5a74;
            background: #eef3fc;
            display: inline-block;
            width: auto;
            padding: 0.5rem 1.5rem;
            border-radius: 40px;
            margin-left: auto;
            margin-right: auto;
        }

        /* центральный персонаж */
        .character {
            max-width: 420px;
            margin: 0 auto 1.5rem auto;
            background: linear-gradient(135deg, #fef9e6, #fff3df);
            border-radius: 2rem;
            padding: 1.2rem 1rem;
            text-align: center;
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.15);
            border: 2px solid #ffcd94;
        }

        .avatar {
            font-size: 4.8rem;
            margin-bottom: 0.5rem;
        }

        .name-age {
            font-weight: 700;
            font-size: 1.2rem;
            color: #b3520c;
            margin-bottom: 0.5rem;
        }

        .bubble {
            background: white;
            border-radius: 1.8rem;
            padding: 1rem 1.2rem;
            font-weight: 500;
            font-size: 1rem;
            color: #2c3e2f;
            border-left: 5px solid #ffb347;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .bubble p {
            font-style: italic;
            line-height: 1.4;
        }

        /* контейнер для двух стрелок (горизонтально) */
        .arrows-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 3rem;
            flex-wrap: wrap;
            margin: 1.5rem 0 1rem;
        }

        .arrow-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            max-width: 220px;
        }

        .desc-text {
            font-weight: 600;
            font-size: 0.9rem;
            color: #1e3a4d;
            background: #f8fafc;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            text-align: center;
        }

        /* красная стрелка — кликабельная */
        .arrow-btn {
            background: #c1272d;
            width: 70px;
            height: 70px;
            border-radius: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(193,39,45,0.4);
            border: none;
            font-size: 2.6rem;
            font-weight: bold;
            color: white;
            line-height: 1;
        }

        .arrow-btn:hover {
            transform: scale(1.1);
            background: #a51f24;
            box-shadow: 0 8px 20px rgba(193,39,45,0.6);
        }

        .arrow-btn:active {
            transform: scale(0.94);
        }

        /* зона для крупного сообщения по центру */
        .message-area {
            text-align: center;
            margin-top: 1.5rem;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .feedback-message {
            display: inline-block;
            padding: 1rem 2rem;
            border-radius: 80px;
            font-weight: 900;
            font-size: 1.8rem;
            background: #f0f5fa;
            animation: fadeSlide 0.25s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
            letter-spacing: 1px;
        }

        .feedback-message.correct {
            background: #c8f0e4;
            color: #1a6e52;
            border-left: 8px solid #1f7b5c;
        }

        .feedback-message.wrong {
            background: #ffe0db;
            color: #bc2f1e;
            border-left: 8px solid #c1272d;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 550px) {
            .interactive-card {
                padding: 1.5rem;
            }
            .arrow-btn {
                width: 55px;
                height: 55px;
                font-size: 2rem;
            }
            .desc-text {
                font-size: 0.75rem;
                max-width: 160px;
            }
            .arrows-container {
                gap: 1rem;
            }
            .feedback-message {
                font-size: 1.3rem;
                padding: 0.7rem 1.2rem;
            }
            .avatar {
                font-size: 3.5rem;
            }
            .bubble p {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
<div class="interactive-card">
    <!-- Подсказка сверху -->
    <div class="hint">
        🧭 Выберите верное действие, нажав на стрелку
    </div>

    <!-- Центральный персонаж: 17-летний Вася -->
    <div class="character">
        <div class="avatar">🧑‍🎤</div>
        <div class="name-age">17-летний Вася</div>
        <div class="bubble">
            <p>«Я и так здоров! И генетика у меня супер.<br>На медосмотр не пойду — неохота время терять!»</p>
        </div>
    </div>

    <!-- Две стрелки под репликой (горизонтально) -->
    <div class="arrows-container">
        <!-- Левая стрелка — верное действие -->
        <div class="arrow-option">
            <div class="desc-text">Направить на обязательный медосмотр</div>
            <button class="arrow-btn" id="correctArrow" aria-label="Верное решение">←</button>
        </div>
        <!-- Правая стрелка — ошибочное действие -->
        <div class="arrow-option">
            <div class="desc-text">Не спорить с подростком и обойтись без справки</div>
            <button class="arrow-btn" id="wrongArrow" aria-label="Ошибочное решение">→</button>
        </div>
    </div>

    <!-- Зона для крупного сообщения по центру -->
    <div class="message-area" id="messageArea"></div>
</div>

<script>
    const messageContainer = document.getElementById('messageArea');
    let activeTimeout = null;

    function showFeedback(isCorrect) {
        if (activeTimeout) clearTimeout(activeTimeout);
        
        const msgDiv = document.createElement('div');
        msgDiv.className = 'feedback-message';
        if (isCorrect) {
            msgDiv.classList.add('correct');
            msgDiv.innerHTML = '🎉 Абсолютно верно!';
        } else {
            msgDiv.classList.add('wrong');
            msgDiv.innerHTML = '❌ Опасная ошибка!';
        }
        
        messageContainer.innerHTML = '';
        messageContainer.appendChild(msgDiv);
        
        activeTimeout = setTimeout(() => {
            if (messageContainer.firstChild) {
                messageContainer.innerHTML = '';
            }
            activeTimeout = null;
        }, 3000);
    }
    
    const correctArrow = document.getElementById('correctArrow');
    const wrongArrow = document.getElementById('wrongArrow');
    
    correctArrow.addEventListener('click', () => {
        showFeedback(true);
    });
    
    wrongArrow.addEventListener('click', () => {
        showFeedback(false);
    });
</script>
</body>
</html>
