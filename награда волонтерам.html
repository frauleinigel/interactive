<style>
.motivation-game{font-family:'Segoe UI',sans-serif;max-width:900px;margin:20px auto;background:#f9fbfd;padding:20px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.05);color:#333}
.motivation-game h3{text-align:center;color:#000;font-size:24px;margin:0 0 10px}
.motivation-game p.desc{text-align:center;color:#555;margin-bottom:15px;font-size:14px}
.game-board{display:flex;gap:15px;margin-bottom:15px}
.column{flex:1;display:flex;flex-direction:column;gap:8px}
.column-header{font-weight:bold;text-align:center;padding-bottom:6px;border-bottom:2px solid #e2e8f0;font-size:15px}
.left{color:#2b6cb0}.right{color:#38a169}
.match-card{background:#fff;border:2px solid #e2e8f0;border-radius:8px;padding:8px 12px;cursor:pointer;transition:.2s;font-size:13px;line-height:1.35;user-select:none;box-sizing:border-box;min-height:65px;display:flex;align-items:center}
.match-card:hover{border-color:#cbd5e0;box-shadow:0 4px 8px rgba(0,0,0,.05)}
.match-card.selected{border-color:#3182ce;background:#ebf8ff;transform:scale(1.02)}
.match-card.matched{border-color:#38a169;background:#f0fff4;opacity:.7;pointer-events:none}
.match-card.error{border-color:#e53e3e;background:#fff5f5;animation:shake .4s}

/* Новая заметная желтая кнопка */
.reset-btn{
    display:block;
    margin:0 auto;
    padding:12px 30px;
    background-color:#facc15; /* Ярко-желтый */
    border:2px solid #eab308;
    border-radius:8px;
    color:#422006; /* Темно-коричневый текст для контраста */
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    transition:all .2s ease;
    box-shadow:0 4px 6px rgba(250, 204, 21, 0.4);
}
.reset-btn:hover{
    background-color:#eab308;
    transform:translateY(-2px);
    box-shadow:0 6px 12px rgba(234, 179, 8, 0.5);
}
.reset-btn:active{
    transform:translateY(0);
    box-shadow:0 2px 4px rgba(234, 179, 8, 0.3);
}

@keyframes shake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal-content{background:#fff;border-radius:12px;padding:30px 20px;max-width:400px;width:90%;position:relative;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.modal-close{position:absolute;top:10px;right:15px;background:none;border:none;font-size:26px;cursor:pointer;color:#a0aec0}
.modal-close:hover{color:#e53e3e}
.success-icon{font-size:40px;margin-bottom:10px;display:block}
.success-text{color:#276749;font-weight:bold;font-size:16px;margin:0}
@media(max-width:600px){.game-board{flex-direction:column}.match-card{min-height:auto}}
</style>

<div class="motivation-game">
    <h3>Подберите награду для каждого волонтера</h3>
    <p class="desc">У каждого добровольца своя мотивация. Кликните на карточку волонтера слева, а затем на подходящую награду справа.</p>
    <div class="game-board">
        <div class="column" id="volunteers-col"><div class="column-header left">Волонтеры и их желания</div></div>
        <div class="column" id="rewards-col"><div class="column-header right">Способы награждения</div></div>
    </div>
    <button class="reset-btn" onclick="resetGame()">Сбросить</button>
</div>

<div class="modal-overlay" id="success-modal" onclick="closeWinModalOnOverlay(event)">
    <div class="modal-content">
        <button class="modal-close" onclick="closeWinModal()">&times;</button>
        <span class="success-icon">🎉</span>
        <p class="success-text">Отлично! Вы верно определили мотивацию каждого волонтера и подобрали к ней подходящую награду.</p>
    </div>
</div>

<script>
const pairsData=[{id:'p1',v:'👩‍🎓 <strong>Студентка педвуза</strong>, хочет получить практический опыт и строчку в резюме.',r:'📚 <strong>Стажировка.</strong> Засчитать волонтерскую деятельность как стажировку от вуза.'},{id:'p2',v:'👦 <strong>Школьник</strong>, обожает мероприятие и хочет забрать что-то на память.',r:'👕 <strong>Уникальная экипировка.</strong> Подарить футболку с логотипом и красивый бейдж.'},{id:'p3',v:'👵 <strong>«Серебряный» волонтер</strong>, помогает из любви к искусству, ценит внимание и уважение.',r:'📜 <strong>Благодарственное письмо.</strong> Отправить письмо с указанием важности его вклада и заполнить книжку волонтера.'},{id:'p4',v:'🧑‍💼 <strong>Талантливый организатор</strong>, который отлично справляется с задачами и ищет подработку.',r:'💰 <strong>Профессиональный рост.</strong> Предложить сотрудничество с учреждением на платной основе.'},{id:'p5',v:'👧 <strong>Фанатка театра</strong>, которая очень хочет попасть на главное событие года, но не может купить билеты.',r:'🎟️ <strong>Бесплатное участие.</strong> Наградить бесплатным билетом на крупное мероприятие или посещением площадок.'},{id:'p6',v:'🧑 <strong>Активист</strong>, который хочет чувствовать себя важной частью большого культурного события.',r:'🌟 <strong>Особая роль.</strong> Позиционировать его как VIP-волонтера в культурном пространстве, доверить ответственный участок.'},{id:'p7',v:'🧑‍🦳 <strong>Постоянный доброволец</strong>, который помогает уже много лет и ждет официального признания на государственном уровне.',r:'🏅 <strong>Нагрудный знак.</strong> Наградить унифицированным нагрудным знаком добровольца (по аналогии с донорами).'}];
let selV=null,selR=null,matched=0;
const vCol=document.getElementById('volunteers-col'),rCol=document.getElementById('rewards-col'),modal=document.getElementById('success-modal');

function initGame(){
    vCol.innerHTML='<div class="column-header left">Волонтеры и их желания</div>';
    rCol.innerHTML='<div class="column-header right">Способы награждения</div>';
    selV=null;selR=null;matched=0;modal.classList.remove('show');
    [...pairsData].sort(()=>Math.random()-.5).forEach(i=>{vCol.innerHTML+=`<div class="match-card" data-id="${i.id}" data-type="v" onclick="clickCard(this,'v')"><div>${i.v}</div></div>`});
    [...pairsData].sort(()=>Math.random()-.5).forEach(i=>{rCol.innerHTML+=`<div class="match-card" data-id="${i.id}" data-type="r" onclick="clickCard(this,'r')"><div>${i.r}</div></div>`});
}

function clickCard(el,type){
    if(el.classList.contains('matched'))return;
    if(type==='v'){if(selV)selV.classList.remove('selected');selV=el;el.classList.add('selected')}
    else{if(selR)selR.classList.remove('selected');selR=el;el.classList.add('selected')}
    if(selV&&selR)checkMatch();
}

function checkMatch(){
    if(selV.dataset.id===selR.dataset.id){
        selV.classList.remove('selected');selR.classList.remove('selected');
        selV.classList.add('matched');selR.classList.add('matched');
        matched++;selV=null;selR=null;
        if(matched===pairsData.length)setTimeout(()=>modal.classList.add('show'),300);
    } else {
        const eV=selV,eR=selR;
        eV.classList.remove('selected');eR.classList.remove('selected');
        eV.classList.add('error');eR.classList.add('error');
        selV=null;selR=null;
        setTimeout(()=>{eV.classList.remove('error');eR.classList.remove('error')},500);
    }
}

function closeWinModal(){modal.classList.remove('show')}
function closeWinModalOnOverlay(e){if(e.target===modal)closeWinModal()}
function resetGame(){initGame()}
window.onload=initGame;
</script>
