<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Диалоговый тренажёр</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f0ede8;
            display: flex;
            justify-content: center;
            padding: 30px 20px;
        }

        .container {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            padding: 28px 32px 32px;
        }

        .intro {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            line-height: 1.5;
            padding-bottom: 18px;
            border-bottom: 2px solid #e9e3dc;
            margin-bottom: 24px;
        }
        .intro .bulb {
            font-size: 22px;
            margin-right: 8px;
        }

        .dialogue {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 10px;
        }

        /* Гость — слева */
        .guest-line {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 12px;
        }
        .guest-avatar {
            flex-shrink: 0;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
        }
        .guest-avatar svg {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e2e8f0;
            padding: 4px;
        }
        .guest-avatar .label {
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            white-space: nowrap;
        }
        .guest-bubble {
            background: #f1f3f5;
            border: 1px solid #e2e8f0;
            border-radius: 12px 12px 12px 4px;
            padding: 12px 18px;
            max-width: 70%;
            font-size: 16px;
            line-height: 1.5;
            color: #0f172a;
        }

        /* Библиотекарь — справа */
        .lib-line {
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            gap: 12px;
        }
        .lib-avatar {
            flex-shrink: 0;
            width: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .lib-avatar svg {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #b8860b;
            padding: 6px;
        }
        .lib-avatar .label {
            font-size: 10px;
            color: #64748b;
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
        }
        .lib-bubble {
            background: #b8860b;
            color: #ffffff;
            border-radius: 12px 12px 4px 12px;
            padding: 12px 18px;
            max-width: 70%;
            font-size: 16px;
            line-height: 1.5;
        }

        /* Блок вариантов — справа (как реплики библиотекаря) */
        .options-line {
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            gap: 12px;
        }
        .options-avatar {
            flex-shrink: 0;
            width: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            order: 2;
        }
        .options-avatar svg {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #b8860b;
            padding: 6px;
        }
        .options-avatar .label {
            font-size: 10px;
            color: #64748b;
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
        }
        .options-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 70%;
            width: 100%;
            order: 1;
        }
        .options-box .option-btn {
            background: #ffffff;
            border: 2px solid #d1d5db;
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 15px;
            line-height: 1.4;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.15s;
            text-align: left;
            font-family: inherit;
            width: 100%;
        }
        .options-box .option-btn:hover:not(:disabled) {
            background: #f8fafc;
            border-color: #b8860b;
            transform: translateY(-1px);
        }
        .options-box .option-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .options-box .option-btn.correct {
            border-color: #16a34a;
            background: #f0fdf4;
        }
        .options-box .option-btn.wrong {
            border-color: #dc2626;
            background: #fef2f2;
        }

        .system-line {
            display: flex;
            justify-content: center;
            margin: 4px 0;
        }
        .system-box {
            background: #fef2f2;
            border-left: 4px solid #dc2626;
            border-radius: 8px;
            padding: 10px 18px;
            color: #7f1d1d;
            font-size: 15px;
            max-width: 85%;
        }
        .system-box .icon {
            font-weight: 700;
            margin-right: 6px;
        }

        .final-line {
            display: flex;
            justify-content: center;
        }
        .final-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 16px;
            padding: 20px 28px;
            text-align: center;
            max-width: 85%;
            color: #14532d;
            font-size: 17px;
            line-height: 1.6;
        }
        .final-box strong {
            font-size: 22px;
            display: block;
            margin-bottom: 6px;
        }

        @media (max-width: 640px) {
            .container { padding: 16px 12px; }
            .intro { font-size: 16px; }
            .guest-bubble, .lib-bubble { max-width: 80%; font-size: 15px; }
            .options-box { max-width: 80%; }
            .guest-avatar .label { font-size: 12px; }
            .guest-avatar svg { width: 30px; height: 30px; }
            .lib-avatar .label, .options-avatar .label { font-size: 9px; }
            .lib-avatar svg, .options-avatar svg { width: 32px; height: 32px; }
            .lib-avatar, .options-avatar { width: 36px; }
            .guest-line, .lib-line, .options-line { gap: 8px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="intro">
        <span class="bulb">💡</span> К вам в библиотеку впервые заходит посетитель. Он осматривается и выглядит неуверенно. Постарайтесь не упустить потенциального читателя.
    </div>

    <div class="dialogue" id="dialogueContainer"></div>
</div>

<script>
    (function() {
        const container = document.getElementById('dialogueContainer');

        const stages = [
            {
                guest: '«Здравствуйте, я тут мимо проходил, решил заглянуть. У вас тут вообще что делают?»',
                options: [
                    { text: '«Записывайтесь в читальный зал. Паспорт есть? Заполните формуляр, вот правила, с 9 до 18 работаем».', correct: false },
                    { text: '«Здравствуйте! Рады вам. Помимо хранения книг, мы помогаем находить ответы на любые вопросы. Расскажите, чем вы обычно интересуетесь? Может, ищете что-то для работы или просто хотите выбрать книгу для души?»', correct: true }
                ],
                wrongFeedback: '❌ <strong>Неверно.</strong> Вы переходите к бюрократии раньше, чем установили контакт. Человек почувствует себя посетителем МФЦ, а не желанным гостем. Выберите другой вариант.'
            },
            {
                guest: '«Ну, не знаю, я обычно в интернете всё читаю...»',
                options: [
                    { text: '«У нас тоже есть компьютеры, можете посидеть. Только шуметь нельзя».', correct: false },
                    { text: '«Это как раз наше поле! Мы можем дать доступ к тем базам знаний, которые обычно платные, или помочь отделить достоверные факты от вымысла. Хотите, покажу, как мы ищем информацию, которую не выдает простой поиск в Яндексе?»', correct: true }
                ],
                wrongFeedback: '❌ <strong>Неверно.</strong> Вы пытаетесь конкурировать с интернетом на его поле, подчёркивая ограничения. Вы должны предложить уникальную ценность, которой нет в обычном поиске. Выберите другой вариант.'
            },
            {
                guest: '«Звучит неплохо. А давно у вас тут так? А то выглядит... ну, как обычная библиотека».',
                options: [
                    { text: '«Библиотека основана в 1950 году, у нас фонд 10 тысяч единиц».', correct: false },
                    { text: '«Наша библиотека — место силы района. Мы храним историю и устраиваем встречи, где люди делятся опытом. Мы стараемся быть сообществом единомышленников. Кстати, как вам у нас внутри? Уютно?»', correct: true }
                ],
                wrongFeedback: '❌ <strong>Неверно.</strong> Сухие цифры не создают эмоциональной связи. Гость спрашивает об «ощущении», а не о статистике. Выберите другой вариант.'
            },
            {
                guest: '«Да, пожалуй. Слушайте, а у вас есть что-то... ну, лёгкое? А то на работе устаю, серьёзное читать не тянет».',
                options: [
                    { text: '«Лёгкое — детективы или любовные романы? У нас есть целый отдел, идите вон туда, к стеллажу 5».', correct: false },
                    { text: '«Прекрасно понимаю, иногда хочется разгрузить голову. А что обычно помогает вам переключиться? Были ли книги, которые вы прочли на одном дыхании в отпуске или в трудные моменты? Расскажите, чего именно вам хочется сейчас — погрузиться в другую реальность или просто отдохнуть с улыбкой?»', correct: true }
                ],
                wrongFeedback: '❌ <strong>Неверно.</strong> Вы навешиваете ярлык «лёгкое» и отправляете человека в свободное плавание. Упускаете шанс узнать его предпочтения и создать доверительную атмосферу. Выберите другой вариант.'
            }
        ];

        let currentStep = 0;
        let isWaiting = false;

        const guestIcon = `
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="24" cy="16" r="10" fill="#64748b"/>
                <path d="M8 44C8 34.0589 15.1634 26 24 26C32.8366 26 40 34.0589 40 44H8Z" fill="#64748b"/>
            </svg>
        `;

        const librarianIcon = `
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="24" cy="16" r="10" fill="#ffffff" opacity="0.3"/>
                <path d="M8 44C8 34.0589 15.1634 26 24 26C32.8366 26 40 34.0589 40 44H8Z" fill="#ffffff" opacity="0.3"/>
                <rect x="18" y="20" width="12" height="16" rx="1" fill="#ffffff" opacity="0.6"/>
                <rect x="21" y="22" width="6" height="2" fill="#b8860b"/>
                <rect x="21" y="26" width="6" height="2" fill="#b8860b"/>
                <rect x="21" y="30" width="4" height="2" fill="#b8860b"/>
            </svg>
        `;

        function addGuest(text) {
            const div = document.createElement('div');
            div.className = 'guest-line';
            div.innerHTML = `
                <div class="guest-avatar">
                    ${guestIcon}
                    <span class="label">Гость</span>
                </div>
                <div class="guest-bubble">${text}</div>
            `;
            container.appendChild(div);
            scrollToBottom();
        }

        function addLibrarian(text) {
            const div = document.createElement('div');
            div.className = 'lib-line';
            div.innerHTML = `
                <div class="lib-bubble">${text}</div>
                <div class="lib-avatar">
                    ${librarianIcon}
                    <span class="label">Библиотекарь</span>
                </div>
            `;
            container.appendChild(div);
            scrollToBottom();
        }

        function addSystem(text) {
            const div = document.createElement('div');
            div.className = 'system-line';
            div.innerHTML = `<div class="system-box"><span class="icon">ⓘ</span> ${text}</div>`;
            container.appendChild(div);
            scrollToBottom();
        }

        function addFinal() {
            const div = document.createElement('div');
            div.className = 'final-line';
            div.innerHTML = `
                <div class="final-box">
                    <strong>🎉 Поздравляем!</strong>
                    Вы успешно установили контакт, презентовали библиотеку как экспертный центр и сняли барьер неловкости.
                    <br><span style="font-size:0.9em;color:#3b7a5a;">Теперь вы готовы переходить к системному формированию читательской траектории.</span>
                </div>
            `;
            container.appendChild(div);
            scrollToBottom();
        }

        function addOptions(stage) {
            const wrapper = document.createElement('div');
            wrapper.className = 'options-line';
            wrapper.id = 'optionsWrapper';

            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'options-avatar';
            avatarDiv.innerHTML = `${librarianIcon}<span class="label">Библиотекарь</span>`;

            const box = document.createElement('div');
            box.className = 'options-box';

            stage.options.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.dataset.correct = opt.correct ? 'true' : 'false';
                btn.textContent = opt.text;
                btn.addEventListener('click', onOptionClick);
                box.appendChild(btn);
            });

            wrapper.appendChild(box);
            wrapper.appendChild(avatarDiv);
            container.appendChild(wrapper);
            scrollToBottom();
            isWaiting = true;
        }

        function onOptionClick(e) {
            if (!isWaiting) return;
            const btn = e.currentTarget;
            const isCorrect = btn.dataset.correct === 'true';
            const currentStage = stages[currentStep];

            if (btn.disabled) return;

            if (!isCorrect) {
                btn.disabled = true;
                btn.classList.add('wrong');
                const oldSys = container.querySelectorAll('.system-line');
                oldSys.forEach(el => el.remove());
                addSystem(currentStage.wrongFeedback);
                return;
            }

            // Правильный ответ
            const wrapper = document.getElementById('optionsWrapper');
            if (wrapper) {
                const btns = wrapper.querySelectorAll('.option-btn');
                btns.forEach(b => {
                    b.disabled = true;
                    if (b.dataset.correct === 'true') b.classList.add('correct');
                });
            }

            const correctText = currentStage.options.find(o => o.correct === true).text;
            addLibrarian(correctText);

            const oldSys = container.querySelectorAll('.system-line');
            oldSys.forEach(el => el.remove());

            currentStep++;
            if (currentStep < stages.length) {
                const oldWrapper = document.getElementById('optionsWrapper');
                if (oldWrapper) oldWrapper.remove();

                setTimeout(() => {
                    const nextStage = stages[currentStep];
                    addGuest(nextStage.guest);
                    addOptions(nextStage);
                }, 500);
            } else {
                const oldWrapper = document.getElementById('optionsWrapper');
                if (oldWrapper) oldWrapper.remove();
                setTimeout(() => {
                    addFinal();
                    isWaiting = false;
                }, 500);
            }
        }

        function scrollToBottom() {
            container.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        function init() {
            container.innerHTML = '';
            const first = stages[0];
            addGuest(first.guest);
            addOptions(first);
        }

        init();
    })();
</script>

</body>
</html>
