<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НОК Самоаудит — Тренажёр (Тишина в библиотеке)</title>
    <style>
        /* ── reset & base ── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #002b80;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .card {
            max-width: 900px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 43, 128, 0.12);
            padding: 40px 38px 46px;
            transition: box-shadow 0.2s;
            position: relative;
        }

        .top-section {
            display: flex;
            align-items: center;
            gap: 26px;
            margin-bottom: 30px;
        }

        .context {
            flex: 1;
        }

        .situation-title {
            font-size: 1.85rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #5a3e2b;
            text-align: center;
            line-height: 1.3;
        }

        /* ── увеличенный текст описания ── */
        .subhead {
            font-size: 1.4rem;
            color: #003d99;
            line-height: 1.7;
            padding: 18px 22px;
            border-left: 4px solid #002b80;
            background: #ffffff;
            word-break: break-word;
        }

        /* ── место под эмодзи ── */
        .emoji-wrap {
            flex-shrink: 0;
            width: 160px;
            max-width: 160px;
            height: 160px;
            border-radius: 20px;
            border: 2px solid #d9e0ed;
            background: #f8fbff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 92px;
            line-height: 1;
            user-select: none;
        }

        /* ── вопрос ── */
        .question {
            font-size: 1.5rem;
            font-weight: 600;
            color: #cc0000;
            margin-bottom: 30px;
            line-height: 1.5;
            padding: 20px 24px;
            border: 1px solid #d9e0ed;
            border-radius: 14px;
            background: #ffffff;
            word-break: break-word;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 34px;
        }

        .answer-btn {
            background: linear-gradient(145deg, #f7f7f7, #e8e8e8);
            border: 2px solid #002b80;
            border-radius: 16px;
            padding: 22px 20px 20px;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 1.25rem;
            font-weight: 600;
            color: #001a4d;
            line-height: 1.5;
            box-shadow: 0 2px 6px rgba(0, 43, 128, 0.03);
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 110px;
            word-break: break-word;
        }

        .answer-btn:hover:not(.disabled) {
            border-color: #001a4d;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 43, 128, 0.08);
            background: linear-gradient(145deg, #f0f0f0, #e0e0e0);
        }

        .answer-btn .text {
            font-weight: 600;
        }

        .answer-btn.correct {
            border-color: #1a8c4a;
            background: #e6f5ed;
            box-shadow: 0 0 0 3px rgba(26, 140, 74, 0.2);
        }

        .answer-btn.wrong {
            border-color: #b3002d;
            background: #fce8eb;
            box-shadow: 0 0 0 3px rgba(204, 51, 68, 0.2);
        }

        .answer-btn.disabled {
            cursor: default;
            opacity: 0.8;
        }
        .answer-btn.disabled:hover {
            transform: none;
            box-shadow: none;
            background: linear-gradient(145deg, #f7f7f7, #e8e8e8);
        }

        .reset-wrap {
            display: flex;
            justify-content: flex-end;
        }

        .reset-btn {
            background: linear-gradient(145deg, #fdf6e3, #f5e6c8);
            border: 2px solid #000000;
            border-radius: 30px;
            padding: 14px 36px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #000000;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.3px;
        }

        .reset-btn:hover {
            background: linear-gradient(145deg, #faf0da, #f0dbb8);
            border-color: #000000;
            transform: scale(1.02);
        }

        .reset-btn:active {
            transform: scale(0.97);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 20, 50, 0.6);
            backdrop-filter: blur(3px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #ffffff;
            max-width: 680px;
            width: 100%;
            border-radius: 24px;
            padding: 38px 36px 34px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
            position: relative;
            animation: fadeSlide 0.25s ease;
            border: 2px solid #002b80;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 2.2rem;
            line-height: 1;
            cursor: pointer;
            color: #002b80;
            background: transparent;
            border: none;
            padding: 4px 10px;
            border-radius: 30px;
            transition: background 0.15s;
            font-weight: 300;
        }

        .modal-close:hover {
            background: #f0f4fc;
        }

        .modal-content {
            font-size: 1.35rem;
            line-height: 1.7;
            color: #002b80;
            padding-right: 20px;
            word-break: break-word;
        }

        .modal-content strong {
            color: #001f5e;
        }

        .modal-content .msg-text {
            display: inline;
        }

        @media (max-width: 640px) {
            .card {
                padding: 24px 16px 28px;
            }
            .top-section {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
            }
            .emoji-wrap {
                width: 100%;
                max-width: 100%;
                height: 130px;
                font-size: 72px;
            }
            .answers-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .answer-btn {
                min-height: 70px;
                padding: 16px 16px;
                font-size: 1.1rem;
            }
            .question {
                font-size: 1.25rem;
                padding: 16px 18px;
            }
            .subhead {
                font-size: 1.15rem;
                padding: 12px 14px;
            }
            .situation-title {
                font-size: 1.45rem;
            }
            .modal-box {
                padding: 24px 20px 20px;
                margin: 10px;
            }
            .modal-content {
                font-size: 1.1rem;
            }
            .modal-close {
                font-size: 1.8rem;
                top: 10px;
                right: 12px;
            }
            .reset-btn {
                padding: 10px 24px;
                font-size: 0.95rem;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 16px 10px 20px;
            }
            .answer-btn {
                font-size: 1rem;
                padding: 12px 14px;
                min-height: 60px;
            }
            .subhead {
                font-size: 1.02rem;
                padding: 10px 12px;
            }
            .question {
                font-size: 1.1rem;
                padding: 12px 14px;
            }
            .situation-title {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="card" role="main" aria-label="Тренажёр тишина в библиотеке">

        <!-- верхняя часть: заголовок, описание, эмодзи -->
        <div class="top-section">
            <div class="context">
                <div class="situation-title">Ситуация №1</div>
                <div class="subhead">
                    В библиотеке очень тихо. Слышен каждый скрип пола, шепот персонала и шум принтера. Посетители чувствуют себя скованно и боятся лишний раз пошевелиться.
                </div>
            </div>
            <div class="emoji-wrap" aria-hidden="true">👂</div>
        </div>

        <!-- вопрос -->
        <div class="question">
            Что делать?
        </div>

        <!-- сетка ответов 2×2 -->
        <div class="answers-grid" id="answersGrid" role="radiogroup" aria-label="Варианты ответов">
            <button class="answer-btn" data-option="А" role="radio" aria-checked="false">
                <span class="text">Включить трансляцию классической музыки через потолочные колонки.</span>
            </button>
            <button class="answer-btn" data-option="Б" role="radio" aria-checked="false">
                <span class="text">Использовать маскирующий аудиофон — лаундж или звуки природы.</span>
            </button>
            <button class="answer-btn" data-option="В" role="radio" aria-checked="false">
                <span class="text">Развесить везде знаки «Соблюдайте тишину!» и «Выключите телефоны!».</span>
            </button>
            <button class="answer-btn" data-option="Г" role="radio" aria-checked="false">
                <span class="text">Запустить генератор белого шума на высокой мощности.</span>
            </button>
        </div>

        <!-- кнопка сброса -->
        <div class="reset-wrap">
            <button class="reset-btn" id="resetBtn" aria-label="Сбросить и попробовать снова">⟳ Попробовать снова</button>
        </div>

    </div>

    <!-- ─── Модальное окно ─── -->
    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-box">
            <button class="modal-close" id="modalCloseBtn" aria-label="Закрыть">✕</button>
            <div class="modal-content" id="modalContent">
                <span class="msg-text" id="modalMessage">Выберите вариант ответа, чтобы проверить себя.</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const grid = document.getElementById('answersGrid');
            const resetBtn = document.getElementById('resetBtn');
            const allButtons = grid.querySelectorAll('.answer-btn');

            const modalOverlay = document.getElementById('modalOverlay');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const modalMessage = document.getElementById('modalMessage');

            let isAnswered = false;

            const results = {
                'А': {
                    correct: false,
                    message: `
                <strong>❌ Неверно.</strong> Навязанный аудиофон быстро утомляет мозг. Классика часто воспринимается молодежью как признак «музейности» и застоя.
              `
                },
                'Б': {
                    correct: true,
                    message: `
                <strong>✅ Верно.</strong> Мягкая аудиозавеса скрывает технические шумы и позволяет гостю чувствовать себя в безопасности.
              `
                },
                'В': {
                    correct: false,
                    message: `
                <strong>❌ Неверно.</strong> Визуальные запреты усиливают стресс. Превращают библиотеку в место контроля, а не развития.
              `
                },
                'Г': {
                    correct: false,
                    message: `
                <strong>❌ Неверно.</strong> Постоянный монотонный гул создает технический фон, от которого быстро начинает болеть голова.
              `
                }
            };

            function resetAll() {
                isAnswered = false;

                allButtons.forEach(btn => {
                    btn.classList.remove('correct', 'wrong', 'disabled');
                    btn.setAttribute('aria-checked', 'false');
                    btn.disabled = false;
                    btn.style.outline = '';
                    btn.style.outlineOffset = '';
                });

                modalOverlay.classList.remove('active');
                modalMessage.innerHTML = 'Выберите вариант ответа, чтобы проверить себя.';
            }

            function showModal(option) {
                const data = results[option];
                if (!data) return;

                modalMessage.innerHTML = data.message;
                modalOverlay.classList.add('active');
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
            }

            function handleAnswerClick(e) {
                const btn = e.currentTarget;
                if (isAnswered || btn.disabled) return;

                const option = btn.dataset.option;
                const data = results[option];
                if (!data) return;

                isAnswered = true;

                allButtons.forEach(b => {
                    b.disabled = true;
                    b.classList.add('disabled');
                });

                btn.classList.add(data.correct ? 'correct' : 'wrong');
                btn.setAttribute('aria-checked', 'true');

                showModal(option);
            }

            modalCloseBtn.addEventListener('click', closeModal);

            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) {
                    closeModal();
                }
            });

            resetBtn.addEventListener('click', function() {
                resetAll();
            });

            allButtons.forEach(btn => {
                btn.addEventListener('click', handleAnswerClick);
            });

            resetAll();

        })();
    </script>
</body>
</html>
